<script>
(function () {
  'use strict';
  function refFromUrl(u) {
    var m = /^https:\/\/([a-z0-9]{20})\.supabase\.co\/?$/.exec(typeof u === 'string' ? u : '');
    return m ? m[1] : null;
  }
  function jwtClaims(k) {
    var p = k.split('.');
    if (p.length !== 3) return null;
    try {
      var s = p[1].replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return JSON.parse(atob(s));
    } catch (e) { return null; }
  }
  function checkStagingKey(k, ref) {
    if (typeof k !== 'string' || !k) return 'staging anon key missing';
    if (k.indexOf('sb_secret_') === 0) return 'secret keys are never allowed in the browser';
    // Publishable keys carry no project ref; the URL check above and the __environment marker gate bind them to staging.
    if (k.indexOf('sb_publishable_') === 0) return /^sb_publishable_[A-Za-z0-9_-]{16,}$/.test(k) ? null : 'staging publishable key format not recognised';
    var c = jwtClaims(k);
    if (!c) return 'staging key format not recognised';
    if (c.role !== 'anon') return 'staging key is not an anon key';
    if (c.ref !== ref) return 'staging key belongs to a different project than the staging URL';
    return null;
  }
  // Pure: (location, production config, staging config, production hostnames) -> environment.
  function resolveEnv(loc, prod, staging, prodHosts) {
    var host = loc && typeof loc.hostname === 'string' ? loc.hostname : '';
    var isProd = !!loc && loc.protocol === 'https:' && Array.isArray(prodHosts) && prodHosts.indexOf(host) !== -1;
    if (isProd) return { name: 'production', url: prod.url, anonKey: prod.anonKey };
    if (!staging || typeof staging !== 'object') return { name: 'blocked', reason: 'staging configuration missing (staging-config.js)' };
    var ref = refFromUrl(staging.url);
    if (!ref) return { name: 'blocked', reason: 'staging URL invalid (expected https://<project-ref>.supabase.co)' };
    var prodUrl = prod && prod.url, prodKey = prod && prod.anonKey;
    if (ref === refFromUrl(prodUrl) || staging.url === prodUrl || staging.anonKey === prodKey)
      return { name: 'blocked', reason: 'staging configuration points at the production project' };
    var why = checkStagingKey(staging.anonKey, ref);

  }
})();

  if(!dateStr)return '';
  const d=new Date(dateStr+'T00:00:00');
  if(freq==='Weekly')d.setDate(d.getDate()+7);
  else if(freq==='Monthly')d.setMonth(d.getMonth()+1);

function planAssetImport(rows, existing, categories) {
  const cats = (categories || []).map(c => String(c).toUpperCase());
  const byNum = new Map((existing || []).map(a => [String(a.num), a]));
  const parsed = (rows || []).map((v, i) => { const c = k => String(v[k] == null ? '' : v[k]).trim();
    return {line: i + 2, a: {num: c(0).replace(/^0+(?=\d)/, ''), plant: c(1).toUpperCase(), desc: c(2), code: c(3), model: c(4), cap: c(5), reg: c(6), eng: c(7), serial: c(8), loc: c(9), status: c(10)}}; })
    .filter(p => Object.values(p.a).some(x => x !== ''));
  const count = new Map(); parsed.forEach(p => { if (p.a.num) count.set(p.a.num, (count.get(p.a.num) || 0) + 1); });
  const out = {added: [], unchanged: [], updates: [], invalid: []};
  for (const {line, a} of parsed) {
    const reason = !a.num ? 'missing asset number' : !/^[A-Za-z0-9][A-Za-z0-9./-]*$/.test(a.num) ? 'invalid asset number'

      : !a.plant ? 'missing category' : !cats.includes(a.plant) ? `unknown category "${a.plant}"` : null;
    if (reason) { out.invalid.push({line, num: a.num, reason}); continue; }
    const ex = byNum.get(a.num);
    if (!ex) { out.added.push({...a, status: a.status || 'OPERATIONAL'}); continue; }

.btn-primary{background:var(--blue);color:#fff;}.btn-primary:hover{background:#1545b8;}
.btn-accent{background:var(--accent-fill);color:var(--on-accent);}.btn-accent:hover{background:var(--accent2);}
.btn-success{background:#059669;color:#fff;}.btn-success:hover{background:#047857;}
.btn-danger{background:var(--red);color:#fff;}.btn-danger:hover{background:#dc2626;}
.btn-warning{background:#ea580c;color:#fff;}.btn-warning:hover{background:#c2410c;}
.btn-ghost{background:var(--hl-07);color:var(--white);border:1px solid var(--border);}.btn-ghost:hover{background:var(--hl-12);}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-icon{padding:5px 8px;font-size:15px;min-width:30px;text-align:center;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{padding:9px 12px;text-align:left;font-family:var(--fh);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);background:rgba(245,158,11,.06);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}tr:hover td{background:var(--hl-02);}
.sb-base{display:inline-block;padding:2px 9px;border-radius:3px;font-family:var(--fm);font-size:10px;letter-spacing:1px;font-weight:600;}
.so{background:rgba(16,185,129,.35);color:#34d399;border:1px solid rgba(16,185,129,.65);}
.sb{background:rgba(239,68,68,.3);color:#fca5a5;border:1px solid rgba(239,68,68,.6);}
.sm{background:rgba(249,115,22,.3);color:#fb923c;border:1px solid rgba(249,115,22,.6);}
.si{background:rgba(148,163,184,.18);color:var(--gray);border:1px solid rgba(148,163,184,.3);}
.sn{background:rgba(26,86,219,.4);color:#93c5fd;border:1px solid rgba(26,86,219,.75);}
.sl{background:rgba(245,158,11,.3);color:#fbbf24;border:1px solid rgba(245,158,11,.6);}
.jop{background:rgba(245,158,11,.15);color:var(--yellow);border:1px solid rgba(245,158,11,.3);}
.jcl{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.jip{background:rgba(26,86,219,.15);color:#60a5fa;border:1px solid rgba(26,86,219,.3);}
.jcp{background:rgba(139,92,246,.15);color:#a78bfa;border:1px solid rgba(139,92,246,.3);}
.prio-high{color:var(--red);font-weight:600;font-family:var(--fm);font-size:11px;}
.prio-low{color:var(--green);font-family:var(--fm);font-size:11px;}
.modal-overlay{display:flex;position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);z-index:200;align-items:center;justify-content:center;}
.modal{background:var(--navy2);border:1px solid var(--border);border-radius:10px;width:min(820px,95vw);max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-head{padding:18px 24px;background:var(--navy2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
.modal-title{font-family:var(--fh);font-size:20px;font-weight:700;}
.modal-close{background:none;border:none;color:var(--gray);cursor:pointer;font-size:22px;line-height:1;padding:2px 6px;}
.modal-close:hover{color:var(--white);}
.modal-body{padding:24px;}
.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:14px;}
.form-group{min-width:0;}
.form-row.three{grid-template-columns:repeat(3,minmax(0,1fr));}.form-row.single{grid-template-columns:1fr;}
@media(max-width:640px){.form-row,.form-row.three{grid-template-columns:1fr;}}
.form-group label{display:block;font-size:11px;font-family:var(--fm);letter-spacing:1px;color:var(--gray);margin-bottom:5px;text-transform:uppercase;}
.form-group input,.form-group select,.form-group textarea{width:100%;}
.jc-section{border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:14px;}
.jc-section-title{font-family:var(--fh);font-size:13px;font-weight:600;letter-spacing:1px;color:var(--accent);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.jc-section-title::after{content:'';flex:1;height:1px;background:var(--border);}
.parts-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
.parts-table th{padding:6px 8px;background:rgba(245,158,11,.08);border:1px solid var(--border);font-family:var(--fm);font-size:10px;letter-spacing:1px;color:var(--accent);}
.parts-table td{padding:4px 6px;border:1px solid var(--border);}
.parts-table input{background:transparent;border:none;color:var(--white);font-size:12px;width:100%;padding:2px 4px;outline:none;}
.parts-table input:focus{background:var(--hl-05);border-radius:3px;}
.checkbox-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.checkbox-item{display:flex;align-items:center;gap:6px;cursor:pointer;}
.checkbox-item input[type=radio],.checkbox-item input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 20px;}
.detail-item label{font-size:10px;font-family:var(--fm);color:var(--gray);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px;}
.detail-item .val{font-size:14px;font-weight:500;}
.pagination{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding-top:14px;}
.page-btn{padding:5px 11px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--gray);cursor:pointer;font-size:12px;}
.page-btn:hover,.page-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.page-info-txt{font-size:12px;color:var(--gray);font-family:var(--fm);}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px;}
.jo-item{background:var(--hl-03);border:1px solid var(--border);border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.jo-num{font-family:var(--fm);font-size:12px;color:var(--accent);}
.jo-desc{font-size:13px;}.jo-meta{font-size:11px;color:var(--gray);margin-top:2px;}
.plant-pill{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--hl-03);border:1px solid var(--border);border-radius:5px;font-size:13px;margin-bottom:6px;}
.pill-count{font-family:var(--fm);color:var(--accent);font-size:13px;}
.empty-state{text-align:center;padding:40px;color:var(--gray);}
.edit-mode-banner{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);border-radius:6px;padding:8px 14px;margin-bottom:14px;font-size:12px;color:var(--accent);font-family:var(--fm);display:flex;align-items:center;gap:8px;}
.toast-wrap{position:fixed;bottom:28px;right:28px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast-msg{background:var(--navy2);border:1px solid var(--green);border-left:4px solid var(--green);border-radius:8px;padding:12px 18px;font-size:13px;color:var(--white);box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:320px;}
.toast-msg.err{border-color:var(--red);border-left-color:var(--red);}
select.sb-base{cursor:pointer;-webkit-appearance:none;appearance:none;padding:2px 8px;}
@media(max-width:900px){.sidebar{display:none;}.sidebar-toggle,.main-toolbar{display:none;}.main{padding:16px;margin-left:0;}.stats-row{grid-template-columns:1fr 1fr;}.dash-grid{grid-template-columns:1fr;}}
.btn-csv{background:rgba(16,185,129,.1);color:#4ade80;border:1px solid rgba(16,185,129,.25);}.btn-csv:hover{background:rgba(16,185,129,.2);color:#6ee7b7;}
/* ── Table action column: always stays on one line */
.assets-tbl td:last-child,.assets-tbl th:last-child{white-space:nowrap;width:1%;}
/* ── Responsive breakpoints ──────────────────────────────────────────── */
/* Hide less-important table columns on smaller screens */
@media(max-width:1400px){
  .col-hide-md{display:none;}
}
@media(max-width:1440px){
  .main{padding:22px 28px;}
  .stats-row{gap:12px;margin-bottom:22px;}
  .stat-card{padding:14px 18px;}
  .stat-num{font-size:30px;}
  .stat-label{font-size:10px;}
}

  .main{padding:18px 20px;}
  .topbar{padding:0 22px;}
  .logo-text{font-size:17px;}
  .logo-sub{font-size:9px;letter-spacing:1.5px;}
  .badge{font-size:10px;padding:2px 8px;}
  .stats-row{gap:10px;margin-bottom:16px;}
  .stat-card{padding:12px 14px;}
  .stat-num{font-size:26px;}
  .page-title{font-size:24px;}
  .page-sub{font-size:11px;}
  .page-header{margin-bottom:18px;}
  .panel-head{padding:11px 16px;}
  .panel-body{padding:14px 16px;}
  th{padding:7px 10px;}
  td{padding:7px 10px;font-size:12px;}
  .nav-item{padding:9px 16px;font-size:14px;}
  .nav-section{padding:6px 14px 3px;font-size:8px;}
  .modal{width:min(760px,93vw);}
  .btn{font-size:13px;padding:6px 13px;}
  .btn-sm{font-size:11px;padding:3px 8px;}
  .controls{gap:7px;}
  .search-box{min-width:160px;}
  .report-grid{gap:14px;}
  .sidebar-footer{padding:12px 16px 14px;}
  .sidebar-user-name{font-size:13px;}
  .jo-item{padding:8px 12px;}
  .plant-pill{padding:6px 12px;font-size:12px;}
}
@media(max-width:1100px){
  :root{--sidebar-w:165px;}
  .main{padding:14px 16px;}
  .topbar{padding:0 16px;}
  .logo-text{font-size:15px;}
  .logo-sub{display:none;}
  .badge{font-size:9px;padding:2px 6px;}
  .stats-row{gap:8px;margin-bottom:14px;}
  .stat-card{padding:10px 11px;}
  .stat-num{font-size:22px;}
  .page-title{font-size:20px;}
  .page-sub{display:none;}
  .page-header{margin-bottom:14px;}
  .nav-item{padding:8px 12px;font-size:13px;gap:8px;}
  .nav-icon{font-size:14px;width:16px;}
  .nav-section{padding:5px 12px 2px;font-size:7px;}
  .panel-head{padding:9px 13px;}
  .panel-body{padding:11px 13px;}
  th{font-size:9px;padding:6px 8px;letter-spacing:.5px;}
  td{font-size:11px;padding:6px 8px;}
  .btn{font-size:12px;padding:5px 11px;}
  .btn-sm{font-size:10px;padding:3px 7px;}
  .btn-icon{min-width:26px;padding:4px 6px;}
  .sidebar-footer{padding:10px 12px 12px;}
  .sidebar-user-name{font-size:12px;}
  .sidebar-user-role{font-size:8px;}
  .sidebar-avatar{width:28px;height:28px;font-size:13px;}
  .modal{width:min(700px,92vw);}
  .report-grid{grid-template-columns:1fr;}
  .dash-grid{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
  .form-row.three{grid-template-columns:1fr;}
}
/* U3 light theme: badge/status text colours with enough contrast on light surfaces */
:root[data-theme="light"] .so{color:#047857;}:root[data-theme="light"] .sb{color:#b91c1c;}:root[data-theme="light"] .sm{color:#c2410c;}
:root[data-theme="light"] .sn{color:#1d4ed8;}:root[data-theme="light"] .sl{color:#92400e;}
:root[data-theme="light"] .jip,:root[data-theme="light"] .role-engineer,:root[data-theme="light"] .sync-saving{color:#1d4ed8;}
:root[data-theme="light"] .jcp,:root[data-theme="light"] .role-senior{color:#6d28d9;}
:root[data-theme="light"] .sc-purple::before{background:#7c3aed;}:root[data-theme="light"] .sc-purple .stat-num{color:#7c3aed;}
:root[data-theme="light"] .btn-csv{color:#047857;}:root[data-theme="light"] .btn-csv:hover{color:#065f46;}
:root[data-theme="light"] .sidebar-footer{background:var(--hl-03);}
:root[data-theme="light"] .toast-msg{box-shadow:0 8px 30px rgba(15,32,68,.15);}
:root[data-theme="light"] .topbar{border-bottom-color:var(--accent-fill);}
/* theme toggle (login page and top bar) */
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:8px;border:1px solid var(--border);background:var(--hl-05);color:var(--gray);cursor:pointer;transition:color .15s,background .15s,border-color .15s;flex-shrink:0;}
.theme-toggle:hover,.theme-toggle:focus-visible{color:var(--accent);border-color:var(--accent);outline:none;}
/* ── Login Page */
.login-page{position:relative;isolation:isolate;overflow:hidden;min-height:100vh;display:grid;grid-template-columns:minmax(0,54fr) minmax(510px,46fr);background:var(--li-bg);
  --li-bg:linear-gradient(160deg,#0b1a33 0%,#0f2550 55%,#0b1a33 100%);--li-line:rgba(148,180,230,.16);--li-line-strong:rgba(148,180,230,.28);--li-gear:rgba(245,158,11,.22);--li-text:#f8fafc;--li-muted:#a9b8cf;
  --card-bg:rgba(10,22,46,.42);--card-bg-solid:rgba(13,28,58,.94);--card-bd:rgba(255,255,255,.16);--card-hl:rgba(255,255,255,.38);--card-sheen:rgba(255,255,255,.07);
  --card-shadow:0 30px 70px rgba(2,8,20,.5),0 10px 24px rgba(2,8,20,.28),0 1px 2px rgba(2,8,20,.3),inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.02);
  --li-tint:rgba(8,18,38,.38);--li-packet:rgba(245,158,11,.75);
  --rs-bg:radial-gradient(ellipse at 75% 20%,rgba(80,130,230,.14) 0%,transparent 60%),linear-gradient(160deg,rgba(28,50,94,.78) 0%,rgba(22,42,82,.78) 100%);
  --rs-edge:rgba(148,180,230,.18);--rs-shade:-18px 0 40px -24px rgba(0,0,0,.6);}
:root[data-theme="light"] .login-page{--li-bg:linear-gradient(160deg,#e9eff8 0%,#dfe8f5 55%,#eaf0f8 100%);--li-line:rgba(15,32,68,.08);--li-line-strong:rgba(15,32,68,.14);--li-gear:rgba(180,83,9,.2);--li-text:#0f2044;--li-muted:#46566e;
  --card-bg:rgba(255,255,255,.5);--card-bg-solid:rgba(255,255,255,.95);--card-bd:rgba(255,255,255,.75);--card-hl:rgba(255,255,255,.95);--card-sheen:rgba(255,255,255,.45);
  --card-shadow:0 28px 64px rgba(15,32,68,.16),0 8px 20px rgba(15,32,68,.08),0 0 0 1px rgba(15,32,68,.06),inset 0 1px 0 rgba(255,255,255,.9);
  --li-tint:rgba(255,255,255,.34);--li-packet:rgba(217,119,6,.7);
  --rs-bg:radial-gradient(ellipse at 75% 20%,rgba(26,86,219,.07) 0%,transparent 60%),linear-gradient(160deg,rgba(246,248,251,.7) 0%,rgba(238,242,247,.7) 100%);
  --rs-edge:rgba(15,32,68,.10);--rs-shade:-18px 0 40px -26px rgba(15,32,68,.25);}
.login-page{--lc-trace:rgba(245,158,11,.20);--lc-trace-strong:rgba(245,158,11,.34);--lc-socket:rgba(245,158,11,.38);--lc-pad:rgba(245,158,11,.62);--lc-via:#0b1a33;}
:root[data-theme="light"] .login-page{--lc-trace:rgba(180,83,9,.16);--lc-trace-strong:rgba(180,83,9,.28);--lc-socket:rgba(180,83,9,.32);--lc-pad:rgba(180,83,9,.55);--lc-via:#eef3fa;}
.lc-traces path{fill:none;stroke:var(--lc-trace);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;}
.lc-socket{fill:none;stroke:var(--lc-socket);stroke-width:1.2;stroke-dasharray:6 6;}
.lc-vias circle{fill:var(--lc-via);stroke:var(--lc-trace-strong);stroke-width:1.3;}
.lc-pads rect{fill:var(--lc-pad);}
.lc-parts rect,.lc-parts path{fill:none;stroke:var(--lc-trace-strong);stroke-width:1.1;}
.lc-signal{fill:none;stroke:var(--li-packet);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:26 100000;stroke-dashoffset:26;}   /* moved by Web Animations (LoginCircuit); hidden until then */
.lc-glow{fill:var(--accent-fill);opacity:.12;}
.login-caps{font-size:12px;color:var(--accent);margin:-10px 0 12px;}
:root[data-theme="light"] .login-caps{color:#b45309;}
.login-input.invalid input{border-color:var(--red) !important;box-shadow:0 0 0 2px rgba(239,68,68,.18);}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.login-theme{position:absolute;top:16px;right:16px;z-index:5;}
.login-intro{position:relative;z-index:2;color:var(--li-text);display:flex;align-items:center;padding:56px clamp(32px,5vw,72px);background:linear-gradient(90deg,var(--li-tint) 0%,transparent 100%);}
.login-visual{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block;}
/* light layer above the right panel tint (so the trail leaving the card is as bright as the one arriving), below the
   introduction (z 2, later in the page: left lights stay behind its text). Nothing is ever drawn over the card. */
.login-visual.lc-anim{z-index:2;}
.lv-anim{will-change:transform;}
.lv-grid{stroke:var(--li-line);stroke-width:.6;}.lv-grid-lg{stroke:var(--li-line-strong);stroke-width:.8;}
.lv-gear path,.lv-gear circle{fill:none;stroke:var(--li-gear);stroke-width:1.4;}
.lv-gear-svg{position:absolute;z-index:0;pointer-events:none;overflow:visible;display:block;}
.lv-gear-m{display:none;}
@media(max-width:1360px){.lv-wo{display:none;}}   /* the sheet would sit behind the feature cards */
.lv-notes text{fill:var(--li-line-strong);font-family:var(--fm);font-size:9px;letter-spacing:1px;}
.lv-line path,.lv-line circle{fill:none;stroke:var(--li-line-strong);stroke-width:1.2;}
.lv-flow{fill:none;stroke:var(--li-line-strong);stroke-width:1.2;stroke-dasharray:4 14;opacity:.9;animation:lv-dash 8s linear infinite;}
.lv-packet{fill:none;stroke:var(--li-packet);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:14 986;animation:lv-travel 14s linear infinite;}
.lv-pulse circle{fill:var(--accent-fill);opacity:.5;animation:lv-pulse 3.6s ease-in-out infinite;}
.lv-spin{transform-origin:50% 50%;will-change:transform;animation-name:lv-rot;animation-timing-function:linear;animation-iteration-count:infinite;}
.lv-breathe{animation:lv-breathe 7s ease-in-out infinite;}
.lv-dial path{stroke-linecap:round;}
@keyframes lv-breathe{0%,100%{opacity:1;}50%{opacity:.45;}}
@keyframes lv-rot{to{transform:rotate(360deg);}}
@keyframes lv-dash{to{stroke-dashoffset:-72;}}
@keyframes lv-travel{from{stroke-dashoffset:0;}to{stroke-dashoffset:-1000;}}
@keyframes lv-pulse{0%,100%{opacity:.2;}50%{opacity:.75;}}
.login-intro-inner{position:relative;z-index:1;max-width:520px;}
.login-brand{display:flex;width:fit-content;max-width:100%;align-items:center;gap:14px;margin-bottom:34px;}
.login-logo-icon{width:58px;height:44px;background:linear-gradient(135deg,var(--accent-fill),var(--blue));border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;font-size:15px;color:var(--on-accent);letter-spacing:1px;flex-shrink:0;box-shadow:0 6px 18px rgba(26,86,219,.25);}
.login-title{font-family:var(--fh);font-size:22px;font-weight:700;letter-spacing:1.5px;color:var(--li-text);}
.login-sub{font-size:10px;color:var(--accent);font-family:var(--fm);letter-spacing:2px;margin-top:2px;}
.login-intro .login-sub{color:var(--accent-fill);}
:root[data-theme="light"] .login-intro .login-sub{color:#b45309;}
.login-headline{font-family:var(--fh);font-size:clamp(30px,3.2vw,42px);line-height:1.08;font-weight:700;letter-spacing:.5px;margin-bottom:16px;}
.login-headline span{display:block;color:var(--accent-fill);}
:root[data-theme="light"] .login-headline span{color:#b45309;}
.login-desc{font-size:14px;line-height:1.65;color:var(--li-muted);max-width:460px;margin-bottom:30px;}
.login-features{list-style:none;display:flex;flex-direction:column;gap:14px;}
.login-features li{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border:1px solid var(--li-line-strong);border-radius:10px;background:var(--hl-03);backdrop-filter:blur(2px);}
.login-features strong{display:block;font-family:var(--fh);font-size:16px;letter-spacing:.5px;margin-bottom:2px;}
.login-features span{font-size:12.5px;line-height:1.5;color:var(--li-muted);}
.lf-icon{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;flex-shrink:0;color:var(--accent-fill);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.28);}
:root[data-theme="light"] .lf-icon{color:#b45309;}
.login-main{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:72px clamp(20px,4vw,56px) 40px;}
.login-main::before{content:'';position:absolute;top:0;bottom:0;right:0;left:-80px;z-index:-1;pointer-events:none;background:var(--rs-bg);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 160px);mask-image:linear-gradient(90deg,transparent 0,#000 160px);}
.login-card{position:relative;isolation:isolate;background-color:var(--card-bg);background-image:linear-gradient(128deg,var(--card-sheen) 0%,transparent 34%,transparent 70%,var(--card-sheen) 130%);border:1px solid var(--card-bd);border-radius:18px;padding:38px 36px 28px;width:392px;max-width:100%;

// ─── ASSET PDF ───────────────────────────────────────────────────────────────
function printAssetPDF(a, rel, user) {
  if (!can(user,'asset.print') || !canSeeAsset(user, a)) { alert('Asset sheet downloads are not available for your account.'); return false; }
  const sc = {OPERATIONAL:'#065f46',BREAKDOWN:'#991b1b','UNDER MAINTENANCE':'#9a3412',IDLE:'#92400e',TRANSFERRED:'#1e40af'};
  const sb = {OPERATIONAL:'#d1fae5',BREAKDOWN:'#fee2e2','UNDER MAINTENANCE':'#ffedd5',IDLE:'#fef3c7',TRANSFERRED:'#dbeafe'};
  const color = sc[a.status]||'#475569', bg = sb[a.status]||'#f1f5f9';
  const fields = [['Asset Number',a.num],['Plant',a.plant],['Description',a.desc],['Equipment Code',a.code||'—'],['Model / Make',a.model||'—'],['Capacity',a.cap||'—'],['Register No.',a.reg||'—'],['Engine No.',a.eng||'—'],['Serial / Chassis',a.serial||'—'],['Location',a.loc||'—']];
  const detailRows = fields.map(([l,v])=>`<div><div style="font-size:9px;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">${l}</div><div style="font-size:12px;font-weight:600">${escHtml(v)}</div></div>`).join('');
  const relRows = rel.map(j=>{const jb=j.status==='OPEN'?'#fef3c7':j.status==='IN PROGRESS'?'#dbeafe':'#d1fae5';const jc=j.status==='OPEN'?'#92400e':j.status==='IN PROGRESS'?'#1e40af':'#065f46';return`<tr><td style="font-family:monospace;color:#f59e0b;font-weight:700">${escHtml(j.jobNo)}</td><td>${escHtml(j.date)}</td><td>${escHtml((j.problem||'—').substring(0,70))}</td><td><span style="background:${jb};color:${jc};padding:1px 8px;border-radius:3px;font-size:9px;font-weight:700">${escHtml(j.status)}</span></td></tr>`;}).join('');
  openPrintWindow(`Asset — ${a.num} | ${a.desc}`, `
    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:14px 16px;margin-bottom:12px">
      <div style="font-size:9px;color:#f59e0b;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">ASSET DETAILS</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">${detailRows}
        <div><div style="font-size:9px;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">Status</div><span style="background:${bg};color:${color};padding:2px 10px;border-radius:4px;font-size:10px;font-weight:700">${escHtml(a.status||'—')}</span></div>
      </div>
    </div>
    ${rel.length?`<div><div style="font-size:9px;color:#f59e0b;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;border-bottom:1px solid #e2e8f0;padding-bottom:6px">RELATED JOB ORDERS (${rel.length})</div>
    <table style="width:100%;border-collapse:collapse"><thead><tr><th style="padding:6px 8px;background:#0a1628;color:#f59e0b;font-size:9px;letter-spacing:1px;text-align:left">Job No.</th><th style="padding:6px 8px;background:#0a1628;color:#f59e0b;font-size:9px;text-align:left">Date</th><th style="padding:6px 8px;background:#0a1628;color:#f59e0b;font-size:9px;text-align:left">Problem</th><th style="padding:6px 8px;background:#0a1628;color:#f59e0b;font-size:9px;text-align:left">Status</th></tr></thead>
    <tbody>${relRows}</tbody></table></div>`:''}
  `);
}

// ─── JOB ORDER PDF ────────────────────────────────────────────────────────────
function printJOPDF(jo, user) {
  if (!can(user,'jo.print') || !canSeeJO(user, jo)) { alert('This job order PDF is not available for your account.'); return false; }
  const jsc=jo.status==='OPEN'?'#92400e':jo.status==='IN PROGRESS'?'#1e40af':'#065f46';
  const jsb=jo.status==='OPEN'?'#fef3c7':jo.status==='IN PROGRESS'?'#dbeafe':'#d1fae5';
  const esc = escHtml;   // S12: every record value below is escaped
  const partsRows=(jo.parts||[]).filter(p=>p.desc||p.itemCode).map(p=>`<tr><td style="font-family:monospace;font-size:10px">${esc(p.itemCode||'—')}</td><td>${esc(p.desc||'—')}</td><td style="text-align:center">${esc(p.qty||'—')}</td><td style="text-align:center">${esc(p.unit||'—')}</td></tr>`).join('')||`<tr><td colspan="4" style="color:#94a3b8;text-align:center;padding:8px">No parts recorded</td></tr>`;
  const mpRows=(jo.manpower||[]).filter(m=>m.empId||m.name).map(m=>`<tr><td style="font-family:monospace;font-size:10px">${esc(m.empId||'—')}</td><td style="font-weight:600">${esc(m.name||'—')}</td><td>${esc(m.designation||'—')}</td><td style="text-align:center">${esc(m.hours||0)} hrs</td></tr>`).join('')||`<tr><td colspan="4" style="color:#94a3b8;text-align:center;padding:8px">No manpower recorded</td></tr>`;
  const nb = 'page-break-inside:avoid;break-inside:avoid';
  const sect = (title,content) => `<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:12px 14px;margin-bottom:10px;${nb}"><div style="font-size:9px;color:#f59e0b;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">${title}</div>${content}</div>`;
  const grid3 = items => `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">${items.map(([l,v])=>`<div><div style="font-size:9px;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px">${l}</div><div style="font-size:11px;font-weight:600">${v}</div></div>`).join('')}</div>`;
  const thStyle = 'padding:6px 8px;background:#0a1628;color:#f59e0b;font-size:9px;letter-spacing:1px;text-align:left';
  openPrintWindow(`Job Order ${jo.jobNo}`, `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #e2e8f0;${nb}">
      <span style="font-size:20px;font-weight:900;font-family:Arial Black,sans-serif;color:#0a1628">${esc(jo.jobNo)}</span>
      <span style="background:${jsb};color:${jsc};padding:3px 14px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:1px">${esc(jo.status)}</span>
    </div>
    ${sect('Request Information', grid3([['Date',esc(jo.date||'—')],['Requested By',esc(jo.requester||'—')],['Department',esc(jo.dept||'—')],['Priority',`<span style="font-weight:700;color:${jo.priority==='High'?'#dc2626':'#059669'}">${esc(jo.priority||'—')}</span>`],['Type of Repair',esc(jo.repairType||'—')],['Status',esc(jo.status)]]))}
    ${sect('Equipment Details', grid3([['Asset Number',esc(jo.assetNum||'—')],['Asset Description',esc(jo.assetDesc||'—')],['Location',esc(jo.location||'—')],['Equipment Code',esc(jo.eqcode||'—')]]))}
    <div style="background:#fff8ed;border:1px solid #fed7aa;border-radius:6px;padding:12px 14px;margin-bottom:10px;${nb}">
      <div style="font-size:9px;color:#f59e0b;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px">PROBLEM DETAILS</div>
      <div style="font-size:11px;line-height:1.65">${esc(jo.problem||'—')}</div>
    </div>
    ${sect('Work Assigned To', grid3([['Assigned To',esc(jo.assignedTo)||'—'],['Received By',esc(jo.recvName||'—')],['Section',esc(jo.section||'—')],['Start Date',esc(jo.target||'—')],['Completion Date',`<span style="color:#059669;font-weight:700">${esc(jo.completionDate||'—')}</span>`]]))}
    ${sect('Manpower Utilisation', `<table style="width:100%;border-collapse:collapse"><thead><tr>
      <th style="${thStyle};width:12%">Emp ID</th>
      <th style="${thStyle};width:40%">Name</th>
      <th style="${thStyle};width:33%">Designation</th>
      <th style="${thStyle};text-align:center;width:15%">Hours</th>
    </tr></thead><tbody>${mpRows}</tbody></table>
    <div style="margin-top:8px;font-size:10px;color:#64748b">Downtime: <strong>${esc(jo.downtime||0)} hrs</strong></div>`)}

// ─── CSV UTILITIES ───────────────────────────────────────────────────────────
function dlCSV(content, filename) {
  const blob = new Blob([content], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvCell(v) { return '"'+(String(v||'')).replace(/"/g,'""')+'"'; }
function parseCSVLine(line) {
  const vals=[]; let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(line[i]===','&&!inQ){vals.push(cur.trim());cur='';}
    else cur+=line[i];
  }
  vals.push(cur.trim()); return vals;
}
function exportAssetsCSV(assets, user) {
  if (!can(user,'asset.export')) { alert('CSV export is not available for your role.'); return false; }
  assets = assets.filter(a => canSeeAsset(user, a));
  const hdr=['Asset No.','Asset Category','Description','Eq. Code','Model/Make','Capacity','Register No.','Engine No.','Serial/Chassis No.','Location','Status'];
  const rows=assets.map(a=>[a.num,a.plant,a.desc,a.code,a.model,a.cap,a.reg,a.eng,a.serial,a.loc,a.status].map(csvCell).join(','));
  dlCSV([hdr.join(','),...rows].join('\n'),'assets_export.csv');
}
function exportJobOrdersCSV(jobOrders, user) {
  if (!can(user,'jo.export')) { alert('CSV export is not available for your role.'); return false; }
  jobOrders = jobOrders.filter(j => canSeeJO(user, j));
  const hdr=['Job No.','Date','Asset No.','Asset Desc.','Asset Category','Location','Eq. Code','Dept','Requested By','Priority','Repair Type','Problem','Status','Start Date','Section','Received By','Downtime (hrs)','Work Done','Work Status','Evaluation','Acceptance','Completion Date','Approved By','Technician','Designation','Hrs Attended'];
  const rows=[];
  jobOrders.forEach(j=>{
    const mp=(j.manpower||[]).filter(m=>m.empId||m.name);
    const joBase=[j.jobNo,j.date,j.assetNum,j.assetDesc,j.assetCategory||j.plant||'',j.location,j.eqcode,j.dept,j.requester,j.priority,j.repairType,j.problem,j.status,j.target,j.section,j.recvName,j.downtime,j.workDone,j.workStatus,j.eval,j.accept,j.completionDate,isApproved(j)?(j.approvedBy||''):''];
    const blank=joBase.map(()=>'');
    if(!mp.length){
      rows.push([...joBase,'','',''].map(csvCell).join(','));
    } else {
      mp.forEach((m,i)=>{
        const base=i===0?joBase:blank;
        const techName=`${m.name||''}${m.empId?` (${m.empId})`:''}`.trim();
        rows.push([...base,techName,m.designation||'',m.hours||''].map(csvCell).join(','));
      });
    }
  });
  dlCSV([hdr.join(','),...rows].join('\n'),'joborders_export.csv');
}

  dlCSV(hdr+'\n"JO-9999","2024-01-01","A001","Sample Equipment","01 FUEL FARM","FUEL FARM","EQ-001","Engineering","John Doe","High","Unplanned","Describe problem","OPEN","2024-01-07","Maintenance","","","","","","","","","Accepted","","","Admin"','joborders_template.csv');

function importCSVFile(file, onRows) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const lines = e.target.result.split(/\r?\n/).filter(l=>l.trim());
      if (lines.length < 2) { alert('CSV is empty or has no data rows.'); return; }
      onRows(lines.slice(1).map(parseCSVLine));
    } catch(err) { alert('Error reading CSV: '+err.message); }
  };
  reader.readAsText(file);
}

// ─── ERROR BOUNDARY ──────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = {error: null}; }
  static getDerivedStateFromError(err) { return {error: err}; }
  componentDidCatch(err, info) { console.error('CMMS render error:', err, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#0a1628',flexDirection:'column',gap:16,padding:32,fontFamily:'sans-serif'}}>
          <div style={{fontSize:22,color:'#f59e0b',fontWeight:700,letterSpacing:1}}>CMMS — Application Error</div>
          <div style={{fontSize:12,color:'#ef4444',maxWidth:560,textAlign:'center',wordBreak:'break-word',background:'rgba(239,68,68,.1)',border:'1px solid rgba(239,68,68,.3)',borderRadius:6,padding:'10px 16px'}}>
            {String(this.state.error)}
          </div>
          <div style={{fontSize:12,color:'#94a3b8',textAlign:'center'}}>Please refresh the page. If the problem persists, contact your administrator.</div>
          <button onClick={()=>window.location.reload()} style={{marginTop:8,padding:'9px 22px',background:'#f59e0b',color:'#0a1628',border:'none',borderRadius:6,fontWeight:700,cursor:'pointer',fontSize:14}}>
            ↺ Reload Page
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('dashboard');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(() => { try { return localStorage.getItem(SIDEBAR_KEY) === '1'; } catch(e) { return false; } });
  function toggleSidebar() { setSidebarCollapsed(c => { const n = !c; try { localStorage.setItem(SIDEBAR_KEY, n ? '1' : '0'); } catch(e) {} return n; }); }
  const [assets, setAssets] = useState(BASE_ASSETS);
  const [jobOrders, setJobOrders] = useState([]);
  const [joCounter, setJoCounter] = useState(1000);
  const [syncStatus, setSyncStatus] = useState('loading'); // loading | saving | ok
  const [toasts, setToasts] = useState([]);
  const [clock, setClock] = useState('');
  const [dbLoaded, setDbLoaded] = useState(false);
  const saveTimer = useRef(null);
  const isLoaded = useRef(false);
  const isResetting = useRef(false);
  const usersFromDb = useRef(false); // true once `users` came from the database (never the built-in defaults)

  // auth & users (Phase 2B-1): authentication state lives in memory only and starts signed out on every load.
  const authAdapter = useRef(authAdapterFor(ENV.name)).current;
  const [auth, setAuth] = useState(AUTH_SIGNED_OUT);
  const [users, setUsers] = useState([]);   // N2: empty until read from the database (no built-in accounts)
  // Profile = the current stored record of the signed-in subject; role/section/etc. never come from the auth state.
  const currentUser = isValidAuthState(auth, authAdapter) ? profileFor(auth, users) : null;
  // Old browser copies that held password hashes (session; users mirror before Phase 2B-4): delete, never read.
  useEffect(() => { try { [SESSION_KEY, USERS_KEY, STORE_KEY, PM_KEY, EMPLOYEES_KEY, CUSTOM_PLANTS_KEY].forEach(k => localStorage.removeItem(k)); } catch(_) {} }, []);
  const [loadIssue, setLoadIssue] = useState(null);   // N1: null | {kind:'failed'|'empty'} (blocks the app) | {kind:'partial', keys} (banner)
  // N2: corrections found while loading (employee statuses that no longer match their dates; plaintext passwords in the
  // users list) are applied in memory only and written after an AUTHORIZED user signs in (never anonymously).
  const [deferredFix, setDeferredFix] = useState({employees: false, users: false});
  // N2: the write gate follows the signed-in profile (deactivation or deletion closes it too).
  const signedInId = currentUser ? currentUser.id : null;
  useEffect(() => { writeGate.signedIn = signedInId !== null; }, [signedInId]);

  // modals
  const [assetModal, setAssetModal] = useState(null); // null | {mode:'view'|'edit'|'add', asset}
  const [joModal, setJoModal] = useState(null);       // null | {mode:'view'|'edit'|'add', jo}
  const [joViewModal, setJoViewModal] = useState(null);
  const [assetImport, setAssetImport] = useState(null);   // {plan, rows, fileName}: preview before any asset import is saved

  // ── Clock
  useEffect(() => {
    const tick = () => setClock(new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
    tick(); const id = setInterval(tick, 1000); return () => clearInterval(id);
  }, []);

  // ── Load from Supabase on mount (N1, data safety). A failed or empty read shows a failure screen and writes
  //    nothing; a partial read loads what was read and keeps the rest read-only. Seeding happens ONLY in the local mock /
  //    staging when staging-config.js explicitly sets seedEmptyDatabase: true, and never creates accounts.
  useEffect(() => {
    const fail = (reason, err) => { if (err) console.error('Supabase load error:', err); setLoadIssue({kind: reason}); setSyncStatus('error'); setDbLoaded(true); };
    sb.from('app_data').select('*').then(result => {
      const plan = planDataLoad(result, {envName: ENV.name, seedOptIn: ENV.name === 'staging' && !!(window.CMMS_STAGING_CONFIG && window.CMMS_STAGING_CONFIG.seedEmptyDatabase === true)});
      if (plan.action === 'fail') { fail(plan.reason, result && result.error); return; }
      if (plan.action === 'seed') {
        DATA_KEYS.forEach(k => writableKeys.add(k));
        const baseAssets = BASE_ASSETS.map(a => ({...a, plant: (a.plant||'').toUpperCase()}));
        const deduped = [...new Map(baseAssets.map(a => [a.num, a])).values()];
        setAssets(deduped); setJobOrders([]); setPM([]); setEmployees([]); setCustomPlants([...PLANTS].sort());
        writeGate.seedAllowed = true;   // the only write before sign-in; dbSave accepts it in staging only
        const seed = {seed: true};
        dbSave('assets', deduped, seed); dbSave('jobOrders', [], seed); dbSave('pm', [], seed); dbSave('employees', [], seed); dbSave('customPlants', [...PLANTS].sort(), seed);
        dbSave('users', [], seed);   // no accounts are created (staging users start empty, DATABASE.md)
        writeGate.seedAllowed = false;
      } else {
        const map = plan.values;
        plan.loaded.forEach(k => writableKeys.add(k));
        // Datasets that could not be read are shown EMPTY (never built-in data) and stay read-only.
        if (!('assets' in map)) setAssets([]);
        if (!('jobOrders' in map)) setJobOrders([]);
        if (!('customPlants' in map)) setCustomPlants([]);
        if (plan.action === 'partial') setLoadIssue({kind: 'partial', keys: [...plan.missing, ...plan.invalid]});
        if ('assets' in map) {
          const raw = map.assets;
          const cleaned = sortByAssetNum([...new Map(
            raw.filter(a => !/^0/.test(String(a.num)))
               .map(a => [a.num, {...a, plant:(a.plant||'').toUpperCase()}])
          ).values()]);
          setAssets(cleaned);   // N1: no write-back before sign-in; the cleaned list is stored with the next asset save
        }
        if ('jobOrders' in map) { const jos=map.jobOrders; setJobOrders(jos); if(jos.length){const maxN=Math.max(...jos.map(j=>parseInt((j.jobNo||'').replace(/\D/g,''))||0)); if(maxN>0) setJoCounter(maxN);} }
        if ('pm' in map) setPM(map.pm);
        if ('employees' in map) {   // statuses follow leave/off-site dates: shown at once, STORED only after an authorized sign-in (N2)
          const fixed=applyStatusFromDates(map.employees); setEmployees(fixed);
          if (stableJson(fixed) !== stableJson(map.employees)) setDeferredFix(f => ({...f, employees: true}));
        }
        if ('users' in map && map.users.length) {
          const rawUsers = map.users;
          const needsMigration = rawUsers.some(u => u.password && !/^[0-9a-f]{64}$/.test(u.password));
          if (needsMigration) {
            Promise.all(rawUsers.map(async u => ({...u, password: await hashPwd(u.password)})))   // hashed in memory; stored after an Admin signs in (N2)
              .then(hashed => { usersFromDb.current = true; setUsers(hashed); setDeferredFix(f => ({...f, users: true})); });
          } else { usersFromDb.current = true; setUsers(rawUsers); }
        }
        if ('customPlants' in map) setCustomPlants(map.customPlants);
      }
      isLoaded.current = true;
      setSyncStatus('ok');
      setDbLoaded(true);
    }, err => fail('failed', err));
  }, []);

  // ── Real-time sync via Supabase
  useEffect(() => {
    const ch = sb.channel('cmms_sync')
      .on('postgres_changes', {event:'*', schema:'public', table:'app_data'}, ({new:row}) => {
        if (isResetting.current) return; // block stale broadcasts during/after reset
        if (!isLoaded.current || !row || !writableKeys.has(row.key) || !Array.isArray(row.value)) return;   // N1
        // N2: our own write coming back is ignored; another user's change wins over a local change still waiting in the queue.
        const act = realtimeAction(row.value, row.key in pendingSaves.current, recentWrites[row.key]);
        if (act === 'echo') return;
        if (act === 'conflict') {
          delete pendingSaves.current[row.key];
          if (!Object.keys(pendingSaves.current).length) { clearTimeout(saveTimer.current); setSyncStatus('error'); }
          addToast(`⚠ Someone else changed ${DATA_LABELS[row.key] || row.key} while your change was waiting to be saved. Your change was NOT saved; the latest data is shown. Please make it again.`, true);
        }
        if (row.key==='assets')        setAssets(sortByAssetNum([...new Map((row.value||[]).filter(a=>!/^0/.test(String(a.num))).map(a=>[a.num,a])).values()]));
        else if (row.key==='jobOrders')    setJobOrders(row.value);
        else if (row.key==='pm')           setPM(row.value);
        else if (row.key==='employees')    { const fixed = applyStatusFromDates(row.value); setEmployees(fixed); if (stableJson(fixed) !== stableJson(row.value)) setDeferredFix(f => ({...f, employees: true})); }
        else if (row.key==='users')        { usersFromDb.current = true; setUsers(row.value); }
        else if (row.key==='customPlants') setCustomPlants(row.value);
      })
      .subscribe();
    return () => sb.removeChannel(ch);
  }, []);

  // ── Phase 2B-4: when the signed-in user's authorization changes (role, scope, status, forced change), nothing opened under
  //    the previous authorization stays open: App-level forms close and a page the new role cannot see falls back to the
  //    dashboard. The page area is also re-mounted (key below), which clears page-local state (tabs, dialogs, notices).
  const authzKey = authzFingerprint(currentUser);
  useEffect(() => {
    setAssetModal(null); setJoModal(null); setJoViewModal(null); setAssetImport(null);
    const PAGE_CAP = {dashboard: 'nav.dashboard', assets: 'nav.assets', joborders: 'nav.jobOrders', pmschedule: 'nav.pm', employees: 'nav.employees', reports: 'nav.reports', settings: 'settings.profile'};
    if (currentUser && !can(currentUser, PAGE_CAP[page])) setPage('dashboard');
  }, [authzKey]);

  // ── Tab session: after the users have been read, one attempt to restore this tab's sign-in (see TAB SESSION).
  const restoreTried = useRef(false);
  useEffect(() => {
    if (restoreTried.current || auth.status === 'signed-in' || !dbLoaded || !usersFromDb.current || !authAdapter) return;
    restoreTried.current = true;
    const tok = readTabSession();
    if (!tok) return;
    verifyTabSession(tok, users, sha256Hex).then(u => {
      if (!u) { clearTabSession(); return; }
      setAuth(Object.freeze({status: 'signed-in', subject: Object.freeze({id: u.id, username: u.username}), adapter: authAdapter.name, env: authAdapter.env, since: new Date().toISOString()}));
    });
  }, [dbLoaded, users]);

  // ── While signed in, the subject must still exist and be active in the stored users (deactivated/deleted elsewhere).
  //    Role and section changes need no action: the profile is re-read from the users on every render.
  useEffect(() => {
    if (auth.status !== 'signed-in' || !dbLoaded || !usersFromDb.current) return;
    if (!profileFor(auth, users)) { handleLogout(true); addToast('Your account is no longer active. Please sign in again.', true); }
  }, [users, dbLoaded, auth]);

  // ── Saves (N1). Asset and job-order changes go through one debounced queue that writes ONLY the dataset(s) that changed
  //    (previously every change rewrote both). A failed write is reported by dataset name and never shown as saved.
  //    No dataset is copied to browser storage.
  const pendingSaves = useRef({});
  const unsavedMsg = keys => `⚠ Not saved: ${keys.map(k => DATA_LABELS[k] || k).join(', ')}. The change is shown on this screen but is NOT stored. Reload and try again.`;
  const runBatch = useCallback(async () => {   // writes everything waiting; reports per dataset
    clearTimeout(saveTimer.current);
    const batch = pendingSaves.current; pendingSaves.current = {};
    const keys = Object.keys(batch);
    if (!keys.length) return;
    const errs = await Promise.all(keys.map(k => dbSave(k, batch[k])));   // dbSave checks the write gate synchronously, at call time
    const failed = keys.filter((k, i) => errs[i]);
    setSyncStatus(failed.length ? 'error' : 'ok');
    if (failed.length) addToast(unsavedMsg(failed), true);
    else addToast('✓ Saved');
  }, []);
  const queueSave = useCallback((key, value) => {
    if (!isLoaded.current) { addToast(unsavedMsg([key]), true); return; }   // N2: never a silent drop
    pendingSaves.current[key] = value;
    clearTimeout(saveTimer.current);
    setSyncStatus('saving');
    saveTimer.current = setTimeout(runBatch, 800);
  }, []);
  // Immediate save of one dataset (PM, employees, categories, users), with a visible error on failure.
  function saveNow(key, next) { return dbSave(key, next).then(e => { if (e) { setSyncStatus('error'); addToast(unsavedMsg([key]), true); } return e; }); }

  // ── N2: deferred load-time corrections. Written once, by the first signed-in user allowed to make them (employee
  //    statuses: emp.statusUpdate = Admin, AE; user password hashing: users.admin = Admin). Until then the corrected
  //    values are only shown. Not retried automatically after a failure.
  useEffect(() => {
    if (!currentUser) return;
    if (deferredFix.employees && can(currentUser,'emp.statusUpdate') && writableKeys.has('employees')) {
      setDeferredFix(f => ({...f, employees: false}));
      setEmployees(prev => { const next = applyStatusFromDates(prev); saveNow('employees', next); return next; });
    }
    if (deferredFix.users && can(currentUser,'users.admin') && writableKeys.has('users')) {
      setDeferredFix(f => ({...f, users: false}));
      saveNow('users', users);   // the in-memory list already holds hashes instead of plaintext
    }
  }, [signedInId, currentUser && currentUser.role, deferredFix.employees, deferredFix.users]);

  // ── Auth & User management
  function persistUsers(next) {
    saveNow('users', next);   // N1: no browser copy of the users list
  }

  // Returns {ok:true} or {ok:false, reason:'invalid'|'unavailable', message?}. Sign-in needs users loaded from the backend:
  // never the built-in defaults and never another environment's data.
  async function handleLogin(loginId, password) {
    const r = await authVerify({adapter: authAdapter, loginId, password, users, usersLoaded: usersFromDb.current, hashFn: sha256Hex});
    if (r.ok) {
      const u = users.find(x => x && x.id === r.state.subject.id && x.username === r.state.subject.username);
      if (u) writeTabSession(await makeTabSession(u, sha256Hex));   // refresh keeps this sign-in (same tab only)
      setPage('dashboard'); setAuth(r.state); return {ok: true};
    }
    return r;
  }

  function handleLogout(forced) {
    // N2: a normal sign-out first writes what is waiting; a forced one (account deactivated or deleted) discards it.
    if (forced === true) { clearTimeout(saveTimer.current); const k = Object.keys(pendingSaves.current); pendingSaves.current = {}; if (k.length) addToast(unsavedMsg(k), true); }
    else runBatch();
    writeGate.signedIn = false;
    clearTabSession();   // logout (normal or forced) ends the tab session
    setAuth(AUTH_SIGNED_OUT);
    setAssetModal(null); setJoModal(null); setJoViewModal(null); setAssetImport(null);   // nothing opened by this user survives
    setPage('dashboard');
    try { localStorage.removeItem(SESSION_KEY); } catch(_) {}
  }

  async function saveUser(user, editId) {
    if (!allow(can(currentUser,'users.admin') || (!!editId && !!currentUser && editId === currentUser.id && can(currentUser,'profile.edit')))) return;
    if (can(currentUser,'users.admin')) {
      const err = validateUserRecord(user, categories, {users, editId});
      if (err) { addToast(err, true); return; }
      if (!editId && !(typeof user.password === 'string' && user.password !== '')) { addToast('A password is required for new accounts.', true); return; }
      user = normalizeUserRecord(user);
    }
    const hashedPwd = user.password && can(currentUser,'users.admin') ? await sha256Hex(user.password) : null;   // own password: Change Password only
    setUsers(prev => {
      let next;
      if (editId) {
        const existing = prev.find(u => u.id === editId);
        // Without users.admin only the own name, email and password may change (fixes S4; FEATURE_PLAN §6.1 ★).
        const base = can(currentUser,'users.admin') ? user : {...existing, fullName: user.fullName, email: user.email};
        const updated = {...base, id: editId, password: hashedPwd || existing.password};
        next = prev.map(u => u.id === editId ? updated : u);
      } else {
        const newId = Math.max(0, ...prev.map(u => u.id)) + 1;
        next = [...prev, {...user, id: newId, password: hashedPwd}];
      }
      persistUsers(next);
      return next;
    });
    addToast(editId ? 'User updated.' : 'User added.');
  }

  // Own password change. Verifies the current password with a plain SHA-256 (no hash passthrough) and changes ONLY `password`.
  async function changeOwnPassword(currentPw, newPw) {
    if (!allow(!!currentUser && can(currentUser,'profile.password'))) return false;
    const me = users.find(u => u.id === currentUser.id && u.username === currentUser.username);
    if (!me) { addToast('Your account was not found.', true); return false; }
    if (typeof currentPw !== 'string' || (await sha256Hex(currentPw)) !== me.password) { addToast('The current password is incorrect.', true); return false; }
    const err = validateNewPassword(newPw, currentPw);
    if (err) { addToast(err, true); return false; }
    const hashed = await sha256Hex(newPw);
    // Only the hash changes, and only once the save has succeeded.
    const updatedMe = {...me, password: hashed};
    const next = users.map(u => u.id === me.id ? updatedMe : u);
    const saveErr = await dbSave('users', next);
    if (saveErr) { addToast('Your password was not changed: it could not be saved. Please try again.', true); return false; }
    setUsers(prev => prev.map(u => u.id === me.id ? updatedMe : u));
    writeTabSession(await makeTabSession(updatedMe, sha256Hex));   // own change: this tab stays signed in after a refresh
    addToast('Password changed.');
    return true;
  }

  // Phase 2B-2, LOCAL DEVELOPMENT ONLY: reset an account to a generated temporary password and force a change at the next
  // sign-in. Only password + flag change; role, section, department, status and all references stay. The plaintext is

  function deleteUser(id) {
    if (!allow(can(currentUser,'users.admin'))) return;
    if (currentUser && currentUser.id === id) { addToast('Cannot delete your own account.', true); return; }
    setUsers(prev => {
      const next = prev.filter(u => u.id !== id);
      persistUsers(next);
      return next;
    });
    addToast('User deleted.');
  }

  // ── Permission guard for user actions (FEATURE_PLAN §12.2; load-time writes are not gated)

  }

  // ── JO mutations
  function saveJO(jo, editJobNo) {
    if (!allow(editJobNo ? (can(currentUser,'jo.edit.request') || can(currentUser,'jo.edit.work')) : can(currentUser,'jo.create'))) return;
    let nextJOs, nextCounter = joCounter;
    if (editJobNo) {
      const stored = jobOrders.find(j => j.jobNo===editJobNo);
      if (!allow(!!stored && mayEditJO(currentUser, stored))) return;
      if (!(can(currentUser,'jo.edit.request') && can(currentUser,'jo.edit.work'))) {
        if (can(currentUser,'jo.edit.work')) jo = {...stored, ...pickFields(jo, JO_WORK_FIELDS.filter(k => k !== 'section'))};   // Job Card Editor: sections 4-7 except Section Assigned
        else {                                                                                           // Department User, own OPEN JO
          jo = {...stored, ...pickFields(jo, JO_REQUEST_FIELDS), requester: stored.requester, dept: stored.dept};
          const a = assets.find(x => x.num === jo.assetNum);
          if (!allow(!!a && canSeeAsset(currentUser, a))) return;
          if (jo.repairType !== DU_REPAIR_TYPE) { addToast('Department Users can only raise Unplanned repairs.', true); return; }
        }
      }
      jo = withStoredFields(jo, stored, JO_CONTROL_FIELDS);       // status, closure and approval only change through their own actions
      jo = resetApprovalIfChanged(stored, jo, currentUser);       // §4.3 / inv. 7
      if (isApproved(stored) && !isApproved(jo)) addToast(`${editJobNo}: completion details changed — approval reset to pending.`, true);
      nextJOs = jobOrders.map(j => j.jobNo===editJobNo ? jo : j);
      addToast(`Job Order ${editJobNo} updated.`);
    } else {
      if (isDeptUser(currentUser)) {                                                                     // D5: restricted request form
        const a = assets.find(x => x.num === jo.assetNum);
        if (!allow(!!a && canSeeAsset(currentUser, a) && DEPARTMENTS.includes(currentUser.department))) return;
        if (jo.repairType !== DU_REPAIR_TYPE) { addToast('Department Users can only raise Unplanned repairs.', true); return; }
        jo = {...jo, ...JO_WORK_BLANK, requester: currentUser.fullName, dept: currentUser.department, status: 'OPEN'};
      }
      nextCounter = joCounter + 1;
      setJoCounter(nextCounter);
      jo = {...withStoredFields(jo, {}, JO_CONTROL_FIELDS), status: 'OPEN', jobNo: `JO-${nextCounter}`, requesterId: currentUser.id};
      nextJOs = [...jobOrders, jo];
      addToast(`Job Order ${jo.jobNo} saved.`);
    }
    setJobOrders(nextJOs);
    queueSave('jobOrders', nextJOs);
    setJoModal(null);
  }

  function updateJOStatus(jobNo, status, assignment) {
    if (!allow((status==='IN PROGRESS' ? can(currentUser,'jo.start') : status==='COMPLETED' ? can(currentUser,'jo.complete') : false) && canSeeJO(currentUser, (jobOrders.find(j => j.jobNo===jobNo))))) return;
    const from = {'IN PROGRESS':'OPEN', 'COMPLETED':'IN PROGRESS'}[status];
    const cur = jobOrders.find(j => j.jobNo===jobNo);
    if (!cur || cur.status !== from) { addToast(`${jobNo}: ${cur ? cur.status : 'not found'} → ${status} is not a valid step.`, true); return; }
    if (!jceSectionAllows(currentUser, cur, status==='IN PROGRESS' ? 'start' : 'progress')) { addToast(`${jobNo} belongs to the ${cur.section || 'unassigned'} section. You can only work on ${currentUser.section || 'your own'} section job orders.`, true); return; }
    // Starting work assigns it (owner decision 2026-10-11). A Job Card Editor assigns it to themselves; Admin/AE must choose an
    // active Job Card Editor. Assignment and status change are ONE update and ONE save.
    let assign = {};
    if (status==='IN PROGRESS') {
      if (isJobCardEditor(currentUser)) {
        const me = users.find(u => u.id === currentUser.id && u.username === currentUser.username);
        if (!isEligibleEditor(me)) { addToast('Your Job Card Editor account needs an active status and a section before you can start work. Ask an Admin.', true); return; }
        assign = {assignedTo: me.fullName, assignedToId: me.id, recvName: me.fullName, section: me.section};
      } else {
        const ed = assignment && users.find(u => u.id === assignment.assigneeId);
        if (!isEligibleEditor(ed)) { addToast(`${jobNo}: select an active Job Card Editor (with a section) to assign the work to before moving it to IN PROGRESS.`, true); return; }
        assign = {assignedTo: ed.fullName, assignedToId: ed.id, recvName: currentUser.fullName, section: ed.section};
      }
    }
    setJobOrders(prev => {
      // Completing never approves: it opens a PENDING approval (§4.4 inv. 1)
      const next = prev.map(j => j.jobNo!==jobNo || j.status!==from ? j : status==='COMPLETED' ? {...withoutApprover(j), status, approvalStatus:'PENDING'} : {...j, status, ...assign});
      queueSave('jobOrders', next);
      return next;
    });
    addToast(`${jobNo} → ${status}`);
  }

  function deleteJO(jobNo) {

  // F5: approval and closing are two separate actions (§4.3). Role-based only (jo.approve / jo.close are non-grantable).
  function approveJO(jobNo) {
    if (!allow(can(currentUser,'jo.approve') && canSeeJO(currentUser, (jobOrders.find(j => j.jobNo===jobNo))))) return;
    if (!canApproveJO(jobOrders.find(j => j.jobNo===jobNo))) { addToast(`${jobNo}: only a COMPLETED job order that is not yet approved can be approved.`, true); return; }
    const ev = approvalEvent(currentUser, 'APPROVED');
    setJobOrders(prev => {
      const next = prev.map(j => j.jobNo===jobNo && canApproveJO(j) ? {...j, approvalStatus:'APPROVED', approvedBy:ev.by, approvedById:ev.byId, approverDesignation:ev.designation, approvedAt:ev.at, approvalHistory:[...historyOf(j), ev]} : j);
      queueSave('jobOrders', next);
      return next;
    });
    addToast(`${jobNo} completion approved. It can now be closed.`);
  }
  function closeJO(jobNo, closure) {
    if (!allow(can(currentUser,'jo.close') && canSeeJO(currentUser, (jobOrders.find(j => j.jobNo===jobNo))))) return;
    if (!canCloseJO(jobOrders.find(j => j.jobNo===jobNo))) { addToast(`${jobNo}: approve the completion before closing.`, true); return; }
    const closedDate = closure && /^\d{4}-\d{2}-\d{2}$/.test(closure.closedDate) ? closure.closedDate : '';
    if (!closedDate) { addToast('Please select the closed date.', true); return; }
    const cev = approvalEvent(currentUser, 'CLOSED', '', {closedDate});   // `at` = automatic time of the action; closedDate = the date selected
    setJobOrders(prev => {
      const next = prev.map(j => j.jobNo===jobNo && canCloseJO(j) ? {...j, status:'CLOSED', closedBy:currentUser.fullName, closerDesignation:DESIGNATIONS[currentUser.role] || currentUser.role, closedDate, approvalHistory:[...historyOf(j), cev]} : j);
      queueSave('jobOrders', next);

    addToast(`${jobNo} closed.`);

  function revertJO(jobNo) {
    if (!allow(can(currentUser,'jo.revert') && canSeeJO(currentUser, (jobOrders.find(j => j.jobNo===jobNo))))) return;
    if ((jobOrders.find(j => j.jobNo===jobNo) || {}).status !== 'CLOSED') { addToast(`${jobNo}: only a CLOSED job order can be reverted.`, true); return; }
    setJobOrders(prev => {
      // §4.3: closure cleared, approval and approval history KEPT (legacy JOs have none, so they need approval again)
      const rev = approvalEvent(currentUser, 'REVERTED', 'reverted to COMPLETED');
      const next = prev.map(j => j.jobNo===jobNo && j.status==='CLOSED' ? {...j, status:'COMPLETED', closedBy:'', closerDesignation:'', closedDate:'', approvalHistory:[...historyOf(j), rev]} : j);
      queueSave('jobOrders', next);
      return next;
    });
    addToast(`${jobNo} reverted to COMPLETED.`);
  }

  // ── Employees

  // ── PM Schedule

  function updateEmployeeStatus(empId, updates) {

  function deleteEmployee(empId) {

  function importEmployeesFromData(newEmps) {
    if (!allow(can(currentUser,'emp.admin'))) return {added:0, updated:0};
    const byId = new Map(employees.map(e => [e.empId, e]));
    let added = 0, updated = 0;
    newEmps.forEach(ne => { if (byId.has(ne.empId)) updated++; else added++; });
    if (!added && !updated) { addToast('CSV has no valid records.'); return {added:0,updated:0}; }
    const today = new Date().toISOString().split('T')[0];
    setEmployees(prev => {
      const next = prev.map(e => {
        const ne = newEmps.find(n => n.empId===e.empId);
        if (!ne) return e;
        const normCsv = ne.siteStatus==='OD'?'ON DUTY':ne.siteStatus==='OL'?'ON LEAVE':ne.siteStatus==='OS'?'OFF SITE':ne.siteStatus;
        const hasActiveLeave = e.leaveStart && e.leaveStart<=today && (!e.leaveEnd||e.leaveEnd>=today);
        const hasActiveOffsite = e.offsiteStart && (!e.offsiteEnd||e.offsiteEnd>=today);
        const keepStatus = normCsv==='ON DUTY' && (hasActiveLeave||hasActiveOffsite);
        return {
          ...e,
          name: ne.name||e.name,
          designation: ne.designation||e.designation,
          section: ne.section||e.section,
          nationality: ne.nationality||e.nationality,
          ...(ne.siteStatus && !keepStatus?{siteStatus:ne.siteStatus}:{}),
          ...(ne.leaveType?{leaveType:ne.leaveType}:{}),
          ...(ne.leaveStart?{leaveStart:ne.leaveStart}:{}),
          ...(ne.leaveEnd?{leaveEnd:ne.leaveEnd}:{}),
          ...(ne.exitDate?{exitDate:ne.exitDate}:{}),
        };
      });
      const existingIds = new Set(prev.map(e=>e.empId));
      const toAdd = newEmps.filter(ne=>!existingIds.has(ne.empId));
      const final = [...next,...toAdd];
      persistEmployees(final);
      return final;
    });
    return {added, updated};
  }
  function fixEmployeeStatusFromDates() {

  function resetData() {

  // ── Custom Plants
  const [customPlants, setCustomPlants] = useState([...PLANTS].sort());
  const categories = useMemo(() => allCategories(assets, customPlants), [assets, customPlants]);
  function addCustomPlant(name) {
    if (!allow(can(currentUser,'asset.category.manage'))) return;
    const upper = name.trim().toUpperCase();
    if (!upper) return;
    setCustomPlants(prev => {
      if (prev.includes(upper)) return prev;
      const next = [...prev, upper].sort();
      saveNow('customPlants', next);
      return next;
    });
  }
  function renameCustomPlant(oldName, newName) {
    if (!allow(can(currentUser,'asset.category.manage'))) return;
    const upper = newName.trim().toUpperCase();
    if (!upper || upper === oldName) return;
    const same = x => String(x == null ? '' : x).toUpperCase() === String(oldName).toUpperCase();
    if (!categories.some(same)) { addToast(`Category "${oldName}" not found — rename cancelled.`, true); return; }
    if (categories.some(p => !same(p) && p === upper)) { addToast(`Category "${upper}" already exists — rename cancelled.`, true); return; }
    const syncWarn = what => e => { if (e) addToast(`⚠ Cloud sync failed for ${what} — the rename is NOT stored. Reload and try again.`, true); };
    setCustomPlants(prev => {
      if (!prev.some(same)) return prev;   // a category used only by assets: the stored list does not change
      const next = prev.map(p => same(p) ? upper : p);
      dbSave('customPlants', next).then(syncWarn('categories'));
      return next;
    });
    // One renamed JO list for both state and the debounced save. (Previously the combined save wrote the PRE-rename
    // jobOrders ~800 ms later, overwriting the renamed JOs in the database.)
    // Deliberately two datasets (assets AND job orders): both are queued into the same save batch.
    const nextJOs = jobOrders.map(j => same(j.assetCategory) ? {...j, assetCategory:upper} : j);
    setJobOrders(nextJOs);
    queueSave('jobOrders', nextJOs);
    setAssets(prev => {
      const next = prev.map(a => same(a.plant) ? {...a, plant:upper} : a);
      queueSave('assets', next);
      return next;
    });
    // Department Users' assigned categories follow the rename (FEATURE_PLAN §7 gate 8); other users and fields untouched.
    const hit = u => Array.isArray(u.assignedCategories) && u.assignedCategories.some(c => String(c).toUpperCase() === oldName.toUpperCase());
    setUsers(prev => {
      if (!prev.some(hit)) return prev;
      const next = prev.map(u => hit(u) ? {...u, assignedCategories: [...new Set(u.assignedCategories.map(c => String(c).toUpperCase() === oldName.toUpperCase() ? upper : c))]} : u);
      dbSave('users', next).then(syncWarn('user categories'));
      return next;
    });
    addToast(`Renamed "${oldName}" → "${upper}"`);
  }
  function importAssetsFromCSV(file) {
    if (!allow(can(currentUser,'asset.import'))) return;
    // Nothing is saved here: the file is checked and a preview is shown first (applyAssetImport saves after confirmation).
    importCSVFile(file, rows => setAssetImport({plan: planAssetImport(rows, assets, categories), rows, fileName: (file && file.name) || 'CSV file'}));
  }
  function applyAssetImport(selectedNums) {
    if (!allow(can(currentUser,'asset.import'))) return false;
    const imp = assetImport;
    if (!imp) return false;
    if (imp.plan.invalid.length) { addToast('Import blocked: fix the invalid rows and import the file again. Nothing was saved.', true); return false; }
    // The asset list may have changed since the preview: re-check, and save nothing if the plan is no longer the same.
    if (JSON.stringify(planAssetImport(imp.rows, assets, categories)) !== JSON.stringify(imp.plan)) { setAssetImport(null); addToast('The asset list changed since the preview. Import the file again. Nothing was saved.', true); return false; }
    let next;
    try { next = applyAssetPlan(assets, imp.plan, selectedNums); }
    catch (e) { setAssetImport(null); addToast(`Import failed (${e.message}). Nothing was saved.`, true); return false; }
    const nUpd = imp.plan.updates.filter(u => (selectedNums || []).map(String).includes(u.num)).length;
    setAssets(next);
    queueSave('assets', next);   // one write of the complete list
    setAssetImport(null);
    addToast(`Assets: ${imp.plan.added.length} added, ${nUpd} updated, ${imp.plan.unchanged.length} unchanged.`);
    return true;
  }
  function importJOsFromCSV(file) {
    if (!allow(can(currentUser,'jo.import'))) return;
    importCSVFile(file, rows => {
      const newJOs = rows.map(v=>({jobNo:v[0]||'',date:v[1]||'',assetNum:v[2]||'',assetDesc:v[3]||'',assetCategory:v[4]||'',location:v[5]||'',eqcode:v[6]||'',dept:v[7]||'',requester:v[8]||'',priority:v[9]||'High',repairType:v[10]||'Planned',problem:v[11]||'',status:v[12]||'OPEN',target:v[13]||'',section:v[14]||'',tech1:v[15]||'',tech1h:v[16]||'',tech2:v[17]||'',tech2h:v[18]||'',workDone:v[19]||'',workStatus:v[20]||'',eval:v[21]||'',downtime:v[22]||'',accept:v[23]||'Accepted',completionDate:v[24]||'',recvName:v[25]||'',approved:v[26]||'',parts:[]})).filter(j=>j.jobNo&&j.assetNum);
      // §8 / D16 / D20: only OPEN, IN PROGRESS and COMPLETED are imported; COMPLETED arrives PENDING approval; the free-text
      // `approved` column never approves. Anything else (incl. CLOSED) is rejected and listed.
      const IMPORTABLE = ['OPEN','IN PROGRESS','COMPLETED'];
      const rejected = newJOs.filter(j => !IMPORTABLE.includes(j.status));
      const accepted = newJOs.filter(j => IMPORTABLE.includes(j.status)).map(j => j.status==='COMPLETED' ? {...j, approvalStatus:'PENDING'} : j);
      if (rejected.length) alert(`${rejected.length} row(s) not imported (status must be OPEN, IN PROGRESS or COMPLETED; CLOSED is never imported):\n` + rejected.map(j => `${j.jobNo}: ${j.status}`).join('\n'));
      setJobOrders(prev => {
        const existing = new Set(prev.map(j=>j.jobNo));
        const toAdd = accepted.filter(j=>!existing.has(j.jobNo));
        const next = [...prev, ...toAdd];
        queueSave('jobOrders', next);
        addToast(`Imported ${toAdd.length} job orders.`);
        return next;
      });
    });
  }

  const syncLabel = syncStatus==='loading' ? '⟳ Loading...' : syncStatus==='saving' ? '💾 Saving...' : syncStatus==='error' ? '⚠ Not saved' : '✓ Saved';
  const syncCls   = syncStatus==='loading' ? 'sync-loading' : syncStatus==='saving' ? 'sync-saving' : syncStatus==='error' ? 'sync-error' : 'sync-ok';

  // Scoped views for DISPLAY only (FEATURE_PLAN §7 gate 1); every save still uses the full arrays.

  if (!dbLoaded) return (

  return (

                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
