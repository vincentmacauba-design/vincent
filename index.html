  function recordPMService(pmId, record) {
    if (!allow(can(currentUser,'pm.recordService'))) return;
    setPM(prev => {
      const next = prev.map(p => {
        if (p.id!==pmId) return p;
        const history = [{...record}, ...(p.serviceHistory||[])];
        const next_ = computeNextService(record.date, p.frequency);
        return {...p, lastService:record.date, nextService:next_, serviceHistory:history};
      });
      saveNow('pm', next);
      return next;
    });
  }

  // Status fields + ONE new leave-history entry (the server appends it; history is append-only).
  function updateEmployeeStatus(empId, updates) {
    if (!allow(can(currentUser,'emp.statusUpdate'))) return;
    const {leaveHistory, ...fields} = updates || {};
    const entry = Array.isArray(leaveHistory) && leaveHistory.length ? leaveHistory[leaveHistory.length - 1] : null;
    serverChange('employee_set_status', {p_emp_id: empId, p_updates: fields, p_entry: entry}, ['employees'], 'Employee record updated.');
  }
  function deleteEmployee(empId) {
    if (!allow(can(currentUser,'emp.admin'))) return;
    serverChange('employee_delete', {p_emp_id: empId}, ['employees'], 'Employee removed.');
  }
  function importEmployeesFromData(newEmps) {
    if (!allow(can(currentUser,'emp.admin'))) return {added:0, updated:0};
    const byId = new Map(employees.map(e => [e.empId, e]));
    let added = 0, updated = 0;
    newEmps.forEach(ne => { if (byId.has(ne.empId)) updated++; else added++; });
    if (!added && !updated) { addToast('CSV has no valid records.'); return {added:0,updated:0}; }
    serverChange('employee_import', {p_rows: newEmps}, ['employees']);   // same merge rules, applied by the server
    return {added, updated};
  }
  function fixEmployeeStatusFromDates() {
    if (!allow(can(currentUser,'emp.admin'))) return;
    serverChange('employee_apply_date_rules', {}, ['employees'], 'Statuses recalculated from leave/off-site dates.');
  }
  function resetData() {
    if (!allow(can(currentUser,'data.reset'))) return;
    isResetting.current = true; // block realtime broadcasts during reset
    clearTimeout(saveTimer.current); pendingSaves.current = {};
    // N2: user accounts are NOT touched (as the Reset screen states). The server empties the datasets in one step.
    serverChange('admin_reset_data', {p_confirm: 'RESET ALL DATA'}, DATA_KEYS.slice(), 'All data has been reset.')
      .finally(() => setTimeout(() => { isResetting.current = false; }, 3000));
  }

  // ── Custom Plants
  const [customPlants, setCustomPlants] = useState([]);
  const categories = useMemo(() => allCategories(assets, customPlants), [assets, customPlants]);
  // Department User assignment uses ONLY the Asset Registry categories (those the assets actually use). A stored category
  // with no asset (production: a stale "12 Vessel" entry) is never offered or accepted for assignment. The asset form and
  // CSV import keep the full list, so a newly added category can still receive its first asset.
  const assetCategories = useMemo(() => allCategories(assets, []), [assets]);
  function addCustomPlant(name) {
    if (!allow(can(currentUser,'asset.category.manage'))) return;
    const upper = name.trim().toUpperCase();
    if (!upper) return;
    if (upper === ALL_CATEGORIES) { addToast('"*" is reserved and cannot be a category name.', true); return; }
    setCustomPlants(prev => {
      if (prev.includes(upper)) return prev;
      const next = [...prev, upper].sort();
      saveNow('customPlants', next);
      return next;
    });
  }
  // Categories, asset categories, job-order categories and Department User categories change together, on the server.
  function renameCustomPlant(oldName, newName) {
    if (!allow(can(currentUser,'asset.category.manage'))) return;
    const upper = newName.trim().toUpperCase();
    if (!upper || upper === oldName) return;
    // Any current category may be renamed: one the assets use or one in the stored list (case-insensitive, as category_rename).
    const same = x => String(x == null ? '' : x).toUpperCase() === String(oldName).toUpperCase();
    if (!categories.some(same)) { addToast(`Category "${oldName}" not found — rename cancelled.`, true); return; }
    if (categories.some(p => !same(p) && p === upper)) { addToast(`Category "${upper}" already exists — rename cancelled.`, true); return; }
    if (pendingSaves.current.assets) runBatch();   // a waiting asset save goes first, so it cannot undo the rename
    serverChange('category_rename', {p_old: oldName, p_new: upper}, ['customPlants', 'assets', 'jobOrders', 'users'], `Renamed "${oldName}" → "${upper}"`);
  }
  function importAssetsFromCSV(file) {
    if (!allow(can(currentUser,'asset.import'))) return;
    // Nothing is saved here: the file is checked and a preview is shown first (applyAssetImport saves after confirmation).
    importCSVFile(file, rows => setAssetImport({plan: planAssetImport(rows, assets, categories), rows, fileName: (file && file.name) || 'CSV file'}));
  }
  function applyAssetImport(selectedNums) {
    if (!allow(can(currentUser,'asset.import'))) return false;
    const imp = assetImport;
    if (!imp) return false;
    if (imp.plan.invalid.length) { addToast('Import blocked: fix the invalid rows and import the file again. Nothing was saved.', true); return false; }
    // The asset list may have changed since the preview: re-check, and save nothing if the plan is no longer the same.
    if (JSON.stringify(planAssetImport(imp.rows, assets, categories)) !== JSON.stringify(imp.plan)) { setAssetImport(null); addToast('The asset list changed since the preview. Import the file again. Nothing was saved.', true); return false; }
    let next;
    try { next = applyAssetPlan(assets, imp.plan, selectedNums); }
    catch (e) { setAssetImport(null); addToast(`Import failed (${e.message}). Nothing was saved.`, true); return false; }
    const nUpd = imp.plan.updates.filter(u => (selectedNums || []).map(String).includes(u.num)).length;
    setAssets(next);
    queueSave('assets', next);   // one write of the complete list
    setAssetImport(null);
    addToast(`Assets: ${imp.plan.added.length} added, ${nUpd} updated, ${imp.plan.unchanged.length} unchanged.`);
    return true;
  }
  function importJOsFromCSV(file) {
    if (!allow(can(currentUser,'jo.import'))) return;
    importCSVFile(file, rows => {
      const newJOs = rows.map(v=>({jobNo:v[0]||'',date:v[1]||'',assetNum:v[2]||'',assetDesc:v[3]||'',assetCategory:v[4]||'',location:v[5]||'',eqcode:v[6]||'',dept:v[7]||'',requester:v[8]||'',priority:v[9]||'High',repairType:v[10]||'Planned',problem:v[11]||'',status:v[12]||'OPEN',target:v[13]||'',section:v[14]||'',tech1:v[15]||'',tech1h:v[16]||'',tech2:v[17]||'',tech2h:v[18]||'',workDone:v[19]||'',workStatus:v[20]||'',eval:v[21]||'',downtime:v[22]||'',accept:v[23]||'Accepted',completionDate:v[24]||'',recvName:v[25]||'',approved:v[26]||'',parts:[]})).filter(j=>j.jobNo&&j.assetNum);
      // §8 / D16 / D20: only OPEN, IN PROGRESS and COMPLETED are imported; COMPLETED arrives PENDING approval; the free-text
      // `approved` column never approves. Anything else (incl. CLOSED) is rejected and listed. The server applies the same rules.
      const IMPORTABLE = ['OPEN','IN PROGRESS','COMPLETED'];
      const rejected = newJOs.filter(j => !IMPORTABLE.includes(j.status));
      if (rejected.length) alert(`${rejected.length} row(s) not imported (status must be OPEN, IN PROGRESS or COMPLETED; CLOSED is never imported):\n` + rejected.map(j => `${j.jobNo}: ${j.status}`).join('\n'));
      serverChange('jo_import', {p_rows: newJOs.filter(j => IMPORTABLE.includes(j.status))}, ['jobOrders'], res => `Imported ${(res && res.added || []).length} job orders.`);
    });
  }

  const syncLabel = syncStatus==='loading' ? '⟳ Loading...' : syncStatus==='saving' ? '💾 Saving...' : syncStatus==='error' ? '⚠ Not saved' : '✓ Saved';
  const syncCls   = syncStatus==='loading' ? 'sync-loading' : syncStatus==='saving' ? 'sync-saving' : syncStatus==='error' ? 'sync-error' : 'sync-ok';

  // Scoped views for DISPLAY only (FEATURE_PLAN §7 gate 1); every save still uses the full arrays.
  const visibleAssets = assets.filter(a => canSeeAsset(currentUser, a));
  const visibleJobOrders = jobOrders.filter(j => canSeeJO(currentUser, j));
  const shownCategories = visibleCategories(currentUser, categories);   // configured categories, incl. empty ones, in the user's scope
  const eligibleEditors = users.filter(isEligibleEditor).map(u => ({id: u.id, fullName: u.fullName, section: u.section}));   // no hashes passed on

  // N1: an inaccessible or empty database is never treated as "no data": the app stops here and writes nothing.
  if (loadIssue && loadIssue.kind !== 'partial') return (
    <><style>{CSS}</style><DataUnavailable kind={loadIssue.kind}/></>
  );
  if (!currentUser && link) return (
    <><style>{CSS}</style><RecoveryLanding link={link} onSetPassword={completeRecovery} onVerify={verifyRecoveryEmail} onBack={()=>setLink(null)}/></>
  );
  // Refresh / direct load with a stored session: never the sign-in form while it is being checked (no login flash).
  if (!currentUser && restoring) return (
    <><style>{CSS}</style><SplashScreen text="Restoring your session…"/></>
  );
  if (!currentUser) return (
    <><style>{CSS}</style><LoginPage onLogin={handleLogin}/>
      {/* N2: messages raised at sign-out (account deactivated, change not saved) stay visible on the login page */}
      <div className="toast-wrap">{toasts.map(t => <div key={t.id} className={`toast-msg${t.err?' err':''}`}>{t.msg}</div>)}</div></>
  );

  // Phase 2B-2: a forced password change blocks the whole application (no navigation, no pages, no actions) until it succeeds.
  if (mustChangePassword(currentUser)) return (
    <><style>{CSS}</style><ForcePasswordChange user={currentUser} onSubmit={changeOwnPassword} onLogout={handleLogout}/></>
  );

  if (!dbLoaded) return (
    <><style>{CSS}</style><SplashScreen text="Loading data..."/></>
  );

  // The pages this account may open, in navigation order: the sidebar shows all of them; on phones the bottom bar shows all
  // but Settings, which is in the account menu. The same checks as before decide visibility (Settings is always available).
  const navItems = [
    {id:'dashboard', icon:'🏠', label:'Dashboard', short:'Dashboard', ok:can(currentUser,'nav.dashboard')},

// Notification bell (p2/sql/0008): the caller's own notifications from my_notifications; the server takes the identity from
// the session and computes the recipients. Polling every 10 s and 1.5 s after a job-order change (decision N-D3).
function NotificationBell({jobOrders, onOpenJO}) {
  const [items, setItems] = useState([]), [open, setOpen] = useState(false), [phase, setPhase] = useState('loading');
  const wrapRef = useRef(null);
  const load = useCallback(async () => {
    try {
      const r = await serverCall('my_notifications', {p_limit: 50}); const data = r.data, error = r.error;
      if (error) throw error;
      setItems(Array.isArray(data) ? data : []); setPhase('ready');
    } catch (_) { setPhase('error'); }
  }, []);
  useEffect(() => { load(); const id = setInterval(load, 10000); return () => clearInterval(id); }, [load]);
  const joSig = (jobOrders || []).map(j => j.jobNo + ':' + j.status).join('|');   // stable across re-renders (the clock re-renders every second)
  useEffect(() => { const id = setTimeout(load, 1500); return () => clearTimeout(id); }, [joSig, load]);   // after job-order changes
  useEffect(() => {
    if (!open) return;
    const away = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    const esc = e => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', away); document.addEventListener('keydown', esc);
    return () => { document.removeEventListener('mousedown', away); document.removeEventListener('keydown', esc); };
  }, [open]);
  async function markRead(ids) {
    setItems(prev => prev.map(n => ids === null || ids.includes(n.id) ? {...n, read: true} : n));
    await serverCall('notification_mark_read', {p_ids: ids});   // the server changes only the caller's own items
    load();
  }
  const unread = unreadCount(items);
  const when = at => { try { return new Date(at).toLocaleString('en-GB', {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'}); } catch (_) { return ''; } };
  return (
    <div className="notif-wrap" ref={wrapRef}>
      <button type="button" className="notif-bell" aria-haspopup="dialog" aria-expanded={open} aria-label={`Notifications, ${unread} unread`} title="Notifications"
        onClick={()=>{ setOpen(o => !o); if (!open) load(); }}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        {unread > 0 && <span className="notif-badge" aria-hidden="true">{unread > 99 ? '99+' : unread}</span>}
      </button>
      {open && <div className="notif-panel" role="dialog" aria-label="Notifications">
        <div className="notif-head"><span>Notifications</span>
          <button type="button" className="login-link" disabled={!unread} onClick={()=>markRead(null)}>Mark all as read</button></div>
        <div className="notif-list">
          {phase === 'loading' && <div className="notif-empty">Loading…</div>}
          {phase === 'error' && <div className="notif-empty notif-err">Notifications could not be loaded.</div>}
          {phase === 'ready' && !items.length && <div className="notif-empty">No notifications.</div>}
          {phase !== 'error' && items.map(n => (
            <button type="button" key={n.id} className={`notif-item${n.read ? '' : ' unread'}`} data-jo={n.jobNo} data-event={n.event}
              onClick={()=>{ if (!n.read) markRead([n.id]); const jo = (jobOrders || []).find(j => j.jobNo === n.jobNo); setOpen(false); if (jo) onOpenJO(jo); }}>
              <span className={`notif-dot ev-${String(n.event).toLowerCase()}`} aria-hidden="true"/>
              <span className="notif-body">
                <span className="notif-title"><strong>{n.jobNo}</strong> · {NOTIFY_EVENT_LABEL[n.event] || n.event}{n.read ? '' : <span className="sr-only"> (unread)</span>}</span>
                <span className="notif-sub">{[n.assetNum, n.assetDesc, n.dept].filter(Boolean).join(' · ')}</span>
                <span className="notif-time">{when(n.at)}</span>
              </span>
            </button>))}
        </div>
      </div>}
    </div>
  );
}

const THEME_KEY = 'cmms_vg_theme';   // 'light' | 'dark' only
function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
function setTheme(t) {
  const v = t === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', v);
  try { localStorage.setItem(THEME_KEY, v); } catch(e) {}
  window.dispatchEvent(new Event('cmms-theme'));
}
function useTheme() {
  const [t, setT] = useState(currentTheme);
  useEffect(() => { const h = () => setT(currentTheme()); window.addEventListener('cmms-theme', h); return () => window.removeEventListener('cmms-theme', h); }, []);
  return t;
}
function ThemeToggle({className=''}) {
  const t = useTheme(), next = t === 'dark' ? 'light' : 'dark', label = `Switch to ${next} mode`;

      : <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>}

// Decorative circuit board behind the login (aria-hidden). Traces are laid out from the REAL card position, so they
// converge on the card at every size; re-measured on resize. CSS animation (signals travelling to the card); none for
// prefers-reduced-motion.
function LoginCircuit({pageRef, cardRef}) {
  const [box, setBox] = useState(null);
  const [reduced, setReduced] = useState(() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { return false; } });
  const sigRefs = useRef([]), glowRefs = useRef([]);
  useEffect(() => {
    const measure = () => {
      const p = pageRef.current, c = cardRef.current;
      if (!p || !c) return;
      const pr = p.getBoundingClientRect(), cr = c.getBoundingClientRect();
      const intro = p.querySelector('.login-intro'), ir = intro ? intro.getBoundingClientRect() : null;
      const top = ir && ir.bottom <= cr.top + 1 ? Math.round(ir.bottom - pr.top) : 0;   // stacked layout: stay below the introduction
      const nb = {w: Math.round(pr.width), h: Math.round(pr.height), top, card: {l: Math.round(cr.left - pr.left), t: Math.round(cr.top - pr.top), r: Math.round(cr.right - pr.left), b: Math.round(cr.bottom - pr.top)}};
      setBox(prev => prev && JSON.stringify(prev) === JSON.stringify(nb) ? prev : nb);
    };
    measure();
    let ro = null;
    try { ro = new ResizeObserver(measure); ro.observe(pageRef.current); ro.observe(cardRef.current); } catch (_) { /* resize listener below */ }
    window.addEventListener('resize', measure);
    return () => { window.removeEventListener('resize', measure); if (ro) ro.disconnect(); };
  }, []);
  useEffect(() => {   // follow the reduced-motion preference live
    let mq; try { mq = window.matchMedia('(prefers-reduced-motion: reduce)'); } catch (_) { return; }
    const h = () => setReduced(mq.matches);
    if (mq.addEventListener) mq.addEventListener('change', h); else if (mq.addListener) mq.addListener(h);
    return () => { if (mq.removeEventListener) mq.removeEventListener('change', h); else if (mq.removeListener) mq.removeListener(h); };
  }, []);
  const w = box ? box.w : 1440, h = box ? box.h : 900;
  const boxKey = box ? JSON.stringify(box) : '';
  const lay = useMemo(() => box ? circuitTraces(w, h, box.card, 7, {topBound: box.top}) : {socket: null, traces: []}, [boxKey]);
  const vias = lay.traces.flatMap(t => t.vias);
  // Light signals (Web Animations, no dependency): one schedule for the whole board, recomputed when the layout
  // changes; not started at all when the user prefers reduced motion (the static board stays).
  useEffect(() => {
    if (reduced || !lay.socket || !lay.traces.length || typeof Element === 'undefined' || !Element.prototype.animate) return;
    const lens = lay.traces.map((_, i) => { const el = sigRefs.current[i]; try { return el ? el.getTotalLength() : 0; } catch (_) { return 0; } });
    const sched = signalSchedule(lay.traces, lens, lay.socket.r - lay.socket.l);
    const anims = [];
    sched.forEach((s, i) => {
      const el = sigRefs.current[i], g = glowRefs.current[i];
      if (!s || !el || !lens[i]) return;
      const timing = {duration: s.duration * 1000, delay: s.delay * 1000, iterations: Infinity, easing: 'linear'};
      el.style.strokeDasharray = `26 ${Math.ceil(lens[i] + 60)}`;
      anims.push(el.animate(signalKeyframes(s, lens[i]), timing));
      if (g) anims.push(g.animate(glowKeyframes(s), timing));
    });
    return () => anims.forEach(a => { try { a.cancel(); } catch (_) {} });
  }, [boxKey, reduced]);
  return <>
    <svg className="login-visual lc-board" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMinYMin meet" aria-hidden="true" focusable="false">
      <defs><pattern id="lv-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" className="lv-grid"/></pattern></defs>
      <rect width={w} height={h} fill="url(#lv-grid)"/>
      <g className="lc-traces">{lay.traces.map((t, i) => <path key={i} d={t.d}/>)}</g>
      {lay.socket && <rect className="lc-socket" x={lay.socket.l} y={lay.socket.t} width={lay.socket.r - lay.socket.l} height={lay.socket.b - lay.socket.t} rx="20"/>}
      <g className="lc-parts">{lay.traces.filter(t => t.part).map((t, i) => t.part.horizontal
        ? <g key={i}><rect x={t.part.x - 11} y={t.part.y - 5} width="22" height="10" rx="2"/><path d={`M${t.part.x - 5} ${t.part.y - 5}v10M${t.part.x + 5} ${t.part.y - 5}v10`}/></g>
        : <g key={i}><rect x={t.part.x - 5} y={t.part.y - 11} width="10" height="22" rx="2"/><path d={`M${t.part.x - 5} ${t.part.y - 5}h10M${t.part.x - 5} ${t.part.y + 5}h10`}/></g>)}</g>
      <g className="lc-vias">{vias.map(([x, y], i) => <circle key={i} cx={x} cy={y} r="3.2"/>)}</g>
      <g className="lc-pads">{lay.traces.map((t, i) => <rect key={i} x={t.pad[0] - 3.5} y={t.pad[1] - 3.5} width="7" height="7" rx="1.5"/>)}</g>
    </svg>
    <svg className="login-visual lc-anim" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMinYMin meet" aria-hidden="true" focusable="false">
      <g className="lc-signals">{lay.traces.map((t, i) => <path key={boxKey + i} ref={el => { sigRefs.current[i] = el; }} d={t.d} className="lc-signal" data-side={t.side} data-row={t.side === 'left' || t.side === 'right' ? t.pad[1] : undefined}/>)}</g>
      <g className="lc-glows">{lay.traces.map((t, i) => <circle key={boxKey + i} ref={el => { glowRefs.current[i] = el; }} cx={t.pad[0]} cy={t.pad[1]} r="5" className="lc-glow" data-side={t.side}/>)}</g>
    </svg>
  </>;
}

function LoginPage({onLogin, recoveryService=RECOVERY_SERVICE}) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [showPw, setShowPw] = useState(false);
  const [missing, setMissing] = useState({id: false, pw: false});   // field-level validation state
  const [caps, setCaps] = useState(false);
  const [view, setView] = useState('signin');                       // 'signin' | 'recover'
  const [rec, setRec] = useState({phase: 'idle', message: ''});
  const [recId, setRecId] = useState('');
  const pageRef = useRef(null), cardRef = useRef(null);

  function capsFrom(e) { try { setCaps(!!(e.getModifierState && e.getModifierState('CapsLock'))); } catch (_) {} }
  function openRecover() { setView('recover'); setRec(recoveryStep(null, {type: 'reset'})); setRecId(EMPLOYEE_ID_RE.test(username.trim()) ? username.trim() : ''); setError(''); }
  function closeRecover() { setView('signin'); setRec(recoveryStep(null, {type: 'reset'})); }
  async function submitRecover(e) {
    e.preventDefault();
    const next = recoveryStep(rec, {type: 'submit', employeeId: recId, serviceAvailable: !!recoveryService});
    setRec(next);
    if (next.phase !== 'sending') return;
    let ok = false;
    try { const r = await recoveryService.requestReset(recId.trim().toUpperCase()); ok = !!(r && r.ok); } catch (_) { ok = false; }
    setRec(prev => recoveryStep(prev, {type: 'result', ok}));
  }

  function handleSubmit(e) {
    e.preventDefault();
    setError('');
    const miss = {id: !username.trim(), pw: !password};
    setMissing(miss);
    if (miss.id || miss.pw) { setError('Please enter your Employee ID and password.'); return; }
    setLoading(true);

function AssetDoughnutChart({assets}) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);
  const theme = useTheme();
  const palette = ['#f59e0b','#3b82f6','#10b981','#f97316','#8b5cf6','#06b6d4','#facc15','#ef4444','#14b8a6','#6366f1','#ec4899','#84cc16'];

  // The page re-renders every second (top-bar clock), so the chart is rebuilt ONLY when the counted data or the theme
  // changes; previously every render rebuilt it and replayed its entrance animation (a constant motion loop).
  const chartKey = JSON.stringify((() => { const m = {}; assets.forEach(a => { if (a.plant) m[a.plant] = (m[a.plant] || 0) + 1; }); return Object.keys(m).sort().map(k => [k, m[k]]); })());
  useEffect(()=>{
    if (!canvasRef.current || typeof Chart==='undefined') return;
    const pairs  = JSON.parse(chartKey);
    const cats   = pairs.map(p=>p[0]);
    const counts = pairs.map(p=>p[1]);
    const total  = counts.reduce((a,b)=>a+b,0);
    if (chartRef.current) chartRef.current.destroy();
    const cssv = (n, d) => { try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || d; } catch(e) { return d; } };
    const txt = cssv('--white', '#f8fafc'), sub = cssv('--gray', '#94a3b8');

    const centerPlugin = {
      id:'centerLabel',
      afterDraw(chart) {
        const {ctx,chartArea:{left,top,width,height}} = chart;
        const cx=left+width/2, cy=top+height/2;
        ctx.save();
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font=`700 ${Math.min(34,width*.16)}px 'Rajdhani',sans-serif`;
        ctx.fillStyle=txt;
        ctx.fillText(total, cx, cy-9);
        ctx.font=`600 ${Math.min(9,width*.045)}px 'Source Code Pro',monospace`;
        ctx.fillStyle=sub;
        ctx.letterSpacing='2px';
        ctx.fillText('TOTAL ASSETS', cx, cy+11);
        ctx.restore();
      }
    };

    chartRef.current = new Chart(canvasRef.current,{
      type:'doughnut',
      plugins:[centerPlugin],
      data:{
        labels: cats.map(c=>c.length>20?c.slice(0,20)+'…':c),
        datasets:[{
          data:counts,
          backgroundColor: cats.map((_,i)=>palette[i%palette.length]+'bb'),
          borderColor:      cats.map((_,i)=>palette[i%palette.length]),
          borderWidth:2,
          hoverBackgroundColor: cats.map((_,i)=>palette[i%palette.length]),
          hoverBorderWidth:2,
          hoverOffset:0,
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        animation:false,   // static chart: no entrance or hover motion
        plugins:{
          legend:{
            position:'right',
            labels:{
              color:txt,
              font:{size:11,family:"'Rajdhani',sans-serif"},
              padding:12, boxWidth:10, boxHeight:10,
              usePointStyle:true, pointStyle:'circle',
              generateLabels:(chart)=>chart.data.labels.map((lbl,i)=>({
                text:`${lbl}  ·  ${chart.data.datasets[0].data[i]}`,
                fillStyle:chart.data.datasets[0].hoverBackgroundColor[i],
                strokeStyle:chart.data.datasets[0].borderColor[i],
                fontColor:txt,
                lineWidth:1,hidden:false,index:i,
              }))
            }
          },
          tooltip:{
            backgroundColor:'rgba(10,22,40,.95)',
            borderColor:'rgba(245,158,11,.4)',
            borderWidth:1,
            padding:12,
            titleFont:{family:"'Rajdhani',sans-serif",size:13,weight:'bold'},
            bodyFont:{family:"'Source Code Pro',monospace",size:11},
            callbacks:{
              title:([ctx])=>ctx.label,
              label:ctx=>{
                const pct=total?Math.round(ctx.parsed/total*100):0;
                return `  ${ctx.parsed} assets  (${pct}%)`;
              }
            }
          }
        },
        cutout:'64%',
      }
    });
    return ()=>{ if(chartRef.current){chartRef.current.destroy();chartRef.current=null;} };
  },[chartKey, theme]);

  const opCount = assets.filter(a=>a.status==='OPERATIONAL').length;
  const brCount = assets.filter(a=>a.status==='BREAKDOWN').length;
  const mnCount = assets.filter(a=>a.status==='UNDER MAINTENANCE').length;

  return (
    <div className="panel" style={{marginTop:20,background:'var(--panel-grad)'}}>
      <div className="panel-head" style={{borderBottom:'1px solid rgba(245,158,11,.15)'}}>
        <div className="panel-title">Asset Distribution by Category</div>
        <div style={{display:'flex',gap:18,fontSize:11,fontFamily:'var(--fm)'}}>
          <span><span style={{color:'var(--green)',fontWeight:700}}>{opCount}</span> <span style={{color:'var(--gray)'}}>OPER.</span></span>
          <span><span style={{color:'var(--red)',fontWeight:700}}>{brCount}</span> <span style={{color:'var(--gray)'}}>BREAK.</span></span>
          <span><span style={{color:'var(--orange)',fontWeight:700}}>{mnCount}</span> <span style={{color:'var(--gray)'}}>MAINT.</span></span>
          <span><span style={{color:'var(--white)',fontWeight:700}}>{assets.length}</span> <span style={{color:'var(--gray)'}}>TOTAL</span></span>
        </div>
      </div>
      <div className="panel-body">
        <div style={{height:300,position:'relative'}}>
          <canvas ref={canvasRef}/>
        </div>
      </div>
    </div>
  );
}

function AssetsPage({assets, setAssetModal, setJoModal, onStatusChange, onDeleteAsset, onClearAssets, categories=[], onExportCSV, onImportCSV, currentUser={}}) {
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('');
  const [status, setStatus] = useState('');
  const [pg, setPg] = useState(1);
  const importRef = useRef(null);
  // Phones (2026-10-29): Export / Import / Template / Clear All sit in an "Actions" menu (CSS; wider screens show them inline).
  // It closes after a choice, on a tap outside it, or on Escape.
  const [toolsOpen, setToolsOpen] = useState(false);
  const toolsRef = useRef(null);
  useEffect(() => {
    if (!toolsOpen) return;
    const away = e => { if (toolsRef.current && !toolsRef.current.contains(e.target)) setToolsOpen(false); };
    const esc = e => { if (e.key === 'Escape') setToolsOpen(false); };
    document.addEventListener('pointerdown', away); window.addEventListener('keydown', esc);
    return () => { document.removeEventListener('pointerdown', away); window.removeEventListener('keydown', esc); };
  }, [toolsOpen]);

  // Deduplicate assets by num before any display
  const uniqueAssets = [...new Map(assets.map(a=>[a.num,a])).values()];
  // Filter: every listed category, also those with no assets yet (2026-10-27); the subtitle counts the categories in use
  const allCats = allCategories(uniqueAssets, categories);
  const usedCats = allCategories(uniqueAssets, []);

    const hay = [a.num,(a.plant||''),(a.desc||''),(a.code||''),(a.model||''),(a.loc||''),(a.serial||'')].join(' ').toLowerCase();
    return (!q||hay.includes(q.toLowerCase())) && (!cat||String(a.plant||'').trim().toUpperCase()===cat) && (!status||(a.status||'').toUpperCase().replace('MAINT.','MAINTENANCE')===status);

  const sorted = sortByAssetNum(filtered);

              {slice.length===0&&<tr><td colSpan={9}><div className="empty-state">No assets found</div></td></tr>}
              {slice.map(a=>(
                <tr key={a.num}>
                  <td style={{fontFamily:'var(--fm)',fontSize:12,color:'var(--accent)'}}>{a.num}</td>
                  <td style={{fontSize:12,fontWeight:500}}>{(a.plant||'').toUpperCase()}</td>
                  <td><strong>{a.desc}</strong></td>
                  <td className="col-hide-md" style={{fontFamily:'var(--fm)',fontSize:11}}>{a.code||'—'}</td>
                  <td className="col-hide-md" style={{fontSize:12}}>{a.model||'—'}</td>
                  <td className="col-hide-md" style={{fontFamily:'var(--fm)',fontSize:11}}>{a.serial||'—'}</td>
                  <td style={{fontSize:12}}>{a.loc||'—'}</td>
                  <td>
                    <select className={`sb-base ${statusCls(a.status)}`} value={(a.status||'OPERATIONAL').toUpperCase().replace('UNDER MAINT.','UNDER MAINTENANCE')} onChange={e=>onStatusChange(a.num,e.target.value)} disabled={!canSetStatus} style={{opacity:canSetStatus?1:.6,cursor:canSetStatus?'pointer':'default'}}>
                      {['OPERATIONAL','BREAKDOWN','UNDER MAINTENANCE','IDLE','TRANSFERRED'].map(s=><option key={s} value={s}>{s==='UNDER MAINTENANCE'?'UNDER MAINT.':s}</option>)}
                    </select>
                  </td>
                  <td>
                    <div style={{display:'flex',gap:4,flexWrap:'nowrap'}}>
                      <button className="btn btn-ghost btn-sm btn-icon" title="View Asset" onClick={()=>setAssetModal({mode:'view',asset:a})}>👁</button>
                      {canEditAsset&&<button className="btn btn-warning btn-sm btn-icon" title="Edit Asset" onClick={()=>setAssetModal({mode:'edit',asset:a})}>✏</button>}
                      {canRaiseJO&&<button className="btn btn-primary btn-sm btn-icon" title="Raise Job Order" onClick={()=>setJoModal({mode:'add',preAsset:a.num})}>＋</button>}
                      {canDeleteAsset&&<button className="btn btn-danger btn-sm btn-icon" title="Delete Asset" onClick={()=>{ if(window.confirm(`Delete asset ${a.num} — ${a.desc}?\n\nThis cannot be undone.`)) onDeleteAsset(a.num); }}>🗑</button>}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="page-foot" style={{padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',borderTop:'1px solid var(--border)'}}>
          <div className="page-info-txt">Showing {sorted.length===0?0:Math.min((pg-1)*PER_PAGE+1,sorted.length)}–{Math.min(pg*PER_PAGE,sorted.length)} of {sorted.length} assets</div>
          <div className="pagination">
            {pg>1&&<button className="page-btn" onClick={()=>setPg(pg-1)}>‹</button>}
            {Array.from({length:total},(_,i)=>i+1).filter(i=>i===1||i===total||(i>=pg-1&&i<=pg+1)).map((i,idx,arr)=>[
              idx>0&&arr[idx-1]!==i-1?<span key={`e${i}`} style={{color:'var(--gray)',padding:'0 4px'}}>…</span>:null,
              <button key={i} className={`page-btn${i===pg?' active':''}`} onClick={()=>setPg(i)}>{i}</button>
            ])}
            {pg<total&&<button className="page-btn" onClick={()=>setPg(pg+1)}>›</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── JOB ORDERS PAGE ─────────────────────────────────────────────────────────
// Phones (2026-10-29): a page's add / file actions behind one floating "+" (CSS shows it on phones only; the page toolbar
// keeps them on wider screens). With menu items (administrators: users.admin) it opens a small menu; otherwise "+" runs onPrimary directly. Every
// item comes from the page with its own permission check and handler. Closes on a choice, a tap outside it or Escape.
function FabActions({label, primaryLabel, onPrimary, menu}) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const items = (menu || []).filter(Boolean);
  useEffect(() => {
    if (!open) return;
    const first = ref.current && ref.current.querySelector('[role=menuitem]'); if (first) first.focus();
    const away = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const esc = e => { if (e.key === 'Escape') { setOpen(false); const b = ref.current && ref.current.querySelector('.fab'); if (b) b.focus(); } };
    document.addEventListener('pointerdown', away); window.addEventListener('keydown', esc);
    return () => { document.removeEventListener('pointerdown', away); window.removeEventListener('keydown', esc); };
  }, [open]);
  if (!items.length && !onPrimary) return null;
  const asMenu = items.length > 0;
  return <div className="fab-wrap" ref={ref}>
    {asMenu && open && <div className="fab-menu" role="menu" aria-label={label}>
      {items.map(it => <button key={it.label} type="button" role="menuitem" className="fab-item" onClick={()=>{ setOpen(false); it.run(); }}>
        <span className="fab-item-icon" aria-hidden="true">{it.icon}</span>{it.label}</button>)}
    </div>}
    <button type="button" className={`fab${open?' open':''}`} aria-label={asMenu ? label : primaryLabel}
      aria-haspopup={asMenu ? 'menu' : undefined} aria-expanded={asMenu ? open : undefined}
      onClick={()=>asMenu ? setOpen(v=>!v) : onPrimary()}><span aria-hidden="true">＋</span></button>
  </div>;
}
function JobOrdersPage({assets, jobOrders, eligibleEditors=[], setJoModal, setJoViewModal, onStatusChange, onDeleteJO, onExportCSV, onImportCSV, onApproveJO, onCloseJO, onRevertJO, currentUser={}}) {
  const [q, setQ] = useState('');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [activeTab, setActiveTab] = useState('OPEN');
  const [confirmModal, setConfirmModal] = useState(null);
  const [assigneeId, setAssigneeId] = useState('');
  const [approvalDate, setApprovalDate] = useState(new Date().toISOString().split('T')[0]);
  const importRef = useRef(null);

  const canAdvanceOpen = can(currentUser,'jo.start');
  const canComplete    = can(currentUser,'jo.complete');
  const canApprove     = can(currentUser,'jo.approve');   // F5: approve and close are separate actions
  const canClose       = can(currentUser,'jo.close');
  const canRevert      = can(currentUser,'jo.revert');
  const canEditJO      = can(currentUser,'jo.edit.request') || can(currentUser,'jo.edit.work');
  const canDeleteJO    = can(currentUser,'jo.delete');
  const canRaiseJO     = can(currentUser,'jo.create');
  const canImportJO    = can(currentUser,'jo.import');

  // Smart search: auto-switch to the tab that has matches
  useEffect(()=>{
    if (!q.trim()) return;
    const qLow = q.toLowerCase().trim();
    const allMatches = jobOrders.filter(j=>[j.jobNo,j.assetNum,j.assetDesc,j.dept,j.problem].join(' ').toLowerCase().includes(qLow));
    if (!allMatches.length) return;
    setActiveTab(prev => {
      if (allMatches.some(j=>j.status===prev)) return prev;
      const best = ['OPEN','IN PROGRESS','CLOSED'].find(s=>allMatches.some(j=>j.status===s));
      return best||prev;
    });
  },[q, jobOrders]);

  const filtered = jobOrders.filter(j=>{
    const hay=[j.jobNo,j.assetNum,j.assetDesc,j.dept,j.problem].join(' ').toLowerCase();
    return (!q||hay.includes(q.toLowerCase()))&&(!dateFrom||j.date>=dateFrom)&&(!dateTo||j.date<=dateTo);
  }).reverse();

  const counts = {
    OPEN: jobOrders.filter(j=>j.status==='OPEN').length,
    'IN PROGRESS': jobOrders.filter(j=>j.status==='IN PROGRESS').length,
    COMPLETED: jobOrders.filter(j=>j.status==='COMPLETED').length,
    CLOSED: jobOrders.filter(j=>j.status==='CLOSED').length,
  };
  const tabJOs = filtered.filter(j=>j.status===activeTab);
  const isClosed = activeTab==='CLOSED';

  const light = useTheme() === 'light';
  const TABS = [
    {id:'OPEN',        label:'Open',        color:light?'#b45309':'#f59e0b', bg:'rgba(245,158,11,.14)'},
    {id:'IN PROGRESS', label:'In Progress', color:light?'#1d4ed8':'#60a5fa', bg:'rgba(96,165,250,.14)'},
    {id:'COMPLETED',   label:'Completed',   color:light?'#6d28d9':'#a78bfa', bg:'rgba(139,92,246,.14)'},
    {id:'CLOSED',      label:'Closed',      color:light?'#047857':'#10b981', bg:'rgba(16,185,129,.14)'},
  ];
  const tabIdle = light ? '#5b6b82' : 'rgba(148,163,184,.7)', countIdle = light ? '#5b6b82' : 'rgba(148,163,184,.6)';

  function requestAdvance(jo) {
    if (jo.status==='OPEN' && canAdvanceOpen) {
      setConfirmModal({jo, nextStatus:'IN PROGRESS'});
    } else if (jo.status==='IN PROGRESS' && canComplete) {
      setConfirmModal({jo, nextStatus:'COMPLETED'});
    } else if (jo.status==='COMPLETED' && !isApproved(jo) && canApprove) {
      setConfirmModal({jo, nextStatus:'APPROVE'});
    } else if (jo.status==='COMPLETED' && isApproved(jo) && canClose) {
      setApprovalDate(new Date().toISOString().split('T')[0]);
      setConfirmModal({jo, nextStatus:'CLOSED'});
    }
  }
  function doAdvance() {
    if (!confirmModal) return;
    if (confirmModal.nextStatus==='IN PROGRESS' && !isJobCardEditor(currentUser)) {
      if (!assigneeId) { alert('Select the Job Card Editor this work is assigned to.'); return; }
      onStatusChange(confirmModal.jo.jobNo, 'IN PROGRESS', {assigneeId: Number(assigneeId)});
      setAssigneeId(''); setConfirmModal(null); return;
    }
    onStatusChange(confirmModal.jo.jobNo, confirmModal.nextStatus);
    setConfirmModal(null);
  }
  function doApprove() {
    onApproveJO(confirmModal.jo.jobNo);
    setConfirmModal(null);
  }
  function doClose() {
    if (!approvalDate) { alert('Please select the closed date.'); return; }
    onCloseJO(confirmModal.jo.jobNo, {closedDate: approvalDate});
    setConfirmModal(null);
  }

  return (
    <div className="fill-page" style={{display:'flex',flexDirection:'column',height:'calc(100vh - 58px)'}}>
      <FabActions label="Job order actions" primaryLabel="Raise Job Order" onPrimary={canRaiseJO ? ()=>setJoModal({mode:'add'}) : null}
        menu={can(currentUser,'users.admin') ? [
          canRaiseJO && {icon:'＋', label:'Raise Job Order', run:()=>setJoModal({mode:'add'})},
          can(currentUser,'jo.export') && {icon:'↓', label:'Export', run:onExportCSV},
          canImportJO && {icon:'↑', label:'Import', run:()=>{ if (importRef.current) importRef.current.click(); }},
          canImportJO && {icon:'⬇', label:'Template', run:downloadJOTemplate},
        ] : null}/>
      {/* Header row */}
      <div className="page-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12,flexShrink:0}}>
        <div>
          <div className="page-title">JOB <span>ORDERS</span></div>
          <div className="page-sub">MAINTENANCE JOB CARD REQUEST LOG</div>
        </div>
        <div className="controls jo-toolbar">
          {canRaiseJO&&<button className="btn btn-accent jo-raise" onClick={()=>setJoModal({mode:'add'})}>＋ Raise<span className="jo-raise-rest"> Job Order</span></button>}
          {can(currentUser,'jo.export')&&<button className="btn btn-csv btn-sm" onClick={onExportCSV}>↓ Export</button>}
          {canImportJO&&<label className="btn btn-csv btn-sm" style={{cursor:'pointer'}}>↑ Import
            <input type="file" accept=".csv" style={{display:'none'}} ref={importRef} onChange={e=>{if(e.target.files[0]){onImportCSV(e.target.files[0]);e.target.value='';}}}/>
          </label>}
          {canImportJO&&<button className="btn btn-csv btn-sm" onClick={downloadJOTemplate}>⬇ Template</button>}
        </div>
      </div>

      {/* Compact stat row */}
      <div className="stat-strip" style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10,marginBottom:16,flexShrink:0}}>
        {[['Total',jobOrders.length,light?'#1a56db':'#3b82f6','sc-blue'],['Open',counts['OPEN'],TABS[0].color,'sc-yellow'],['In Progress',counts['IN PROGRESS'],TABS[1].color,'sc-orange'],['Completed',counts['COMPLETED'],TABS[2].color,'sc-purple'],['Closed',counts['CLOSED'],TABS[3].color,'sc-green']].map(([lbl,num,c,cls])=>(
          <div key={lbl} className={`stat-card ${cls}`} style={{padding:'8px 14px'}}>
            <div style={{fontFamily:'var(--fh)',fontSize:24,fontWeight:700,color:c,lineHeight:1}}>{num}</div>
            <div style={{fontSize:10,color:'var(--gray)',fontFamily:'var(--fm)',letterSpacing:1,marginTop:3,textTransform:'uppercase'}}>{lbl}</div>
          </div>
        ))}
      </div>

      {/* Tab bar + inline search */}
      <div className="tabbar" style={{display:'flex',alignItems:'stretch',borderBottom:'2px solid var(--border)',flexShrink:0,background:'var(--navy2)',borderRadius:'8px 8px 0 0',overflow:'hidden'}}>
        <div className="tabbar-tabs" style={{display:'flex',flex:1}}>
          {TABS.map(t=>{
            const active = activeTab===t.id;
            return (
              <button key={t.id} onClick={()=>setActiveTab(t.id)} style={{
                padding:'11px 20px',
                background: active ? t.bg : 'transparent',
                border:'none', borderBottom: active?`2px solid ${t.color}`:'2px solid transparent',
                color: active ? t.color : tabIdle,
                cursor:'pointer', fontFamily:'var(--fh)', fontSize:14, fontWeight:700,
                letterSpacing:.5, marginBottom:-2, display:'flex', alignItems:'center', gap:8,
                transition:'all .15s',
                outline: active ? `1px solid ${t.color}22` : 'none',
              }}>
                <span style={{
                  display:'inline-block',width:8,height:8,borderRadius:'50%',
                  background: active?t.color:t.color+'44',flexShrink:0,
                  boxShadow: active?`0 0 6px ${t.color}`:'none',
                }}/>
                {t.label}
                <span style={{
                  fontFamily:'var(--fm)',fontSize:11,
                  background: active?t.color+'22':'var(--hl-07)',
                  padding:'1px 8px',borderRadius:10,color:active?t.color:countIdle,
                  border:`1px solid ${active?t.color+'44':'transparent'}`,
                }}>{counts[t.id]}</span>
              </button>
            );
          })}
        </div>
        {/* Search + date on right side of tab bar */}
        <div className="tabbar-tools" style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderLeft:'1px solid var(--border)'}}>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Search job orders..." style={{fontSize:12,padding:'5px 10px',minWidth:180,background:'var(--hl-05)',border:'1px solid var(--hl-12)',color:'var(--white)',borderRadius:5,outline:'none'}}/>
          <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} title="From date" style={{fontSize:12,padding:'5px 8px',width:130}}/>
          <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} title="To date" style={{fontSize:12,padding:'5px 8px',width:130}}/>
          {(dateFrom||dateTo)&&<button className="btn btn-ghost btn-sm" onClick={()=>{setDateFrom('');setDateTo('');}}>✕</button>}
        </div>
      </div>

      {/* Scrollable table fills remaining page height */}
      <div className="panel" style={{borderTopLeftRadius:0,borderTopRightRadius:0,borderTop:'none',flex:1,overflow:'hidden',display:'flex',flexDirection:'column',marginBottom:0}}>
        <div className="tbl-wrap" style={{flex:1,overflowY:'auto'}}>
          <table>
            <thead><tr>
              <th>Job No.</th><th>Date</th><th>Asset</th><th>Asset Category</th><th>Problem</th>
              <th>Priority</th><th>Status</th>
              {isClosed&&<><th>Approved By</th><th>Approved Date</th></>}
              <th>Actions</th>
            </tr></thead>
            <tbody>
              {tabJOs.length===0&&<tr><td colSpan={isClosed?10:8}><div className="empty-state" style={{padding:48}}>No {activeTab.toLowerCase()} job orders{q?' matching search':''}</div></td></tr>}
              {tabJOs.map(jo=>{
                const joIsClosed = jo.status==='CLOSED';
                const canAdvThis = (jo.status==='OPEN'?canAdvanceOpen:jo.status==='IN PROGRESS'?canComplete:jo.status==='COMPLETED'?(isApproved(jo)?canClose:canApprove):false) && jceSectionAllows(currentUser, jo, jo.status==='OPEN'?'start':'progress');
                return (
                <tr key={jo.jobNo}>
                  <td style={{fontFamily:'var(--fm)',fontSize:12,color:'var(--accent)'}}>{jo.jobNo}</td>
                  <td style={{fontSize:12}}>{jo.date}</td>
                  <td><strong>{jo.assetNum}</strong><div style={{fontSize:11,color:'var(--gray)'}}>{jo.assetDesc||''}</div></td>
                  <td style={{fontSize:11,color:'var(--gray)'}}>{(jo.assetCategory||jo.plant||'').toUpperCase()||'—'}</td>
                  <td style={{fontSize:12,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{jo.problem||'—'}</td>
                  <td><span className={jo.priority==='High'?'prio-high':'prio-low'}>{jo.priority}</span></td>
                  <td>
                    {joIsClosed
                      ? <span className="sb-base jcl">CLOSED ✓</span>
                      : canAdvThis
                        ? <button className={`sb-base ${joStatusCls(jo.status)}`}
                            style={{cursor:'pointer',border:'none',background:'inherit'}}
                            title={jo.status==='OPEN'?'Move to In Progress':jo.status==='IN PROGRESS'?'Mark Completed':isApproved(jo)?'Close job order':'Approve completion'}
                            onClick={()=>requestAdvance(jo)}>{jo.status} ›</button>
                        : <span className={`sb-base ${joStatusCls(jo.status)}`}>{jo.status}</span>
                    }
                    {jo.status==='COMPLETED'&&<div style={{fontSize:10,marginTop:3,fontFamily:'var(--fm)',color:isApproved(jo)?'var(--green)':'var(--accent)'}}>{isApproved(jo)?'✓ Approved':'Awaiting approval'}</div>}
                  </td>
                  {isClosed&&<>
                    <td style={{fontSize:11}}>{jo.approvalStatus ? (jo.approvedBy||'—') : (jo.closedBy||'—')}</td>
                    <td style={{fontFamily:'var(--fm)',fontSize:11}}>{jo.approvalStatus ? ((jo.approvedAt||'').slice(0,10)||'—') : (jo.closedDate||'—')}</td>
                  </>}
                  <td>
                    <div style={{display:'flex',gap:4,flexWrap:'nowrap'}}>
                      <button className="btn btn-ghost btn-sm btn-icon" title="View" onClick={()=>setJoViewModal(jo)}>👁</button>
                      {mayEditJO(currentUser, jo)&&<button className="btn btn-warning btn-sm btn-icon" title="Edit" onClick={()=>setJoModal({mode:'edit',jo})}>✏</button>}
                      {can(currentUser,'jo.print')&&<button className="btn btn-primary btn-sm btn-icon" title="Download PDF" onClick={()=>printJOPDF(jo, currentUser)}>↓</button>}
                      {canDeleteJO&&!joIsClosed&&<button className="btn btn-danger btn-sm btn-icon" title="Delete" onClick={()=>{ if(window.confirm(`Delete ${jo.jobNo}? This cannot be undone.`)) onDeleteJO(jo.jobNo); }}>🗑</button>}
                      {canRevert&&joIsClosed&&<button className="btn btn-warning btn-sm btn-icon" title="Revert to Completed" onClick={()=>{ if(window.confirm(`Revert ${jo.jobNo} to COMPLETED?\nThe closure details are cleared; the completion approval and its history are kept.`)) onRevertJO(jo.jobNo); }}>↺</button>}
                    </div>
                  </td>
                </tr>
              );})}
            </tbody>
          </table>
        </div>
      </div>

      {/* Simple confirm: OPEN → IN PROGRESS */}
      {confirmModal&&confirmModal.nextStatus==='IN PROGRESS'&&(
        <div className="modal-overlay" onClick={()=>setConfirmModal(null)}>
          <div className="modal" style={{width:420}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">Move to In Progress?</div>
              <button className="modal-close" onClick={()=>setConfirmModal(null)}>×</button>
            </div>
            <div className="modal-body">
              <div style={{fontSize:13,marginBottom:12}}>
                Move <span style={{fontFamily:'var(--fm)',color:'var(--accent)'}}>{confirmModal.jo.jobNo}</span>{' '}
                from <span className="sb-base jop">OPEN</span> → <span className="sb-base jip">IN PROGRESS</span>?
              </div>
              <div style={{fontSize:12,color:'var(--gray)',marginBottom:16}}>
                Asset: <strong style={{color:'var(--white)'}}>{confirmModal.jo.assetNum} — {confirmModal.jo.assetDesc||'—'}</strong>
              </div>
              {isJobCardEditor(currentUser)
                ? <div className="assign-self" style={{fontSize:12,color:'var(--gray)',marginBottom:20}}>Work will be assigned to you: <strong style={{color:'var(--white)'}}>{currentUser.fullName}</strong>{currentUser.section?` — section ${currentUser.section}`:''}. Received By and Section Assigned are filled in automatically.</div>
                : <div className="form-group" style={{marginBottom:20}}>
                    <label>Assign to Job Card Editor *</label>
                    <select value={assigneeId} onChange={e=>setAssigneeId(e.target.value)}>
                      <option value="">— Select an active Job Card Editor —</option>
                      {eligibleEditors.map(e=><option key={e.id} value={e.id}>{e.fullName} — {e.section}</option>)}
                    </select>
                    {eligibleEditors.length===0&&<div style={{fontSize:11,color:'var(--red)',marginTop:6}}>No active Job Card Editor with a section exists. An Admin must create one before work can be started.</div>}
                    <div style={{fontSize:11,color:'var(--gray)',marginTop:6}}>Received By will be you ({currentUser.fullName}); Section Assigned comes from the selected editor.</div>
                  </div>}
              <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                <button className="btn btn-ghost" onClick={()=>{setAssigneeId('');setConfirmModal(null);}}>Cancel</button>
                <button className="btn btn-primary" onClick={doAdvance}>→ Move to In Progress</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Simple confirm: IN PROGRESS → COMPLETED */}
      {confirmModal&&confirmModal.nextStatus==='COMPLETED'&&(
        <div className="modal-overlay" onClick={()=>setConfirmModal(null)}>
          <div className="modal" style={{width:420}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">Mark as Completed?</div>
              <button className="modal-close" onClick={()=>setConfirmModal(null)}>×</button>
            </div>
            <div className="modal-body">
              <div style={{fontSize:13,marginBottom:12}}>
                Move <span style={{fontFamily:'var(--fm)',color:'var(--accent)'}}>{confirmModal.jo.jobNo}</span>{' '}
                from <span className="sb-base jip">IN PROGRESS</span> → <span className="sb-base jcp">COMPLETED</span>?
              </div>
              <div style={{fontSize:12,color:'var(--gray)',marginBottom:20}}>
                Asset: <strong style={{color:'var(--white)'}}>{confirmModal.jo.assetNum} — {confirmModal.jo.assetDesc||'—'}</strong>
              </div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                <button className="btn btn-ghost" onClick={()=>setConfirmModal(null)}>Cancel</button>
                <button className="btn btn-primary" onClick={doAdvance} style={{background:'rgba(139,92,246,.9)'}}>✓ Mark Completed</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* F5: approve completion (status stays COMPLETED; closing is a separate action) */}
      {confirmModal&&confirmModal.nextStatus==='APPROVE'&&(
        <div className="modal-overlay" onClick={()=>setConfirmModal(null)}>
          <div className="modal" style={{width:460}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">Approve Completion</div>
              <button className="modal-close" onClick={()=>setConfirmModal(null)}>×</button>
            </div>
            <div className="modal-body">
              <div style={{fontSize:13,marginBottom:8}}>Approve the completed work on <span style={{fontFamily:'var(--fm)',color:'var(--accent)'}}>{confirmModal.jo.jobNo}</span>?</div>
              <div style={{fontSize:12,color:'var(--gray)',marginBottom:12}}>Asset: <strong style={{color:'var(--white)'}}>{confirmModal.jo.assetNum} — {confirmModal.jo.assetDesc||'—'}</strong></div>
              <div style={{fontSize:12,color:'var(--gray)',marginBottom:16}}>Approved by <strong style={{color:'var(--white)'}}>{currentUser.fullName}</strong> ({DESIGNATIONS[currentUser.role]||currentUser.role}). The status stays <span className="sb-base jcp">COMPLETED</span>; closing is a separate step.</div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                <button className="btn btn-ghost" onClick={()=>setConfirmModal(null)}>Cancel</button>
                <button className="btn btn-success" onClick={doApprove}>✓ Approve Completion</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Close: COMPLETED + APPROVED → CLOSED (approval already recorded; this step records the closure) */}
      {confirmModal&&confirmModal.nextStatus==='CLOSED'&&(
        <div className="modal-overlay" onClick={()=>setConfirmModal(null)}>
          <div className="modal close-dialog" style={{width:620}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">Close Job Order {confirmModal.jo.jobNo}</div>
              <button className="modal-close" onClick={()=>setConfirmModal(null)}>×</button>
            </div>
            <div className="modal-body">
              <div className="close-card">
                <div className="close-card-title">Job order</div>
                <dl className="kv">
                  <dt>Asset</dt><dd>{confirmModal.jo.assetNum} — {confirmModal.jo.assetDesc||'—'}</dd>
                  <dt>Status change</dt><dd><span className="sb-base jcp">COMPLETED</span> → <span className="sb-base jcl">CLOSED</span></dd>
                </dl>
              </div>
              <div className="close-card approved">
                <div className="close-card-title">✓ Completion approval (already recorded)</div>
                <dl className="kv">
                  <dt>Approved by</dt><dd>{confirmModal.jo.approvedBy||'—'}{confirmModal.jo.approverDesignation?` (${confirmModal.jo.approverDesignation})`:''}</dd>
                  <dt>Approved at (automatic)</dt><dd>{(confirmModal.jo.approvedAt||'').replace('T',' ').slice(0,16)||'—'}</dd>
                </dl>
              </div>
              <div className="close-card">
                <div className="close-card-title">Closure (this step)</div>
                <div className="form-row">
                  <div className="form-group"><label>Closed By</label><input readOnly value={currentUser.fullName}/></div>
                  <div className="form-group"><label>Designation</label><input readOnly value={DESIGNATIONS[currentUser.role]||currentUser.role}/></div>
                </div>
                <div className="form-row" style={{marginBottom:0}}>
                  <div className="form-group"><label>Closed Date * (selected)</label><input type="date" value={approvalDate} onChange={e=>setApprovalDate(e.target.value)}/></div>
                  <div className="close-hint">The date the job order is formally closed. It is separate from the approval time above, which was recorded automatically.</div>
                </div>
              </div>
              <div className="close-warning">⚠ After closing, only an Admin can revert this job order.</div>
              <div className="modal-actions">
                <button className="btn btn-ghost" onClick={()=>setConfirmModal(null)}>Cancel</button>
                <button className="btn btn-success" onClick={doClose}>✓ Close Job Order</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── PDF GENERATOR ────────────────────────────────────────────────────────────
function openPrintWindow(title, bodyHtml) {
  const win = window.open('', '_blank');
  if (!win) { alert('Please allow pop-ups for PDF generation.'); return; }
  const now = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  title = escHtml(title);   // S12: titles carry record values
  win.document.write(`<!DOCTYPE html><html><head><title>${title}</title><style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,sans-serif;font-size:11px;color:#111;padding:24px 28px;}
    .hdr{display:flex;align-items:center;gap:14px;border-bottom:2px solid #f59e0b;padding-bottom:12px;margin-bottom:16px;}
    .hdr-icon{width:40px;height:32px;background:linear-gradient(135deg,#f59e0b,#1a56db);border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#0a1628;letter-spacing:.5px;}
    .hdr-title{font-size:18px;font-weight:700;letter-spacing:.5px;}
    .hdr-sub{font-size:9px;color:#f59e0b;letter-spacing:1.5px;margin-top:2px;}
    .meta{font-size:10px;color:#64748b;margin-bottom:14px;display:flex;gap:20px;}
    table{width:100%;border-collapse:collapse;margin-top:4px;}
    th{padding:7px 8px;text-align:left;background:#0a1628;color:#f59e0b;font-size:9px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
    td{padding:6px 8px;border-bottom:1px solid #e2e8f0;font-size:10px;vertical-align:middle;}
    tr:nth-child(even) td{background:#f8fafc;}
    .b{font-weight:700;}
    .badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.5px;}
    .op{background:#d1fae5;color:#065f46;}.br{background:#fee2e2;color:#991b1b;}
    .mn{background:#ffedd5;color:#9a3412;}.ot{background:#f1f5f9;color:#475569;}
    .jop{background:#fef3c7;color:#92400e;}.jip{background:#dbeafe;color:#1e40af;}.jcl{background:#d1fae5;color:#065f46;}
    .hi{color:#dc2626;font-weight:700;}.lo{color:#059669;}
    .footer{margin-top:20px;font-size:9px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:10px;display:flex;justify-content:space-between;}
    @media print{body{padding:12px 16px;}tr,td,th{page-break-inside:avoid;}}
  </style></head><body>
    <div class="hdr"><div class="hdr-icon">CMM</div><div><div class="hdr-title">${title}</div><div class="hdr-sub">VHPL TIC — ENGINEERING SOLUTIONS DEPARTMENT</div></div></div>
    <div class="meta"><span>Generated: ${now}</span></div>
    ${bodyHtml}
    <div class="footer"><span>VHPL TIC · CMMS</span><span>${title} · ${now}</span></div>
  </body></html>`);
  win.document.close();
  // Use onload to ensure fonts/layout are ready before printing
  if (win.document.readyState === 'complete') {
    win.print();
  } else {
    win.onload = () => win.print();
  }
}

// ─── REPORT DOWNLOADS (D19: not available to Department Users; the check is here, in the handler) ─────────
function printReport(kind, assets, jobOrders, user) {
  if (!can(user,'report.print')) { alert('Report downloads are not available for your role.'); return false; }
  function dlAssetMasterList() {
    const rows = assets.map(a => {
      const sc = a.status==='OPERATIONAL'?'op':a.status==='BREAKDOWN'?'br':a.status==='UNDER MAINTENANCE'?'mn':a.status==='TRANSFERRED'?'tr':'ot';
      return `<tr><td class="b" style="color:#f59e0b;font-family:monospace">${escHtml(a.num)}</td><td style="font-size:9px">${escHtml(a.plant)}</td><td class="b">${escHtml(a.desc)}</td><td style="font-family:monospace;font-size:9px">${escHtml(a.code||'—')}</td><td>${escHtml(a.model||'—')}</td><td>${escHtml(a.cap||'—')}</td><td>${escHtml(a.loc||'—')}</td><td style="font-family:monospace;font-size:9px">${escHtml(a.serial||'—')}</td><td><span class="badge ${sc}">${escHtml(a.status||'—')}</span></td></tr>`;
    }).join('');
    openPrintWindow('Asset Master List', `
      <div class="meta" style="margin-bottom:10px"><span>Total Assets: <b>${assets.length}</b></span><span>Plants: <b>${[...new Set(assets.map(a=>a.plant))].length}</b></span><span>Operational: <b>${assets.filter(a=>a.status==='OPERATIONAL').length}</b></span></div>
      <table><thead><tr><th>Asset No.</th><th>Plant</th><th>Description</th><th>Eq. Code</th><th>Model</th><th>Capacity</th><th>Location</th><th>Serial No.</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody></table>`);
  }

  function dlAllJobOrders() {
    const rows = [...jobOrders].reverse().map(j => {
      const sc = j.status==='OPEN'?'jop':j.status==='IN PROGRESS'?'jip':'jcl';
      return `<tr><td class="b" style="color:#f59e0b;font-family:monospace">${escHtml(j.jobNo)}</td><td>${escHtml(j.date)}</td><td style="font-family:monospace;font-size:9px">${escHtml(j.assetNum)}</td><td>${escHtml(j.assetDesc||'—')}</td><td>${escHtml(j.dept||'—')}</td><td style="max-width:160px">${escHtml((j.problem||'—').substring(0,70))}</td><td><span class="${j.priority==='High'?'hi':'lo'}">${escHtml(j.priority||'—')}</span></td><td><span class="badge ${sc}">${escHtml(j.status)}</span></td><td>${escHtml(j.completionDate||'—')}</td></tr>`;
    }).join('');
    openPrintWindow('All Job Orders', `
      <div class="meta" style="margin-bottom:10px"><span>Total: <b>${jobOrders.length}</b></span><span>Open: <b>${jobOrders.filter(j=>j.status==='OPEN').length}</b></span><span>In Progress: <b>${jobOrders.filter(j=>j.status==='IN PROGRESS').length}</b></span><span>Closed: <b>${jobOrders.filter(j=>j.status==='CLOSED').length}</b></span></div>
      <table><thead><tr><th>Job No.</th><th>Date</th><th>Asset No.</th><th>Asset</th><th>Dept</th><th>Problem</th><th>Priority</th><th>Status</th><th>Completed</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:20px">No job orders recorded.</td></tr>'}</tbody></table>`);
  }

  function dlBreakdownReport() {
    const broken = assets.filter(a=>['BREAKDOWN','UNDER MAINTENANCE','Inactive','idle'].includes(a.status));
    const rows = broken.map(a => {
      const sc = a.status==='BREAKDOWN'?'br':'mn';
      return `<tr><td class="b" style="color:#f59e0b;font-family:monospace">${escHtml(a.num)}</td><td style="font-size:9px">${escHtml(a.plant)}</td><td class="b">${escHtml(a.desc)}</td><td>${escHtml(a.loc||'—')}</td><td style="font-family:monospace;font-size:9px">${escHtml(a.serial||'—')}</td><td><span class="badge ${sc}">${escHtml(a.status)}</span></td></tr>`;
    }).join('');
    openPrintWindow('Breakdown / Maintenance Report', `
      <div class="meta" style="margin-bottom:10px"><span>Non-Operational Assets: <b>${broken.length}</b></span><span>Breakdown: <b>${assets.filter(a=>a.status==='BREAKDOWN').length}</b></span><span>Under Maintenance: <b>${assets.filter(a=>a.status==='UNDER MAINTENANCE').length}</b></span></div>
      <table><thead><tr><th>Asset No.</th><th>Plant</th><th>Description</th><th>Location</th><th>Serial No.</th><th>Status</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px">All assets are operational.</td></tr>'}</tbody></table>`);
  }

  function dlOpenJobOrders() {
    const open = jobOrders.filter(j=>j.status!=='CLOSED');
    const rows = open.map(j => {
      const sc = j.status==='OPEN'?'jop':'jip';
      return `<tr><td class="b" style="color:#f59e0b;font-family:monospace">${escHtml(j.jobNo)}</td><td>${escHtml(j.date)}</td><td style="font-family:monospace;font-size:9px">${escHtml(j.assetNum)}</td><td>${escHtml(j.assetDesc||'—')}</td><td>${escHtml(j.dept||'—')}</td><td><span class="${j.priority==='High'?'hi':'lo'}">${escHtml(j.priority||'—')}</span></td><td>${escHtml(j.target||'—')}</td><td><span class="badge ${sc}">${escHtml(j.status)}</span></td></tr>`;
    }).join('');
    openPrintWindow('Open Job Orders', `
      <div class="meta" style="margin-bottom:10px"><span>Pending: <b>${open.length}</b></span><span>Open: <b>${jobOrders.filter(j=>j.status==='OPEN').length}</b></span><span>In Progress: <b>${jobOrders.filter(j=>j.status==='IN PROGRESS').length}</b></span></div>
      <table><thead><tr><th>Job No.</th><th>Date</th><th>Asset No.</th><th>Asset</th><th>Dept</th><th>Priority</th><th>Target</th><th>Status</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:20px">No open job orders.</td></tr>'}</tbody></table>`);
  }
  const run = {assetMaster: dlAssetMasterList, allJobOrders: dlAllJobOrders, breakdown: dlBreakdownReport, openJobOrders: dlOpenJobOrders}[kind];
  if (!run) return false;
  run(); return true;
}

// ─── ASSET IMPORT PREVIEW ─────────────────────────────────────────────────────
function AssetImportPreview({plan, fileName, onCancel, onConfirm}) {
  const [sel, setSel] = useState([]);
  const blocked = plan.invalid.length > 0;
  const toggle = num => setSel(p => p.includes(num) ? p.filter(x => x !== num) : [...p, num]);
  const nothing = plan.added.length === 0 && sel.length === 0;
  return (
    <div className="modal-overlay">
      <div className="modal asset-import" style={{width:860}}>
        <div className="modal-head"><div className="modal-title">Import Assets — Preview</div><button className="modal-close" onClick={onCancel}>×</button></div>
        <div className="modal-body">
          <div style={{fontSize:12,color:'var(--gray)',marginBottom:12}}>File: <strong style={{color:'var(--white)'}}>{fileName}</strong>. Nothing has been saved yet. Assets not in the file are never removed or changed, in any category.</div>
          <div className="import-summary">
            <span className="import-pill new">New: {plan.added.length}</span>
            <span className="import-pill">Unchanged: {plan.unchanged.length}</span>
            <span className="import-pill upd">Existing with changes: {plan.updates.length}</span>
            <span className="import-pill bad">Invalid rows: {plan.invalid.length}</span>
          </div>
          {blocked&&<>
            <div className="close-warning" style={{color:'var(--red)'}}>The file has invalid rows. Fix them and import again — nothing can be saved from this file.</div>
            <div className="import-list"><table><thead><tr><th>Row</th><th>Asset No.</th><th>Problem</th></tr></thead><tbody>
              {plan.invalid.map(r=><tr key={r.line} className="import-invalid"><td>{r.line}</td><td>{r.num||'—'}</td><td>{r.reason}</td></tr>)}
            </tbody></table></div></>}
          {plan.updates.length>0&&<>
            <div className="close-card-title">Existing assets with changes — tick the ones to update ({sel.length} selected)
              {!blocked&&<span style={{marginLeft:12}}><button className="btn btn-ghost btn-sm" onClick={()=>setSel(plan.updates.map(u=>u.num))}>Select all</button> <button className="btn btn-ghost btn-sm" onClick={()=>setSel([])}>Select none</button></span>}</div>
            <div className="import-list"><table><thead><tr><th></th><th>Asset No.</th><th>Description</th><th>Proposed changes</th></tr></thead><tbody>
              {plan.updates.map(u=><tr key={u.num} className="import-update"><td><input type="checkbox" aria-label={`Update ${u.num}`} checked={sel.includes(u.num)} disabled={blocked} onChange={()=>toggle(u.num)}/></td>
                <td>{u.num}</td><td>{u.desc}</td><td>{u.changes.map(c=><div key={c.field}><span style={{color:'var(--gray)'}}>{c.field}:</span> {c.from||'(blank)'} → <strong>{c.to}</strong></div>)}</td></tr>)}
            </tbody></table></div></>}
          {plan.added.length>0&&<>
            <div className="close-card-title">New assets to add ({plan.added.length})</div>
            <div className="import-list"><table><thead><tr><th>Asset No.</th><th>Category</th><th>Description</th></tr></thead><tbody>
              {plan.added.map(a=><tr key={a.num} className="import-new"><td>{a.num}</td><td>{a.plant}</td><td>{a.desc}</td></tr>)}
            </tbody></table></div></>}
          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={onCancel}>Cancel — save nothing</button>
            <button className="btn btn-success" disabled={blocked||nothing} onClick={()=>onConfirm(sel)}>✓ Confirm import ({plan.added.length} new, {sel.length} update{sel.length===1?'':'s'})</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── SETTINGS PAGE ────────────────────────────────────────────────────────────
// Settings → Users: compact assignment summary. Display only; reads the stored fields, never changes them.
// Short labels: display only (tooltips and the View dialog always show the full names).
const DEPT_ABBR = Object.freeze({'Cement Plant':'CEM','LPG / Oxygen Plant':'LPG/OXY','Fuel Farm':'FUEL','Roofing Plant':'ROOF','General Store':'STORE','Accounts':'ACC','HR':'HR','Housekeeping':'HK','F&B':'F&B','Loss Prevention':'LP','Administration':'ADMIN'});
const SECTION_ABBR = Object.freeze({electrical:'ELE',mechanical:'MEC',maintenance:'MNT'});   // keyed by normSection()
function deptAbbr(d) { return DEPT_ABBR[d] || String(d); }
function sectionAbbr(sec) { return SECTION_ABBR[normSection(sec)] || String(sec); }
// asset categories already carry a number ("01 FUEL FARM" -> "01"); others: first word, max 6 letters
function catCode(c) { const m = /^(\d+)\s+(.*)$/.exec(String(c).trim()); return m ? m[1] : ''; }
function catName(c) { const m = /^(\d+)\s+(.*)$/.exec(String(c).trim()); return m ? m[2] : String(c).trim(); }
const EyeIcon = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
function userDepartments(u) { return (Array.isArray(u.department) ? u.department : [u.department]).filter(Boolean).map(String); }
function userCategories(u) { return (Array.isArray(u.assignedCategories) ? u.assignedCategories : []).map(String).slice().sort(); }
function ViewAssignBtn({u, onView}) {
  return <button type="button" className="assign-btn" onClick={onView} title="View assignments" aria-label={`View assignments for ${u.fullName}`}><EyeIcon/></button>;
}
function assignmentSummary(u, onView) {
  if (isDeptUser(u)) {
    // "Cat: 02, 04 +3": up to 2 real codes; the rest (and any category without a stored code) counted in +N
    const depts = userDepartments(u), cats = userCategories(u), SHOW = 2;
    const codes = cats.map(catCode).filter(Boolean), shown = codes.slice(0, SHOW), more = cats.length - shown.length;
    const catText = isAllCategories(u.assignedCategories) ? 'Cat: All' : cats.length ? `Cat: ${shown.join(', ')}${more ? (shown.length ? ' ' : '') + '+' + more : ''}` : 'Cat: —';
    return <span className="assign-sum">
      {depts.length ? depts.map(d=><span key={d} className="assign-badge abbr" title={d}>{deptAbbr(d)}</span>) : <span className="assign-badge">No dept</span>}
      <span className="assign-badge" title={isAllCategories(u.assignedCategories) ? 'All asset categories, including new ones' : `${cats.length} categor${cats.length===1?'y':'ies'} assigned`}>{catText}</span>
      <ViewAssignBtn u={u} onView={onView}/>
    </span>;
  }
  if (isJobCardEditor(u)) return <span className="assign-sum">
      {u.section ? <span className="assign-badge abbr" title={`Section: ${u.section}`}>{sectionAbbr(u.section)}</span> : <span className="assign-badge">No section</span>}
      <ViewAssignBtn u={u} onView={onView}/>
    </span>;
  return '—';
}
