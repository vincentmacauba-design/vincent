// ─── CATEGORY PANEL ROW (module-level to avoid remount) ──────────────────────
function CategoryPanelRow({name, onRename}) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(name);
  function save() {
    const upper = draft.trim().toUpperCase();
    if (upper && upper !== name) onRename(name, upper);
    setEditing(false);
  }
  return (
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:7,padding:'9px 12px',background:'var(--hl-03)',borderRadius:6,border:'1px solid var(--border)'}}>
      {editing
        ? <>
            <input value={draft} onChange={e=>setDraft(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter')save();if(e.key==='Escape'){setEditing(false);setDraft(name);}}}
              style={{flex:1,fontSize:13}} autoFocus/>
            <button className="btn btn-success btn-sm" onClick={save}>Save</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>{setEditing(false);setDraft(name);}}>✕</button>
          </>
        : <>
            <span style={{flex:1,fontFamily:'var(--fh)',fontSize:13,fontWeight:600}}>{name}</span>
            <button className="btn btn-warning btn-sm btn-icon" title="Rename" onClick={()=>{setEditing(true);setDraft(name);}}>✏</button>
          </>
      }
    </div>
  );
}

// ─── ASSET FORM MODAL ─────────────────────────────────────────────────────────
function AssetFormModal({mode, asset, assets, onClose, onSave, customPlants=[], onAddPlant, onRenameCategory}) {
  const [f, setF] = useState(asset ? {...asset} : {num:'',plant:'',desc:'',code:'',model:'',cap:'',reg:'',eng:'',serial:'',loc:'',status:'OPERATIONAL'});
  const [showNew, setShowNew] = useState(false);
  const [newName, setNewName] = useState('');
  const [showCatPanel, setShowCatPanel] = useState(false);
  // customPlants now contains ALL categories (built-in + custom), de-duped
  const allPlants = [...new Set(customPlants)].sort();

  function handleSave() {
    if (!f.num.trim()) { alert('Asset number required'); return; }
    if (!f.desc.trim()) { alert('Description required'); return; }
    if (!f.plant) { alert('Asset category required'); return; }
    onSave(f, mode==='edit' ? asset.num : null);
  }

  function saveNewPlant() {
    const name = newName.trim().toUpperCase();
    if (!name) return;
    onAddPlant && onAddPlant(name);
    setF({...f, plant:name});
    setShowNew(false); setNewName('');
  }

  const fld = (label, key, opts={}) => (
    <div className="form-group">
      <label>{label}</label>
      <input type={opts.type||'text'} value={f[key]||''} onChange={e=>setF({...f,[key]:e.target.value})} placeholder={opts.placeholder||''} readOnly={opts.readonly}/>
    </div>
  );

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-head">
          <div className="modal-title">{mode==='add'?'Add New Asset':`Edit Asset — ${asset?.num}`}</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <button className="btn btn-warning btn-sm" onClick={()=>setShowCatPanel(true)}>⚙ Edit Categories</button>
            <button className="modal-close" onClick={onClose}>×</button>
          </div>
        </div>
        <div className="modal-body">
          {mode==='edit'&&<div className="edit-mode-banner">✏ Editing existing asset — changes will be saved to the registry</div>}
          <div className="form-row">{fld('Asset Number','num')}{fld('Description','desc')}</div>
          <div className="form-row">
            <div className="form-group">
              <label>Asset Category</label>
              <select value={showNew?'__new__':f.plant} onChange={e=>{
                if(e.target.value==='__new__'){setShowNew(true);}
                else{setShowNew(false);setF({...f,plant:e.target.value});}
              }}>
                <option value="">— Select Category —</option>
                {allPlants.map(p=><option key={p} value={p}>{p.toUpperCase()}</option>)}
                <option value="__new__">New...</option>
              </select>
            </div>
            {showNew
              ? <div className="form-group">
                  <label>New Category Name</label>
                  <div style={{display:'flex',gap:8}}>
                    <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Category name" onKeyDown={e=>e.key==='Enter'&&saveNewPlant()} style={{flex:1}}/>
                    <button className="btn btn-success btn-sm" onClick={saveNewPlant}>Save</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>{setShowNew(false);setNewName('');}}>✕</button>
                  </div>
                </div>
              : fld('Equipment Code','code')
            }
          </div>
          <div className="form-row">{fld('Model / Make','model')}{fld('Capacity','cap')}</div>
          <div className="form-row">{fld('Register Number','reg')}{fld('Engine Number','eng')}</div>
          <div className="form-row">{fld('Serial / Chassis No.','serial')}{fld('Location','loc')}</div>
          <div className="form-row">
            <div className="form-group">
              <label>Status</label>
              <select value={f.status||'OPERATIONAL'} onChange={e=>setF({...f,status:e.target.value})}>
                {['OPERATIONAL','BREAKDOWN','UNDER MAINTENANCE','IDLE','TRANSFERRED'].map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:8}}>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-success" onClick={handleSave}>💾 {mode==='add'?'Save Asset':'Update Asset'}</button>
          </div>
        </div>
      </div>

      {/* Slide-in categories panel */}
      {showCatPanel&&(
        <>
          <div style={{position:'fixed',inset:0,zIndex:250,background:'rgba(0,0,0,.35)'}} onClick={()=>setShowCatPanel(false)}/>
          <div style={{position:'fixed',right:0,top:0,bottom:0,width:340,background:'var(--navy2)',borderLeft:'2px solid rgba(245,158,11,.25)',zIndex:260,display:'flex',flexDirection:'column',boxShadow:'-20px 0 60px rgba(0,0,0,.6)'}}>
            <div style={{padding:'18px 22px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',background:'rgba(245,158,11,.06)'}}>
              <div>
                <div style={{fontFamily:'var(--fh)',fontSize:18,fontWeight:700}}>Edit Categories</div>
                <div style={{fontSize:10,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,marginTop:2}}>CLICK ✏ TO RENAME · UPDATES ALL ASSETS</div>
              </div>
              <button className="modal-close" onClick={()=>setShowCatPanel(false)}>×</button>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'14px 16px'}}>
              {allPlants.map(p=>(
                <CategoryPanelRow key={p} name={p} onRename={(oldN,newN)=>{onRenameCategory&&onRenameCategory(oldN,newN);}}/>
              ))}
            </div>
            <div style={{padding:'12px 16px',borderTop:'1px solid var(--border)',fontSize:11,fontFamily:'var(--fm)',color:'var(--gray)'}}>
              {allPlants.length} categories total
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// ─── JO FORM MODAL ────────────────────────────────────────────────────────────
function JOFormModal({mode, jo, preAsset, assets, joCounter, onClose, onSave, employees=[], currentUser=null}) {
  // Form mode (FEATURE_PLAN §3.2): 'full' = Admin/AE (unchanged); 'request' = Department User (sections 1-3; requester and
  // department locked from the profile); 'work' = Job Card Editor / editor bundle (sections 4-7; 1-3 read-only). saveJO enforces the same.
  const formMode = isDeptUser(currentUser) ? 'request' : (can(currentUser,'jo.edit.request') && can(currentUser,'jo.edit.work')) || mode==='add' ? 'full' : 'work';
  const lockRequest = formMode==='work', lockRequester = formMode!=='full', showWork = formMode!=='request';
  const today = new Date().toISOString().split('T')[0];
  const [f, setF] = useState(() => {
    if (jo) return {...jo, manpower: jo.manpower || [{empId:'',name:'',designation:'',hours:''}], ...(isDeptUser(currentUser) ? {repairType: DU_REPAIR_TYPE} : {})};
    const base = {
      date:today, requester: isDeptUser(currentUser) ? currentUser.fullName : '', dept: isDeptUser(currentUser) ? (currentUser.department||'') : '', assetNum:'', assetDesc:'', assetCategory:'', location:'',
      eqcode:'', problem:'', priority:'High', repairType: isDeptUser(currentUser) ? DU_REPAIR_TYPE : 'Planned',
      recvName:'', section:'', target:'',
      manpower:[{empId:'',name:'',designation:'',hours:''}],
      parts:[{itemCode:'',desc:'',qty:'',unit:''}],
      workDone:'', workStatus:'', eval:'', downtime:'', accept:'Accepted', status:'OPEN', completionDate:'',
    };
    if (preAsset) {
      const a = assets.find(x=>x.num===preAsset);
      if (a) return {...base, assetNum:a.num, assetDesc:a.desc, assetCategory:(a.plant||'').toUpperCase(), location:a.loc||a.plant||'', eqcode:a.code||''};
      return {...base, assetNum:preAsset};
    }
    return base;
  });
  const [assetSearch, setAssetSearch] = useState('');
  const [assetOpen, setAssetOpen] = useState(false);
  const sortedAssets = [...assets].sort((a,b)=>(parseInt(a.num)||0)-(parseInt(b.num)||0));
  const filteredAssets = sortedAssets.filter(a =>
    !assetSearch ||
    a.num.toLowerCase().includes(assetSearch.toLowerCase()) ||
    a.desc.toLowerCase().includes(assetSearch.toLowerCase()) ||
    (a.plant||'').toLowerCase().includes(assetSearch.toLowerCase())
  );

  function populateAsset(num) {
    const a = assets.find(x=>x.num===num);
    if (a) setF(prev=>({...prev,assetNum:num,assetDesc:a.desc,assetCategory:(a.plant||'').toUpperCase(),location:a.loc||a.plant,eqcode:a.code||''}));
    else setF(prev=>({...prev,assetNum:num,assetCategory:''}));
  }

  function setParts(idx, key, val) {
    setF(prev=>{
      const parts = [...(prev.parts||[])];
      parts[idx] = {...parts[idx],[key]:val};
      return {...prev,parts};
    });
  }
  function addPart() { setF(prev=>({...prev,parts:[...(prev.parts||[]),{itemCode:'',desc:'',qty:'',unit:''}]})); }
  function removePart(idx) { setF(prev=>({...prev,parts:(prev.parts||[]).filter((_,i)=>i!==idx)})); }

  function handleSave() {
    if (!f.assetNum) { alert('Please select an asset'); return; }
    if (!f.date) { alert('Please enter a date'); return; }
    onSave(f, mode==='edit' ? jo.jobNo : null);
  }

  const fld = (label, key, opts={}) => (
    <div className="form-group">
      <label>{label}</label>
      {opts.textarea
        ? <textarea value={f[key]||''} onChange={e=>setF({...f,[key]:e.target.value})} placeholder={opts.placeholder||''} readOnly={opts.readonly}/>
        : opts.select
          ? <select value={f[key]||''} onChange={e=>setF({...f,[key]:e.target.value})}>{opts.options.map(o=><option key={o}>{o}</option>)}</select>
          : <input type={opts.type||'text'} value={f[key]||''} onChange={e=>setF({...f,[key]:e.target.value})} placeholder={opts.placeholder||''} readOnly={opts.readonly}/>
      }
    </div>
  );

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{width:860}}>
        <div className="modal-head">
          <div className="modal-title">{mode==='add'?'Raise Job Order':`Edit Job Order — ${jo?.jobNo}`}</div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {mode==='edit'&&<div className="edit-mode-banner">✏ Editing existing job order</div>}
          <div style={{fontFamily:'var(--fm)',fontSize:11,color:'var(--accent)',marginBottom:12}}>JOB NO: {mode==='edit'?jo.jobNo:`JO-${joCounter+1} (auto)`}</div>

          <div className="jc-section">
            <div className="jc-section-title">Request Information</div>
            <div className="form-row">
              <div className="form-group"><label>Date</label><input type="date" value={f.date} onChange={e=>setF({...f,date:e.target.value})} readOnly={lockRequest}/></div>
              {fld('Requested By','requester',{readonly:lockRequester})}
            </div>
            <div className="form-row">{fld('Department','dept',{readonly:lockRequester})}</div>
          </div>

          <div className="jc-section">
            <div className="jc-section-title">Equipment Details</div>

            {/* Search + Asset Number row */}
            <div style={{display:'flex',gap:14,marginBottom:14}}>
              <div className="form-group" style={{flex:3,position:'relative',marginBottom:0}}>
                <label>Search</label>
                <input
                  value={assetSearch}
                  onChange={e=>{setAssetSearch(e.target.value);setAssetOpen(true);}}
                  onFocus={()=>setAssetOpen(true)}
                  placeholder="Search by asset number or description..."
                  autoComplete="off"
                  disabled={lockRequest}
                />
                {assetOpen&&!lockRequest&&(
                  <>
                    <div style={{position:'fixed',inset:0,zIndex:299}} onClick={()=>{setAssetOpen(false);}}/>
                    <div style={{position:'absolute',top:'calc(100% + 3px)',left:0,right:0,background:'var(--navy2)',border:'1px solid var(--border)',borderTop:'2px solid var(--accent)',borderRadius:'0 0 6px 6px',zIndex:300,maxHeight:220,overflowY:'auto',boxShadow:'0 16px 48px rgba(0,0,0,.75)'}}>
                      {filteredAssets.length===0
                        ? <div style={{padding:'14px 16px',color:'var(--gray)',fontSize:12,fontFamily:'var(--fm)'}}>No assets match "{assetSearch}"</div>
                        : <>
                            <div style={{padding:'6px 12px 4px',fontSize:10,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,textTransform:'uppercase',borderBottom:'1px solid var(--border)',display:'flex',gap:10}}>
                              <span style={{width:52,flexShrink:0}}>No.</span><span style={{flex:1}}>Description</span><span style={{width:100,textAlign:'right'}}>Category</span>
                            </div>
                            {filteredAssets.slice(0,35).map(a=>(
                              <div key={a.num}
                                onMouseDown={e=>e.preventDefault()}
                                onClick={()=>{populateAsset(a.num);setAssetOpen(false);setAssetSearch('');}}
                                style={{padding:'9px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid var(--border)'}}
                                onMouseEnter={e=>e.currentTarget.style.background='rgba(26,86,219,.18)'}
                                onMouseLeave={e=>e.currentTarget.style.background='transparent'}
                              >
                                <span style={{fontFamily:'var(--fm)',fontSize:12,color:'var(--accent)',width:52,flexShrink:0,fontWeight:700}}>{a.num}</span>
                                <span style={{fontSize:13,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.desc}</span>
                                <span style={{fontSize:10,color:'var(--gray)',flexShrink:0,width:100,textAlign:'right',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{(a.plant||'').replace(/^\d+\s*/,'')}</span>
                              </div>
                            ))}
                          </>
                      }
                    </div>
                  </>
                )}
              </div>
              <div className="form-group" style={{flex:1,marginBottom:0}}>
                <label>Asset Number</label>
                <input
                  value={f.assetNum||''}
                  readOnly
                  placeholder="Auto-filled"
                  style={{
                    background:'var(--hl-03)',
                    color: f.assetNum ? 'var(--accent)' : 'var(--gray)',
                    fontFamily:'var(--fm)', fontWeight:f.assetNum?700:400, fontSize:13,
                    cursor:'default',
                  }}
                />
              </div>
            </div>

            {/* Auto-filled fields */}
            <div className="form-row">
              {fld('Asset Description','assetDesc',{readonly:true})}
              {fld('Asset Category','assetCategory',{readonly:true})}
            </div>
            <div className="form-row">
              {fld('Location','location',{readonly:true})}
              {fld('Equipment Code','eqcode',{readonly:true})}
            </div>
          </div>

          <div className="jc-section">
            <div className="jc-section-title">Problem Details</div>
            <div className="form-row single">{fld('Details of the Problem','problem',{textarea:true,placeholder:'Describe the problem...',readonly:lockRequest})}</div>
            <div style={{display:'flex',gap:30,flexWrap:'wrap',marginTop:4}}>
              <div>
                <label style={{fontSize:11,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,textTransform:'uppercase',display:'block',marginBottom:8}}>Priority</label>
                <div className="checkbox-row">
                  {['High','Low'].map(p=><label key={p} className="checkbox-item"><input type="radio" name="prio" checked={f.priority===p} onChange={()=>setF({...f,priority:p})} disabled={lockRequest}/><span style={p==='High'?{color:'var(--red)',fontWeight:600}:{color:'var(--green)'}}>{p==='High'?'⚡ HIGH':'LOW'}</span></label>)}
                </div>
              </div>
              <div>
                <label style={{fontSize:11,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,textTransform:'uppercase',display:'block',marginBottom:8}}>Type of Repair</label>
                <div className="checkbox-row">
                  {(isDeptUser(currentUser) ? [DU_REPAIR_TYPE] : ['Planned','Unplanned']).map(t=><label key={t} className="checkbox-item"><input type="radio" name="rtype" checked={f.repairType===t} onChange={()=>setF({...f,repairType:t})} disabled={lockRequest}/>{t}</label>)}
                </div>
              </div>
            </div>
          </div>

          {showWork&&<>
          <div className="jc-section">
            <div className="jc-section-title">Work Assigned To</div>
            <div className="form-row single"><div className="form-group"><label>Work Assigned To</label><input value={f.assignedTo||''} readOnly placeholder="Set automatically when work is started"/></div></div>
            <div className="form-row">{fld('Received By','recvName')}{fld('Section Assigned','section',{readonly:isJobCardEditor(currentUser)})}</div>
            <div className="form-row">
              <div className="form-group"><label>Start Date</label><input type="date" value={f.target||''} onChange={e=>setF({...f,target:e.target.value})}/></div>
            </div>
          </div>

          <div className="jc-section">
            <div className="jc-section-title">Manpower Utilisation</div>
            <table className="parts-table">
              <thead><tr>
                <th style={{width:'14%'}}>Emp ID</th>
                <th style={{width:'30%'}}>Name</th>
                <th style={{width:'30%'}}>Designation</th>
                <th style={{width:'14%'}}>Hrs Attended</th>
                <th style={{width:'8%'}}></th>
              </tr></thead>
              <tbody>
                {(f.manpower||[]).map((m,i)=>(
                  <tr key={i}>
                    <td><input value={m.empId||''} onChange={e=>{
                      const _today = new Date().toISOString().split('T')[0];
                      const emp = employees.find(x=>x.empId===e.target.value&&(!x.exitDate||x.exitDate>_today));
                      setF(prev=>{
                        const mp=[...(prev.manpower||[])];
                        mp[i]={...mp[i],empId:e.target.value,name:emp?emp.name:'',designation:emp?emp.designation:''};
                        return {...prev,manpower:mp};
                      });
                    }} placeholder="Emp ID"/></td>
                    <td><input value={m.name||''} readOnly placeholder="Auto-filled"/></td>
                    <td><input value={m.designation||''} readOnly placeholder="Auto-filled"/></td>
                    <td><input type="number" value={m.hours||''} onChange={e=>{
                      setF(prev=>{const mp=[...(prev.manpower||[])];mp[i]={...mp[i],hours:e.target.value};return{...prev,manpower:mp};});
                    }} placeholder="0"/></td>
                    <td><button className="btn btn-danger btn-sm" onClick={()=>setF(prev=>({...prev,manpower:(prev.manpower||[]).filter((_,x)=>x!==i)}))}>✕</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
            <button className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={()=>setF(prev=>({...prev,manpower:[...(prev.manpower||[]),{empId:'',name:'',designation:'',hours:''}]}))}>＋ Add Row</button>
          </div>

          <div className="jc-section">
            <div className="jc-section-title">Material / Spare Parts</div>
            <table className="parts-table">
              <thead><tr><th style={{width:'16%'}}>Item Code</th><th style={{width:'44%'}}>Description</th><th style={{width:'12%'}}>Qty</th><th style={{width:'14%'}}>Unit</th><th style={{width:'8%'}}></th></tr></thead>
              <tbody>
                {(f.parts||[]).map((p,i)=>(
                  <tr key={i}>
                    <td><input value={p.itemCode||''} onChange={e=>setParts(i,'itemCode',e.target.value)} placeholder="Code"/></td>
                    <td><input value={p.desc||''} onChange={e=>setParts(i,'desc',e.target.value)} placeholder="Description"/></td>
                    <td><input type="number" value={p.qty||''} onChange={e=>setParts(i,'qty',e.target.value)} placeholder="0"/></td>
                    <td><input value={p.unit||''} onChange={e=>setParts(i,'unit',e.target.value)} placeholder="pcs"/></td>
                    <td><button className="btn btn-danger btn-sm" onClick={()=>removePart(i)}>✕</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
            <button className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={addPart}>＋ Add Row</button>
          </div>

          <div className="jc-section">
            <div className="jc-section-title">Service Report</div>
            <div className="form-row single">{fld('Details of Work Done','workDone',{textarea:true,placeholder:'Describe work carried out...'})}</div>
            <div style={{display:'flex',gap:30,flexWrap:'wrap',marginTop:8}}>
              <div>
                <label style={{fontSize:11,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,textTransform:'uppercase',display:'block',marginBottom:8}}>Work Status</label>
                <div className="checkbox-row">
                  {['Work Completed Successful','Temporary Repaired'].map(s=><label key={s} className="checkbox-item"><input type="radio" name="ws" checked={f.workStatus===s} onChange={()=>setF({...f,workStatus:s})}/>{s==='Work Completed Successful'?'Completed ✓':'Temporary Repaired'}</label>)}
                </div>
              </div>
              <div>
                <label style={{fontSize:11,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,textTransform:'uppercase',display:'block',marginBottom:8}}>Evaluation</label>
                <div className="checkbox-row">
                  {['Very Good','Good','Satisfied','Not Satisfied'].map(e=><label key={e} className="checkbox-item"><input type="radio" name="ev" checked={f.eval===e} onChange={()=>setF({...f,eval:e})}/>{e}</label>)}
                </div>
              </div>
            </div>
            <div className="form-row" style={{marginTop:14}}>
              {fld('Downtime (hours)','downtime',{type:'number'})}
              <div className="form-group">
                <label>Acceptance</label>
                <select value={f.accept||'Accepted'} onChange={e=>setF({...f,accept:e.target.value})}>
                  <option value="Accepted">Accepted the repair</option>
                  <option value="Rejected">Rejected the repair</option>
                </select>
              </div>
            </div>
            <div className="form-row single">
              <div className="form-group"><label>Completion Date</label><input type="date" value={f.completionDate||''} onChange={e=>setF({...f,completionDate:e.target.value})}/></div>
            </div>
          </div>
          </>}

          <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:6}}>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={()=>{
              if(!f.assetNum){alert('Please select an asset');return;}
              if(!f.date){alert('Please enter a date');return;}
              const previewJO={...f,jobNo:mode==='edit'?jo.jobNo:`JO-${joCounter+1}`};
              printJOPDF(previewJO, currentUser);
            }}>↓ PDF Preview</button>
            <button className="btn btn-success" onClick={handleSave}>💾 {mode==='add'?'Save Job Order':'Update Job Order'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── JO VIEW MODAL ────────────────────────────────────────────────────────────
function JOViewModal({jo, onClose, onEdit, currentUser={}}) {
  const DI = ({label,val,mono,green,accent}) => (
    <div className="detail-item">
      <label>{label}</label>
      <div className="val" style={{fontSize:13,fontFamily:mono?'var(--fm)':'inherit',color:green?'var(--green)':accent?'var(--accent)':'inherit'}}>{val||'—'}</div>
    </div>
  );
  const Grid3 = ({children}) => <div className="grid3" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>{children}</div>;
  const mpRows = (jo.manpower||[]).filter(m=>m.empId||m.name);
  const partsRows = (jo.parts||[]).filter(p=>p.desc||p.itemCode);
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{width:900,maxHeight:'92vh',display:'flex',flexDirection:'column'}}>
        {/* Header */}
        <div className="modal-head" style={{flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:14}}>
            <div style={{fontFamily:'var(--fm)',fontSize:20,fontWeight:700,color:'var(--accent)',letterSpacing:1}}>{jo.jobNo}</div>
            <span className={`sb-base ${joStatusCls(jo.status)}`} style={{fontSize:11}}>{jo.status}</span>
            {jo.priority&&<span className={jo.priority==='High'?'prio-high':'prio-low'} style={{fontSize:11}}>{jo.priority} Priority</span>}
          </div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>

        <div className="modal-body" style={{overflowY:'auto',flex:1}}>

          {/* Request Information */}
          <div className="jc-section">
            <div className="jc-section-title">Request Information</div>
            <Grid3>
              <DI label="Date" val={jo.date}/>
              <DI label="Requested By" val={jo.requester}/>
              <DI label="Department" val={jo.dept}/>
              <DI label="Priority" val={<span className={jo.priority==='High'?'prio-high':'prio-low'}>{jo.priority||'—'}</span>}/>
              <DI label="Type of Repair" val={jo.repairType}/>
              <DI label="Status" val={<span className={`sb-base ${joStatusCls(jo.status)}`} style={{fontSize:11}}>{jo.status}</span>}/>
            </Grid3>
          </div>

          {/* Equipment Details */}
          <div className="jc-section">
            <div className="jc-section-title">Equipment Details</div>
            <Grid3>
              <DI label="Asset Number" val={jo.assetNum} mono accent/>
              <DI label="Asset Description" val={jo.assetDesc}/>
              <DI label="Location" val={jo.location}/>
              <DI label="Equipment Code" val={jo.eqcode} mono/>
              <DI label="Asset Category" val={jo.assetCategory||jo.plant}/>
            </Grid3>
          </div>

          {/* Problem Details — amber tint like PDF */}
          <div style={{background:'rgba(245,158,11,.06)',border:'1px solid rgba(245,158,11,.25)',borderRadius:6,padding:'12px 14px',marginBottom:14}}>
            <div className="jc-section-title" style={{marginBottom:8}}>Problem Details</div>
            <p style={{fontSize:13,lineHeight:1.7,margin:0,color:'var(--white)'}}>{jo.problem||'—'}</p>
          </div>

          {/* Work Assigned To */}
          <div className="jc-section">
            <div className="jc-section-title">Work Assigned To</div>
            <Grid3>
              <DI label="Work Assigned To" val={jo.assignedTo}/>
              <DI label="Received By" val={jo.recvName}/>
              <DI label="Section" val={jo.section}/>
              <DI label="Start Date" val={jo.target}/>
              <DI label="Completion Date" val={jo.completionDate} green/>
            </Grid3>
          </div>

          {/* Manpower Utilisation */}
          <div className="jc-section">
            <div className="jc-section-title">Manpower Utilisation</div>
            <table className="parts-table">
              <thead><tr>
                <th style={{width:'12%'}}>Emp ID</th>
                <th style={{width:'40%'}}>Name</th>
                <th style={{width:'33%'}}>Designation</th>
                <th style={{width:'15%',textAlign:'center'}}>Hours</th>
              </tr></thead>
              <tbody>
                {mpRows.length>0
                  ? mpRows.map((m,i)=><tr key={i}>
                      <td style={{fontFamily:'var(--fm)',fontSize:11,color:'var(--accent)'}}>{m.empId||'—'}</td>
                      <td style={{fontWeight:600}}>{m.name||'—'}</td>
                      <td style={{fontSize:11,color:'var(--gray)'}}>{m.designation||'—'}</td>
                      <td style={{textAlign:'center',fontFamily:'var(--fm)'}}>{m.hours||0} hrs</td>
                    </tr>)
                  : <tr><td colSpan={4} style={{color:'var(--gray)',textAlign:'center',padding:10,fontSize:12}}>No manpower recorded</td></tr>
                }
              </tbody>
            </table>
            {jo.downtime>0&&<div style={{marginTop:8,fontSize:12,color:'var(--gray)',fontFamily:'var(--fm)'}}>Downtime: <strong style={{color:'var(--accent)'}}>{jo.downtime} hrs</strong></div>}
          </div>

          {/* Service Report */}
          <div className="jc-section">
            <div className="jc-section-title">Service Report</div>
            <Grid3>
              <DI label="Work Status" val={jo.workStatus}/>
              <DI label="Evaluation" val={jo.eval}/>
              <DI label="Acceptance" val={jo.accept}/>
            </Grid3>
          </div>

          {/* Work Done — green tint like PDF */}
          {jo.workDone&&(
            <div style={{background:'rgba(16,185,129,.06)',border:'1px solid rgba(16,185,129,.25)',borderRadius:6,padding:'12px 14px',marginBottom:14}}>
              <div className="jc-section-title" style={{marginBottom:8}}>Work Done</div>
              <p style={{fontSize:13,lineHeight:1.7,margin:0,color:'var(--white)'}}>{jo.workDone}</p>
            </div>
          )}

          {/* Materials / Spare Parts */}
          <div className="jc-section">
            <div className="jc-section-title">Materials / Spare Parts</div>
            <table className="parts-table">
              <thead><tr>
                <th style={{width:'14%'}}>Item Code</th>
                <th style={{width:'52%'}}>Description</th>
                <th style={{width:'12%',textAlign:'center'}}>Qty</th>
                <th style={{width:'12%',textAlign:'center'}}>Unit</th>
              </tr></thead>
              <tbody>
                {partsRows.length>0
                  ? partsRows.map((p,i)=><tr key={i}>
                      <td style={{fontFamily:'var(--fm)',fontSize:11}}>{p.itemCode||'—'}</td>
                      <td>{p.desc||'—'}</td>
                      <td style={{textAlign:'center'}}>{p.qty||'—'}</td>
                      <td style={{textAlign:'center',color:'var(--gray)'}}>{p.unit||'—'}</td>
                    </tr>)
                  : <tr><td colSpan={4} style={{color:'var(--gray)',textAlign:'center',padding:10,fontSize:12}}>No parts recorded</td></tr>
                }
              </tbody>
            </table>
          </div>

          {/* Approval */}
          {!jo.approvalStatus&&jo.closedBy&&(   /* legacy combined record: unchanged */
            <div style={{background:'rgba(16,185,129,.06)',border:'1px solid rgba(16,185,129,.25)',borderRadius:6,padding:'12px 14px',marginBottom:14}}>
              <div className="jc-section-title" style={{marginBottom:8,color:'var(--green)'}}>Approval</div>
              <Grid3>
                <DI label="Approved By" val={jo.closedBy}/>
                <DI label="Designation" val={jo.closerDesignation}/>
                <DI label="Approved Date" val={jo.closedDate}/>
              </Grid3>
            </div>
          )}

          {(jo.approvalStatus||jo.status==='COMPLETED')&&(
            <div style={{background:isApproved(jo)?'rgba(16,185,129,.06)':'rgba(245,158,11,.06)',border:`1px solid ${isApproved(jo)?'rgba(16,185,129,.25)':'rgba(245,158,11,.25)'}`,borderRadius:6,padding:'12px 14px',marginBottom:14}}>
              <div className="jc-section-title" style={{marginBottom:isApproved(jo)?8:0,color:isApproved(jo)?'var(--green)':'var(--accent)'}}>Completion Approval — {isApproved(jo)?'Approved':'Awaiting approval'}</div>
              {isApproved(jo)&&<Grid3>
                <DI label="Approved By" val={jo.approvedBy}/>
                <DI label="Designation" val={jo.approverDesignation}/>
                <DI label="Approved At" val={(jo.approvedAt||'').replace('T',' ').slice(0,16)}/>
              </Grid3>}
            </div>
          )}
          {jo.approvalStatus&&jo.closedBy&&(
            <div style={{background:'rgba(16,185,129,.06)',border:'1px solid rgba(16,185,129,.25)',borderRadius:6,padding:'12px 14px',marginBottom:14}}>
              <div className="jc-section-title" style={{marginBottom:8,color:'var(--green)'}}>Closure</div>
              <Grid3>
                <DI label="Closed By" val={jo.closedBy}/>
                <DI label="Designation" val={jo.closerDesignation}/>
                <DI label="Closed Date" val={jo.closedDate}/>
              </Grid3>
            </div>
          )}

          {/* Actions */}
          <div style={{display:'flex',gap:10,justifyContent:'flex-end',flexWrap:'wrap',paddingTop:4}}>
            {can(currentUser,'jo.print')&&<button className="btn btn-primary" onClick={()=>printJOPDF(jo, currentUser)}>↓ Download PDF</button>}
            {mayEditJO(currentUser, jo)&&<button className="btn btn-warning" onClick={()=>onEdit(jo)}>✏ Edit</button>}
            <button className="btn btn-ghost" onClick={onClose}>Close</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── USER FORM MODAL ──────────────────────────────────────────────────────────
// Change own password (Department User, Job Card Editor). Only the password is sent; the App checks the current one.
// Recovery / verification link landing (designed for Supabase Auth recovery emails). NOT CONNECTED: the link cannot be
// used yet. The URL fragment (which would hold tokens) was already removed by App before rendering; nothing is stored.
function RecoveryLanding({link, onSetPassword, onVerify, onBack}) {
  const pageRef = useRef(null), cardRef = useRef(null);
  const [nw, setNw] = useState(''), [cf, setCf] = useState(''), [phase, setPhase] = useState('form'), [msg, setMsg] = useState('');
  const verify = link && link.kind === 'verify-email';
  useEffect(() => { if (verify) { setPhase('busy'); onVerify().then(r => { setPhase(r && r.ok ? 'verified' : 'error'); }); } }, []);
  async function submit(e) {
    e.preventDefault(); setMsg('');
    if (nw !== cf) { setMsg('The new passwords do not match.'); return; }
    const v = validatePassword(nw); if (v) { setMsg(v); return; }
    setPhase('busy');
    const r = await onSetPassword(nw);
    if (r && r.ok) setPhase('done'); else { setPhase('form'); setMsg((r && r.message) || 'The password was not changed.'); }
  }
  return (
    <div className="login-page recovery-landing" ref={pageRef}>
      <LoginCircuit pageRef={pageRef} cardRef={cardRef}/>
      <ThemeToggle className="login-theme"/>
      <main className="login-main" style={{gridColumn:'1 / -1'}}>
        <div className="login-card" ref={cardRef} role="region" aria-labelledby="rl-title">
          <div className="login-card-head">
            <h2 className="login-welcome" id="rl-title">{verify ? 'Email confirmation' : 'Choose a new password'}</h2>
          </div>
          {verify ? <div className={phase === 'error' ? 'login-error' : 'login-info'} role="status">
              {phase === 'busy' ? 'Confirming…' : phase === 'verified' ? 'If the link was valid, your recovery email address is now confirmed. You can close this page or sign in.' : 'The confirmation could not be sent. Check your connection and open the link again.'}</div>
          : link.error ? <div className="login-error" role="alert">This reset link is invalid or has expired. Request a new one with "Forgot password?" on the sign-in page.</div>
          : phase === 'done' ? <div className="login-success" role="status">Your password was changed. Sign in with your Employee ID and the new password.</div>
          : <form onSubmit={submit} autoComplete="off">
              <div className="login-field"><label htmlFor="rl-new">New password</label><div className="login-input"><input id="rl-new" type="password" value={nw} onChange={e=>setNw(e.target.value)} autoComplete="new-password" style={{paddingLeft:14}}/></div><div className="pw-hint">{PASSWORD_HINT}</div></div>
              <div className="login-field"><label htmlFor="rl-confirm">Confirm new password</label><div className="login-input"><input id="rl-confirm" type="password" value={cf} onChange={e=>setCf(e.target.value)} autoComplete="new-password" style={{paddingLeft:14}}/></div></div>
              <ul className="pw-checklist" aria-label="Password requirements">
                {PASSWORD_RULES.map(r => { const ok = r.test(nw); return <li key={r.id} className={ok ? 'ok' : ''}><span aria-hidden="true">{ok ? '✓' : '○'}</span> {r.text}{ok ? <span className="sr-only"> (met)</span> : null}</li>; })}
                <li className={nw && nw === cf ? 'ok' : ''}><span aria-hidden="true">{nw && nw === cf ? '✓' : '○'}</span> both new passwords match</li>
              </ul>
              {msg && <div className="login-error" role="alert">{msg}</div>}
              <button type="submit" className="login-btn" disabled={phase === 'busy'} aria-busy={phase === 'busy'}>{phase === 'busy' ? <><span className="login-spinner" aria-hidden="true"/>Saving…</> : 'Set new password'}</button>
            </form>}
          <button type="button" className="login-btn" style={{marginTop:18}} onClick={onBack}>Back to sign in</button>
        </div>
      </main>
    </div>
  );
}
// Phase 2B-2: forced first-login change. Rendered INSTEAD of the application while must_change_password is set.
function ForcePasswordChange({user, onSubmit, onLogout}) {
  const [cur, setCur] = useState(''), [nw, setNw] = useState(''), [cf, setCf] = useState('');
  const [err, setErr] = useState(''), [busy, setBusy] = useState(false);
  async function submit(e) {
    e.preventDefault(); setErr('');
    if (!cur) { setErr('Enter your temporary password.'); return; }
    if (nw !== cf) { setErr('The new passwords do not match.'); return; }
    const v = validateNewPassword(nw, cur); if (v) { setErr(v); return; }
    setBusy(true);
    const ok = await onSubmit(cur, nw);
    if (!ok) { setErr('The password was not changed. Check your temporary password and try again.'); setBusy(false); }
  }
  const pageRef = useRef(null), cardRef = useRef(null);
  return (
    <div className="login-page force-change" ref={pageRef}>
      <LoginCircuit pageRef={pageRef} cardRef={cardRef}/>
      <main className="login-main" style={{gridColumn:'1 / -1'}}>
        <div className="login-card" role="dialog" aria-labelledby="fc-title" ref={cardRef}>
          <div className="login-card-head">
            <h2 className="login-welcome" id="fc-title">Change your password</h2>
            <p className="login-instr">{user.fullName}, your account has a temporary password. Choose a new password to continue.</p>
          </div>
          <form onSubmit={submit} autoComplete="off">
            <div className="login-field"><label htmlFor="fc-current">Temporary password</label><div className="login-input"><input id="fc-current" type="password" value={cur} onChange={e=>setCur(e.target.value)} autoComplete="current-password" style={{paddingLeft:14}}/></div></div>
            <div className="login-field"><label htmlFor="fc-new">New password</label><div className="login-input"><input id="fc-new" type="password" value={nw} onChange={e=>setNw(e.target.value)} autoComplete="new-password" style={{paddingLeft:14}}/></div></div>
            <div className="login-field"><label htmlFor="fc-confirm">Confirm new password</label><div className="login-input"><input id="fc-confirm" type="password" value={cf} onChange={e=>setCf(e.target.value)} autoComplete="new-password" style={{paddingLeft:14}}/></div></div>
            <ul className="pw-checklist" aria-label="Password requirements">
              {PASSWORD_RULES.map(r => { const ok = r.test(nw); return <li key={r.id} className={ok ? 'ok' : ''}><span aria-hidden="true">{ok ? '✓' : '○'}</span> {r.text}{ok ? <span className="sr-only"> (met)</span> : null}</li>; })}
              <li className={nw && nw === cf ? 'ok' : ''}><span aria-hidden="true">{nw && nw === cf ? '✓' : '○'}</span> both new passwords match</li>
            </ul>
            {err && <div className="login-error" role="alert">{err}</div>}
            <button type="submit" className="login-btn" disabled={busy} aria-busy={busy}>{busy ? <><span className="login-spinner" aria-hidden="true"/>Saving…</> : 'Change password'}</button>
            <button type="button" className="btn btn-ghost" style={{width:'100%',marginTop:6}} onClick={onLogout}>Sign out</button>
          </form>
        </div>
      </main>
    </div>
  );
}
