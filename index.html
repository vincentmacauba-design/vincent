    case 'OPERATIONAL': return 'so';
    case 'BREAKDOWN': return 'sb';
    case 'UNDER MAINTENANCE': return 'sm';
    case 'NEW': return 'sn';
    case 'IDLE': return 'sl';

  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316;
  --gray:#94a3b8;--light:#e2e8f0;--white:#f8fafc;
  --panel:rgba(15,32,68,0.85);--border:rgba(255,255,255,0.07);
  --fh:'Rajdhani',sans-serif;--fb:'Noto Sans',sans-serif;--fm:'Source Code Pro',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body,#root{background:var(--navy);color:var(--white);font-family:var(--fb);font-size:14px;min-height:100vh;}
.app{background:var(--navy);min-height:100vh;background-image:radial-gradient(ellipse at 20% 20%,rgba(26,86,219,.12) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(245,158,11,.06) 0%,transparent 60%);}
.topbar{background:var(--navy2);border-bottom:2px solid var(--accent);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 24px rgba(0,0,0,.5);}
.logo{display:flex;align-items:center;gap:12px;}
.logo-icon{width:52px;height:36px;background:linear-gradient(135deg,var(--accent),var(--blue));border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;font-size:12px;color:var(--navy);letter-spacing:.5px;flex-shrink:0;}
.logo-text{font-family:var(--fh);font-size:20px;font-weight:700;letter-spacing:1.5px;}
.logo-sub{font-size:10px;color:var(--accent);font-family:var(--fm);letter-spacing:2px;}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.badge{font-family:var(--fm);font-size:11px;color:var(--accent);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);padding:3px 10px;border-radius:3px;white-space:nowrap;}
.sync-badge{font-family:var(--fm);font-size:11px;padding:3px 10px;border-radius:3px;white-space:nowrap;}
.sync-ok{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.sync-saving{background:rgba(26,86,219,.15);color:#60a5fa;border:1px solid rgba(26,86,219,.3);}
.sync-loading{background:rgba(245,158,11,.1);color:var(--accent);border:1px solid rgba(245,158,11,.3);}
.layout{display:flex;min-height:calc(100vh - 58px);}
.sidebar{width:210px;position:fixed;top:58px;left:0;bottom:0;background:var(--navy2);border-right:1px solid var(--border);padding:20px 0 0;overflow-y:auto;display:flex;flex-direction:column;z-index:50;}
.nav-section{padding:8px 16px 4px;font-family:var(--fm);font-size:9px;letter-spacing:2px;color:var(--gray);text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-family:var(--fh);font-size:15px;font-weight:500;letter-spacing:.5px;color:var(--gray);transition:all .15s;border-left:3px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--white);}
.nav-item.active{background:rgba(26,86,219,.15);color:var(--accent);border-left-color:var(--accent);}
.nav-icon{font-size:16px;width:18px;text-align:center;}
.main{flex:1;padding:28px 32px;min-height:calc(100vh - 58px);overflow-y:auto;margin-left:210px;}
.page-title{font-family:var(--fh);font-size:28px;font-weight:700;letter-spacing:1px;}
.page-title span{color:var(--accent);}
.page-sub{font-size:12px;color:var(--gray);font-family:var(--fm);letter-spacing:1px;margin-top:2px;}
.page-header{margin-bottom:24px;}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:28px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px 20px;backdrop-filter:blur(8px);position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.sc-blue::before{background:var(--blue);}.sc-green::before{background:var(--green);}
.sc-yellow::before{background:var(--yellow);}.sc-red::before{background:var(--red);}.sc-orange::before{background:var(--orange);}
.stat-num{font-family:var(--fh);font-size:36px;font-weight:700;line-height:1;}
.sc-blue .stat-num{color:var(--blue);}.sc-green .stat-num{color:var(--green);}
.sc-yellow .stat-num{color:var(--yellow);}.sc-red .stat-num{color:var(--red);}.sc-orange .stat-num{color:var(--orange);}
.stat-label{font-size:11px;color:var(--gray);font-family:var(--fm);letter-spacing:1px;margin-top:4px;text-transform:uppercase;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;backdrop-filter:blur(6px);margin-bottom:20px;}
.panel-head{padding:14px 20px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-title{font-family:var(--fh);font-size:16px;font-weight:600;letter-spacing:.5px;}
.panel-body{padding:20px;}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
input[type=text],input[type=date],input[type=number],select,textarea{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--white);font-family:var(--fb);font-size:13px;padding:7px 12px;border-radius:5px;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--blue);}
select option{background:var(--navy2);}
textarea{resize:vertical;min-height:70px;width:100%;}
.search-box{padding:7px 12px;border-radius:5px;min-width:220px;}
.btn{padding:7px 16px;border:none;border-radius:5px;cursor:pointer;font-family:var(--fh);font-size:14px;font-weight:600;letter-spacing:.5px;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-primary{background:var(--blue);color:#fff;}.btn-primary:hover{background:#1545b8;}
.btn-accent{background:var(--accent);color:var(--navy);}.btn-accent:hover{background:var(--accent2);}
.btn-success{background:var(--green);color:#fff;}.btn-success:hover{background:#059669;}
.btn-danger{background:var(--red);color:#fff;}.btn-danger:hover{background:#dc2626;}
.btn-warning{background:var(--orange);color:#fff;}.btn-warning:hover{background:#ea580c;}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--white);border:1px solid var(--border);}.btn-ghost:hover{background:rgba(255,255,255,.12);}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-icon{padding:5px 8px;font-size:15px;min-width:30px;text-align:center;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{padding:9px 12px;text-align:left;font-family:var(--fh);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);background:rgba(245,158,11,.06);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}tr:hover td{background:rgba(255,255,255,.02);}
.sb-base{display:inline-block;padding:2px 9px;border-radius:3px;font-family:var(--fm);font-size:10px;letter-spacing:1px;font-weight:600;}
.so{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.sb{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.sm{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3);}
.si{background:rgba(148,163,184,.15);color:var(--gray);border:1px solid rgba(148,163,184,.2);}
.sn{background:rgba(26,86,219,.15);color:#60a5fa;border:1px solid rgba(26,86,219,.3);}
.sl{background:rgba(245,158,11,.15);color:var(--yellow);border:1px solid rgba(245,158,11,.3);}
.jop{background:rgba(245,158,11,.15);color:var(--yellow);border:1px solid rgba(245,158,11,.3);}
.jcl{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.jip{background:rgba(26,86,219,.15);color:#60a5fa;border:1px solid rgba(26,86,219,.3);}
.prio-high{color:var(--red);font-weight:600;font-family:var(--fm);font-size:11px;}
.prio-low{color:var(--green);font-family:var(--fm);font-size:11px;}
.modal-overlay{display:flex;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(3px);z-index:200;align-items:center;justify-content:center;}
.modal{background:var(--navy2);border:1px solid var(--border);border-radius:10px;width:820px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:0 20px 80px rgba(0,0,0,.7);}
.modal-head{padding:18px 24px;background:var(--navy2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
.modal-title{font-family:var(--fh);font-size:20px;font-weight:700;}
.modal-close{background:none;border:none;color:var(--gray);cursor:pointer;font-size:22px;line-height:1;padding:2px 6px;}
.modal-close:hover{color:var(--white);}
.modal-body{padding:24px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.form-row.three{grid-template-columns:1fr 1fr 1fr;}.form-row.single{grid-template-columns:1fr;}
.form-group label{display:block;font-size:11px;font-family:var(--fm);letter-spacing:1px;color:var(--gray);margin-bottom:5px;text-transform:uppercase;}
.form-group input,.form-group select,.form-group textarea{width:100%;}
.jc-section{border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:14px;}
.jc-section-title{font-family:var(--fh);font-size:13px;font-weight:600;letter-spacing:1px;color:var(--accent);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.jc-section-title::after{content:'';flex:1;height:1px;background:var(--border);}
.parts-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
.parts-table th{padding:6px 8px;background:rgba(245,158,11,.08);border:1px solid var(--border);font-family:var(--fm);font-size:10px;letter-spacing:1px;color:var(--accent);}
.parts-table td{padding:4px 6px;border:1px solid var(--border);}
.parts-table input{background:transparent;border:none;color:var(--white);font-size:12px;width:100%;padding:2px 4px;outline:none;}
.parts-table input:focus{background:rgba(255,255,255,.05);border-radius:3px;}
.checkbox-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.checkbox-item{display:flex;align-items:center;gap:6px;cursor:pointer;}
.checkbox-item input[type=radio],.checkbox-item input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.detail-item label{font-size:10px;font-family:var(--fm);color:var(--gray);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px;}
.detail-item .val{font-size:14px;font-weight:500;}
.pagination{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding-top:14px;}
.page-btn{padding:5px 11px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--gray);cursor:pointer;font-size:12px;}
.page-btn:hover,.page-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.page-info-txt{font-size:12px;color:var(--gray);font-family:var(--fm);}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px;}
.jo-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.jo-num{font-family:var(--fm);font-size:12px;color:var(--accent);}
.jo-desc{font-size:13px;}.jo-meta{font-size:11px;color:var(--gray);margin-top:2px;}
.plant-pill{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:5px;font-size:13px;margin-bottom:6px;}
.pill-count{font-family:var(--fm);color:var(--accent);font-size:13px;}
.empty-state{text-align:center;padding:40px;color:var(--gray);}
.edit-mode-banner{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);border-radius:6px;padding:8px 14px;margin-bottom:14px;font-size:12px;color:var(--accent);font-family:var(--fm);display:flex;align-items:center;gap:8px;}
.toast-wrap{position:fixed;bottom:28px;right:28px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast-msg{background:var(--navy2);border:1px solid var(--green);border-left:4px solid var(--green);border-radius:8px;padding:12px 18px;font-size:13px;color:var(--white);box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:320px;}
.toast-msg.err{border-color:var(--red);border-left-color:var(--red);}
select.sb-base{cursor:pointer;-webkit-appearance:none;appearance:none;padding:2px 8px;}
@media(max-width:900px){.sidebar{display:none;}.main{padding:16px;margin-left:0;}.stats-row{grid-template-columns:1fr 1fr;}.dash-grid{grid-template-columns:1fr;}}
.btn-csv{background:rgba(16,185,129,.1);color:#4ade80;border:1px solid rgba(16,185,129,.25);}.btn-csv:hover{background:rgba(16,185,129,.2);color:#6ee7b7;}
/* ── Login Page */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);background-image:radial-gradient(ellipse at 20% 20%,rgba(26,86,219,.15) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(245,158,11,.08) 0%,transparent 60%);}
.login-card{background:rgba(15,32,68,0.93);border:1px solid rgba(245,158,11,.22);border-radius:12px;padding:44px 48px;width:440px;max-width:96vw;backdrop-filter:blur(16px);box-shadow:0 24px 80px rgba(0,0,0,.65);}
.login-logo-wrap{text-align:center;margin-bottom:28px;}
.login-logo-icon{width:80px;height:60px;background:linear-gradient(135deg,var(--accent),var(--blue));border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;font-size:18px;color:var(--navy);margin-bottom:12px;letter-spacing:1px;}
.login-title{font-family:var(--fh);font-size:22px;font-weight:700;letter-spacing:1.5px;}
.login-sub{font-size:10px;color:var(--accent);font-family:var(--fm);letter-spacing:2px;margin-top:3px;}
.login-divider{border:none;border-top:1px solid var(--border);margin:22px 0;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-size:11px;font-family:var(--fm);letter-spacing:1px;color:var(--gray);margin-bottom:6px;text-transform:uppercase;}
.login-field input{width:100%;padding:10px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--white);font-family:var(--fb);font-size:14px;border-radius:6px;outline:none;transition:border-color .15s;}
.login-field input:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:11px;background:var(--accent);color:var(--navy);font-family:var(--fh);font-size:16px;font-weight:700;letter-spacing:1px;border:none;border-radius:6px;cursor:pointer;margin-top:8px;transition:background .15s;}
.login-btn:hover{background:var(--accent2);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;}
.login-error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);border-radius:6px;padding:9px 14px;font-size:12px;color:var(--red);font-family:var(--fm);margin-top:12px;text-align:center;}
.login-footer{text-align:center;margin-top:28px;font-size:10px;color:rgba(148,163,184,.45);font-family:var(--fm);letter-spacing:1px;line-height:1.8;}
/* ── User badge & logout */
.user-badge{display:flex;align-items:center;gap:8px;padding:4px 12px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:5px;}
.user-avatar{width:26px;height:26px;background:linear-gradient(135deg,var(--blue),var(--accent));border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;font-size:12px;color:var(--navy);flex-shrink:0;}
.user-name{font-family:var(--fm);font-size:11px;color:var(--white);white-space:nowrap;}
.user-role-sm{font-family:var(--fm);font-size:9px;color:var(--gray);letter-spacing:1px;}
.btn-logout{padding:5px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);font-family:var(--fh);font-size:13px;font-weight:600;border-radius:5px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-logout:hover{background:rgba(239,68,68,.22);}
/* ── Settings Page */
.settings-tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--border);}
.settings-tab{padding:10px 22px;font-family:var(--fh);font-size:14px;font-weight:600;letter-spacing:.5px;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.settings-tab:hover{color:var(--white);}
.settings-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.user-role-badge{display:inline-block;padding:2px 9px;border-radius:3px;font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:1px;}
.role-admin{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.role-engineer{background:rgba(26,86,219,.15);color:#60a5fa;border:1px solid rgba(26,86,219,.3);}
.role-operator{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.profile-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:28px;display:flex;gap:24px;align-items:center;margin-bottom:20px;backdrop-filter:blur(6px);}
.profile-avatar{width:72px;height:72px;background:linear-gradient(135deg,var(--blue),var(--accent));border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;font-size:30px;color:var(--navy);flex-shrink:0;}
.profile-name{font-family:var(--fh);font-size:22px;font-weight:700;}
.profile-meta{font-size:12px;color:var(--gray);margin-top:4px;font-family:var(--fm);}
.sidebar-footer{margin-top:auto;padding:14px 18px 18px;border-top:1px solid var(--border);background:rgba(0,0,0,.12);}
.sidebar-avatar{width:34px;height:34px;background:linear-gradient(135deg,var(--blue),var(--accent));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;font-size:15px;color:var(--navy);flex-shrink:0;}
.sidebar-user-name{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-user-role{font-family:var(--fm);font-size:9px;color:var(--gray);letter-spacing:1.5px;margin-top:3px;text-transform:uppercase;}
/* ── Report Cards */
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.report-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:32px 28px;backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:14px;transition:border-color .15s;}
.report-card:hover{border-color:rgba(245,158,11,.3);}
.report-card-icon{font-size:28px;line-height:1;}
.report-card-title{font-family:var(--fh);font-size:19px;font-weight:700;letter-spacing:.5px;}
.report-card-desc{font-size:13px;color:var(--gray);line-height:1.65;flex:1;}
.report-card-meta{font-family:var(--fm);font-size:11px;color:var(--accent);letter-spacing:.5px;padding:6px 10px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.15);border-radius:4px;display:inline-block;}
@media(max-width:900px){.report-grid{grid-template-columns:1fr;}}

// ─── ASSET PDF ───────────────────────────────────────────────────────────────
function printAssetPDF(a, rel) {
  const sc = {OPERATIONAL:'#065f46',BREAKDOWN:'#991b1b','UNDER MAINTENANCE':'#9a3412',NEW:'#1e40af',Inactive:'#475569',idle:'#92400e'};
  const sb = {OPERATIONAL:'#d1fae5',BREAKDOWN:'#fee2e2','UNDER MAINTENANCE':'#ffedd5',NEW:'#dbeafe',Inactive:'#f1f5f9',idle:'#fef3c7'};
  const color = sc[a.status]||'#475569', bg = sb[a.status]||'#f1f5f9';
  const fields = [['Asset Number',a.num],['Plant',a.plant],['Description',a.desc],['Equipment Code',a.code||'—'],['Model / Make',a.model||'—'],['Capacity',a.cap||'—'],['Register No.',a.reg||'—'],['Engine No.',a.eng||'—'],['Serial / Chassis',a.serial||'—'],['Location',a.loc||'—']];
  const detailRows = fields.map(([l,v])=>`<div><div style="font-size:9px;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">${l}</div><div style="font-size:12px;font-weight:600">${v}</div></div>`).join('');

// ─── CSV UTILITIES ───────────────────────────────────────────────────────────
function dlCSV(content, filename) {
  const blob = new Blob([content], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvCell(v) { return '"'+(String(v||'')).replace(/"/g,'""')+'"'; }
function parseCSVLine(line) {
  const vals=[]; let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(line[i]===','&&!inQ){vals.push(cur.trim());cur='';}
    else cur+=line[i];
  }
  vals.push(cur.trim()); return vals;
}
function exportAssetsCSV(assets) {
  const hdr=['Asset No.','Asset Category','Description','Eq. Code','Model/Make','Capacity','Register No.','Engine No.','Serial/Chassis No.','Location','Status'];
  const rows=assets.map(a=>[a.num,a.plant,a.desc,a.code,a.model,a.cap,a.reg,a.eng,a.serial,a.loc,a.status].map(csvCell).join(','));
  dlCSV([hdr.join(','),...rows].join('\n'),'assets_export.csv');
}
function exportJobOrdersCSV(jobOrders) {
  const hdr=['Job No.','Date','Asset No.','Asset Desc.','Asset Category','Location','Eq. Code','Dept','Requested By','Priority','Repair Type','Problem','Status','Target','Section','Tech 1','Tech 1 Hrs','Tech 2','Tech 2 Hrs','Work Done','Work Status','Evaluation','Downtime','Acceptance','Completion Date','Received By','Approved By'];
  const rows=jobOrders.map(j=>[j.jobNo,j.date,j.assetNum,j.assetDesc,j.assetCategory||j.plant||'',j.location,j.eqcode,j.dept,j.requester,j.priority,j.repairType,j.problem,j.status,j.target,j.section,j.tech1,j.tech1h,j.tech2,j.tech2h,j.workDone,j.workStatus,j.eval,j.downtime,j.accept,j.completionDate,j.recvName,j.approved].map(csvCell).join(','));
  dlCSV([hdr.join(','),...rows].join('\n'),'joborders_export.csv');
}
function downloadAssetTemplate() {
  const hdr='Asset No.,Asset Category,Description,Eq. Code,Model/Make,Capacity,Register No.,Engine No.,Serial/Chassis No.,Location,Status';
  const ex='"A001","01 FUEL FARM","Sample Equipment","EQ-001","Model XYZ","100 KW","","","SN-0001","FUEL FARM","OPERATIONAL"';
  dlCSV(hdr+'\n'+ex,'assets_template.csv');
}
function downloadJOTemplate() {

  dlCSV(hdr+'\n"JO-9999","2024-01-01","A001","Sample Equipment","01 FUEL FARM","FUEL FARM","EQ-001","Engineering","John Doe","High","Unplanned","Describe problem","OPEN","2024-01-07","Maintenance","","","","","","","","","Accepted","","","Admin"','joborders_template.csv');
}
function importCSVFile(file, onRows) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const lines = e.target.result.split(/\r?\n/).filter(l=>l.trim());
      if (lines.length < 2) { alert('CSV is empty or has no data rows.'); return; }
      onRows(lines.slice(1).map(parseCSVLine));
    } catch(err) { alert('Error reading CSV: '+err.message); }
  };
  reader.readAsText(file);
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('dashboard');
  const [assets, setAssets] = useState(() => JSON.parse(JSON.stringify(BASE_ASSETS)));
  const [jobOrders, setJobOrders] = useState([]);
  const [joCounter, setJoCounter] = useState(1000);
  const [syncStatus, setSyncStatus] = useState('loading'); // loading | saving | ok
  const [toasts, setToasts] = useState([]);
  const [clock, setClock] = useState('');
  const saveTimer = useRef(null);
  const isLoaded = useRef(false);

  // auth & users
  const [currentUser, setCurrentUser] = useState(null);
  const [users, setUsers] = useState(() => {
    try { const r = localStorage.getItem(USERS_KEY); if (r) return JSON.parse(r); } catch(e) {}
    return DEFAULT_USERS;
  });

  // modals
  const [assetModal, setAssetModal] = useState(null); // null | {mode:'view'|'edit'|'add', asset}
  const [joModal, setJoModal] = useState(null);       // null | {mode:'view'|'edit'|'add', jo}
  const [joViewModal, setJoViewModal] = useState(null);

  // ── Clock
  useEffect(() => {
    const tick = () => setClock(new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
    tick(); const id = setInterval(tick, 1000); return () => clearInterval(id);
  }, []);

  // ── Load from localStorage on mount
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d.assets) {
          // Normalise plant names to UPPERCASE on load (one-time migration)
          const na = d.assets.map(a=>({...a,plant:(a.plant||'').toUpperCase()}));
          setAssets(na);
          try { localStorage.setItem(STORE_KEY, JSON.stringify({...d,assets:na})); } catch(_){}
        } else setAssets([]);
        if (d.jobOrders) setJobOrders(d.jobOrders);
        if (d.joCounter) setJoCounter(d.joCounter);
      }
    } catch(e) { /* no saved data yet */ }
    isLoaded.current = true;
    setSyncStatus('ok');
  }, []);

  // ── Persist (debounced) to localStorage
  const persist = useCallback((newAssets, newJOs, newCounter) => {
    if (!isLoaded.current) return;
    clearTimeout(saveTimer.current);
    setSyncStatus('saving');
    saveTimer.current = setTimeout(() => {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          assets: newAssets, jobOrders: newJOs, joCounter: newCounter
        }));
        setSyncStatus('ok');
        addToast('✓ Saved locally');
      } catch(e) {
        setSyncStatus('ok');
        addToast('⚠ Could not save', true);
      }
    }, 800);
  }, []);

  // ── Auth & User management
  function persistUsers(next) {
    try { localStorage.setItem(USERS_KEY, JSON.stringify(next)); } catch(e) {}
  }

  function handleLogin(username, password) {
    const u = users.find(u => u.username === username && u.password === password && u.active !== false);
    if (u) { setCurrentUser(u); return true; }
    return false;
  }

  function handleLogout() {
    setCurrentUser(null);
    setPage('dashboard');
  }

  function saveUser(user, editId) {
    setUsers(prev => {
      let next;
      if (editId) {
        const existing = prev.find(u => u.id === editId);
        const updated = {...user, id: editId, password: user.password || existing.password};
        next = prev.map(u => u.id === editId ? updated : u);
        if (currentUser && currentUser.id === editId) setCurrentUser(updated);
      } else {
        const newId = Math.max(0, ...prev.map(u => u.id)) + 1;
        next = [...prev, {...user, id: newId}];
      }
      persistUsers(next);
      return next;
    });
    addToast(editId ? 'User updated.' : 'User added.');
  }

  function deleteUser(id) {
    if (currentUser && currentUser.id === id) { addToast('Cannot delete your own account.', true); return; }
    setUsers(prev => {
      const next = prev.filter(u => u.id !== id);
      persistUsers(next);
      return next;
    });
    addToast('User deleted.');
  }

  // ── Toast
  function addToast(msg, err=false) {
    const id = Date.now();
    setToasts(t => [...t, {id, msg, err}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }

  // ── Asset mutations
  function updateAssetStatus(num, status) {
    setAssets(prev => {
      const next = prev.map(a => a.num===num ? {...a, status} : a);
      persist(next, jobOrders, joCounter);
      return next;
    });
    addToast(`Asset ${num} → ${status}`);
  }

  function saveAsset(asset, editNum) {
    setAssets(prev => {
      let next;
      if (editNum) {
        next = prev.map(a => a.num===editNum ? asset : a);
        addToast(`Asset ${asset.num} updated.`);
      } else {
        if (prev.find(a => a.num===asset.num)) { addToast(`Asset ${asset.num} already exists.`, true); return prev; }
        next = [...prev, asset];
        addToast(`Asset ${asset.num} added.`);
      }
      persist(next, jobOrders, joCounter);
      return next;
    });
    setAssetModal(null);
  }

  // ── JO mutations
  function saveJO(jo, editJobNo) {
    let nextJOs, nextCounter = joCounter;
    if (editJobNo) {
      nextJOs = jobOrders.map(j => j.jobNo===editJobNo ? jo : j);
      addToast(`Job Order ${editJobNo} updated.`);
    } else {
      nextCounter = joCounter + 1;
      setJoCounter(nextCounter);
      jo = {...jo, jobNo: `JO-${nextCounter}`};
      nextJOs = [...jobOrders, jo];
      addToast(`Job Order ${jo.jobNo} saved.`);
    }
    setJobOrders(nextJOs);
    persist(assets, nextJOs, nextCounter);
    setJoModal(null);
  }

  function updateJOStatus(jobNo, status) {
    setJobOrders(prev => {
      const next = prev.map(j => j.jobNo===jobNo ? {...j, status} : j);
      persist(assets, next, joCounter);
      return next;
    });
    addToast(`${jobNo} → ${status}`);
  }

  function deleteAsset(num) {
    setAssets(prev => {
      const next = prev.filter(a => a.num !== num);
      persist(next, jobOrders, joCounter);
      return next;
    });
    addToast(`Asset ${num} deleted.`);
  }

  function deleteJO(jobNo) {
    setJobOrders(prev => {
      const next = prev.filter(j => j.jobNo !== jobNo);
      persist(assets, next, joCounter);
      return next;
    });
    addToast(`${jobNo} deleted.`);
  }

  // ── Custom Plants
  const [customPlants, setCustomPlants] = useState(() => {
    try {
      const r = localStorage.getItem(CUSTOM_PLANTS_KEY);
      if (r) {
        const stored = JSON.parse(r);
        // Migrate: merge with PLANTS so all built-ins are always present
        const merged = [...new Set([...PLANTS, ...stored])].sort();
        localStorage.setItem(CUSTOM_PLANTS_KEY, JSON.stringify(merged));
        return merged;
      }
    } catch(e) {}
    const initial = [...PLANTS].sort();
    try { localStorage.setItem(CUSTOM_PLANTS_KEY, JSON.stringify(initial)); } catch(e) {}
    return initial;
  });
  function addCustomPlant(name) {
    const upper = name.trim().toUpperCase();
    if (!upper) return;
    setCustomPlants(prev => {
      if (prev.includes(upper)) return prev;
      const next = [...prev, upper].sort();
      try { localStorage.setItem(CUSTOM_PLANTS_KEY, JSON.stringify(next)); } catch(e) {}
      return next;
    });
  }
  function renameCustomPlant(oldName, newName) {
    const upper = newName.trim().toUpperCase();
    if (!upper || upper === oldName) return;
    setCustomPlants(prev => {
      const next = prev.map(p => p===oldName ? upper : p);
      try { localStorage.setItem(CUSTOM_PLANTS_KEY, JSON.stringify(next)); } catch(e) {}
      return next;
    });
    setAssets(prev => {
      const next = prev.map(a => a.plant===oldName ? {...a, plant:upper} : a);
      persist(next, jobOrders, joCounter);
      return next;
    });
    setJobOrders(prev => prev.map(j => j.assetCategory===oldName ? {...j, assetCategory:upper} : j));
    addToast(`Renamed "${oldName}" → "${upper}"`);
  }
  function importAssetsFromCSV(file) {
    importCSVFile(file, rows => {
      const newAssets = rows.map(v=>({num:v[0]||'',plant:(v[1]||'').toUpperCase(),desc:v[2]||'',code:v[3]||'',model:v[4]||'',cap:v[5]||'',reg:v[6]||'',eng:v[7]||'',serial:v[8]||'',loc:v[9]||'',status:v[10]||'OPERATIONAL'})).filter(a=>a.num&&a.desc);
      setAssets(prev => {
        const existing = new Set(prev.map(a=>a.num));
        const toAdd = newAssets.filter(a=>!existing.has(a.num));
        const next = [...prev, ...toAdd];
        persist(next, jobOrders, joCounter);
        addToast(`Imported ${toAdd.length} assets (${newAssets.length-toAdd.length} skipped).`);
        return next;
      });
    });
  }
  function importJOsFromCSV(file) {
    importCSVFile(file, rows => {
      const newJOs = rows.map(v=>({jobNo:v[0]||'',date:v[1]||'',assetNum:v[2]||'',assetDesc:v[3]||'',assetCategory:v[4]||'',location:v[5]||'',eqcode:v[6]||'',dept:v[7]||'',requester:v[8]||'',priority:v[9]||'High',repairType:v[10]||'Planned',problem:v[11]||'',status:v[12]||'OPEN',target:v[13]||'',section:v[14]||'',tech1:v[15]||'',tech1h:v[16]||'',tech2:v[17]||'',tech2h:v[18]||'',workDone:v[19]||'',workStatus:v[20]||'',eval:v[21]||'',downtime:v[22]||'',accept:v[23]||'Accepted',completionDate:v[24]||'',recvName:v[25]||'',approved:v[26]||'',parts:[]})).filter(j=>j.jobNo&&j.assetNum);
      setJobOrders(prev => {
        const existing = new Set(prev.map(j=>j.jobNo));
        const toAdd = newJOs.filter(j=>!existing.has(j.jobNo));
        const next = [...prev, ...toAdd];
        persist(assets, next, joCounter);
        addToast(`Imported ${toAdd.length} job orders.`);
        return next;
      });
    });
  }

  const syncLabel = syncStatus==='loading' ? '⟳ Loading...' : syncStatus==='saving' ? '💾 Saving...' : '✓ Saved';
  const syncCls   = syncStatus==='loading' ? 'sync-loading' : syncStatus==='saving' ? 'sync-saving' : 'sync-ok';

  if (!currentUser) return (
    <><style>{CSS}</style><LoginPage onLogin={handleLogin} /></>

  return (
    <>

            <div className="logo-icon">CMMS</div>
            <div>

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function AssetDoughnutChart({assets}) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);
  const palette = ['#f59e0b','#3b82f6','#10b981','#f97316','#8b5cf6','#06b6d4','#facc15','#ef4444','#14b8a6','#6366f1','#ec4899','#84cc16'];

  useEffect(()=>{
    if (!canvasRef.current || typeof Chart==='undefined') return;
    const cats   = [...new Set(assets.map(a=>a.plant).filter(Boolean))].sort();
    const counts = cats.map(c=>assets.filter(a=>a.plant===c).length);
    const total  = counts.reduce((a,b)=>a+b,0);
    if (chartRef.current) chartRef.current.destroy();

    const centerPlugin = {
      id:'centerLabel',
      afterDraw(chart) {
        const {ctx,chartArea:{left,top,width,height}} = chart;
        const cx=left+width/2, cy=top+height/2;
        ctx.save();
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font=`700 ${Math.min(34,width*.16)}px 'Rajdhani',sans-serif`;
        ctx.fillStyle='#f8fafc';
        ctx.fillText(total, cx, cy-9);
        ctx.font=`600 ${Math.min(9,width*.045)}px 'Source Code Pro',monospace`;
        ctx.fillStyle='#94a3b8';
        ctx.letterSpacing='2px';
        ctx.fillText('TOTAL ASSETS', cx, cy+11);
        ctx.restore();
      }
    };

    chartRef.current = new Chart(canvasRef.current,{
      type:'doughnut',
      plugins:[centerPlugin],
      data:{
        labels: cats.map(c=>c.length>20?c.slice(0,20)+'…':c),
        datasets:[{
          data:counts,
          backgroundColor: cats.map((_,i)=>palette[i%palette.length]+'bb'),
          borderColor:      cats.map((_,i)=>palette[i%palette.length]),
          borderWidth:2,
          hoverBackgroundColor: cats.map((_,i)=>palette[i%palette.length]),
          hoverBorderWidth:3,
          hoverOffset:10,
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        animation:{animateRotate:true,animateScale:true,duration:900,easing:'easeInOutQuart'},
        plugins:{
          legend:{
            position:'right',
            labels:{
              color:'#ffffff',
              font:{size:11,family:"'Rajdhani',sans-serif"},
              padding:12, boxWidth:10, boxHeight:10,
              usePointStyle:true, pointStyle:'circle',
              generateLabels:(chart)=>chart.data.labels.map((lbl,i)=>({
                text:`${lbl}  ·  ${chart.data.datasets[0].data[i]}`,
                fillStyle:chart.data.datasets[0].hoverBackgroundColor[i],
                strokeStyle:chart.data.datasets[0].borderColor[i],
                fontColor:'#ffffff',
                lineWidth:1,hidden:false,index:i,
              }))
            }
          },
          tooltip:{
            backgroundColor:'rgba(10,22,40,.95)',
            borderColor:'rgba(245,158,11,.4)',
            borderWidth:1,
            padding:12,
            titleFont:{family:"'Rajdhani',sans-serif",size:13,weight:'bold'},
            bodyFont:{family:"'Source Code Pro',monospace",size:11},
            callbacks:{
              title:([ctx])=>ctx.label,
              label:ctx=>{
                const pct=total?Math.round(ctx.parsed/total*100):0;
                return `  ${ctx.parsed} assets  (${pct}%)`;
              }
            }
          }
        },
        cutout:'64%',
      }
    });
    return ()=>{ if(chartRef.current){chartRef.current.destroy();chartRef.current=null;} };
  },[assets]);

  const opCount = assets.filter(a=>a.status==='OPERATIONAL').length;
  const brCount = assets.filter(a=>a.status==='BREAKDOWN').length;
  const mnCount = assets.filter(a=>a.status==='UNDER MAINTENANCE').length;

  return (
    <div className="panel" style={{marginTop:20,background:'linear-gradient(135deg,rgba(15,32,68,.9),rgba(10,22,40,.95))'}}>
      <div className="panel-head" style={{borderBottom:'1px solid rgba(245,158,11,.15)'}}>
        <div className="panel-title">Asset Distribution by Category</div>
        <div style={{display:'flex',gap:18,fontSize:11,fontFamily:'var(--fm)'}}>
          <span><span style={{color:'var(--green)',fontWeight:700}}>{opCount}</span> <span style={{color:'var(--gray)'}}>OPER.</span></span>
          <span><span style={{color:'var(--red)',fontWeight:700}}>{brCount}</span> <span style={{color:'var(--gray)'}}>BREAK.</span></span>
          <span><span style={{color:'var(--orange)',fontWeight:700}}>{mnCount}</span> <span style={{color:'var(--gray)'}}>MAINT.</span></span>
          <span><span style={{color:'var(--white)',fontWeight:700}}>{assets.length}</span> <span style={{color:'var(--gray)'}}>TOTAL</span></span>
        </div>
      </div>
      <div className="panel-body">
        <div style={{height:300,position:'relative'}}>
          <canvas ref={canvasRef}/>
        </div>
      </div>
    </div>
  );
}

// ─── JOB ORDERS PAGE ─────────────────────────────────────────────────────────
function JobOrdersPage({assets, jobOrders, setJoModal, setJoViewModal, onStatusChange, onDeleteJO, onExportCSV, onImportCSV}) {
  const [q, setQ] = useState('');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [activeTab, setActiveTab] = useState('OPEN');
  const [confirmModal, setConfirmModal] = useState(null);
  const importRef = useRef(null);

  // Smart search: auto-switch to the tab that has matches
  useEffect(()=>{
    if (!q.trim()) return;
    const qLow = q.toLowerCase().trim();
    const allMatches = jobOrders.filter(j=>[j.jobNo,j.assetNum,j.assetDesc,j.dept,j.problem].join(' ').toLowerCase().includes(qLow));
    if (!allMatches.length) return;
    setActiveTab(prev => {
      if (allMatches.some(j=>j.status===prev)) return prev;
      const best = ['OPEN','IN PROGRESS','CLOSED'].find(s=>allMatches.some(j=>j.status===s));
      return best||prev;
    });
  },[q, jobOrders]);

  const filtered = jobOrders.filter(j=>{
    const hay=[j.jobNo,j.assetNum,j.assetDesc,j.dept,j.problem].join(' ').toLowerCase();
    return (!q||hay.includes(q.toLowerCase()))&&(!dateFrom||j.date>=dateFrom)&&(!dateTo||j.date<=dateTo);
  }).reverse();

  const counts = {
    OPEN: jobOrders.filter(j=>j.status==='OPEN').length,
    'IN PROGRESS': jobOrders.filter(j=>j.status==='IN PROGRESS').length,
    CLOSED: jobOrders.filter(j=>j.status==='CLOSED').length,
  };
  const tabJOs = filtered.filter(j=>j.status===activeTab);
  const isClosed = activeTab==='CLOSED';

  const TABS = [
    {id:'OPEN',        label:'Open',        color:'#f59e0b', bg:'rgba(245,158,11,.14)'},
    {id:'IN PROGRESS', label:'In Progress', color:'#60a5fa', bg:'rgba(96,165,250,.14)'},
    {id:'CLOSED',      label:'Closed',      color:'#10b981', bg:'rgba(16,185,129,.14)'},
  ];

  function requestAdvance(jo) {
    if (jo.status==='OPEN') setConfirmModal({jo,nextStatus:'IN PROGRESS'});
    else if (jo.status==='IN PROGRESS') setConfirmModal({jo,nextStatus:'CLOSED'});
  }
  function doAdvance() {
    if (!confirmModal) return;
    onStatusChange(confirmModal.jo.jobNo,confirmModal.nextStatus);
    setConfirmModal(null);
  }

  return (
    <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 58px)'}}>
      {/* Header row */}
      <div className="page-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12,flexShrink:0}}>
        <div>
          <div className="page-title">JOB <span>ORDERS</span></div>
          <div className="page-sub">MAINTENANCE JOB CARD REQUEST LOG</div>
        </div>
        <div className="controls">
          <button className="btn btn-accent" onClick={()=>setJoModal({mode:'add'})}>＋ Raise Job Order</button>
          <button className="btn btn-csv btn-sm" onClick={onExportCSV}>↓ Export</button>
          <label className="btn btn-csv btn-sm" style={{cursor:'pointer'}}>↑ Import
            <input type="file" accept=".csv" style={{display:'none'}} ref={importRef} onChange={e=>{if(e.target.files[0]){onImportCSV(e.target.files[0]);e.target.value='';}}}/>
          </label>
          <button className="btn btn-csv btn-sm" onClick={downloadJOTemplate}>⬇ Template</button>
        </div>
      </div>

      {/* Compact stat row */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16,flexShrink:0}}>
        {[['Total',jobOrders.length,'#1a56db','sc-blue'],['Open',counts['OPEN'],'#f59e0b','sc-yellow'],['In Progress',counts['IN PROGRESS'],'#60a5fa','sc-orange'],['Closed',counts['CLOSED'],'#10b981','sc-green']].map(([lbl,num,c,cls])=>(
          <div key={lbl} className={`stat-card ${cls}`} style={{padding:'8px 14px'}}>
            <div style={{fontFamily:'var(--fh)',fontSize:24,fontWeight:700,color:c,lineHeight:1}}>{num}</div>
            <div style={{fontSize:10,color:'var(--gray)',fontFamily:'var(--fm)',letterSpacing:1,marginTop:3,textTransform:'uppercase'}}>{lbl}</div>
          </div>
        ))}
      </div>

      {/* Tab bar + inline search */}
      <div style={{display:'flex',alignItems:'stretch',borderBottom:'2px solid var(--border)',flexShrink:0,background:'var(--navy2)',borderRadius:'8px 8px 0 0',overflow:'hidden'}}>
        <div style={{display:'flex',flex:1}}>
          {TABS.map(t=>{
            const active = activeTab===t.id;
            return (
              <button key={t.id} onClick={()=>setActiveTab(t.id)} style={{
                padding:'11px 20px',
                background: active ? t.bg : 'transparent',
                border:'none', borderBottom: active?`2px solid ${t.color}`:'2px solid transparent',
                color: active ? t.color : 'rgba(148,163,184,.7)',
                cursor:'pointer', fontFamily:'var(--fh)', fontSize:14, fontWeight:700,
                letterSpacing:.5, marginBottom:-2, display:'flex', alignItems:'center', gap:8,
                transition:'all .15s',
                outline: active ? `1px solid ${t.color}22` : 'none',
              }}>
                <span style={{
                  display:'inline-block',width:8,height:8,borderRadius:'50%',
                  background: active?t.color:t.color+'44',flexShrink:0,
                  boxShadow: active?`0 0 6px ${t.color}`:'none',
                }}/>
                {t.label}
                <span style={{
                  fontFamily:'var(--fm)',fontSize:11,
                  background: active?t.color+'22':'rgba(255,255,255,.07)',
                  padding:'1px 8px',borderRadius:10,color:active?t.color:'rgba(148,163,184,.6)',
                  border:`1px solid ${active?t.color+'44':'transparent'}`,
                }}>{counts[t.id]}</span>
              </button>
            );
          })}
        </div>
        {/* Search + date on right side of tab bar */}
        <div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderLeft:'1px solid var(--border)'}}>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Search job orders..." style={{fontSize:12,padding:'5px 10px',minWidth:180,background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.12)',color:'var(--white)',borderRadius:5,outline:'none'}}/>
          <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} title="From date" style={{fontSize:12,padding:'5px 8px',width:130}}/>
          <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} title="To date" style={{fontSize:12,padding:'5px 8px',width:130}}/>
          {(dateFrom||dateTo)&&<button className="btn btn-ghost btn-sm" onClick={()=>{setDateFrom('');setDateTo('');}}>✕</button>}
        </div>
      </div>

      {/* Scrollable table fills remaining page height */}
      <div className="panel" style={{borderTopLeftRadius:0,borderTopRightRadius:0,borderTop:'none',flex:1,overflow:'hidden',display:'flex',flexDirection:'column',marginBottom:0}}>
        <div className="tbl-wrap" style={{flex:1,overflowY:'auto'}}>
          <table>
            <thead><tr>
              <th>Job No.</th><th>Date</th><th>Asset</th><th>Asset Category</th><th>Problem</th>
              <th>Priority</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody>
              {tabJOs.length===0&&<tr><td colSpan={8}><div className="empty-state" style={{padding:48}}>No {activeTab.toLowerCase()} job orders{q?' matching search':''}</div></td></tr>}
              {tabJOs.map(jo=>(
                <tr key={jo.jobNo}>
                  <td style={{fontFamily:'var(--fm)',fontSize:12,color:'var(--accent)'}}>{jo.jobNo}</td>
                  <td style={{fontSize:12}}>{jo.date}</td>
                  <td><strong>{jo.assetNum}</strong><div style={{fontSize:11,color:'var(--gray)'}}>{jo.assetDesc||''}</div></td>
                  <td style={{fontSize:11,color:'var(--gray)'}}>{(jo.assetCategory||jo.plant||'').toUpperCase()||'—'}</td>
                  <td style={{fontSize:12,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{jo.problem||'—'}</td>
                  <td><span className={jo.priority==='High'?'prio-high':'prio-low'}>{jo.priority}</span></td>
                  <td>
                    {isClosed
                      ? <span className="sb-base jcl">CLOSED ✓</span>
                      : <button className={`sb-base ${joStatusCls(jo.status)}`}
                          style={{cursor:'pointer',border:'none',background:'inherit'}}
                          title={jo.status==='OPEN'?'Move to In Progress':'Mark as Closed'}
                          onClick={()=>requestAdvance(jo)}>
                          {jo.status} ›
                        </button>
                    }
                  </td>
                  <td>
                    <div style={{display:'flex',gap:4}}>
                      <button className="btn btn-ghost btn-sm btn-icon" title="View" onClick={()=>setJoViewModal(jo)}>👁</button>
                      {!isClosed&&<button className="btn btn-warning btn-sm btn-icon" title="Edit" onClick={()=>setJoModal({mode:'edit',jo})}>✏</button>}
                      <button className="btn btn-primary btn-sm btn-icon" title="Download PDF" onClick={()=>printJOPDF(jo)}>↓</button>
                      {!isClosed&&<button className="btn btn-danger btn-sm btn-icon" title="Delete" onClick={()=>{ if(window.confirm(`Delete ${jo.jobNo}? This cannot be undone.`)) onDeleteJO(jo.jobNo); }}>🗑</button>}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Confirm modal */}
      {confirmModal&&(
        <div className="modal-overlay" onClick={()=>setConfirmModal(null)}>
          <div className="modal" style={{width:440}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">Confirm Status Change</div>
              <button className="modal-close" onClick={()=>setConfirmModal(null)}>×</button>
            </div>
            <div className="modal-body">
              <div style={{marginBottom:16}}>
                <div style={{fontSize:13,marginBottom:10}}>
                  Move <span style={{fontFamily:'var(--fm)',color:'var(--accent)'}}>{confirmModal.jo.jobNo}</span> from{' '}
                  <span className={`sb-base ${joStatusCls(confirmModal.jo.status)}`}>{confirmModal.jo.status}</span>
                  {' → '}
                  <span className={`sb-base ${joStatusCls(confirmModal.nextStatus)}`}>{confirmModal.nextStatus}</span>
                </div>
                {confirmModal.nextStatus==='CLOSED'&&(
                  <div style={{background:'rgba(245,158,11,.1)',border:'1px solid rgba(245,158,11,.3)',borderRadius:6,padding:'8px 12px',fontSize:12,color:'var(--accent)',fontFamily:'var(--fm)'}}>
                    ⚠ Once closed, this job order cannot be reopened or edited.
                  </div>
                )}
              </div>
              <div style={{fontSize:12,color:'var(--gray)',marginBottom:20}}>
                Asset: <strong style={{color:'var(--white)'}}>{confirmModal.jo.assetNum} — {confirmModal.jo.assetDesc||'—'}</strong>
              </div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                <button className="btn btn-ghost" onClick={()=>setConfirmModal(null)}>Cancel</button>
                <button className={`btn ${confirmModal.nextStatus==='CLOSED'?'btn-success':'btn-primary'}`} onClick={doAdvance}>
                  {confirmModal.nextStatus==='CLOSED'?'✓ Close Job Order':'→ Move to In Progress'}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── PDF GENERATOR ────────────────────────────────────────────────────────────
function openPrintWindow(title, bodyHtml) {
  const win = window.open('', '_blank');
  if (!win) { alert('Please allow pop-ups for PDF generation.'); return; }
  const now = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  win.document.write(`<!DOCTYPE html><html><head><title>${title}</title><style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,sans-serif;font-size:11px;color:#111;padding:24px 28px;}
    .hdr{display:flex;align-items:center;gap:14px;border-bottom:2px solid #f59e0b;padding-bottom:12px;margin-bottom:16px;}
    .hdr-icon{width:40px;height:32px;background:linear-gradient(135deg,#f59e0b,#1a56db);border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#0a1628;letter-spacing:.5px;}
    .hdr-title{font-size:18px;font-weight:700;letter-spacing:.5px;}
    .hdr-sub{font-size:9px;color:#f59e0b;letter-spacing:1.5px;margin-top:2px;}
    .meta{font-size:10px;color:#64748b;margin-bottom:14px;display:flex;gap:20px;}
    table{width:100%;border-collapse:collapse;margin-top:4px;}
    th{padding:7px 8px;text-align:left;background:#0a1628;color:#f59e0b;font-size:9px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
    td{padding:6px 8px;border-bottom:1px solid #e2e8f0;font-size:10px;vertical-align:middle;}
    tr:nth-child(even) td{background:#f8fafc;}
    .b{font-weight:700;}
    .badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.5px;}
    .op{background:#d1fae5;color:#065f46;}.br{background:#fee2e2;color:#991b1b;}
    .mn{background:#ffedd5;color:#9a3412;}.ot{background:#f1f5f9;color:#475569;}
    .jop{background:#fef3c7;color:#92400e;}.jip{background:#dbeafe;color:#1e40af;}.jcl{background:#d1fae5;color:#065f46;}
    .hi{color:#dc2626;font-weight:700;}.lo{color:#059669;}
    .footer{margin-top:20px;font-size:9px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:10px;display:flex;justify-content:space-between;}
    @media print{body{padding:12px 16px;}}
  </style></head><body>
    <div class="hdr"><div class="hdr-icon">CMM</div><div><div class="hdr-title">${title}</div><div class="hdr-sub">VHPL TIC — ENGINEERING SOLUTIONS DEPT</div></div></div>
    <div class="meta"><span>Generated: ${now}</span></div>
    ${bodyHtml}
    <div class="footer"><span>VHPL TIC · CMMS</span><span>${title} · ${now}</span></div>
  </body></html>`);
  win.document.close();
  setTimeout(() => win.print(), 400);
}

// ─── REPORTS PAGE ─────────────────────────────────────────────────────────────
function ReportsPage({assets, jobOrders}) {
  function dlAssetMasterList() {
    const rows = assets.map(a => {
      const sc = a.status==='OPERATIONAL'?'op':a.status==='BREAKDOWN'?'br':a.status==='UNDER MAINTENANCE'?'mn':'ot';
      return `<tr><td class="b" style="color:#f59e0b;font-family:monospace">${a.num}</td><td style="font-size:9px">${a.plant}</td><td class="b">${a.desc}</td><td style="font-family:monospace;font-size:9px">${a.code||'—'}</td><td>${a.model||'—'}</td><td>${a.cap||'—'}</td><td>${a.loc||'—'}</td><td style="font-family:monospace;font-size:9px">${a.serial||'—'}</td><td><span class="badge ${sc}">${a.status||'—'}</span></td></tr>`;
    }).join('');
    openPrintWindow('Asset Master List', `
      <div class="meta" style="margin-bottom:10px"><span>Total Assets: <b>${assets.length}</b></span><span>Plants: <b>${[...new Set(assets.map(a=>a.plant))].length}</b></span><span>Operational: <b>${assets.filter(a=>a.status==='OPERATIONAL').length}</b></span></div>
      <table><thead><tr><th>Asset No.</th><th>Plant</th><th>Description</th><th>Eq. Code</th><th>Model</th><th>Capacity</th><th>Location</th><th>Serial No.</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody></table>`);
  }

  function dlAllJobOrders() {
    const rows = [...jobOrders].reverse().map(j => {
      const sc = j.status==='OPEN'?'jop':j.status==='IN PROGRESS'?'jip':'jcl';
      return `<tr><td class="b" style="color:#f59e0b;font-family:monospace">${j.jobNo}</td><td>${j.date}</td><td style="font-family:monospace;font-size:9px">${j.assetNum}</td><td>${j.assetDesc||'—'}</td><td>${j.dept||'—'}</td><td style="max-width:160px">${(j.problem||'—').substring(0,70)}</td><td><span class="${j.priority==='High'?'hi':'lo'}">${j.priority||'—'}</span></td><td><span class="badge ${sc}">${j.status}</span></td><td>${j.completionDate||'—'}</td></tr>`;
    }).join('');
    openPrintWindow('All Job Orders', `
      <div class="meta" style="margin-bottom:10px"><span>Total: <b>${jobOrders.length}</b></span><span>Open: <b>${jobOrders.filter(j=>j.status==='OPEN').length}</b></span><span>In Progress: <b>${jobOrders.filter(j=>j.status==='IN PROGRESS').length}</b></span><span>Closed: <b>${jobOrders.filter(j=>j.status==='CLOSED').length}</b></span></div>
      <table><thead><tr><th>Job No.</th><th>Date</th><th>Asset No.</th><th>Asset</th><th>Dept</th><th>Problem</th><th>Priority</th><th>Status</th><th>Completed</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:20px">No job orders recorded.</td></tr>'}</tbody></table>`);
  }

  function dlBreakdownReport() {
    const broken = assets.filter(a=>['BREAKDOWN','UNDER MAINTENANCE','Inactive','idle'].includes(a.status));
    const rows = broken.map(a => {
      const sc = a.status==='BREAKDOWN'?'br':'mn';
      return `<tr><td class="b" style="color:#f59e0b;font-family:monospace">${a.num}</td><td style="font-size:9px">${a.plant}</td><td class="b">${a.desc}</td><td>${a.loc||'—'}</td><td style="font-family:monospace;font-size:9px">${a.serial||'—'}</td><td><span class="badge ${sc}">${a.status}</span></td></tr>`;
    }).join('');
    openPrintWindow('Breakdown / Maintenance Report', `
      <div class="meta" style="margin-bottom:10px"><span>Non-Operational Assets: <b>${broken.length}</b></span><span>Breakdown: <b>${assets.filter(a=>a.status==='BREAKDOWN').length}</b></span><span>Under Maintenance: <b>${assets.filter(a=>a.status==='UNDER MAINTENANCE').length}</b></span></div>
      <table><thead><tr><th>Asset No.</th><th>Plant</th><th>Description</th><th>Location</th><th>Serial No.</th><th>Status</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px">All assets are operational.</td></tr>'}</tbody></table>`);
  }

  function dlOpenJobOrders() {
    const open = jobOrders.filter(j=>j.status!=='CLOSED');
    const rows = open.map(j => {
      const sc = j.status==='OPEN'?'jop':'jip';
      return `<tr><td class="b" style="color:#f59e0b;font-family:monospace">${j.jobNo}</td><td>${j.date}</td><td style="font-family:monospace;font-size:9px">${j.assetNum}</td><td>${j.assetDesc||'—'}</td><td>${j.dept||'—'}</td><td><span class="${j.priority==='High'?'hi':'lo'}">${j.priority||'—'}</span></td><td>${j.target||'—'}</td><td><span class="badge ${sc}">${j.status}</span></td></tr>`;
    }).join('');
    openPrintWindow('Open Job Orders', `
      <div class="meta" style="margin-bottom:10px"><span>Pending: <b>${open.length}</b></span><span>Open: <b>${jobOrders.filter(j=>j.status==='OPEN').length}</b></span><span>In Progress: <b>${jobOrders.filter(j=>j.status==='IN PROGRESS').length}</b></span></div>
      <table><thead><tr><th>Job No.</th><th>Date</th><th>Asset No.</th><th>Asset</th><th>Dept</th><th>Priority</th><th>Target</th><th>Status</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:20px">No open job orders.</td></tr>'}</tbody></table>`);
  }

  const brokenCount = assets.filter(a=>['BREAKDOWN','UNDER MAINTENANCE','Inactive','idle'].includes(a.status)).length;
  const openCount   = jobOrders.filter(j=>j.status!=='CLOSED').length;
  const plantCount  = [...new Set(assets.map(a=>a.plant))].length;

  return (
    <div>
      <div className="page-header">
        <div className="page-title">REPORTS <span>& EXPORTS</span></div>
        <div className="page-sub">GENERATE AND DOWNLOAD MAINTENANCE REPORTS AS PDF</div>
      </div>
      <div className="report-grid">
        <div className="report-card">
          <div className="report-card-icon">📋</div>
          <div className="report-card-title">Asset Master List</div>
          <div className="report-card-desc">Full asset registry with all equipment, status, capacity, serial numbers, and location details across all plants.</div>
          <div className="report-card-meta">{assets.length} assets · {plantCount} plants</div>
          <button className="btn btn-accent" onClick={dlAssetMasterList}>↓ Download PDF</button>
        </div>
        <div className="report-card">
          <div className="report-card-icon">🗂️</div>
          <div className="report-card-title">All Job Orders</div>
          <div className="report-card-desc">Complete log of all raised job orders including problem details, technician records, parts used, and completion status.</div>
          <div className="report-card-meta">{jobOrders.length} total job orders</div>
          <button className="btn btn-accent" onClick={dlAllJobOrders}>↓ Download PDF</button>
        </div>
        <div className="report-card">
          <div className="report-card-icon">⚠️</div>
          <div className="report-card-title">Breakdown / Maintenance Report</div>
          <div className="report-card-desc">Assets currently in BREAKDOWN, UNDER MAINTENANCE, or INACTIVE status requiring attention or ongoing repair.</div>
          <div className="report-card-meta">{brokenCount} asset{brokenCount!==1?'s':''} affected</div>
          <button className="btn btn-danger" onClick={dlBreakdownReport}>↓ Download PDF</button>
        </div>
        <div className="report-card">
          <div className="report-card-icon">🔧</div>
          <div className="report-card-title">Open Job Orders</div>
          <div className="report-card-desc">All open and in-progress job orders pending completion, including priority levels and target dates.</div>
          <div className="report-card-meta">{openCount} pending</div>
          <button className="btn btn-primary" onClick={dlOpenJobOrders}>↓ Download PDF</button>
        </div>
      </div>
    </div>
  );
}

// ─── SETTINGS PAGE ────────────────────────────────────────────────────────────

              <div className="profile-meta">{currentUser.email||'No email set'}</div>
              <div style={{marginTop:10}}>{roleBadge(currentUser.role)}</div>
            </div>

          <div className="panel">

// ─── CATEGORY PANEL ROW (module-level to avoid remount) ──────────────────────
function CategoryPanelRow({name, onRename}) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(name);
  function save() {
    const upper = draft.trim().toUpperCase();
    if (upper && upper !== name) onRename(name, upper);
    setEditing(false);
  }
  return (
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:7,padding:'9px 12px',background:'rgba(255,255,255,.03)',borderRadius:6,border:'1px solid var(--border)'}}>
      {editing
        ? <>
            <input value={draft} onChange={e=>setDraft(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter')save();if(e.key==='Escape'){setEditing(false);setDraft(name);}}}
              style={{flex:1,fontSize:13}} autoFocus/>
            <button className="btn btn-success btn-sm" onClick={save}>Save</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>{setEditing(false);setDraft(name);}}>✕</button>
          </>
        : <>
            <span style={{flex:1,fontFamily:'var(--fh)',fontSize:13,fontWeight:600}}>{name}</span>
            <button className="btn btn-warning btn-sm btn-icon" title="Rename" onClick={()=>{setEditing(true);setDraft(name);}}>✏</button>
          </>
      }
    </div>
  );
}

// ─── ASSET FORM MODAL ─────────────────────────────────────────────────────────
function AssetFormModal({mode, asset, assets, onClose, onSave, customPlants=[], onAddPlant, onRenameCategory}) {
  const [f, setF] = useState(asset ? {...asset} : {num:'',plant:'',desc:'',code:'',model:'',cap:'',reg:'',eng:'',serial:'',loc:'',status:'OPERATIONAL'});
  const [showNew, setShowNew] = useState(false);
  const [newName, setNewName] = useState('');
  const [showCatPanel, setShowCatPanel] = useState(false);
  // customPlants now contains ALL categories (built-in + custom), de-duped
  const allPlants = [...new Set(customPlants)].sort();

  function handleSave() {
    if (!f.num.trim()) { alert('Asset number required'); return; }
    if (!f.desc.trim()) { alert('Description required'); return; }
    if (!f.plant) { alert('Asset category required'); return; }
    onSave(f, mode==='edit' ? asset.num : null);
  }

  function saveNewPlant() {
    const name = newName.trim().toUpperCase();
    if (!name) return;
    onAddPlant && onAddPlant(name);
    setF({...f, plant:name});
    setShowNew(false); setNewName('');
  }

  const fld = (label, key, opts={}) => (
    <div className="form-group">
      <label>{label}</label>
      <input type={opts.type||'text'} value={f[key]||''} onChange={e=>setF({...f,[key]:e.target.value})} placeholder={opts.placeholder||''} readOnly={opts.readonly}/>
    </div>
  );

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-head">
          <div className="modal-title">{mode==='add'?'Add New Asset':`Edit Asset — ${asset?.num}`}</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <button className="btn btn-warning btn-sm" onClick={()=>setShowCatPanel(true)}>⚙ Edit Categories</button>
            <button className="modal-close" onClick={onClose}>×</button>
          </div>
        </div>
        <div className="modal-body">
          {mode==='edit'&&<div className="edit-mode-banner">✏ Editing existing asset — changes will be saved to the registry</div>}
          <div className="form-row">{fld('Asset Number','num')}{fld('Description','desc')}</div>
          <div className="form-row">
            <div className="form-group">
              <label>Asset Category</label>
              <select value={showNew?'__new__':f.plant} onChange={e=>{
                if(e.target.value==='__new__'){setShowNew(true);}
                else{setShowNew(false);setF({...f,plant:e.target.value});}
              }}>
                <option value="">— Select Category —</option>
                {allPlants.map(p=><option key={p} value={p}>{p.toUpperCase()}</option>)}
                <option value="__new__">New...</option>
              </select>
            </div>
            {showNew
              ? <div className="form-group">
                  <label>New Category Name</label>
                  <div style={{display:'flex',gap:8}}>
                    <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Category name" onKeyDown={e=>e.key==='Enter'&&saveNewPlant()} style={{flex:1}}/>
                    <button className="btn btn-success btn-sm" onClick={saveNewPlant}>Save</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>{setShowNew(false);setNewName('');}}>✕</button>
                  </div>
                </div>
              : fld('Equipment Code','code')
            }
          </div>
          <div className="form-row">{fld('Model / Make','model')}{fld('Capacity','cap')}</div>
          <div className="form-row">{fld('Register Number','reg')}{fld('Engine Number','eng')}</div>
          <div className="form-row">{fld('Serial / Chassis No.','serial')}{fld('Location','loc')}</div>
          <div className="form-row">
            <div className="form-group">
              <label>Status</label>
              <select value={f.status||'OPERATIONAL'} onChange={e=>setF({...f,status:e.target.value})}>
                {['OPERATIONAL','BREAKDOWN','UNDER MAINTENANCE','NEW','Inactive','idle'].map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:8}}>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-success" onClick={handleSave}>💾 {mode==='add'?'Save Asset':'Update Asset'}</button>
          </div>
        </div>
      </div>

      {/* Slide-in categories panel */}
      {showCatPanel&&(
        <>
          <div style={{position:'fixed',inset:0,zIndex:250,background:'rgba(0,0,0,.35)'}} onClick={()=>setShowCatPanel(false)}/>
          <div style={{position:'fixed',right:0,top:0,bottom:0,width:340,background:'var(--navy2)',borderLeft:'2px solid rgba(245,158,11,.25)',zIndex:260,display:'flex',flexDirection:'column',boxShadow:'-20px 0 60px rgba(0,0,0,.6)'}}>
            <div style={{padding:'18px 22px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',background:'rgba(245,158,11,.06)'}}>
              <div>
                <div style={{fontFamily:'var(--fh)',fontSize:18,fontWeight:700}}>Edit Categories</div>
                <div style={{fontSize:10,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,marginTop:2}}>CLICK ✏ TO RENAME · UPDATES ALL ASSETS</div>
              </div>
              <button className="modal-close" onClick={()=>setShowCatPanel(false)}>×</button>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'14px 16px'}}>
              {allPlants.map(p=>(
                <CategoryPanelRow key={p} name={p} onRename={(oldN,newN)=>{onRenameCategory&&onRenameCategory(oldN,newN);}}/>
              ))}
            </div>
            <div style={{padding:'12px 16px',borderTop:'1px solid var(--border)',fontSize:11,fontFamily:'var(--fm)',color:'var(--gray)'}}>
              {allPlants.length} categories total
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// ─── JO FORM MODAL ────────────────────────────────────────────────────────────
function JOFormModal({mode, jo, preAsset, assets, joCounter, onClose, onSave}) {
  const today = new Date().toISOString().split('T')[0];
  const [f, setF] = useState(jo ? {...jo} : {
    date:today, requester:'', dept:'', assetNum:preAsset||'', assetDesc:'', assetCategory:'', location:'',
    eqcode:'', problem:'', priority:'High', repairType:'Planned',
    recvName:'', section:'', target:'', approved:'Priyantha Athapaththu',
    tech1:'', tech1h:'', tech2:'', tech2h:'', parts:[{desc:'',qty:'',unit:'',srp:''}],
    workDone:'', workStatus:'', eval:'', downtime:'', accept:'Accepted', status:'OPEN', completionDate:'',
  });

  function populateAsset(num) {
    const a = assets.find(x=>x.num===num);
    if (a) setF(prev=>({...prev,assetNum:num,assetDesc:a.desc,assetCategory:(a.plant||'').toUpperCase(),location:a.loc||a.plant,eqcode:a.code||''}));
    else setF(prev=>({...prev,assetNum:num,assetCategory:''}));
  }

  function setParts(idx, key, val) {
    setF(prev=>{
      const parts = [...(prev.parts||[])];
      parts[idx] = {...parts[idx],[key]:val};
      return {...prev,parts};
    });
  }
  function addPart() { setF(prev=>({...prev,parts:[...(prev.parts||[]),{desc:'',qty:'',unit:'',srp:''}]})); }
  function removePart(idx) { setF(prev=>({...prev,parts:(prev.parts||[]).filter((_,i)=>i!==idx)})); }

  function handleSave() {
    if (!f.assetNum) { alert('Please select an asset'); return; }
    if (!f.date) { alert('Please enter a date'); return; }
    onSave(f, mode==='edit' ? jo.jobNo : null);
  }

  const fld = (label, key, opts={}) => (
    <div className="form-group">
      <label>{label}</label>
      {opts.textarea
        ? <textarea value={f[key]||''} onChange={e=>setF({...f,[key]:e.target.value})} placeholder={opts.placeholder||''}/>
        : opts.select
          ? <select value={f[key]||''} onChange={e=>setF({...f,[key]:e.target.value})}>{opts.options.map(o=><option key={o}>{o}</option>)}</select>
          : <input type={opts.type||'text'} value={f[key]||''} onChange={e=>setF({...f,[key]:e.target.value})} placeholder={opts.placeholder||''} readOnly={opts.readonly}/>
      }
    </div>
  );

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{width:860}}>
        <div className="modal-head">
          <div className="modal-title">{mode==='add'?'Raise Job Order':`Edit Job Order — ${jo?.jobNo}`}</div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {mode==='edit'&&<div className="edit-mode-banner">✏ Editing existing job order</div>}
          <div style={{fontFamily:'var(--fm)',fontSize:11,color:'var(--accent)',marginBottom:12}}>JOB NO: {mode==='edit'?jo.jobNo:`JO-${joCounter+1} (auto)`}</div>

          <div className="jc-section">
            <div className="jc-section-title">Request Information</div>
            <div className="form-row">
              <div className="form-group"><label>Date</label><input type="date" value={f.date} onChange={e=>setF({...f,date:e.target.value})}/></div>
              {fld('Requested By','requester')}
            </div>
            <div className="form-row">{fld('Department','dept')}</div>
          </div>

          <div className="jc-section">
            <div className="jc-section-title">Equipment Details</div>
            <div className="form-row">
              <div className="form-group">
                <label>Asset Number</label>
                <select value={f.assetNum||''} onChange={e=>populateAsset(e.target.value)}>
                  <option value="">— Select Asset —</option>
                  {assets.map(a=><option key={a.num} value={a.num}>{a.num} — {a.desc}</option>)}
                </select>
              </div>
              {fld('Asset Description','assetDesc',{readonly:true})}
            </div>
            <div className="form-row">{fld('Asset Category','assetCategory',{readonly:true})}{fld('Location','location',{readonly:true})}{fld('Equipment Code','eqcode',{readonly:true})}</div>
          </div>

          <div className="jc-section">
            <div className="jc-section-title">Problem Details</div>
            <div className="form-row single">{fld('Details of the Problem','problem',{textarea:true,placeholder:'Describe the problem...'})}</div>
            <div style={{display:'flex',gap:30,flexWrap:'wrap',marginTop:4}}>
              <div>
                <label style={{fontSize:11,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,textTransform:'uppercase',display:'block',marginBottom:8}}>Priority</label>
                <div className="checkbox-row">
                  {['High','Low'].map(p=><label key={p} className="checkbox-item"><input type="radio" name="prio" checked={f.priority===p} onChange={()=>setF({...f,priority:p})}/><span style={p==='High'?{color:'var(--red)',fontWeight:600}:{color:'var(--green)'}}>{p==='High'?'⚡ HIGH':'LOW'}</span></label>)}
                </div>
              </div>
              <div>
                <label style={{fontSize:11,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,textTransform:'uppercase',display:'block',marginBottom:8}}>Type of Repair</label>
                <div className="checkbox-row">
                  {['Planned','Unplanned'].map(t=><label key={t} className="checkbox-item"><input type="radio" name="rtype" checked={f.repairType===t} onChange={()=>setF({...f,repairType:t})}/>{t}</label>)}
                </div>
              </div>
            </div>
          </div>

          <div className="jc-section">
            <div className="jc-section-title">Authorisation</div>
            <div className="form-row">{fld('Received By','recvName')}{fld('Section Assigned','section')}</div>
            <div className="form-row">
              <div className="form-group"><label>Target Completion</label><input type="date" value={f.target||''} onChange={e=>setF({...f,target:e.target.value})}/></div>
              {fld('Approved By','approved',{readonly:true})}
            </div>
          </div>

          <div className="jc-section">
            <div className="jc-section-title">Manpower Utilisation</div>
            <div className="form-row">{fld('Technician 1','tech1')}{fld('Hours Attended','tech1h',{type:'number'})}</div>
            <div className="form-row">{fld('Technician 2','tech2')}{fld('Hours Attended','tech2h',{type:'number'})}</div>
          </div>

          <div className="jc-section">
            <div className="jc-section-title">Material / Spare Parts</div>
            <table className="parts-table">
              <thead><tr><th style={{width:'48%'}}>Description</th><th style={{width:'12%'}}>Qty</th><th style={{width:'14%'}}>Unit</th><th style={{width:'18%'}}>SRP</th><th style={{width:'8%'}}></th></tr></thead>
              <tbody>
                {(f.parts||[]).map((p,i)=>(
                  <tr key={i}>
                    <td><input value={p.desc||''} onChange={e=>setParts(i,'desc',e.target.value)} placeholder="Description"/></td>
                    <td><input type="number" value={p.qty||''} onChange={e=>setParts(i,'qty',e.target.value)} placeholder="0"/></td>
                    <td><input value={p.unit||''} onChange={e=>setParts(i,'unit',e.target.value)} placeholder="pcs"/></td>
                    <td><input value={p.srp||''} onChange={e=>setParts(i,'srp',e.target.value)} placeholder="0.00"/></td>
                    <td><button className="btn btn-danger btn-sm" onClick={()=>removePart(i)}>✕</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
            <button className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={addPart}>＋ Add Row</button>
          </div>

          <div className="jc-section">
            <div className="jc-section-title">Service Report</div>
            <div className="form-row single">{fld('Details of Work Done','workDone',{textarea:true,placeholder:'Describe work carried out...'})}</div>

                <label style={{fontSize:11,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,textTransform:'uppercase',display:'block',marginBottom:8}}>Work Status</label>
                <div className="checkbox-row">
                  {['Work Completed Successful','Temporary Repaired'].map(s=><label key={s} className="checkbox-item"><input type="radio" name="ws" checked={f.workStatus===s} onChange={()=>setF({...f,workStatus:s})}/>{s==='Work Completed Successful'?'Completed ✓':'Temporary Repaired'}</label>)}

              <div>
                <label style={{fontSize:11,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,textTransform:'uppercase',display:'block',marginBottom:8}}>Evaluation</label>
                <div className="checkbox-row">
                  {['Very Good','Good','Satisfied','Not Satisfied'].map(e=><label key={e} className="checkbox-item"><input type="radio" name="ev" checked={f.eval===e} onChange={()=>setF({...f,eval:e})}/>{e}</label>)}
                </div>
              </div>
            </div>
            <div className="form-row" style={{marginTop:14}}>
              {fld('Downtime (hours)','downtime',{type:'number'})}
              <div className="form-group">
                <label>Acceptance</label>
                <select value={f.accept||'Accepted'} onChange={e=>setF({...f,accept:e.target.value})}>
                  <option value="Accepted">Accepted the repair</option>
                  <option value="Rejected">Rejected the repair</option>
                </select>
              </div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Job Order Status</label>
                <select value={f.status||'OPEN'} onChange={e=>setF({...f,status:e.target.value})}>
                  <option>OPEN</option><option>IN PROGRESS</option><option>CLOSED</option>
                </select>
              </div>
              <div className="form-group"><label>✅ Completion Date</label><input type="date" value={f.completionDate||''} onChange={e=>setF({...f,completionDate:e.target.value})}/></div>
            </div>
          </div>

          <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:6}}>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={()=>{
              if(!f.assetNum){alert('Please select an asset');return;}
              if(!f.date){alert('Please enter a date');return;}
              const previewJO={...f,jobNo:mode==='edit'?jo.jobNo:`JO-${joCounter+1}`};
              printJOPDF(previewJO);

            <button className="btn btn-success" onClick={handleSave}>💾 {mode==='add'?'Save Job Order':'Update Job Order'}</button>
          </div>
        </div>
      </div>
    </div>
  );
