  else if(freq==='Monthly')d.setMonth(d.getMonth()+1);
  else if(freq==='Quarterly')d.setMonth(d.getMonth()+3);
  else if(freq==='Half-Yearly')d.setMonth(d.getMonth()+6);
  else if(freq==='Yearly')d.setFullYear(d.getFullYear()+1);
  return d.toISOString().split('T')[0];
}

async function hashPwd(pw) {
  if (!pw) return '';
  if (/^[0-9a-f]{64}$/.test(pw)) return pw;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ─── ASSET PDF ───────────────────────────────────────────────────────────────
function printAssetPDF(a, rel) {
  const sc = {OPERATIONAL:'#065f46',BREAKDOWN:'#991b1b','UNDER MAINTENANCE':'#9a3412',NEW:'#1e40af',Inactive:'#475569',idle:'#92400e'};
  const sb = {OPERATIONAL:'#d1fae5',BREAKDOWN:'#fee2e2','UNDER MAINTENANCE':'#ffedd5',NEW:'#dbeafe',Inactive:'#f1f5f9',idle:'#fef3c7'};
  const color = sc[a.status]||'#475569', bg = sb[a.status]||'#f1f5f9';
  const fields = [['Asset Number',a.num],['Plant',a.plant],['Description',a.desc],['Equipment Code',a.code||'—'],['Model / Make',a.model||'—'],['Capacity',a.cap||'—'],['Register No.',a.reg||'—'],['Engine No.',a.eng||'—'],['Serial / Chassis',a.serial||'—'],['Location',a.loc||'—']];
  const detailRows = fields.map(([l,v])=>`<div><div style="font-size:9px;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">${l}</div><div style="font-size:12px;font-weight:600">${v}</div></div>`).join('');
  const relRows = rel.map(j=>{const jb=j.status==='OPEN'?'#fef3c7':j.status==='IN PROGRESS'?'#dbeafe':'#d1fae5';const jc=j.status==='OPEN'?'#92400e':j.status==='IN PROGRESS'?'#1e40af':'#065f46';return`<tr><td style="font-family:monospace;color:#f59e0b;font-weight:700">${j.jobNo}</td><td>${j.date}</td><td>${(j.problem||'—').substring(0,70)}</td><td><span style="background:${jb};color:${jc};padding:1px 8px;border-radius:3px;font-size:9px;font-weight:700">${j.status}</span></td></tr>`;}).join('');
  openPrintWindow(`Asset — ${a.num} | ${a.desc}`, `
    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:14px 16px;margin-bottom:12px">
      <div style="font-size:9px;color:#f59e0b;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">ASSET DETAILS</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">${detailRows}
        <div><div style="font-size:9px;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">Status</div><span style="background:${bg};color:${color};padding:2px 10px;border-radius:4px;font-size:10px;font-weight:700">${a.status||'—'}</span></div>
      </div>
    </div>

  `);

    </div>
    ${sect('Request Information', grid3([['Date',jo.date||'—'],['Requested By',jo.requester||'—'],['Department',jo.dept||'—'],['Priority',`<span style="font-weight:700;color:${jo.priority==='High'?'#dc2626':'#059669'}">${jo.priority||'—'}</span>`],['Type of Repair',jo.repairType||'—'],['Status',jo.status]]))}
    ${sect('Equipment Details', grid3([['Asset Number',jo.assetNum||'—'],['Asset Description',jo.assetDesc||'—'],['Location',jo.location||'—'],['Equipment Code',jo.eqcode||'—']]))}
    <div style="background:#fff8ed;border:1px solid #fed7aa;border-radius:6px;padding:12px 14px;margin-bottom:10px;${nb}">
      <div style="font-size:9px;color:#f59e0b;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px">PROBLEM DETAILS</div>
      <div style="font-size:11px;line-height:1.65">${jo.problem||'—'}</div>
    </div>

    ${sect('Manpower Utilisation', `<table style="width:100%;border-collapse:collapse"><thead><tr>

    <div style="margin-top:8px;font-size:10px;color:#64748b">Downtime: <strong>${jo.downtime||0} hrs</strong></div>`)}

// ─── CSV UTILITIES ───────────────────────────────────────────────────────────
function dlCSV(content, filename) {
  const blob = new Blob([content], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvCell(v) { return '"'+(String(v||'')).replace(/"/g,'""')+'"'; }
function parseCSVLine(line) {
  const vals=[]; let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(line[i]===','&&!inQ){vals.push(cur.trim());cur='';}
    else cur+=line[i];
  }
  vals.push(cur.trim()); return vals;
}
function exportAssetsCSV(assets) {
  const hdr=['Asset No.','Asset Category','Description','Eq. Code','Model/Make','Capacity','Register No.','Engine No.','Serial/Chassis No.','Location','Status'];
  const rows=assets.map(a=>[a.num,a.plant,a.desc,a.code,a.model,a.cap,a.reg,a.eng,a.serial,a.loc,a.status].map(csvCell).join(','));
  dlCSV([hdr.join(','),...rows].join('\n'),'assets_export.csv');
}
function exportJobOrdersCSV(jobOrders) {
  const hdr=['Job No.','Date','Asset No.','Asset Desc.','Asset Category','Location','Eq. Code','Dept','Requested By','Priority','Repair Type','Problem','Status','Target','Section','Tech 1','Tech 1 Hrs','Tech 2','Tech 2 Hrs','Work Done','Work Status','Evaluation','Downtime','Acceptance','Completion Date','Received By','Approved By'];
  const rows=jobOrders.map(j=>[j.jobNo,j.date,j.assetNum,j.assetDesc,j.assetCategory||j.plant||'',j.location,j.eqcode,j.dept,j.requester,j.priority,j.repairType,j.problem,j.status,j.target,j.section,j.tech1,j.tech1h,j.tech2,j.tech2h,j.workDone,j.workStatus,j.eval,j.downtime,j.accept,j.completionDate,j.recvName,j.approved].map(csvCell).join(','));
  dlCSV([hdr.join(','),...rows].join('\n'),'joborders_export.csv');
}

function importCSVFile(file, onRows) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const lines = e.target.result.split(/\r?\n/).filter(l=>l.trim());
      if (lines.length < 2) { alert('CSV is empty or has no data rows.'); return; }
      onRows(lines.slice(1).map(parseCSVLine));
    } catch(err) { alert('Error reading CSV: '+err.message); }
  };
  reader.readAsText(file);
}

  // ── Load from Supabase on mount
  useEffect(() => {
    sb.from('app_data').select('*').then(({data, error}) => { if (error) { console.error('Supabase load error:', error); setDbLoaded(true); return; }
      if (data && data.length > 0) {
        const map = {};
        data.forEach(r => { map[r.key] = r.value; });
        if ('assets' in map) {
          const deduped = [...new Map((map.assets||[]).map(a => [a.num, {...a, plant:(a.plant||'').toUpperCase()}])).values()];
          setAssets(deduped);
        }
        if ('jobOrders' in map) { const jos=map.jobOrders||[]; setJobOrders(jos); if(jos.length){const maxN=Math.max(...jos.map(j=>parseInt((j.jobNo||'').replace(/\D/g,''))||0)); if(maxN>0) setJoCounter(maxN);} }
        if ('pm' in map) setPM(map.pm||[]);
        if ('employees' in map) setEmployees(map.employees||[]);
        if ('users' in map && map.users?.length) {
          const rawUsers = map.users;
          const needsMigration = rawUsers.some(u => u.password && !/^[0-9a-f]{64}$/.test(u.password));
          if (needsMigration) {
            Promise.all(rawUsers.map(async u => ({...u, password: await hashPwd(u.password)})))
              .then(hashed => { setUsers(hashed); persistUsers(hashed); });
          } else { setUsers(rawUsers); }
        }
        if ('customPlants' in map) setCustomPlants(map.customPlants||[]);
      }
      if (!data || data.length === 0) {
        // Seed base data on first load
        const baseAssets = BASE_ASSETS.map(a => ({...a, plant: (a.plant||'').toUpperCase()}));
        const deduped = [...new Map(baseAssets.map(a => [a.num, a])).values()];
        setAssets(deduped);
        dbSave('assets', deduped);
        dbSave('jobOrders', []);
        dbSave('pm', BASE_PM);
        dbSave('employees', BASE_EMPLOYEES);
        Promise.all(DEFAULT_USERS.map(async u=>({...u,password:await hashPwd(u.password)}))).then(h=>{setUsers(h);dbSave('users',h);});
        dbSave('customPlants', [...PLANTS].sort());
      }
      isLoaded.current = true;
      setSyncStatus('ok');
      setDbLoaded(true);
    });
    // Also attempt to restore joCounter from localStorage as fallback
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) { const d = JSON.parse(raw); if (d.joCounter) setJoCounter(d.joCounter); }
    } catch(e) {}
  }, []);

  // ── Real-time sync via Supabase
  useEffect(() => {
    const ch = sb.channel('cmms_sync')
      .on('postgres_changes', {event:'*', schema:'public', table:'app_data'}, ({new:row}) => {
        if (row.key==='assets')        setAssets(row.value);
        else if (row.key==='jobOrders')    setJobOrders(row.value);
        else if (row.key==='pm')           setPM(row.value);
        else if (row.key==='employees')    setEmployees(row.value);
        else if (row.key==='users')        setUsers(row.value);
        else if (row.key==='customPlants') setCustomPlants(row.value);
      })
      .subscribe();
    return () => sb.removeChannel(ch);
  }, []);

  // ── Persist (debounced) to localStorage + Supabase
  const persist = useCallback((newAssets, newJOs, newCounter) => {
    if (!isLoaded.current) return;
    clearTimeout(saveTimer.current);
    setSyncStatus('saving');
    saveTimer.current = setTimeout(() => {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          assets: newAssets, jobOrders: newJOs, joCounter: newCounter
        }));
        setSyncStatus('ok');
        addToast('✓ Saved');
      } catch(e) {
        setSyncStatus('ok');
        addToast('⚠ Could not save locally', true);
      }
      dbSave('assets', newAssets);
      dbSave('jobOrders', newJOs);
    }, 800);
  }, []);

  // ── Auth & User management
  function persistUsers(next) {
    try { localStorage.setItem(USERS_KEY, JSON.stringify(next)); } catch(e) {}
    dbSave('users', next);
  }

  async function handleLogin(username, password) {
    const hashed = await hashPwd(password);
    const u = users.find(u => u.username === username && u.password === hashed && u.active !== false);
    if (u) { setCurrentUser(u); try{localStorage.setItem(SESSION_KEY,JSON.stringify(u));}catch(_){} return true; }
    return false;
  }

  function handleLogout() {
    setCurrentUser(null);
    setPage('dashboard');
    try { localStorage.removeItem(SESSION_KEY); } catch(_) {}
  }

  async function saveUser(user, editId) {
    const hashedPwd = user.password ? await hashPwd(user.password) : null;
    setUsers(prev => {
      let next;
      if (editId) {
        const existing = prev.find(u => u.id === editId);
        const updated = {...user, id: editId, password: hashedPwd || existing.password};
        next = prev.map(u => u.id === editId ? updated : u);
        if (currentUser && currentUser.id === editId) { setCurrentUser(updated); try{localStorage.setItem(SESSION_KEY,JSON.stringify(updated));}catch(_){} }
      } else {
        const newId = Math.max(0, ...prev.map(u => u.id)) + 1;
        next = [...prev, {...user, id: newId, password: hashedPwd||''}];
      }
      persistUsers(next);
      return next;
    });
    addToast(editId ? 'User updated.' : 'User added.');
  }

  function deleteUser(id) {
    if (currentUser && currentUser.id === id) { addToast('Cannot delete your own account.', true); return; }
    setUsers(prev => {
      const next = prev.filter(u => u.id !== id);
      persistUsers(next);
      return next;
    });
    addToast('User deleted.');
  }

  // ── Toast
  function addToast(msg, err=false) {
    const id = Date.now();
    setToasts(t => [...t, {id, msg, err}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }

  // ── Asset mutations
  function updateAssetStatus(num, status) {
    setAssets(prev => {
      const next = prev.map(a => a.num===num ? {...a, status} : a);
      persist(next, jobOrders, joCounter);
      return next;
    });
    addToast(`Asset ${num} → ${status}`);
  }

  function saveAsset(asset, editNum) {
    setAssets(prev => {
      let next;
      if (editNum) {
        next = prev.map(a => a.num===editNum ? asset : a);
        addToast(`Asset ${asset.num} updated.`);
      } else {
        if (prev.find(a => a.num===asset.num)) { addToast(`Asset ${asset.num} already exists.`, true); return prev; }
        next = [...prev, asset];
        addToast(`Asset ${asset.num} added.`);
      }
      persist(next, jobOrders, joCounter);
      return next;
    });
    setAssetModal(null);
  }

  // ── JO mutations
  function saveJO(jo, editJobNo) {
    let nextJOs, nextCounter = joCounter;
    if (editJobNo) {
      nextJOs = jobOrders.map(j => j.jobNo===editJobNo ? jo : j);
      addToast(`Job Order ${editJobNo} updated.`);
    } else {
      nextCounter = joCounter + 1;
      setJoCounter(nextCounter);
      jo = {...jo, jobNo: `JO-${nextCounter}`};
      nextJOs = [...jobOrders, jo];
      addToast(`Job Order ${jo.jobNo} saved.`);
    }
    setJobOrders(nextJOs);
    persist(assets, nextJOs, nextCounter);
    setJoModal(null);
  }

  function updateJOStatus(jobNo, status) {
    setJobOrders(prev => {
      const next = prev.map(j => j.jobNo===jobNo ? {...j, status} : j);
      persist(assets, next, joCounter);
      return next;
    });
    addToast(`${jobNo} → ${status}`);
  }

  function deleteAsset(num) {
    setAssets(prev => {
      const next = prev.filter(a => a.num !== num);
      persist(next, jobOrders, joCounter);
      return next;
    });
    addToast(`Asset ${num} deleted.`);
  }

  function deleteJO(jobNo) {
    setJobOrders(prev => {
      const next = prev.filter(j => j.jobNo !== jobNo);
      persist(assets, next, joCounter);
      return next;
    });
    addToast(`${jobNo} deleted.`);
  }
  function approveJO(jobNo, approval) {
    setJobOrders(prev => {
      const next = prev.map(j => j.jobNo===jobNo ? {...j, status:'CLOSED', closedBy:approval.closedBy, closerDesignation:approval.closerDesignation, closedDate:approval.closedDate} : j);
      persist(assets, next, joCounter);
      return next;
    });
    addToast(`${jobNo} approved and closed.`);
  }
  function revertJO(jobNo) {
    setJobOrders(prev => {
      const next = prev.map(j => j.jobNo===jobNo ? {...j, status:'COMPLETED', closedBy:'', closerDesignation:'', closedDate:''} : j);
      persist(assets, next, joCounter);
      return next;
    });
    addToast(`${jobNo} reverted to COMPLETED.`);
  }

  // ── Employees
  const [employees, setEmployees] = useState(BASE_EMPLOYEES);
  function persistEmployees(next) {
    try { localStorage.setItem(EMPLOYEES_KEY, JSON.stringify(next)); } catch(e) {}
    dbSave('employees', next);
  }
  function saveEmployee(emp, editId) {
    setEmployees(prev => {
      let next;
      if (editId) {
        next = prev.map(e => e.empId===editId ? {...emp, empId:editId} : e);
      } else {
        next = [...prev, emp];
      }
      persistEmployees(next);
      return next;
    });
    addToast(editId ? 'Employee updated.' : 'Employee added.');
  }
  // ── PM Schedule
  const [pm, setPM] = useState(BASE_PM);
  function savePMItem(item, editId) {
    setPM(prev => {
      let next;
      if (editId) {
        next = prev.map(p => p.id===editId ? {...item,id:editId,serviceHistory:p.serviceHistory||[]} : p);
      } else {
        const maxN = Math.max(0,...prev.map(p=>parseInt(p.id.split('-')[1])||0));
        const newId = 'pm-'+String(maxN+1).padStart(3,'0');
        next = [...prev, {...item, id:newId, serviceHistory:[]}];
      }
      try { localStorage.setItem(PM_KEY, JSON.stringify(next)); } catch(e) {}
      dbSave('pm', next);
      return next;
    });
  }
  function importPMFromCSV(file) {
    importCSVFile(file, rows => {
      const newPM = rows.map(r => ({
        id: r[0] || 'pm-' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
        assetNum: r[1]||'', assetDesc: r[2]||'', category: r[3]||'',
        location: r[4]||'', frequency: r[5]||'Monthly',
        lastService: r[6]||'', nextService: r[7]||'', notes: r[8]||'', serviceHistory:[]
      })).filter(p => p.assetDesc);
      setPM(prev => {
        const existing = new Set(prev.map(p => p.id));
        const next = [...prev, ...newPM.filter(p => !existing.has(p.id))];
        try { localStorage.setItem(PM_KEY, JSON.stringify(next)); } catch(e) {}
        dbSave('pm', next);
        return next;
      });
      addToast('PM schedule imported.');
    });
  }
  function recordPMService(pmId, record) {
    setPM(prev => {
      const next = prev.map(p => {
        if (p.id!==pmId) return p;
        const history = [{...record}, ...(p.serviceHistory||[])];
        const next_ = computeNextService(record.date, p.frequency);
        return {...p, lastService:record.date, nextService:next_, serviceHistory:history};
      });
      try { localStorage.setItem(PM_KEY, JSON.stringify(next)); } catch(e) {}
      dbSave('pm', next);
      return next;
    });
  }

  function updateEmployeeStatus(empId, updates) {
    setEmployees(prev => {
      const next = prev.map(e => e.empId===empId ? {...e, ...updates} : e);
      persistEmployees(next);
      return next;
    });
    addToast('Employee record updated.');
  }
  function resetData() {
    clearTimeout(saveTimer.current);
    setAssets([]);
    setJobOrders([]);
    setJoCounter(1000);
    setPM([]);
    setEmployees([]);
    setCustomPlants([]);
    try { localStorage.setItem(STORE_KEY, JSON.stringify({assets:[], jobOrders:[], joCounter:1000})); } catch(e) {}
    try { localStorage.setItem(PM_KEY, JSON.stringify([])); } catch(e) {}
    try { localStorage.setItem(EMPLOYEES_KEY, JSON.stringify([])); } catch(e) {}
    try { localStorage.setItem(CUSTOM_PLANTS_KEY, JSON.stringify([])); } catch(e) {}
    dbSave('assets', []);
    dbSave('jobOrders', []);
    dbSave('pm', []);
    dbSave('employees', []);
    dbSave('customPlants', []);
    dbSave('users', DEFAULT_USERS);
    try { localStorage.removeItem(USERS_KEY); } catch(e) {}
    addToast('All data has been reset.');
  }

  // ── Custom Plants
  const [customPlants, setCustomPlants] = useState([...PLANTS].sort());
  function addCustomPlant(name) {
    const upper = name.trim().toUpperCase();
    if (!upper) return;
    setCustomPlants(prev => {
      if (prev.includes(upper)) return prev;
      const next = [...prev, upper].sort();
      try { localStorage.setItem(CUSTOM_PLANTS_KEY, JSON.stringify(next)); } catch(e) {}
      dbSave('customPlants', next);
      return next;
    });
  }
  function renameCustomPlant(oldName, newName) {
    const upper = newName.trim().toUpperCase();
    if (!upper || upper === oldName) return;
    setCustomPlants(prev => {
      const next = prev.map(p => p===oldName ? upper : p);
      try { localStorage.setItem(CUSTOM_PLANTS_KEY, JSON.stringify(next)); } catch(e) {}
      dbSave('customPlants', next);
      return next;
    });
    setAssets(prev => {
      const next = prev.map(a => a.plant===oldName ? {...a, plant:upper} : a);
      persist(next, jobOrders, joCounter);
      return next;
    });
    setJobOrders(prev => { const next=prev.map(j => j.assetCategory===oldName ? {...j, assetCategory:upper} : j); dbSave('jobOrders', next); return next; });
    addToast(`Renamed "${oldName}" → "${upper}"`);
  }
  function importAssetsFromCSV(file) {
    importCSVFile(file, rows => {
      const newAssets = rows.map(v=>({num:v[0]||'',plant:(v[1]||'').toUpperCase(),desc:v[2]||'',code:v[3]||'',model:v[4]||'',cap:v[5]||'',reg:v[6]||'',eng:v[7]||'',serial:v[8]||'',loc:v[9]||'',status:v[10]||'OPERATIONAL'})).filter(a=>a.num&&a.desc);
      setAssets(prev => {
        const existing = new Set(prev.map(a=>a.num));
        const toAdd = newAssets.filter(a=>!existing.has(a.num));
        const next = sortByAssetNum([...prev, ...toAdd]);
        persist(next, jobOrders, joCounter);
        addToast(`Imported ${toAdd.length} assets (${newAssets.length-toAdd.length} skipped).`);
        return next;
      });
    });
  }
  function importJOsFromCSV(file) {
    importCSVFile(file, rows => {
      const newJOs = rows.map(v=>({jobNo:v[0]||'',date:v[1]||'',assetNum:v[2]||'',assetDesc:v[3]||'',assetCategory:v[4]||'',location:v[5]||'',eqcode:v[6]||'',dept:v[7]||'',requester:v[8]||'',priority:v[9]||'High',repairType:v[10]||'Planned',problem:v[11]||'',status:v[12]||'OPEN',target:v[13]||'',section:v[14]||'',tech1:v[15]||'',tech1h:v[16]||'',tech2:v[17]||'',tech2h:v[18]||'',workDone:v[19]||'',workStatus:v[20]||'',eval:v[21]||'',downtime:v[22]||'',accept:v[23]||'Accepted',completionDate:v[24]||'',recvName:v[25]||'',approved:v[26]||'',parts:[]})).filter(j=>j.jobNo&&j.assetNum);
      setJobOrders(prev => {
        const existing = new Set(prev.map(j=>j.jobNo));
        const toAdd = newJOs.filter(j=>!existing.has(j.jobNo));
        const next = [...prev, ...toAdd];
        persist(assets, next, joCounter);
        addToast(`Imported ${toAdd.length} job orders.`);
        return next;
      });
    });
  }

  const syncLabel = syncStatus==='loading' ? '⟳ Loading...' : syncStatus==='saving' ? '💾 Saving...' : '✓ Saved';
  const syncCls   = syncStatus==='loading' ? 'sync-loading' : syncStatus==='saving' ? 'sync-saving' : 'sync-ok';

  if (!currentUser) return (
    <><style>{CSS}</style><LoginPage onLogin={handleLogin} /></>
  );

  if (!dbLoaded) return (
    <><style>{CSS}</style>
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'var(--navy)',flexDirection:'column',gap:16}}>
      <div style={{fontFamily:'var(--fh)',fontSize:24,color:'var(--accent)'}}>CMMS</div>
      <div style={{color:'var(--gray)',fontSize:13}}>Loading data...</div>
    </div></>
  );

  return (
    <>
      <style>{CSS}</style>
      <div className="app">
        {/* TOPBAR */}
        <div className="topbar">
          <div className="logo">
            <div className="logo-icon">CMMS</div>
            <div>
              <div className="logo-text">VHPL TIC</div>
              <div className="logo-sub">CMMS — ENGINEERING SOLUTIONS DEPARTMENT</div>
            </div>
          </div>
          <div className="topbar-right">
            <div className="badge">{clock}</div>
            <div className="badge">MALE', MALDIVES</div>
            <button className="btn-logout" onClick={handleLogout}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Logout
            </button>
          </div>
        </div>

        <div className="layout">
          {/* SIDEBAR */}
          <div className="sidebar">
            <div className="nav-section">Main</div>
            <NavItem active={page==='dashboard'} onClick={()=>setPage('dashboard')} icon="🏠" label="Dashboard"/>
            <div className="nav-section">Assets</div>
            <NavItem active={page==='assets'} onClick={()=>setPage('assets')} icon="🗂️" label="Asset Registry"/>
            <div className="nav-section">Maintenance</div>
            <NavItem active={page==='joborders'} onClick={()=>setPage('joborders')} icon="📋" label="Job Orders"/>
            <NavItem active={page==='pmschedule'} onClick={()=>setPage('pmschedule')} icon="🔩" label="PM Schedule"/>
            <div className="nav-section">Manpower</div>
            <NavItem active={page==='employees'} onClick={()=>setPage('employees')} icon="👷" label="Employees"/>
            <div className="nav-section">Reports</div>
            <NavItem active={page==='reports'} onClick={()=>setPage('reports')} icon="📊" label="Reports"/>
            <div className="nav-section">System</div>
            <NavItem active={page==='settings'} onClick={()=>setPage('settings')} icon="👥" label="Settings"/>
            <div className="sidebar-footer">
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div className="sidebar-avatar">{currentUser.fullName.charAt(0).toUpperCase()}</div>
                <div style={{minWidth:0}}>
                  <div className="sidebar-user-name">{currentUser.fullName.split(' ')[0]}</div>
                  <div className="sidebar-user-role">{currentUser.role}</div>
                </div>
              </div>
            </div>
          </div>

          <div className="main">
            {page==='dashboard' && <DashboardPage assets={assets} jobOrders={jobOrders} setPage={setPage} setJoModal={setJoModal} customPlants={customPlants} employees={employees}/>}
            {page==='assets'    && <AssetsPage assets={assets} setAssetModal={setAssetModal} setJoModal={setJoModal} onStatusChange={updateAssetStatus} onDeleteAsset={deleteAsset} customPlants={customPlants} onExportCSV={()=>exportAssetsCSV(assets)} onImportCSV={importAssetsFromCSV} currentUser={currentUser}/>}
            {page==='joborders' && <JobOrdersPage assets={assets} jobOrders={jobOrders} setJoModal={setJoModal} setJoViewModal={setJoViewModal} onStatusChange={updateJOStatus} onDeleteJO={deleteJO} onExportCSV={()=>exportJobOrdersCSV(jobOrders)} onImportCSV={importJOsFromCSV} onApproveJO={approveJO} onRevertJO={revertJO} currentUser={currentUser}/>}
            {page==='pmschedule' && <PMSchedulePage pm={pm} assets={assets} setJoModal={setJoModal} onSavePM={savePMItem} onRecordService={recordPMService} onImportPM={importPMFromCSV} onExportPM={()=>exportPMCSV(pm)} currentUser={currentUser}/>}
            {page==='employees' && <EmployeesPage employees={employees} onSaveEmployee={saveEmployee} onUpdateStatus={updateEmployeeStatus} currentUser={currentUser}/>}
            {page==='reports'   && <ReportsPage assets={assets} jobOrders={jobOrders}/>}
            {page==='settings'  && <SettingsPage users={users} currentUser={currentUser} onSaveUser={saveUser} onDeleteUser={deleteUser} onResetData={resetData}/>}
          </div>
        </div>

        {/* MODALS */}
        {assetModal && (
          assetModal.mode==='view'
            ? <AssetViewModal asset={assetModal.asset} assets={assets} jobOrders={jobOrders}
                currentUser={currentUser}
                onClose={()=>setAssetModal(null)}
                onEdit={a=>setAssetModal({mode:'edit',asset:a})}
                onJO={a=>{setAssetModal(null);setJoModal({mode:'add',preAsset:a.num});}} />
            : <AssetFormModal mode={assetModal.mode} asset={assetModal.asset}
                assets={assets} onClose={()=>setAssetModal(null)} onSave={saveAsset}
                customPlants={customPlants} onAddPlant={addCustomPlant} onRenameCategory={renameCustomPlant}/>
        )}
        {joModal && (
          <JOFormModal mode={joModal.mode} jo={joModal.jo} preAsset={joModal.preAsset}
            assets={assets} joCounter={joCounter} employees={employees}
            onClose={()=>setJoModal(null)} onSave={saveJO}/>
        )}
        {joViewModal && (
          <JOViewModal jo={joViewModal}
            currentUser={currentUser}
            onClose={()=>setJoViewModal(null)}
            onEdit={jo=>{setJoViewModal(null);setJoModal({mode:'edit',jo});}}/>
        )}

        {/* TOASTS */}
        <div className="toast-wrap">
          {toasts.map(t => <div key={t.id} className={`toast-msg${t.err?' err':''}`}>{t.msg}</div>)}
        </div>
      </div>
    </>
  );
}

function NavItem({active,onClick,icon,label}) {
  return <div className={`nav-item${active?' active':''}`} onClick={onClick}><span className="nav-icon">{icon}</span>{label}</div>;
}

// ─── LOGIN PAGE ───────────────────────────────────────────────────────────────
function LoginPage({onLogin}) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  function handleSubmit(e) {
    e.preventDefault();
    setError('');
    if (!username.trim() || !password) { setError('Please enter your username and password.'); return; }
    setLoading(true);
    setTimeout(async () => {
      const ok = await onLogin(username.trim(), password);
      if (!ok) { setError('Invalid username or password. Please try again.'); setLoading(false); }
    }, 350);
  }

  return (
    <div className="login-page">
      <div className="login-card">
        <div className="login-logo-wrap">
          <div className="login-logo-icon">CMMS</div>
          <div className="login-title">VHPL TIC</div>
          <div className="login-sub">CMMS — ENGINEERING SOLUTIONS DEPARTMENT</div>
        </div>
        <hr className="login-divider"/>
        <form onSubmit={handleSubmit} autoComplete="on">
          <div className="login-field">
            <label>Username</label>
            <input
              type="text"
              value={username}
              onChange={e=>setUsername(e.target.value)}
              placeholder="Enter your username"
              autoFocus
              autoComplete="username"
            />
          </div>

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function AssetDoughnutChart({assets}) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);
  const palette = ['#f59e0b','#3b82f6','#10b981','#f97316','#8b5cf6','#06b6d4','#facc15','#ef4444','#14b8a6','#6366f1','#ec4899','#84cc16'];

  useEffect(()=>{
    if (!canvasRef.current || typeof Chart==='undefined') return;
    const cats   = [...new Set(assets.map(a=>a.plant).filter(Boolean))].sort();
    const counts = cats.map(c=>assets.filter(a=>a.plant===c).length);
    const total  = counts.reduce((a,b)=>a+b,0);
    if (chartRef.current) chartRef.current.destroy();

    const centerPlugin = {
      id:'centerLabel',
      afterDraw(chart) {
        const {ctx,chartArea:{left,top,width,height}} = chart;
        const cx=left+width/2, cy=top+height/2;
        ctx.save();
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font=`700 ${Math.min(34,width*.16)}px 'Rajdhani',sans-serif`;
        ctx.fillStyle='#f8fafc';
        ctx.fillText(total, cx, cy-9);
        ctx.font=`600 ${Math.min(9,width*.045)}px 'Source Code Pro',monospace`;
        ctx.fillStyle='#94a3b8';
        ctx.letterSpacing='2px';
        ctx.fillText('TOTAL ASSETS', cx, cy+11);
        ctx.restore();
      }
    };

    chartRef.current = new Chart(canvasRef.current,{
      type:'doughnut',
      plugins:[centerPlugin],
      data:{
        labels: cats.map(c=>c.length>20?c.slice(0,20)+'…':c),
        datasets:[{
          data:counts,
          backgroundColor: cats.map((_,i)=>palette[i%palette.length]+'bb'),
          borderColor:      cats.map((_,i)=>palette[i%palette.length]),
          borderWidth:2,
          hoverBackgroundColor: cats.map((_,i)=>palette[i%palette.length]),
          hoverBorderWidth:3,
          hoverOffset:10,
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        animation:{animateRotate:true,animateScale:true,duration:900,easing:'easeInOutQuart'},
        plugins:{
          legend:{
            position:'right',
            labels:{
              color:'#ffffff',
              font:{size:11,family:"'Rajdhani',sans-serif"},
              padding:12, boxWidth:10, boxHeight:10,
              usePointStyle:true, pointStyle:'circle',
              generateLabels:(chart)=>chart.data.labels.map((lbl,i)=>({
                text:`${lbl}  ·  ${chart.data.datasets[0].data[i]}`,
                fillStyle:chart.data.datasets[0].hoverBackgroundColor[i],
                strokeStyle:chart.data.datasets[0].borderColor[i],
                fontColor:'#ffffff',
                lineWidth:1,hidden:false,index:i,
              }))
            }
          },
          tooltip:{
            backgroundColor:'rgba(10,22,40,.95)',
            borderColor:'rgba(245,158,11,.4)',
            borderWidth:1,
            padding:12,
            titleFont:{family:"'Rajdhani',sans-serif",size:13,weight:'bold'},
            bodyFont:{family:"'Source Code Pro',monospace",size:11},
            callbacks:{
              title:([ctx])=>ctx.label,
              label:ctx=>{
                const pct=total?Math.round(ctx.parsed/total*100):0;
                return `  ${ctx.parsed} assets  (${pct}%)`;
              }
            }
          }
        },
        cutout:'64%',
      }
    });
    return ()=>{ if(chartRef.current){chartRef.current.destroy();chartRef.current=null;} };
  },[assets]);

  const opCount = assets.filter(a=>a.status==='OPERATIONAL').length;
  const brCount = assets.filter(a=>a.status==='BREAKDOWN').length;
  const mnCount = assets.filter(a=>a.status==='UNDER MAINTENANCE').length;

  return (
    <div className="panel" style={{marginTop:20,background:'linear-gradient(135deg,rgba(15,32,68,.9),rgba(10,22,40,.95))'}}>
      <div className="panel-head" style={{borderBottom:'1px solid rgba(245,158,11,.15)'}}>
        <div className="panel-title">Asset Distribution by Category</div>
        <div style={{display:'flex',gap:18,fontSize:11,fontFamily:'var(--fm)'}}>
          <span><span style={{color:'var(--green)',fontWeight:700}}>{opCount}</span> <span style={{color:'var(--gray)'}}>OPER.</span></span>
          <span><span style={{color:'var(--red)',fontWeight:700}}>{brCount}</span> <span style={{color:'var(--gray)'}}>BREAK.</span></span>
          <span><span style={{color:'var(--orange)',fontWeight:700}}>{mnCount}</span> <span style={{color:'var(--gray)'}}>MAINT.</span></span>
          <span><span style={{color:'var(--white)',fontWeight:700}}>{assets.length}</span> <span style={{color:'var(--gray)'}}>TOTAL</span></span>
        </div>
      </div>
      <div className="panel-body">
        <div style={{height:300,position:'relative'}}>
          <canvas ref={canvasRef}/>
        </div>
      </div>
    </div>
  );
}

function JobOrdersPage({assets, jobOrders, setJoModal, setJoViewModal, onStatusChange, onDeleteJO, onExportCSV, onImportCSV, onApproveJO, onRevertJO, currentUser={}}) {
  const [q, setQ] = useState('');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [activeTab, setActiveTab] = useState('OPEN');
  const [confirmModal, setConfirmModal] = useState(null);
  const [approvalDate, setApprovalDate] = useState(new Date().toISOString().split('T')[0]);
  const importRef = useRef(null);

  const canAdvanceOpen = currentUser.role==='Admin' || currentUser.role==='Assistant Engineer';
  const canComplete    = currentUser.role==='Admin' || currentUser.role==='Assistant Engineer';
  const canClose       = currentUser.role==='Admin' || currentUser.role==='Senior Engineer' || currentUser.role==='Assistant Engineer';
  const canRevert      = currentUser.role==='Admin';
  const canEditJO      = currentUser.role !== 'Senior Engineer';
  const canRaiseJO     = currentUser.role !== 'Senior Engineer';

  // Smart search: auto-switch to the tab that has matches
  useEffect(()=>{
    if (!q.trim()) return;
    const qLow = q.toLowerCase().trim();
    const allMatches = jobOrders.filter(j=>[j.jobNo,j.assetNum,j.assetDesc,j.dept,j.problem].join(' ').toLowerCase().includes(qLow));
    if (!allMatches.length) return;
    setActiveTab(prev => {
      if (allMatches.some(j=>j.status===prev)) return prev;
      const best = ['OPEN','IN PROGRESS','CLOSED'].find(s=>allMatches.some(j=>j.status===s));
      return best||prev;
    });
  },[q, jobOrders]);

  const filtered = jobOrders.filter(j=>{
    const hay=[j.jobNo,j.assetNum,j.assetDesc,j.dept,j.problem].join(' ').toLowerCase();
    return (!q||hay.includes(q.toLowerCase()))&&(!dateFrom||j.date>=dateFrom)&&(!dateTo||j.date<=dateTo);
  }).reverse();

  const counts = {
    OPEN: jobOrders.filter(j=>j.status==='OPEN').length,
    'IN PROGRESS': jobOrders.filter(j=>j.status==='IN PROGRESS').length,
    COMPLETED: jobOrders.filter(j=>j.status==='COMPLETED').length,
    CLOSED: jobOrders.filter(j=>j.status==='CLOSED').length,
  };
  const tabJOs = filtered.filter(j=>j.status===activeTab);
  const isClosed = activeTab==='CLOSED';

  const TABS = [
    {id:'OPEN',        label:'Open',        color:'#f59e0b', bg:'rgba(245,158,11,.14)'},
    {id:'IN PROGRESS', label:'In Progress', color:'#60a5fa', bg:'rgba(96,165,250,.14)'},
    {id:'COMPLETED',   label:'Completed',   color:'#a78bfa', bg:'rgba(139,92,246,.14)'},
    {id:'CLOSED',      label:'Closed',      color:'#10b981', bg:'rgba(16,185,129,.14)'},
  ];

  function requestAdvance(jo) {
    if (jo.status==='OPEN' && canAdvanceOpen) {
      setConfirmModal({jo, nextStatus:'IN PROGRESS'});
    } else if (jo.status==='IN PROGRESS' && canComplete) {
      setConfirmModal({jo, nextStatus:'COMPLETED'});
    } else if (jo.status==='COMPLETED' && canClose) {
      setApprovalDate(new Date().toISOString().split('T')[0]);
      setConfirmModal({jo, nextStatus:'CLOSED'});

  function doAdvance() {
    if (!confirmModal) return;
    onStatusChange(confirmModal.jo.jobNo, confirmModal.nextStatus);
    setConfirmModal(null);

  function doApprove() {
    if (!approvalDate) { alert('Please select the approved date.'); return; }
    onApproveJO(confirmModal.jo.jobNo, {
      closedBy: currentUser.fullName,
      closerDesignation: DESIGNATIONS[currentUser.role] || currentUser.role,
      closedDate: approvalDate,
    });
    setConfirmModal(null);

  return (
    <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 58px)'}}>

            <input type="file" accept=".csv" style={{display:'none'}} ref={importRef} onChange={e=>{if(e.target.files[0]){onImportCSV(e.target.files[0]);e.target.value='';}}}/>

        </div>
      </div>

      {/* Compact stat row */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10,marginBottom:16,flexShrink:0}}>
        {[['Total',jobOrders.length,'#1a56db','sc-blue'],['Open',counts['OPEN'],'#f59e0b','sc-yellow'],['In Progress',counts['IN PROGRESS'],'#60a5fa','sc-orange'],['Completed',counts['COMPLETED'],'#a78bfa','sc-purple'],['Closed',counts['CLOSED'],'#10b981','sc-green']].map(([lbl,num,c,cls])=>(

                border:'none', borderBottom: active?`2px solid ${t.color}`:'2px solid transparent',
                color: active ? t.color : 'rgba(148,163,184,.7)',
                cursor:'pointer', fontFamily:'var(--fh)', fontSize:14, fontWeight:700,
                letterSpacing:.5, marginBottom:-2, display:'flex', alignItems:'center', gap:8,
                transition:'all .15s',
                outline: active ? `1px solid ${t.color}22` : 'none',
              }}>
                <span style={{
                  display:'inline-block',width:8,height:8,borderRadius:'50%',
                  background: active?t.color:t.color+'44',flexShrink:0,
                  boxShadow: active?`0 0 6px ${t.color}`:'none',
                }}/>
                {t.label}
                <span style={{
                  fontFamily:'var(--fm)',fontSize:11,
                  background: active?t.color+'22':'rgba(255,255,255,.07)',
                  padding:'1px 8px',borderRadius:10,color:active?t.color:'rgba(148,163,184,.6)',
                  border:`1px solid ${active?t.color+'44':'transparent'}`,
                }}>{counts[t.id]}</span>
              </button>
            );
          })}
        </div>
        {/* Search + date on right side of tab bar */}
        <div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderLeft:'1px solid var(--border)'}}>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Search job orders..." style={{fontSize:12,padding:'5px 10px',minWidth:180,background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.12)',color:'var(--white)',borderRadius:5,outline:'none'}}/>
          <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} title="From date" style={{fontSize:12,padding:'5px 8px',width:130}}/>
          <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} title="To date" style={{fontSize:12,padding:'5px 8px',width:130}}/>
          {(dateFrom||dateTo)&&<button className="btn btn-ghost btn-sm" onClick={()=>{setDateFrom('');setDateTo('');}}>✕</button>}
        </div>
      </div>

      {/* Scrollable table fills remaining page height */}
      <div className="panel" style={{borderTopLeftRadius:0,borderTopRightRadius:0,borderTop:'none',flex:1,overflow:'hidden',display:'flex',flexDirection:'column',marginBottom:0}}>
        <div className="tbl-wrap" style={{flex:1,overflowY:'auto'}}>
          <table>
            <thead><tr>
              <th>Job No.</th><th>Date</th><th>Asset</th><th>Asset Category</th><th>Problem</th>
              <th>Priority</th><th>Status</th>
              {isClosed&&<><th>Approved By</th><th>Approved Date</th></>}
              <th>Actions</th>
            </tr></thead>
            <tbody>
              {tabJOs.length===0&&<tr><td colSpan={isClosed?10:8}><div className="empty-state" style={{padding:48}}>No {activeTab.toLowerCase()} job orders{q?' matching search':''}</div></td></tr>}
              {tabJOs.map(jo=>{
                const joIsClosed = jo.status==='CLOSED';
                const canAdvThis = jo.status==='OPEN'?canAdvanceOpen:jo.status==='IN PROGRESS'?canComplete:jo.status==='COMPLETED'?canClose:false;
                return (
                <tr key={jo.jobNo}>
                  <td style={{fontFamily:'var(--fm)',fontSize:12,color:'var(--accent)'}}>{jo.jobNo}</td>
                  <td style={{fontSize:12}}>{jo.date}</td>
                  <td><strong>{jo.assetNum}</strong><div style={{fontSize:11,color:'var(--gray)'}}>{jo.assetDesc||''}</div></td>
                  <td style={{fontSize:11,color:'var(--gray)'}}>{(jo.assetCategory||jo.plant||'').toUpperCase()||'—'}</td>
                  <td style={{fontSize:12,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{jo.problem||'—'}</td>
                  <td><span className={jo.priority==='High'?'prio-high':'prio-low'}>{jo.priority}</span></td>
                  <td>
                    {joIsClosed
                      ? <span className="sb-base jcl">CLOSED ✓</span>
                      : canAdvThis
                        ? <button className={`sb-base ${joStatusCls(jo.status)}`}
                            style={{cursor:'pointer',border:'none',background:'inherit'}}
                            title={jo.status==='OPEN'?'Move to In Progress':'Approve & Close'}
                            onClick={()=>requestAdvance(jo)}>{jo.status} ›</button>
                        : <span className={`sb-base ${joStatusCls(jo.status)}`}>{jo.status}</span>
                    }
                  </td>
                  {isClosed&&<>
                    <td style={{fontSize:11}}>{jo.closedBy||'—'}</td>
                    <td style={{fontFamily:'var(--fm)',fontSize:11}}>{jo.closedDate||'—'}</td>
                  </>}
                  <td>
                    <div style={{display:'flex',gap:4,flexWrap:'nowrap'}}>
                      <button className="btn btn-ghost btn-sm btn-icon" title="View" onClick={()=>setJoViewModal(jo)}>👁</button>
                      {canEditJO&&!joIsClosed&&<button className="btn btn-warning btn-sm btn-icon" title="Edit" onClick={()=>setJoModal({mode:'edit',jo})}>✏</button>}
                      <button className="btn btn-primary btn-sm btn-icon" title="Download PDF" onClick={()=>printJOPDF(jo)}>↓</button>
                      {canEditJO&&!joIsClosed&&<button className="btn btn-danger btn-sm btn-icon" title="Delete" onClick={()=>{ if(window.confirm(`Delete ${jo.jobNo}? This cannot be undone.`)) onDeleteJO(jo.jobNo); }}>🗑</button>}
                      {canRevert&&joIsClosed&&<button className="btn btn-warning btn-sm btn-icon" title="Revert to In Progress" onClick={()=>{ if(window.confirm(`Revert ${jo.jobNo} to IN PROGRESS?\nThis clears the approval record.`)) onRevertJO(jo.jobNo); }}>↺</button>}
                    </div>
                  </td>
                </tr>
              );})}
            </tbody>
          </table>
        </div>
      </div>

      {/* Simple confirm: OPEN → IN PROGRESS */}
      {confirmModal&&confirmModal.nextStatus==='IN PROGRESS'&&(
        <div className="modal-overlay" onClick={()=>setConfirmModal(null)}>
          <div className="modal" style={{width:420}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">Move to In Progress?</div>
              <button className="modal-close" onClick={()=>setConfirmModal(null)}>×</button>
            </div>
            <div className="modal-body">
              <div style={{fontSize:13,marginBottom:12}}>
                Move <span style={{fontFamily:'var(--fm)',color:'var(--accent)'}}>{confirmModal.jo.jobNo}</span>{' '}
                from <span className="sb-base jop">OPEN</span> → <span className="sb-base jip">IN PROGRESS</span>?
              </div>
              <div style={{fontSize:12,color:'var(--gray)',marginBottom:20}}>
                Asset: <strong style={{color:'var(--white)'}}>{confirmModal.jo.assetNum} — {confirmModal.jo.assetDesc||'—'}</strong>
              </div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                <button className="btn btn-ghost" onClick={()=>setConfirmModal(null)}>Cancel</button>
                <button className="btn btn-primary" onClick={doAdvance}>→ Move to In Progress</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Simple confirm: IN PROGRESS → COMPLETED */}
      {confirmModal&&confirmModal.nextStatus==='COMPLETED'&&(
        <div className="modal-overlay" onClick={()=>setConfirmModal(null)}>
          <div className="modal" style={{width:420}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">Mark as Completed?</div>
              <button className="modal-close" onClick={()=>setConfirmModal(null)}>×</button>
            </div>
            <div className="modal-body">
              <div style={{fontSize:13,marginBottom:12}}>
                Move <span style={{fontFamily:'var(--fm)',color:'var(--accent)'}}>{confirmModal.jo.jobNo}</span>{' '}
                from <span className="sb-base jip">IN PROGRESS</span> → <span className="sb-base jcp">COMPLETED</span>?
              </div>
              <div style={{fontSize:12,color:'var(--gray)',marginBottom:20}}>
                Asset: <strong style={{color:'var(--white)'}}>{confirmModal.jo.assetNum} — {confirmModal.jo.assetDesc||'—'}</strong>
              </div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                <button className="btn btn-ghost" onClick={()=>setConfirmModal(null)}>Cancel</button>
                <button className="btn btn-primary" onClick={doAdvance} style={{background:'rgba(139,92,246,.9)'}}>✓ Mark Completed</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Approval confirm: COMPLETED → CLOSED */}
      {confirmModal&&confirmModal.nextStatus==='CLOSED'&&(
        <div className="modal-overlay" onClick={()=>setConfirmModal(null)}>
          <div className="modal" style={{width:480}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">Approve & Close Job Order</div>
              <button className="modal-close" onClick={()=>setConfirmModal(null)}>×</button>
            </div>
            <div className="modal-body">
              <div style={{fontSize:13,marginBottom:4}}>
                Closing <span style={{fontFamily:'var(--fm)',color:'var(--accent)'}}>{confirmModal.jo.jobNo}</span>{' '}
                <span className="sb-base jip">IN PROGRESS</span> → <span className="sb-base jcl">CLOSED</span>
              </div>
              <div style={{fontSize:12,color:'var(--gray)',marginBottom:16}}>
                Asset: <strong style={{color:'var(--white)'}}>{confirmModal.jo.assetNum} — {confirmModal.jo.assetDesc||'—'}</strong>
              </div>
              <div className="jc-section" style={{marginBottom:14}}>
                <div className="jc-section-title">Approval Details</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                  <div className="form-group">
                    <label>Approved By</label>
                    <input readOnly value={currentUser.fullName} style={{background:'rgba(255,255,255,.03)',color:'var(--white)'}}/>
                  </div>
                  <div className="form-group">
                    <label>Designation</label>
                    <input readOnly value={DESIGNATIONS[currentUser.role]||currentUser.role} style={{background:'rgba(255,255,255,.03)',color:'var(--white)'}}/>
                  </div>
                  <div className="form-group">
                    <label>Approved Date *</label>
                    <input type="date" value={approvalDate} onChange={e=>setApprovalDate(e.target.value)}/>
                  </div>
                </div>
              </div>
              <div style={{background:'rgba(245,158,11,.08)',border:'1px solid rgba(245,158,11,.25)',borderRadius:6,padding:'8px 12px',fontSize:11,color:'var(--accent)',fontFamily:'var(--fm)',marginBottom:16}}>
                ⚠ Once closed, only Admin can revert this job order.
              </div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                <button className="btn btn-ghost" onClick={()=>setConfirmModal(null)}>Cancel</button>
                <button className="btn btn-success" onClick={doApprove}>✓ Approve & Close</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── PDF GENERATOR ────────────────────────────────────────────────────────────
function openPrintWindow(title, bodyHtml) {
  const win = window.open('', '_blank');
  if (!win) { alert('Please allow pop-ups for PDF generation.'); return; }
  const now = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  win.document.write(`<!DOCTYPE html><html><head><title>${title}</title><style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,sans-serif;font-size:11px;color:#111;padding:24px 28px;}
    .hdr{display:flex;align-items:center;gap:14px;border-bottom:2px solid #f59e0b;padding-bottom:12px;margin-bottom:16px;}
    .hdr-icon{width:40px;height:32px;background:linear-gradient(135deg,#f59e0b,#1a56db);border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#0a1628;letter-spacing:.5px;}
    .hdr-title{font-size:18px;font-weight:700;letter-spacing:.5px;}
    .hdr-sub{font-size:9px;color:#f59e0b;letter-spacing:1.5px;margin-top:2px;}
    .meta{font-size:10px;color:#64748b;margin-bottom:14px;display:flex;gap:20px;}
    table{width:100%;border-collapse:collapse;margin-top:4px;}
    th{padding:7px 8px;text-align:left;background:#0a1628;color:#f59e0b;font-size:9px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
    td{padding:6px 8px;border-bottom:1px solid #e2e8f0;font-size:10px;vertical-align:middle;}
    tr:nth-child(even) td{background:#f8fafc;}
    .b{font-weight:700;}
    .badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.5px;}
    .op{background:#d1fae5;color:#065f46;}.br{background:#fee2e2;color:#991b1b;}
    .mn{background:#ffedd5;color:#9a3412;}.ot{background:#f1f5f9;color:#475569;}
    .jop{background:#fef3c7;color:#92400e;}.jip{background:#dbeafe;color:#1e40af;}.jcl{background:#d1fae5;color:#065f46;}
    .hi{color:#dc2626;font-weight:700;}.lo{color:#059669;}
    .footer{margin-top:20px;font-size:9px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:10px;display:flex;justify-content:space-between;}
    @media print{body{padding:12px 16px;}tr,td,th{page-break-inside:avoid;}}
  </style></head><body>
    <div class="hdr"><div class="hdr-icon">CMM</div><div><div class="hdr-title">${title}</div><div class="hdr-sub">VHPL TIC — ENGINEERING SOLUTIONS DEPARTMENT</div></div></div>
    <div class="meta"><span>Generated: ${now}</span></div>
    ${bodyHtml}
    <div class="footer"><span>VHPL TIC · CMMS</span><span>${title} · ${now}</span></div>
  </body></html>`);
  win.document.close();
  setTimeout(() => win.print(), 400);
}

// ─── REPORTS PAGE ─────────────────────────────────────────────────────────────
function ReportsPage({assets, jobOrders}) {
  function dlAssetMasterList() {
    const rows = assets.map(a => {
      const sc = a.status==='OPERATIONAL'?'op':a.status==='BREAKDOWN'?'br':a.status==='UNDER MAINTENANCE'?'mn':'ot';
      return `<tr><td class="b" style="color:#f59e0b;font-family:monospace">${a.num}</td><td style="font-size:9px">${a.plant}</td><td class="b">${a.desc}</td><td style="font-family:monospace;font-size:9px">${a.code||'—'}</td><td>${a.model||'—'}</td><td>${a.cap||'—'}</td><td>${a.loc||'—'}</td><td style="font-family:monospace;font-size:9px">${a.serial||'—'}</td><td><span class="badge ${sc}">${a.status||'—'}</span></td></tr>`;
    }).join('');
    openPrintWindow('Asset Master List', `
      <div class="meta" style="margin-bottom:10px"><span>Total Assets: <b>${assets.length}</b></span><span>Plants: <b>${[...new Set(assets.map(a=>a.plant))].length}</b></span><span>Operational: <b>${assets.filter(a=>a.status==='OPERATIONAL').length}</b></span></div>
      <table><thead><tr><th>Asset No.</th><th>Plant</th><th>Description</th><th>Eq. Code</th><th>Model</th><th>Capacity</th><th>Location</th><th>Serial No.</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody></table>`);
  }

  function dlAllJobOrders() {
    const rows = [...jobOrders].reverse().map(j => {
      const sc = j.status==='OPEN'?'jop':j.status==='IN PROGRESS'?'jip':'jcl';
      return `<tr><td class="b" style="color:#f59e0b;font-family:monospace">${j.jobNo}</td><td>${j.date}</td><td style="font-family:monospace;font-size:9px">${j.assetNum}</td><td>${j.assetDesc||'—'}</td><td>${j.dept||'—'}</td><td style="max-width:160px">${(j.problem||'—').substring(0,70)}</td><td><span class="${j.priority==='High'?'hi':'lo'}">${j.priority||'—'}</span></td><td><span class="badge ${sc}">${j.status}</span></td><td>${j.completionDate||'—'}</td></tr>`;
    }).join('');
    openPrintWindow('All Job Orders', `
      <div class="meta" style="margin-bottom:10px"><span>Total: <b>${jobOrders.length}</b></span><span>Open: <b>${jobOrders.filter(j=>j.status==='OPEN').length}</b></span><span>In Progress: <b>${jobOrders.filter(j=>j.status==='IN PROGRESS').length}</b></span><span>Closed: <b>${jobOrders.filter(j=>j.status==='CLOSED').length}</b></span></div>
      <table><thead><tr><th>Job No.</th><th>Date</th><th>Asset No.</th><th>Asset</th><th>Dept</th><th>Problem</th><th>Priority</th><th>Status</th><th>Completed</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:20px">No job orders recorded.</td></tr>'}</tbody></table>`);
  }

  function dlBreakdownReport() {
    const broken = assets.filter(a=>['BREAKDOWN','UNDER MAINTENANCE','Inactive','idle'].includes(a.status));
    const rows = broken.map(a => {
      const sc = a.status==='BREAKDOWN'?'br':'mn';
      return `<tr><td class="b" style="color:#f59e0b;font-family:monospace">${a.num}</td><td style="font-size:9px">${a.plant}</td><td class="b">${a.desc}</td><td>${a.loc||'—'}</td><td style="font-family:monospace;font-size:9px">${a.serial||'—'}</td><td><span class="badge ${sc}">${a.status}</span></td></tr>`;
    }).join('');
    openPrintWindow('Breakdown / Maintenance Report', `
      <div class="meta" style="margin-bottom:10px"><span>Non-Operational Assets: <b>${broken.length}</b></span><span>Breakdown: <b>${assets.filter(a=>a.status==='BREAKDOWN').length}</b></span><span>Under Maintenance: <b>${assets.filter(a=>a.status==='UNDER MAINTENANCE').length}</b></span></div>
      <table><thead><tr><th>Asset No.</th><th>Plant</th><th>Description</th><th>Location</th><th>Serial No.</th><th>Status</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px">All assets are operational.</td></tr>'}</tbody></table>`);
  }

  function dlOpenJobOrders() {
    const open = jobOrders.filter(j=>j.status!=='CLOSED');
    const rows = open.map(j => {
      const sc = j.status==='OPEN'?'jop':'jip';
      return `<tr><td class="b" style="color:#f59e0b;font-family:monospace">${j.jobNo}</td><td>${j.date}</td><td style="font-family:monospace;font-size:9px">${j.assetNum}</td><td>${j.assetDesc||'—'}</td><td>${j.dept||'—'}</td><td><span class="${j.priority==='High'?'hi':'lo'}">${j.priority||'—'}</span></td><td>${j.target||'—'}</td><td><span class="badge ${sc}">${j.status}</span></td></tr>`;
    }).join('');
    openPrintWindow('Open Job Orders', `
      <div class="meta" style="margin-bottom:10px"><span>Pending: <b>${open.length}</b></span><span>Open: <b>${jobOrders.filter(j=>j.status==='OPEN').length}</b></span><span>In Progress: <b>${jobOrders.filter(j=>j.status==='IN PROGRESS').length}</b></span></div>
      <table><thead><tr><th>Job No.</th><th>Date</th><th>Asset No.</th><th>Asset</th><th>Dept</th><th>Priority</th><th>Target</th><th>Status</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:20px">No open job orders.</td></tr>'}</tbody></table>`);
  }

  const brokenCount = assets.filter(a=>['BREAKDOWN','UNDER MAINTENANCE','Inactive','idle'].includes(a.status)).length;
  const openCount   = jobOrders.filter(j=>j.status!=='CLOSED').length;
  const plantCount  = [...new Set(assets.map(a=>a.plant))].length;

  return (
    <div>
      <div className="page-header">
        <div className="page-title">REPORTS <span>& EXPORTS</span></div>
        <div className="page-sub">GENERATE AND DOWNLOAD MAINTENANCE REPORTS AS PDF</div>
      </div>
      <div className="report-grid">
        <div className="report-card">
          <div className="report-card-icon">📋</div>
          <div className="report-card-title">Asset Master List</div>
          <div className="report-card-desc">Full asset registry with all equipment, status, capacity, serial numbers, and location details across all plants.</div>
          <div className="report-card-meta">{assets.length} assets · {plantCount} plants</div>
          <button className="btn btn-accent" onClick={dlAssetMasterList}>↓ Download PDF</button>
        </div>
        <div className="report-card">
          <div className="report-card-icon">🗂️</div>
          <div className="report-card-title">All Job Orders</div>
          <div className="report-card-desc">Complete log of all raised job orders including problem details, technician records, parts used, and completion status.</div>
          <div className="report-card-meta">{jobOrders.length} total job orders</div>
          <button className="btn btn-accent" onClick={dlAllJobOrders}>↓ Download PDF</button>
        </div>
        <div className="report-card">
          <div className="report-card-icon">⚠️</div>
          <div className="report-card-title">Breakdown / Maintenance Report</div>
          <div className="report-card-desc">Assets currently in BREAKDOWN, UNDER MAINTENANCE, or INACTIVE status requiring attention or ongoing repair.</div>
          <div className="report-card-meta">{brokenCount} asset{brokenCount!==1?'s':''} affected</div>
          <button className="btn btn-danger" onClick={dlBreakdownReport}>↓ Download PDF</button>
        </div>
        <div className="report-card">
          <div className="report-card-icon">🔧</div>
          <div className="report-card-title">Open Job Orders</div>
          <div className="report-card-desc">All open and in-progress job orders pending completion, including priority levels and target dates.</div>
          <div className="report-card-meta">{openCount} pending</div>
          <button className="btn btn-primary" onClick={dlOpenJobOrders}>↓ Download PDF</button>
        </div>
      </div>
    </div>
  );
}

// ─── SETTINGS PAGE ────────────────────────────────────────────────────────────
function SettingsPage({users, currentUser, onSaveUser, onDeleteUser, onResetData}) {
  const isAdmin = currentUser.role==='Admin';
  const [tab, setTab] = useState(isAdmin?'users':'profile');
  const [userModal, setUserModal] = useState(null);
  const [deleteConfirm, setDeleteConfirm] = useState(null);

  function roleBadge(role) {
    const cls = role==='Admin'?'role-admin':role==='Senior Engineer'?'role-senior':'role-engineer';
    return <span className={`user-role-badge ${cls}`}>{role.toUpperCase()}</span>;
  }

  return (
    <div>
      <div className="page-header">
        <div className="page-title">SYSTEM <span>SETTINGS</span></div>
        <div className="page-sub">USER MANAGEMENT & ACCESS CONTROL</div>
      </div>

      <div className="settings-tabs">
        {isAdmin&&<div className={`settings-tab${tab==='users'?' active':''}`} onClick={()=>setTab('users')}>Users</div>}
        <div className={`settings-tab${tab==='profile'?' active':''}`} onClick={()=>setTab('profile')}>My Profile</div>
        {isAdmin&&<div className={`settings-tab${tab==='reset'?' active':''}`} onClick={()=>setTab('reset')} style={{color:tab==='reset'?'var(--red)':''}}>Reset Data</div>}
      </div>

      {tab==='users' && (
        <div>
          <div className="panel">
            <div className="panel-head">
              <div className="panel-title">System Users ({users.length})</div>
              <button className="btn btn-accent btn-sm" onClick={()=>setUserModal({mode:'add'})}>＋ Add User</button>
            </div>
            <div className="tbl-wrap">
              <table>
                <thead><tr>
                  <th>#</th><th>Full Name</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th>
                </tr></thead>
                <tbody>
                  {users.map(u=>(

// ─── CATEGORY PANEL ROW (module-level to avoid remount) ──────────────────────
function CategoryPanelRow({name, onRename}) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(name);
  function save() {
    const upper = draft.trim().toUpperCase();
    if (upper && upper !== name) onRename(name, upper);
    setEditing(false);
  }
  return (
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:7,padding:'9px 12px',background:'rgba(255,255,255,.03)',borderRadius:6,border:'1px solid var(--border)'}}>
      {editing
        ? <>
            <input value={draft} onChange={e=>setDraft(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter')save();if(e.key==='Escape'){setEditing(false);setDraft(name);}}}
              style={{flex:1,fontSize:13}} autoFocus/>
            <button className="btn btn-success btn-sm" onClick={save}>Save</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>{setEditing(false);setDraft(name);}}>✕</button>
          </>
        : <>
            <span style={{flex:1,fontFamily:'var(--fh)',fontSize:13,fontWeight:600}}>{name}</span>
            <button className="btn btn-warning btn-sm btn-icon" title="Rename" onClick={()=>{setEditing(true);setDraft(name);}}>✏</button>
          </>
      }
    </div>
  );
}

// ─── ASSET FORM MODAL ─────────────────────────────────────────────────────────
function AssetFormModal({mode, asset, assets, onClose, onSave, customPlants=[], onAddPlant, onRenameCategory}) {
  const [f, setF] = useState(asset ? {...asset} : {num:'',plant:'',desc:'',code:'',model:'',cap:'',reg:'',eng:'',serial:'',loc:'',status:'OPERATIONAL'});
  const [showNew, setShowNew] = useState(false);
  const [newName, setNewName] = useState('');
  const [showCatPanel, setShowCatPanel] = useState(false);
  // customPlants now contains ALL categories (built-in + custom), de-duped
  const allPlants = [...new Set(customPlants)].sort();

  function handleSave() {
    if (!f.num.trim()) { alert('Asset number required'); return; }
    if (!f.desc.trim()) { alert('Description required'); return; }
    if (!f.plant) { alert('Asset category required'); return; }
    onSave(f, mode==='edit' ? asset.num : null);
  }

  function saveNewPlant() {
    const name = newName.trim().toUpperCase();
    if (!name) return;
    onAddPlant && onAddPlant(name);
    setF({...f, plant:name});
    setShowNew(false); setNewName('');
  }

  const fld = (label, key, opts={}) => (
    <div className="form-group">
      <label>{label}</label>
      <input type={opts.type||'text'} value={f[key]||''} onChange={e=>setF({...f,[key]:e.target.value})} placeholder={opts.placeholder||''} readOnly={opts.readonly}/>
    </div>
  );

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-head">
          <div className="modal-title">{mode==='add'?'Add New Asset':`Edit Asset — ${asset?.num}`}</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <button className="btn btn-warning btn-sm" onClick={()=>setShowCatPanel(true)}>⚙ Edit Categories</button>
            <button className="modal-close" onClick={onClose}>×</button>
          </div>
        </div>
        <div className="modal-body">
          {mode==='edit'&&<div className="edit-mode-banner">✏ Editing existing asset — changes will be saved to the registry</div>}
          <div className="form-row">{fld('Asset Number','num')}{fld('Description','desc')}</div>
          <div className="form-row">
            <div className="form-group">
              <label>Asset Category</label>
              <select value={showNew?'__new__':f.plant} onChange={e=>{
                if(e.target.value==='__new__'){setShowNew(true);}
                else{setShowNew(false);setF({...f,plant:e.target.value});}
              }}>
                <option value="">— Select Category —</option>
                {allPlants.map(p=><option key={p} value={p}>{p.toUpperCase()}</option>)}
                <option value="__new__">New...</option>
              </select>
            </div>
            {showNew
              ? <div className="form-group">
                  <label>New Category Name</label>
                  <div style={{display:'flex',gap:8}}>
                    <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Category name" onKeyDown={e=>e.key==='Enter'&&saveNewPlant()} style={{flex:1}}/>
                    <button className="btn btn-success btn-sm" onClick={saveNewPlant}>Save</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>{setShowNew(false);setNewName('');}}>✕</button>
                  </div>
                </div>
              : fld('Equipment Code','code')
            }
          </div>
          <div className="form-row">{fld('Model / Make','model')}{fld('Capacity','cap')}</div>
          <div className="form-row">{fld('Register Number','reg')}{fld('Engine Number','eng')}</div>
          <div className="form-row">{fld('Serial / Chassis No.','serial')}{fld('Location','loc')}</div>
          <div className="form-row">
            <div className="form-group">
              <label>Status</label>
              <select value={f.status||'OPERATIONAL'} onChange={e=>setF({...f,status:e.target.value})}>
                {['OPERATIONAL','BREAKDOWN','UNDER MAINTENANCE','NEW','Inactive','idle'].map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:8}}>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-success" onClick={handleSave}>💾 {mode==='add'?'Save Asset':'Update Asset'}</button>
          </div>
        </div>
      </div>

      {/* Slide-in categories panel */}
      {showCatPanel&&(
        <>
          <div style={{position:'fixed',inset:0,zIndex:250,background:'rgba(0,0,0,.35)'}} onClick={()=>setShowCatPanel(false)}/>
          <div style={{position:'fixed',right:0,top:0,bottom:0,width:340,background:'var(--navy2)',borderLeft:'2px solid rgba(245,158,11,.25)',zIndex:260,display:'flex',flexDirection:'column',boxShadow:'-20px 0 60px rgba(0,0,0,.6)'}}>
            <div style={{padding:'18px 22px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',background:'rgba(245,158,11,.06)'}}>
              <div>
                <div style={{fontFamily:'var(--fh)',fontSize:18,fontWeight:700}}>Edit Categories</div>
                <div style={{fontSize:10,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,marginTop:2}}>CLICK ✏ TO RENAME · UPDATES ALL ASSETS</div>
              </div>
              <button className="modal-close" onClick={()=>setShowCatPanel(false)}>×</button>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'14px 16px'}}>
              {allPlants.map(p=>(
                <CategoryPanelRow key={p} name={p} onRename={(oldN,newN)=>{onRenameCategory&&onRenameCategory(oldN,newN);}}/>

          </div>
        </>
      )}

  );
}

// ─── JO FORM MODAL ────────────────────────────────────────────────────────────
function JOFormModal({mode, jo, preAsset, assets, joCounter, onClose, onSave, employees=[]}) {
  const today = new Date().toISOString().split('T')[0];
  const [f, setF] = useState(() => {
    if (jo) return {...jo, manpower: jo.manpower || [{empId:'',name:'',designation:'',hours:''}]};
    const base = {
      date:today, requester:'', dept:'', assetNum:'', assetDesc:'', assetCategory:'', location:'',
      eqcode:'', problem:'', priority:'High', repairType:'Planned',
      recvName:'', section:'', target:'',
      manpower:[{empId:'',name:'',designation:'',hours:''}],
      parts:[{itemCode:'',desc:'',qty:'',unit:''}],
      workDone:'', workStatus:'', eval:'', downtime:'', accept:'Accepted', status:'OPEN', completionDate:'',
    };
    if (preAsset) {
      const a = assets.find(x=>x.num===preAsset);
      if (a) return {...base, assetNum:a.num, assetDesc:a.desc, assetCategory:(a.plant||'').toUpperCase(), location:a.loc||a.plant||'', eqcode:a.code||''};
      return {...base, assetNum:preAsset};
    }
    return base;
  });
  const [assetSearch, setAssetSearch] = useState('');
  const [assetOpen, setAssetOpen] = useState(false);
  const sortedAssets = [...assets].sort((a,b)=>(parseInt(a.num)||0)-(parseInt(b.num)||0));
  const filteredAssets = sortedAssets.filter(a =>
    !assetSearch ||
    a.num.toLowerCase().includes(assetSearch.toLowerCase()) ||
    a.desc.toLowerCase().includes(assetSearch.toLowerCase()) ||
    (a.plant||'').toLowerCase().includes(assetSearch.toLowerCase())
  );

  function populateAsset(num) {
    const a = assets.find(x=>x.num===num);
    if (a) setF(prev=>({...prev,assetNum:num,assetDesc:a.desc,assetCategory:(a.plant||'').toUpperCase(),location:a.loc||a.plant,eqcode:a.code||''}));
    else setF(prev=>({...prev,assetNum:num,assetCategory:''}));
  }

  function setParts(idx, key, val) {
    setF(prev=>{
      const parts = [...(prev.parts||[])];
      parts[idx] = {...parts[idx],[key]:val};
      return {...prev,parts};
    });
  }
  function addPart() { setF(prev=>({...prev,parts:[...(prev.parts||[]),{itemCode:'',desc:'',qty:'',unit:''}]})); }
  function removePart(idx) { setF(prev=>({...prev,parts:(prev.parts||[]).filter((_,i)=>i!==idx)})); }

  function handleSave() {
    if (!f.assetNum) { alert('Please select an asset'); return; }
    if (!f.date) { alert('Please enter a date'); return; }
    onSave(f, mode==='edit' ? jo.jobNo : null);
  }

  const fld = (label, key, opts={}) => (
    <div className="form-group">
      <label>{label}</label>
      {opts.textarea
        ? <textarea value={f[key]||''} onChange={e=>setF({...f,[key]:e.target.value})} placeholder={opts.placeholder||''}/>
        : opts.select
          ? <select value={f[key]||''} onChange={e=>setF({...f,[key]:e.target.value})}>{opts.options.map(o=><option key={o}>{o}</option>)}</select>
          : <input type={opts.type||'text'} value={f[key]||''} onChange={e=>setF({...f,[key]:e.target.value})} placeholder={opts.placeholder||''} readOnly={opts.readonly}/>
      }
    </div>
  );

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{width:860}}>
        <div className="modal-head">
          <div className="modal-title">{mode==='add'?'Raise Job Order':`Edit Job Order — ${jo?.jobNo}`}</div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {mode==='edit'&&<div className="edit-mode-banner">✏ Editing existing job order</div>}
          <div style={{fontFamily:'var(--fm)',fontSize:11,color:'var(--accent)',marginBottom:12}}>JOB NO: {mode==='edit'?jo.jobNo:`JO-${joCounter+1} (auto)`}</div>

          <div className="jc-section">
            <div className="jc-section-title">Request Information</div>
            <div className="form-row">
              <div className="form-group"><label>Date</label><input type="date" value={f.date} onChange={e=>setF({...f,date:e.target.value})}/></div>
              {fld('Requested By','requester')}
            </div>
            <div className="form-row">{fld('Department','dept')}</div>
          </div>

          <div className="jc-section">
            <div className="jc-section-title">Equipment Details</div>

            {/* Search + Asset Number row */}
            <div style={{display:'flex',gap:14,marginBottom:14}}>
              <div className="form-group" style={{flex:3,position:'relative',marginBottom:0}}>
                <label>Search</label>
                <input
                  value={assetSearch}
                  onChange={e=>{setAssetSearch(e.target.value);setAssetOpen(true);}}
                  onFocus={()=>setAssetOpen(true)}
                  placeholder="Search by asset number or description..."
                  autoComplete="off"
                />
                {assetOpen&&(
                  <>
                    <div style={{position:'fixed',inset:0,zIndex:299}} onClick={()=>{setAssetOpen(false);}}/>
                    <div style={{position:'absolute',top:'calc(100% + 3px)',left:0,right:0,background:'var(--navy2)',border:'1px solid var(--border)',borderTop:'2px solid var(--accent)',borderRadius:'0 0 6px 6px',zIndex:300,maxHeight:220,overflowY:'auto',boxShadow:'0 16px 48px rgba(0,0,0,.75)'}}>
                      {filteredAssets.length===0
                        ? <div style={{padding:'14px 16px',color:'var(--gray)',fontSize:12,fontFamily:'var(--fm)'}}>No assets match "{assetSearch}"</div>

                <div className="checkbox-row">

                </div>

              <div>
                <label style={{fontSize:11,fontFamily:'var(--fm)',color:'var(--gray)',letterSpacing:1,textTransform:'uppercase',display:'block',marginBottom:8}}>Evaluation</label>

                </div>

            <div className="form-row" style={{marginTop:14}}>
              {fld('Downtime (hours)','downtime',{type:'number'})}
              <div className="form-group">
                <label>Acceptance</label>
                <select value={f.accept||'Accepted'} onChange={e=>setF({...f,accept:e.target.value})}>

                  <option value="Rejected">Rejected the repair</option>

            <div className="form-row single">
              <div className="form-group"><label>Completion Date</label><input type="date" value={f.completionDate||''} onChange={e=>setF({...f,completionDate:e.target.value})}/></div>
            </div>
          </div>

          <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:6}}>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={()=>{
              if(!f.assetNum){alert('Please select an asset');return;}
              if(!f.date){alert('Please enter a date');return;}
              const previewJO={...f,jobNo:mode==='edit'?jo.jobNo:`JO-${joCounter+1}`};

            <button className="btn btn-success" onClick={handleSave}>💾 {mode==='add'?'Save Job Order':'Update Job Order'}</button>

        </div>
      </div>
    </div>
  );
}
