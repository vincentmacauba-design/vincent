// ─── PM SCHEDULE PAGE ─────────────────────────────────────────────────────────
function PMSchedulePage({pm, assets, setJoModal, onSavePM, onRecordService, onImportPM, onExportPM, currentUser={}}) {
  const today = new Date().toISOString().split('T')[0];
  const pmImportRef = useRef(null);
  const [q, setQ] = useState('');
  const [filterFreq, setFilterFreq] = useState('');
  const [filterCat, setFilterCat] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [historyModal, setHistoryModal] = useState(null);
  const [recordModal, setRecordModal] = useState(null);
  const [recordDate, setRecordDate] = useState(today);
  const [recordNotes, setRecordNotes] = useState('');
  const [recordJobNo, setRecordJobNo] = useState('');
  const [pmForm, setPmForm] = useState(null);
  const [pmF, setPmF] = useState({});
  const [sortPMCol, setSortPMCol] = useState('daysUntil');

  const canEdit = currentUser.role !== 'Senior Engineer';

  const SortThPM = ({label, col}) => (
    <th onClick={()=>setSortPMCol(col)} style={{cursor:'pointer',userSelect:'none',whiteSpace:'nowrap'}}>
      {label}{sortPMCol===col&&<span style={{marginLeft:4,color:'var(--accent)'}}>↑</span>}
    </th>
  );

  function daysUntil(ns) {
    if (!ns) return null;
    return Math.ceil((new Date(ns+'T00:00:00') - new Date(today+'T00:00:00')) / 86400000);
  }
  function statusInfo(days) {
    if (days===null) return {text:'Not set',color:'var(--gray)'};
    if (days<0)  return {text:`${Math.abs(days)}d overdue`,color:'var(--red)'};
    if (days===0) return {text:'Due Today',color:'var(--orange)'};
    if (days<=7) return {text:`${days}d`,color:'var(--yellow)'};
    return {text:`${days}d`,color:'var(--green)'};
  }

  const allCats = [...new Set(pm.map(p=>p.category).filter(Boolean))].sort();
  const filtered = pm.filter(p => {
    const days = daysUntil(p.nextService);
    const sOk = !filterStatus ||
      (filterStatus==='overdue'   && days!==null && days<0) ||
      (filterStatus==='due-soon'  && days!==null && days>=0 && days<=7) ||
      (filterStatus==='ok'        && days!==null && days>7);
    const hay = [p.assetNum,p.assetDesc,p.category,p.location].join(' ').toLowerCase();
    return (!q||hay.includes(q.toLowerCase())) && (!filterFreq||p.frequency===filterFreq) && (!filterCat||p.category===filterCat) && sOk;
  }).sort((a,b)=>{
    if (sortPMCol==='daysUntil') {
      const da=daysUntil(a.nextService), db=daysUntil(b.nextService);
      if (da===null&&db===null) return 0;
      if (da===null) return 1;
      if (db===null) return -1;
      return da-db;
    }
    return (a[sortPMCol]||'').toString().localeCompare((b[sortPMCol]||'').toString());
  });

  const overdueN  = pm.filter(p=>{const d=daysUntil(p.nextService);return d!==null&&d<0;}).length;
  const dueSoonN  = pm.filter(p=>{const d=daysUntil(p.nextService);return d!==null&&d>=0&&d<=7;}).length;
  const upToDateN = pm.filter(p=>{const d=daysUntil(p.nextService);return d!==null&&d>7;}).length;

  function openAdd() {
    setPmF({assetNum:'',assetDesc:'',category:'',location:'',frequency:'Monthly',nextService:'',notes:''});
    setPmForm({mode:'add'});
  }
  function openEdit(item) {
    setPmF({...item});
    setPmForm({mode:'edit',id:item.id});
  }
  function populatePMAsset(num) {
    const a = assets.find(x=>x.num===num);
    if (a) setPmF(prev=>({...prev,assetNum:num,assetDesc:a.desc,category:a.plant,location:a.loc||a.plant}));
    else setPmF(prev=>({...prev,assetNum:num}));
  }
  function savePM() {
    if (!pmF.assetDesc||!pmF.frequency) { alert('Asset and frequency required'); return; }
    onSavePM(pmF, pmForm.mode==='edit'?pmForm.id:null);
    setPmForm(null);
  }
  function doRecord() {
    if (!recordDate) { alert('Service date required'); return; }
    onRecordService(recordModal.id, {date:recordDate, notes:recordNotes, jobNo:recordJobNo||null});
    setRecordModal(null); setRecordNotes(''); setRecordJobNo('');
  }

  const FreqBadge = ({freq}) => {
    const s = FREQ_STYLE[freq]||{color:'var(--gray)',bg:'rgba(148,163,184,.1)',bd:'rgba(148,163,184,.2)'};
    return <span style={{display:'inline-block',padding:'2px 9px',borderRadius:3,fontSize:10,fontFamily:'var(--fm)',fontWeight:700,letterSpacing:.5,background:s.bg,color:s.color,border:`1px solid ${s.bd}`}}>{freq}</span>;
  };

  return (
    <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 58px)'}}>
      {/* Header row — title + action buttons */}
      <div className="page-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12,flexShrink:0}}>
        <div>
          <div className="page-title">PM <span>SCHEDULE</span></div>
          <div className="page-sub">PREVENTIVE MAINTENANCE SCHEDULE — MACHINERY & EQUIPMENT</div>
        </div>
        <div className="controls">
          {canEdit&&<button className="btn btn-accent" onClick={openAdd}>＋ Add PM Schedule</button>}
          <button className="btn btn-csv btn-sm" onClick={onExportPM}>↓ Export</button>
          {canEdit&&<label className="btn btn-csv btn-sm" style={{cursor:'pointer'}}>↑ Import
            <input type="file" accept=".csv" style={{display:'none'}} ref={pmImportRef} onChange={e=>{if(e.target.files[0]){onImportPM(e.target.files[0]);e.target.value='';}}}/>
          </label>}
          {canEdit&&<button className="btn btn-csv btn-sm" onClick={downloadPMTemplate}>⬇ Template</button>}
        </div>
      </div>

      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16,flexShrink:0}}>
        {[['Total',pm.length,'var(--blue)','sc-blue'],['Overdue',overdueN,'var(--red)','sc-red'],['Due Soon',dueSoonN,'var(--yellow)','sc-yellow'],['Up to Date',upToDateN,'var(--green)','sc-green']].map(([l,n,c,cls])=>(
          <div key={l} className={`stat-card ${cls}`} style={{padding:'10px 14px'}}>
            <div style={{fontFamily:'var(--fh)',fontSize:24,fontWeight:700,color:c,lineHeight:1}}>{n}</div>
            <div style={{fontSize:10,color:'var(--gray)',fontFamily:'var(--fm)',letterSpacing:1,marginTop:3,textTransform:'uppercase'}}>{l}</div>
          </div>
        ))}
      </div>

      {/* Search + filter toolbar above table */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'flex-end',gap:6,padding:'6px 12px',background:'var(--navy2)',borderRadius:'8px 8px 0 0',borderBottom:'2px solid var(--border)',flexShrink:0}}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Search assets..." style={{fontSize:12,padding:'5px 10px',minWidth:180,background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.12)',color:'var(--white)',borderRadius:5,outline:'none'}}/>
        <select value={filterFreq} onChange={e=>setFilterFreq(e.target.value)} style={{fontSize:12,padding:'5px 8px'}}>
          <option value="">All Frequencies</option>
          {['Weekly','Monthly','Quarterly','Half-Yearly','Yearly'].map(f=><option key={f}>{f}</option>)}
        </select>
        <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={{fontSize:12,padding:'5px 8px'}}>
          <option value="">All Categories</option>
          {allCats.map(c=><option key={c}>{c}</option>)}
        </select>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{fontSize:12,padding:'5px 8px'}}>
          <option value="">All Status</option>
          <option value="overdue">Overdue</option>
          <option value="due-soon">Due Soon (≤7d)</option>
          <option value="ok">Up to Date</option>
        </select>
      </div>

      {/* Table fills remaining height */}
      <div className="panel" style={{borderTopLeftRadius:0,borderTopRightRadius:0,borderTop:'none',flex:1,overflow:'hidden',display:'flex',flexDirection:'column',marginBottom:0}}>
        <div className="tbl-wrap" style={{flex:1,overflowY:'auto'}}>
          <table>
            <thead><tr>
              <SortThPM label="Asset"        col="assetDesc"/>
              <SortThPM label="Category"     col="category"/>
              <SortThPM label="Location"     col="location"/>
              <SortThPM label="Frequency"    col="frequency"/>
              <SortThPM label="Last Service" col="lastService"/>
              <SortThPM label="Next Service" col="nextService"/>
              <SortThPM label="Days Until"   col="daysUntil"/>
              <th>Actions</th>
            </tr></thead>
            <tbody>
              {filtered.length===0&&<tr><td colSpan={8}><div className="empty-state" style={{padding:40}}>No PM schedules found</div></td></tr>}
              {filtered.map(item=>{
                const days = daysUntil(item.nextService);
                const st = statusInfo(days);
                const isOverdue = days!==null && days<0;
                const rowStyle = isOverdue ? {borderLeft:'3px solid var(--red)'} : days===0 ? {borderLeft:'3px solid var(--orange)'} : {};
                return (
                  <tr key={item.id} style={rowStyle}>
                    <td>
                      <strong style={{fontSize:13}}>{item.assetDesc}</strong>
                      <div style={{fontSize:11,color:'var(--accent)',fontFamily:'var(--fm)',marginTop:2}}>{item.assetNum}</div>
                      {item.notes&&<div style={{fontSize:10,color:'var(--gray)',marginTop:2,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={item.notes}>{item.notes}</div>}
                    </td>
                    <td style={{fontSize:11}}>{item.category}</td>
                    <td style={{fontSize:12}}>{item.location}</td>
                    <td><FreqBadge freq={item.frequency}/></td>
                    <td style={{fontFamily:'var(--fm)',fontSize:12,color:item.lastService?'var(--white)':'var(--gray)'}}>{item.lastService||'—'}</td>
                    <td style={{fontFamily:'var(--fm)',fontSize:12,color:item.nextService?'var(--white)':'var(--gray)'}}>{item.nextService||'—'}</td>
                    <td>
                      <span style={{fontFamily:'var(--fm)',fontSize:12,fontWeight:isOverdue?700:500,color:st.color}}>
                        {st.text}
                      </span>
                    </td>
                    <td>
                      <div style={{display:'flex',gap:4,flexWrap:'nowrap'}}>
                        <button className="btn btn-ghost btn-sm btn-icon" title="Service History" style={{padding:'3px 5px',fontSize:11}} onClick={()=>setHistoryModal(item)}>📋</button>
                        {canEdit&&<button className="btn btn-success btn-sm btn-icon" title="Record Service" style={{padding:'3px 5px',fontSize:11}} onClick={()=>{setRecordModal(item);setRecordDate(today);setRecordNotes('');setRecordJobNo('');}}>✓</button>}
                        {canEdit&&<button className="btn btn-primary btn-sm btn-icon" title="Raise Job Order" style={{padding:'3px 5px',fontSize:11}} onClick={()=>setJoModal({mode:'add',preAsset:item.assetNum})}>＋JO</button>}
                        {canEdit&&<button className="btn btn-warning btn-sm btn-icon" title="Edit" style={{padding:'3px 5px',fontSize:11}} onClick={()=>openEdit(item)}>✏</button>}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Service History Modal */}
      {historyModal&&(
        <div className="modal-overlay" onClick={()=>setHistoryModal(null)}>
          <div className="modal" style={{width:640}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <div className="modal-title">{historyModal.assetDesc} — Service History</div>
                <div style={{fontSize:11,color:'var(--gray)',fontFamily:'var(--fm)',marginTop:2}}>{historyModal.assetNum} · <FreqBadge freq={historyModal.frequency}/></div>
              </div>
              <button className="modal-close" onClick={()=>setHistoryModal(null)}>×</button>
            </div>
            <div className="modal-body">
              <div style={{display:'flex',gap:20,marginBottom:16,fontSize:12,flexWrap:'wrap'}}>
                <span>Last Service: <strong style={{color:'var(--green)'}}>{historyModal.lastService||'—'}</strong></span>
                <span>Next Service: <strong style={{color:daysUntil(historyModal.nextService)<0?'var(--red)':'var(--accent)'}}>{historyModal.nextService||'—'}</strong></span>
                <span>Status: <strong style={{color:statusInfo(daysUntil(historyModal.nextService)).color}}>{statusInfo(daysUntil(historyModal.nextService)).text}</strong></span>
              </div>
              {(historyModal.serviceHistory||[]).length===0
                ? <div className="empty-state" style={{padding:24}}>No service history recorded yet</div>
                : <div className="tbl-wrap">
                    <table>
                      <thead><tr><th>Service Date</th><th>Notes</th><th>Job No.</th></tr></thead>
                      <tbody>
                        {[...(historyModal.serviceHistory||[])].map((h,i)=>(
                          <tr key={i}>
                            <td style={{fontFamily:'var(--fm)',fontSize:12,color:'var(--accent)',width:120}}>{h.date}</td>
                            <td style={{fontSize:12}}>{h.notes||'—'}</td>
                            <td style={{fontFamily:'var(--fm)',fontSize:12,color:'var(--gray)'}}>{h.jobNo||'—'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
              }
              <div style={{marginTop:16,display:'flex',justifyContent:'flex-end'}}>
                <button className="btn btn-ghost" onClick={()=>setHistoryModal(null)}>Close</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Record Service Modal */}
      {recordModal&&(
        <div className="modal-overlay" onClick={()=>setRecordModal(null)}>
          <div className="modal" style={{width:460}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">Record Service — {recordModal.assetDesc}</div>
              <button className="modal-close" onClick={()=>setRecordModal(null)}>×</button>
            </div>
            <div className="modal-body">
              <div style={{fontSize:12,color:'var(--gray)',marginBottom:14}}>
                Frequency: <FreqBadge freq={recordModal.frequency}/>{' '}
                Next service will be auto-computed as <strong style={{color:'var(--accent)'}}>{computeNextService(recordDate,recordModal.frequency)||'—'}</strong>
              </div>
              <div className="form-row">
                <div className="form-group"><label>Service Date *</label><input type="date" value={recordDate} onChange={e=>setRecordDate(e.target.value)}/></div>
                <div className="form-group"><label>Linked Job No. (optional)</label><input value={recordJobNo} onChange={e=>setRecordJobNo(e.target.value)} placeholder="JO-XXXX"/></div>
              </div>
              <div className="form-group">
                <label>Service Notes</label>
                <textarea value={recordNotes} onChange={e=>setRecordNotes(e.target.value)} placeholder="Describe work done, parts replaced, observations..."/>
              </div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:8}}>
                <button className="btn btn-ghost" onClick={()=>setRecordModal(null)}>Cancel</button>
                <button className="btn btn-success" onClick={doRecord}>✓ Save Service Record</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Add / Edit PM Modal */}
      {pmForm&&(
        <div className="modal-overlay" onClick={()=>setPmForm(null)}>
          <div className="modal" style={{width:600}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">{pmForm.mode==='add'?'Add PM Schedule':'Edit PM Schedule'}</div>
              <button className="modal-close" onClick={()=>setPmForm(null)}>×</button>
            </div>
            <div className="modal-body">
              <div className="form-row">
                <div className="form-group">
                  <label>Asset Number</label>
                  <select value={pmF.assetNum||''} onChange={e=>populatePMAsset(e.target.value)}>
                    <option value="">— Select Asset —</option>
                    {assets.map(a=><option key={a.num} value={a.num}>{a.num} — {a.desc}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label>Frequency *</label>
                  <select value={pmF.frequency||'Monthly'} onChange={e=>setPmF({...pmF,frequency:e.target.value})}>
                    {['Weekly','Monthly','Quarterly','Half-Yearly','Yearly'].map(f=><option key={f}>{f}</option>)}
                  </select>
                </div>
              </div>
              <div className="form-row">
                <div className="form-group"><label>Asset Description</label><input value={pmF.assetDesc||''} onChange={e=>setPmF({...pmF,assetDesc:e.target.value})}/></div>
                <div className="form-group"><label>Location</label><input value={pmF.location||''} onChange={e=>setPmF({...pmF,location:e.target.value})}/></div>
              </div>
              <div className="form-row">
                <div className="form-group"><label>Category</label><input value={pmF.category||''} onChange={e=>setPmF({...pmF,category:e.target.value})}/></div>
                <div className="form-group"><label>Next Service Date</label><input type="date" value={pmF.nextService||''} onChange={e=>setPmF({...pmF,nextService:e.target.value})}/></div>
              </div>
              <div className="form-group">
                <label>PM Notes / Checklist</label>
                <textarea value={pmF.notes||''} onChange={e=>setPmF({...pmF,notes:e.target.value})} placeholder="Describe what should be checked/done during this PM..."/>
              </div>
              <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:8}}>
                <button className="btn btn-ghost" onClick={()=>setPmForm(null)}>Cancel</button>
                <button className="btn btn-success" onClick={savePM}>💾 {pmForm.mode==='add'?'Add Schedule':'Update Schedule'}</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── EMPLOYEES PAGE ───────────────────────────────────────────────────────────
function EmployeesPage({employees, onSaveEmployee, onUpdateStatus, currentUser={}}) {
  const today = new Date().toISOString().split('T')[0];
  const [tab, setTab] = useState('active');
  const [q, setQ] = useState('');
  const [filterSection, setFilterSection] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [sortCol, setSortCol] = useState('empId');
  const [empForm, setEmpForm] = useState(null); // null=closed, {empId,name,...}=open
  const [empFormIsEdit, setEmpFormIsEdit] = useState(false);
  const [updateModal, setUpdateModal] = useState(null);
  const [updateType, setUpdateType] = useState('leave');
  const [leaveType, setLeaveType] = useState('AL');
  const [leaveStart, setLeaveStart] = useState('');
  const [leaveEnd, setLeaveEnd] = useState('');
  const [exitDate, setExitDate] = useState('');
  const [updateRemarks, setUpdateRemarks] = useState('');
  const [historyModal, setHistoryModal] = useState(null);
  const [showResignModal, setShowResignModal] = useState(false);
  const importRef = useRef(null);

  const isActive   = emp => !emp.exitDate || emp.exitDate > today;
  const getStatus  = emp => {
    if (!isActive(emp)) return 'INACTIVE';
    const s = emp.siteStatus || 'ON DUTY';
    if (s==='ON LEAVE' && emp.leaveEnd && emp.leaveEnd < today) return 'ON DUTY';
    return s;
  };
  const fmtD = d => { if (!d||d==='—') return '—'; try { const [y,m,dy]=d.split('-'); return `${dy}-${m}-${y.slice(2)}`; } catch(_){return d;} };
  const empStatusCls = s => s==='ON DUTY'?'so':s==='INACTIVE'?'sb':s==='OFF SITE'?'sn':s==='PENDING RESIGN'?'sm':'sl';
  const shortStatus  = s => s==='ON DUTY'?'OD':s==='ON LEAVE'?'OL':s==='OFF SITE'?'OS':s==='INACTIVE'?'INACT':s==='PENDING RESIGN'?'PR':s;

  const allSections = [...new Set(employees.map(e=>e.section).filter(Boolean))].sort();
  const pendingResign = employees.filter(e=>isActive(e)&&e.exitDate).sort((a,b)=>a.exitDate.localeCompare(b.exitDate));

  const displayList = employees
    .filter(e => {
      const active = isActive(e);
      if (tab==='active' && !active) return false;
      if (tab==='inactive' && active) return false;
      if (filterSection && e.section!==filterSection) return false;
      if (filterStatus) {
        if (filterStatus==='RESIGN') { if (!e.exitDate) return false; }
        else if (getStatus(e)!==filterStatus) return false;
      }
      if (q && ![e.empId,e.name,e.designation,e.section,e.nationality].join(' ').toLowerCase().includes(q.toLowerCase())) return false;
      return true;
    })
    .sort((a,b)=>{
      if (sortCol==='empId') return (parseInt(a.empId)||0)-(parseInt(b.empId)||0);
      return (a[sortCol]||'').localeCompare(b[sortCol]||'');
    });

  const total       = employees.filter(isActive).length;
  const onDuty      = employees.filter(e=>isActive(e)&&e.siteStatus==='ON DUTY').length;
  const onLeave     = employees.filter(e=>isActive(e)&&e.siteStatus==='ON LEAVE').length;
  const resignCount = employees.filter(e=>isActive(e)&&e.exitDate).length;

  function exportEmpsCSV() {
    const hdr='Emp ID,Name,Designation,Section,Nationality,Site Status,Leave Type,Leave Start,Leave End,Exit Date';
    const rows=employees.map(e=>[e.empId,e.name,e.designation,e.section,e.nationality,e.siteStatus,e.leaveType,e.leaveStart,e.leaveEnd,e.exitDate].map(csvCell).join(','));
    dlCSV([hdr,...rows].join('\n'),'employees_export.csv');
  }
  function downloadEmpTemplate() {
    dlCSV('Emp ID,Name,Designation,Section,Nationality,Site Status,Leave Type,Leave Start,Leave End,Exit Date\n"55050","JOHN DOE","ENGINEER","ENGINEERING ADMINISTRATION","FILIPINO","ON DUTY","","","",""','employees_template.csv');
  }
  function importEmpsFromFile(file) {
    importCSVFile(file, rows=>{
      const newEmps=rows.map(r=>({empId:r[0]||'',name:r[1]||'',designation:r[2]||'',section:r[3]||'',nationality:r[4]||'',siteStatus:r[5]||'ON DUTY',leaveType:r[6]||'',leaveStart:r[7]||'',leaveEnd:r[8]||'',exitDate:r[9]||'',leaveHistory:[]})).filter(e=>e.empId&&e.name);
      setEmployees(prev=>{
        const existing=new Set(prev.map(e=>e.empId));
        const toAdd=newEmps.filter(e=>!existing.has(e.empId));
        if(!toAdd.length){addToast('No new employees to import.');return prev;}
        const next=[...prev,...toAdd];
        persistEmployees(next);
        addToast(toAdd.length+' employee(s) imported.');
        return next;
      });
    });
  }

  const canAdmin = currentUser.role==='Admin';
  const canEdit  = currentUser.role !== 'Senior Engineer'; // can use actions (AE + Admin)

  function doUpdate() {
    if (!updateModal) return;
    let updates = {};
    let entry = {savedOn: today, remarks: updateRemarks};
    if (updateType==='resign') {
      if (!exitDate) { alert('Exit date required'); return; }
      updates = {exitDate, siteStatus:'ON DUTY'};
      entry = {...entry, type:'RESIGN', exitDate};
    } else if (updateType==='offsite') {
      updates = {siteStatus:'OFF SITE'};
      entry = {...entry, type:'OFF SITE'};
    } else {
      if (!leaveStart||!leaveEnd) { alert('Leave dates required'); return; }
      const onL = leaveStart<=today && leaveEnd>=today;
      updates = {leaveType, leaveStart, leaveEnd, siteStatus: onL?'ON LEAVE':'ON DUTY'};
      entry = {...entry, type:leaveType, start:leaveStart, end:leaveEnd};
    }
    updates.leaveHistory = [...(updateModal.leaveHistory||[]), entry];
    onUpdateStatus(updateModal.empId, updates);
    setUpdateModal(null); setUpdateRemarks('');
  }

  const SortTh = ({label,col,style:sx}) => (
    <th onClick={()=>setSortCol(col)} style={{cursor:'pointer',userSelect:'none',whiteSpace:'nowrap',...(sx||{})}}>
      {label}{sortCol===col?<span style={{marginLeft:4,color:'var(--accent)'}}>↑</span>:null}
    </th>
  );

  return (
    <div>
      {/* Header */}
      <div className="page-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div>
          <div className="page-title">EMPLOYEE <span>REGISTRY</span></div>
          <div className="page-sub">MANPOWER MANAGEMENT — SITE STATUS & LEAVE TRACKING</div>
        </div>
        <div className="controls">
          {canAdmin&&<button className="btn btn-accent" onClick={()=>{setEmpForm({empId:'',name:'',designation:'',section:'',nationality:'',siteStatus:'ON DUTY'});setEmpFormIsEdit(false);}}>＋ Add Employee</button>}
          <button className="btn btn-csv btn-sm" onClick={exportEmpsCSV}>↓ Export</button>
          {canAdmin&&<label className="btn btn-csv btn-sm" style={{cursor:'pointer'}}>↑ Import
            <input type="file" accept=".csv" style={{display:'none'}} ref={importRef} onChange={e=>{if(e.target.files[0]){importEmpsFromFile(e.target.files[0]);e.target.value='';}}}/>
          </label>}
          {canAdmin&&<button className="btn btn-csv btn-sm" onClick={downloadEmpTemplate}>⬇ Template</button>}
        </div>
      </div>

      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:18}}>
        {[['Total Active',total,'var(--blue)','sc-blue'],['On Duty',onDuty,'var(--green)','sc-green'],['On Leave',onLeave,'var(--yellow)','sc-yellow'],['Pending Resignation',resignCount,'var(--red)','sc-red']].map(([l,n,c,cls])=>(
          <div key={l} className={`stat-card ${cls}`} style={{padding:'8px 12px',height:60,display:'flex',flexDirection:'column',justifyContent:'center'}}>
            <div style={{fontFamily:'var(--fh)',fontSize:22,fontWeight:700,color:c,lineHeight:1}}>{n}</div>
            <div style={{fontSize:8,color:'var(--gray)',fontFamily:'var(--fm)',letterSpacing:0,marginTop:3,textTransform:'uppercase',whiteSpace:'nowrap'}}>{l}</div>
          </div>
        ))}
      </div>

      {/* Tabs + inline filters */}
      <div style={{display:'flex',alignItems:'stretch',borderBottom:'2px solid var(--border)',background:'var(--navy2)',borderRadius:'8px 8px 0 0',overflow:'hidden'}}>
        <div style={{display:'flex'}}>
          <div className={`settings-tab${tab==='active'?' active':''}`}
            style={{color:tab==='active'?'#10b981':'',borderBottom:tab==='active'?'2px solid #10b981':'2px solid transparent',marginBottom:-2}}
            onClick={()=>{setTab('active');setFilterStatus('');}}>
            Active
            <span style={{fontFamily:'var(--fm)',fontSize:11,marginLeft:5,opacity:.75}}>({employees.filter(isActive).length})</span>
          </div>
          <div className={`settings-tab${tab==='inactive'?' active':''}`}
            style={{color:tab==='inactive'?'#ef4444':'',borderBottom:tab==='inactive'?'2px solid #ef4444':'2px solid transparent',marginBottom:-2}}
            onClick={()=>{setTab('inactive');setFilterStatus('');}}>
            Inactive
            <span style={{fontFamily:'var(--fm)',fontSize:11,marginLeft:5,opacity:.75}}>({employees.filter(e=>!isActive(e)).length})</span>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',marginLeft:'auto',borderLeft:'1px solid var(--border)'}}>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Search..." style={{fontSize:12,padding:'5px 10px',minWidth:160,background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.12)',color:'var(--white)',borderRadius:5,outline:'none'}}/>
          <select value={filterSection} onChange={e=>setFilterSection(e.target.value)} style={{fontSize:12,minWidth:140}}>
            <option value="">All Sections</option>
            {allSections.map(s=><option key={s}>{s}</option>)}
          </select>
          <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{fontSize:12}}>
            <option value="">All Status</option>
            {tab==='active'&&<><option value="ON DUTY">On Duty</option><option value="ON LEAVE">On Leave</option><option value="OFF SITE">Off Site</option><option value="RESIGN">Pending Resignation</option></>}
            {tab==='inactive'&&<option value="INACTIVE">Inactive</option>}
          </select>
        </div>
      </div>

      {/* Table */}
      <div className="panel" style={{borderTopLeftRadius:0,borderTopRightRadius:0,borderTop:'none'}}>
        <div className="tbl-wrap">
          <table style={{tableLayout:'fixed',width:'100%'}}>
            <thead><tr>
              <SortTh label="Emp ID"      col="empId"      style={{width:'7%'}}/>
              <SortTh label="Name"        col="name"       style={{width:'18%'}}/>
              <SortTh label="Designation" col="designation" style={{width:'16%'}}/>
              <SortTh label="Section"     col="section"    style={{width:'12%'}}/>
              <SortTh label="Nationality" col="nationality" style={{width:'9%'}}/>
              <SortTh label="Site Status" col="siteStatus" style={{width:'9%'}}/>
              <th style={{width:'8%'}}>Leave Start</th>
              <th style={{width:'8%'}}>Leave End</th>
              <SortTh label="Exit Date"   col="exitDate"   style={{width:'9%'}}/>
              {canEdit&&<th style={{width:'11%'}}>Actions</th>}
            </tr></thead>
            <tbody>
              {displayList.length===0&&<tr><td colSpan={canEdit?10:9}><div className="empty-state" style={{padding:32}}>No employees found</div></td></tr>}

              {displayList.map(e=>{
                const resigning = isActive(e) && e.exitDate;
                const dispStatus = getStatus(e);
                const rowStyle  = resigning       ? {background:'rgba(245,158,11,.13)',borderLeft:'3px solid rgba(245,158,11,.6)'}
                  : dispStatus==='ON LEAVE' ? {background:'rgba(26,86,219,.15)',borderLeft:'3px solid rgba(26,86,219,.6)'}
                  : dispStatus==='OFF SITE' ? {background:'rgba(16,185,129,.12)',borderLeft:'3px solid rgba(16,185,129,.6)'}
                  : {};
                return (
                <tr key={e.empId} style={rowStyle}>
                  <td style={{fontFamily:'var(--fm)',fontSize:11,color:'var(--accent)'}}>{e.empId}</td>
                  <td style={{fontWeight:600,fontSize:11,maxWidth:180,wordBreak:'break-word'}}>{e.name}</td>
                  <td style={{fontSize:11,maxWidth:160,wordBreak:'break-word'}}>{e.designation}</td>
                  <td style={{fontSize:11,wordBreak:'break-word'}}>{e.section}</td>
                  <td style={{fontSize:11}}>{e.nationality}</td>
                  <td>
                    <span className={`sb-base ${empStatusCls(dispStatus)}`} style={{fontSize:10,whiteSpace:'nowrap'}}>
                      {shortStatus(dispStatus)}
                    </span>
                  </td>
                  <td style={{fontFamily:'var(--fm)',fontSize:11,color:e.leaveStart?'var(--yellow)':'var(--gray)'}}>{fmtD(e.leaveStart)}</td>
                  <td style={{fontFamily:'var(--fm)',fontSize:11,color:e.leaveEnd?'var(--yellow)':'var(--gray)'}}>{fmtD(e.leaveEnd)}</td>
                  <td style={{fontFamily:'var(--fm)',fontSize:11,color:resigning?'var(--accent)':'var(--gray)',fontWeight:resigning?700:400}}>{fmtD(e.exitDate)}</td>
                  {canEdit&&<td>
                    <div style={{display:'flex',gap:3,flexWrap:'nowrap'}}>
                      {canAdmin&&<button className="btn btn-warning btn-sm btn-icon" title="Edit Employee" style={{padding:'3px 6px',fontSize:12}} onClick={()=>{setEmpForm({...e});setEmpFormIsEdit(true);}}>✏</button>}
                      <button className="btn btn-primary btn-sm btn-icon" title="Update Leave / Resignation" style={{padding:'3px 6px',fontSize:12}} onClick={()=>{setUpdateModal(e);setUpdateType('leave');setLeaveType(e.leaveType||'AL');setLeaveStart(e.leaveStart||'');setLeaveEnd(e.leaveEnd||'');setExitDate(e.exitDate||'');setUpdateRemarks('');}}>📅</button>
                      <button className="btn btn-ghost btn-sm btn-icon" title="Leave History" style={{padding:'3px 6px',fontSize:12}} onClick={()=>setHistoryModal(e)}>📜</button>
                    </div>
                  </td>}
                </tr>
              );})}
            </tbody>
          </table>
        </div>
      </div>

      {/* Add / Edit Employee Modal (inline, no nested component) */}
      {empForm&&(
        <div className="modal-overlay" onClick={()=>setEmpForm(null)}>
          <div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">{empFormIsEdit?`Edit — ${empForm.empId}`:'Add New Employee'}</div>
              <button className="modal-close" onClick={()=>setEmpForm(null)}>×</button>
            </div>
            <div className="modal-body">
              <div className="form-row">
                <div className="form-group"><label>Emp ID</label><input value={empForm.empId} onChange={e=>setEmpForm({...empForm,empId:e.target.value})} readOnly={empFormIsEdit}/></div>
                <div className="form-group"><label>Full Name</label><input value={empForm.name||''} onChange={e=>setEmpForm({...empForm,name:e.target.value})}/></div>
              </div>
              <div className="form-row">
                <div className="form-group"><label>Designation</label><input value={empForm.designation||''} onChange={e=>setEmpForm({...empForm,designation:e.target.value})}/></div>
                <div className="form-group">
                  <label>Section</label>
                  <select value={empForm.section||''} onChange={e=>setEmpForm({...empForm,section:e.target.value})}>
                    <option value="">— Select Section —</option>
                    {allSections.map(s=><option key={s}>{s}</option>)}
                    <option value="__other__">Other (type below)</option>
                  </select>
                  {empForm.section==='__other__'&&<input value='' placeholder="Type section name" onChange={e=>setEmpForm({...empForm,section:e.target.value})} style={{marginTop:6}}/>}
                </div>
              </div>
              <div className="form-row">
                <div className="form-group"><label>Nationality</label><input value={empForm.nationality||''} onChange={e=>setEmpForm({...empForm,nationality:e.target.value})}/></div>
                <div className="form-group">
                  <label>Site Status</label>
                  <select value={empForm.siteStatus||'ON DUTY'} onChange={e=>setEmpForm({...empForm,siteStatus:e.target.value})}>
                    <option>ON DUTY</option><option>ON LEAVE</option><option>OFF SITE</option>
                  </select>
                </div>
              </div>
              <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:8}}>
                <button className="btn btn-ghost" onClick={()=>setEmpForm(null)}>Cancel</button>
                <button className="btn btn-success" onClick={()=>{
                  if(!empForm.empId||!empForm.name){alert('Emp ID and Name required');return;}
                  onSaveEmployee(empForm, empFormIsEdit?empForm.empId:null);
                  setEmpForm(null);
                }}>💾 Save</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Leave / Resignation Modal — fixed size */}
      {updateModal&&(
        <div className="modal-overlay" onClick={()=>setUpdateModal(null)}>
          <div className="modal" style={{width:480}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <div className="modal-title">Staff Update — {updateModal.name.split(' ')[0]}</div>
                <div style={{fontSize:10,color:'var(--gray)',fontFamily:'var(--fm)',marginTop:2}}>{updateModal.empId} · {updateModal.designation}</div>
              </div>
              <button className="modal-close" onClick={()=>setUpdateModal(null)}>×</button>
            </div>
            <div className="modal-body" style={{minHeight:300}}>
              <div style={{display:'flex',gap:8,marginBottom:16}}>
                <button className={`btn btn-sm ${updateType==='leave'?'btn-primary':'btn-ghost'}`} onClick={()=>setUpdateType('leave')}>Leave</button>
                <button className={`btn btn-sm ${updateType==='offsite'?'btn-primary':'btn-ghost'}`} style={updateType==='offsite'?{background:'rgba(26,86,219,.25)',color:'#60a5fa',border:'1px solid rgba(26,86,219,.4)'}:{}} onClick={()=>setUpdateType('offsite')}>Off Site</button>
                <button className={`btn btn-sm ${updateType==='resign'?'btn-danger':'btn-ghost'}`} onClick={()=>setUpdateType('resign')}>Resignation</button>
              </div>
              {/* Leave fields */}
              <div style={{display:updateType==='leave'?'block':'none'}}>
                <div className="form-row">
                  <div className="form-group">
                    <label>Leave Type</label>
                    <select value={leaveType} onChange={e=>setLeaveType(e.target.value)}>
                      <option value="AL">AL — Annual Leave</option>
                      <option value="FRL">FRL — Family Responsibility Leave</option>
                      <option value="SL">SL — Sick Leave</option>
                    </select>
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group"><label>Leave Start</label><input type="date" value={leaveStart} onChange={e=>setLeaveStart(e.target.value)}/></div>
                  <div className="form-group"><label>Leave End</label><input type="date" value={leaveEnd} onChange={e=>setLeaveEnd(e.target.value)}/></div>
                </div>
              </div>
              {/* Off Site fields */}
              <div style={{display:updateType==='offsite'?'block':'none'}}>
                <div style={{background:'rgba(26,86,219,.08)',border:'1px solid rgba(26,86,219,.25)',borderRadius:6,padding:'8px 12px',fontSize:11,color:'#60a5fa',fontFamily:'var(--fm)',marginBottom:12}}>
                  Employee will be marked as <strong>Off Site</strong>. To return to duty, update via Leave or edit the employee directly.
                </div>
              </div>
              {/* Resign fields */}
              <div style={{display:updateType==='resign'?'block':'none'}}>
                <div style={{background:'rgba(245,158,11,.08)',border:'1px solid rgba(245,158,11,.25)',borderRadius:6,padding:'8px 12px',fontSize:11,color:'var(--accent)',fontFamily:'var(--fm)',marginBottom:12}}>
                  ⚠ Employee becomes Inactive automatically on the exit date.
                </div>
                <div className="form-group"><label>Exit / Resignation Date</label><input type="date" value={exitDate} onChange={e=>setExitDate(e.target.value)}/></div>
              </div>
              <div className="form-group" style={{marginTop:10}}>
                <label>Remarks</label>
                <textarea value={updateRemarks} onChange={e=>setUpdateRemarks(e.target.value)} placeholder="Optional notes..." style={{minHeight:56}}/>
              </div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:12}}>
                <button className="btn btn-ghost" onClick={()=>setUpdateModal(null)}>Cancel</button>
                <button className={`btn ${updateType==='resign'?'btn-danger':updateType==='offsite'?'btn-primary':'btn-success'}`} onClick={doUpdate}>
                  {updateType==='resign'?'Save Resignation':updateType==='offsite'?'Mark Off Site':'Save Leave'}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Leave History Modal */}
      {historyModal&&(
        <div className="modal-overlay" onClick={()=>setHistoryModal(null)}>
          <div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <div className="modal-title">Leave History — {historyModal.name.split(' ')[0]}</div>
                <div style={{fontSize:10,color:'var(--gray)',fontFamily:'var(--fm)',marginTop:2}}>{historyModal.empId} · {historyModal.designation}</div>
              </div>
              <button className="modal-close" onClick={()=>setHistoryModal(null)}>×</button>
            </div>
            <div className="modal-body">
              {(historyModal.leaveHistory||[]).length===0
                ? <div className="empty-state" style={{padding:24}}>No leave records found</div>
                : <div className="tbl-wrap">
                    <table>
                      <thead><tr>
                        <th>Type</th><th>Start / Exit Date</th><th>End Date</th><th>Remarks</th><th>Saved On</th>
                      </tr></thead>
                      <tbody>
                        {[...(historyModal.leaveHistory||[])].reverse().map((h,i)=>(
                          <tr key={i}>
                            <td><span className={`sb-base ${h.type==='RESIGN'?'sb':h.type==='SL'?'sm':'sl'}`}>{h.type}</span></td>
                            <td style={{fontFamily:'var(--fm)',fontSize:12}}>{fmtD(h.start||h.exitDate)}</td>
                            <td style={{fontFamily:'var(--fm)',fontSize:12}}>{fmtD(h.end)}</td>
                            <td style={{fontSize:11,color:'var(--gray)'}}>{h.remarks||'—'}</td>
                            <td style={{fontFamily:'var(--fm)',fontSize:11,color:'var(--gray)'}}>{h.savedOn||'—'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
              }
              <div style={{marginTop:14,display:'flex',justifyContent:'flex-end'}}>
                <button className="btn btn-ghost" onClick={()=>setHistoryModal(null)}>Close</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Pending Resignations Modal */}
      {showResignModal&&(
        <div className="modal-overlay" onClick={()=>setShowResignModal(false)}>
          <div className="modal" style={{width:620}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-title">Pending Resignations ({pendingResign.length})</div>
              <button className="modal-close" onClick={()=>setShowResignModal(false)}>×</button>
            </div>
            <div className="modal-body">
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                <thead><tr>
                  <th style={{padding:'7px 10px',background:'rgba(245,158,11,.08)',color:'var(--accent)',fontSize:10,letterSpacing:1,textAlign:'left'}}>Emp ID</th>
                  <th style={{padding:'7px 10px',background:'rgba(245,158,11,.08)',color:'var(--accent)',fontSize:10,letterSpacing:1,textAlign:'left'}}>Name</th>
                  <th style={{padding:'7px 10px',background:'rgba(245,158,11,.08)',color:'var(--accent)',fontSize:10,letterSpacing:1,textAlign:'left'}}>Designation</th>
                  <th style={{padding:'7px 10px',background:'rgba(245,158,11,.08)',color:'var(--accent)',fontSize:10,letterSpacing:1,textAlign:'left'}}>Section</th>
                  <th style={{padding:'7px 10px',background:'rgba(245,158,11,.08)',color:'var(--accent)',fontSize:10,letterSpacing:1,textAlign:'left'}}>Exit Date</th>
                </tr></thead>
                <tbody>
                  {pendingResign.map(e=>(
                    <tr key={e.empId}>
                      <td style={{padding:'7px 10px',fontFamily:'var(--fm)',color:'var(--accent)',borderBottom:'1px solid var(--border)'}}>{e.empId}</td>
                      <td style={{padding:'7px 10px',fontWeight:600,borderBottom:'1px solid var(--border)'}}>{e.name}</td>
                      <td style={{padding:'7px 10px',fontSize:11,borderBottom:'1px solid var(--border)'}}>{e.designation}</td>
                      <td style={{padding:'7px 10px',fontSize:11,borderBottom:'1px solid var(--border)'}}>{e.section}</td>
                      <td style={{padding:'7px 10px',fontFamily:'var(--fm)',fontWeight:700,color:'var(--accent)',borderBottom:'1px solid var(--border)'}}>{e.exitDate}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
