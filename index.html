<script>
(function () {
  'use strict';
  function refFromUrl(u) {
    var m = /^https:\/\/([a-z0-9]{20})\.supabase\.co\/?$/.exec(typeof u === 'string' ? u : '');
    return m ? m[1] : null;
  }
  function jwtClaims(k) {
    var p = k.split('.');
    if (p.length !== 3) return null;
    try {
      var s = p[1].replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return JSON.parse(atob(s));
    } catch (e) { return null; }
  }
  function checkStagingKey(k, ref) {
    if (typeof k !== 'string' || !k) return 'staging anon key missing';
    if (k.indexOf('sb_secret_') === 0) return 'secret keys are never allowed in the browser';
    // Publishable keys carry no project ref; the URL check above and the __environment marker gate bind them to staging.
    if (k.indexOf('sb_publishable_') === 0) return /^sb_publishable_[A-Za-z0-9_-]{16,}$/.test(k) ? null : 'staging publishable key format not recognised';
    var c = jwtClaims(k);
    if (!c) return 'staging key format not recognised';
    if (c.role !== 'anon') return 'staging key is not an anon key';
    if (c.ref !== ref) return 'staging key belongs to a different project than the staging URL';
    return null;
  }
  // Pure: (location, production config, staging config, production hostnames) -> environment.
  function resolveEnv(loc, prod, staging, prodHosts) {
    var host = loc && typeof loc.hostname === 'string' ? loc.hostname : '';
    var isProd = !!loc && loc.protocol === 'https:' && Array.isArray(prodHosts) && prodHosts.indexOf(host) !== -1;
    if (isProd) return { name: 'production', url: prod.url, anonKey: prod.anonKey };
    if (!staging || typeof staging !== 'object') return { name: 'blocked', reason: 'staging configuration missing (staging-config.js)' };
    var ref = refFromUrl(staging.url);
    if (!ref) return { name: 'blocked', reason: 'staging URL invalid (expected https://<project-ref>.supabase.co)' };
    var prodUrl = prod && prod.url, prodKey = prod && prod.anonKey;
    if (ref === refFromUrl(prodUrl) || staging.url === prodUrl || staging.anonKey === prodKey)
      return { name: 'blocked', reason: 'staging configuration points at the production project' };
    var why = checkStagingKey(staging.anonKey, ref);
    if (why) return { name: 'blocked', reason: why };
    return { name: 'staging', url: 'https://' + ref + '.supabase.co', anonKey: staging.anonKey };
  }
  // Staging only: the backend must carry the __environment marker before the app starts. Read through the one function
  // the server allows before sign-in (environment_marker: returns only the marker value; app_data itself is closed).
  function envGate(env, client) {
    if (!env || env.name === 'blocked' || !client) return Promise.resolve({ ok: false, reason: (env && env.reason) || 'environment not resolved' });
    if (env.name === 'production') return Promise.resolve({ ok: true });
    return Promise.resolve().then(function () {
      return client.rpc('environment_marker');
    }).then(function (r) {
      if (!r || r.error) return { ok: false, reason: 'staging environment marker could not be read' };
      var v = r.data;
      if (!v || v.env !== 'staging') return { ok: false, reason: 'staging environment marker missing or not "staging"' };
      return { ok: true };
    }, function () { return { ok: false, reason: 'staging environment marker check failed' }; });
  }
  function lock(name, fn) { Object.defineProperty(window, name, { value: fn, writable: false, configurable: false }); }
  lock('CMMS_resolveEnv', resolveEnv);
  lock('CMMS_envGate', envGate);
  // Local staging config (untracked file, see .gitignore): loaded ONLY on loopback hosts / file://.
  // Production and Vercel previews never request it, so previews fail closed.
  var h = window.location.hostname;
  if (window.location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1' || h === '[::1]') {
    document.write('<script src="staging-config.js"><\/script>');
  }
})();
</script>

async function dbSave(key, value) {
  if (!sb || !envReady) { console.warn('dbSave blocked: environment not ready', key); return new Error('environment not ready'); }
  if (!writeGate.signedIn) { console.warn('dbSave blocked: not signed in', key); return new Error('not signed in'); }

  (recentWrites[key] = (recentWrites[key] || []).slice(-4)).push(stableJson(value));

async function serverCall(fn, args) {

    const {data, error} = await sb.rpc(fn, args || {});

        traces.push({side: name, d, start: [r1(c ? s : p), r1(edge)], pad: [r1(p), r1(name === 'top' ? S.t : S.b)], vias: c ? [[r1(s - sg * c), r1(jog)], [r1(p + sg * c), r1(jog)]] : [],
                     part: name === 'bottom' && h - jog > 170 ? {x: r1(c ? s : p), y: r1(jog + (h - jog) * 0.55), horizontal: false} : null});

  side('right', vPads, cy, top, h, w - S.r, S.r, 1);
  if (!top) side('top', hPads, cx, S.l, S.r, S.t, S.t, -1);   // stays within the card's width: never crosses the side traces
  side('bottom', hPads, cx, S.l, S.r, h - S.b, S.b, 1);

}

// Pure: timing of the light signals on the circuit (all values in seconds / px). ONE constant speed everywhere. A left
// trace and the right trace that ends on the SAME pad row form a pair: the light runs IN along the left trace, passes
// hidden behind the card for the socket width (same speed, nothing is drawn over the card), then runs OUT along the
// right trace to the page edge. Pairs share duration and delay, so in and out are one connected flow. Traces without a
// partner (top, bottom, or left when there is no room on the right) run in only. lengths[i] = length of traces[i].
const SIGNAL_SPEED = 150, SIGNAL_PAUSE = 2.4;   // px/s and s between runs (login board light signals)
function signalSchedule(traces, lengths, socketWidth, opts = {}) {
  // 2026-10-18: slower and calmer (was 260 px/s with a 1.4 s pause: every cycle is now ~1.75x longer).
  const v = opts.speed || SIGNAL_SPEED, pause = opts.pause == null ? SIGNAL_PAUSE : opts.pause, out = traces.map(() => null);
  const rightByRow = new Map();

    if (t.side === 'right') return;
    const j = t.side === 'left' && rightByRow.has(t.pad[1]) ? rightByRow.get(t.pad[1]) : null;
    const tin = lengths[i] / v, tc = j === null ? 0 : socketWidth / v, tout = j === null ? 0 : lengths[j] / v;
    const T = tin + tc + tout + pause + (i % 5) * 0.4, delay = -((i * 1.7) % T);
    out[i] = {duration: T, delay, from: 0, to: tin / T, dir: 'in', pair: j, speed: v};
    if (j !== null) out[j] = {duration: T, delay, from: (tin + tc) / T, to: (tin + tc + tout) / T, dir: 'out', pair: i, speed: v};
  });
  traces.forEach((t, i) => {   // a right trace without a left partner (not produced by circuitTraces) still runs out
    if (out[i]) return;
    const T = lengths[i] / v + pause;
    out[i] = {duration: T, delay: -((i * 1.7) % T), from: 0, to: (lengths[i] / v) / T, dir: 'out', pair: null, speed: v};
  });

}
// Keyframes (Web Animations) for one signal: a dash of `dash` px on a path of `len` px. The trace path runs from the
// page edge to the pad: 'in' moves the dash edge -> pad, 'out' moves it pad -> edge. Outside [from, to] the dash sits
// beyond an end of the path, i.e. it is invisible (no flash anywhere, in particular never over the card).
function signalKeyframes(s, len, dash = 26) {

// Pad glow: peaks when the light ARRIVES at a left/top/bottom pad and when it LEAVES a right pad.
function glowKeyframes(s, base = 0.12, peak = 0.85) {

}

// ─── PASSWORD RECOVERY (P2: request-recovery / complete-recovery / verify-recovery-email Edge Functions) ─────────
// Requests are non-enumerating: every outcome except a network failure shows the SAME message. Recovery is offered only
// where Supabase Auth sign-in is configured (SIGN_IN_DOMAIN); emails go only to a VERIFIED recovery address (server).
const RECOVERY_SERVICE = typeof SIGN_IN_DOMAIN === 'string' && SIGN_IN_DOMAIN && EMAIL_FEATURES ? Object.freeze({   // + email features on (2026-10-21)
  requestReset: async employeeId => { const r = await serverFunction('request-recovery', {employeeId}); return {ok: r.status === 202 || r.status === 200}; },
}) : null;
const RECOVERY_MESSAGES = Object.freeze({
  sent: 'If an account with a verified recovery email exists for this Employee ID, a password reset link has been sent to it. Check your inbox.',
  unavailable: 'Password reset by email is not available yet. Ask a CMMS administrator to reset your password: you will receive a temporary password and must change it when you next sign in.',
  error: 'The request could not be sent. Check your connection and try again.',

      if (!EMPLOYEE_ID_RE.test(id)) return {phase: 'invalid', message: RECOVERY_MESSAGES.format};
      if (action.serviceAvailable !== true) return {phase: 'unavailable', message: RECOVERY_MESSAGES.unavailable};
      return {phase: 'sending', message: ''};

    case 'result': return action.ok === true ? {phase: 'sent', message: RECOVERY_MESSAGES.sent} : {phase: 'error', message: RECOVERY_MESSAGES.error};

function parseRecoveryLink(hash) {

// ─── NOTIFICATIONS (P2: p2/sql/0008; recipients computed on the server) ─────────────────────────────────────────
// Every signed-in role except Viewer (which receives none). The browser only reads its own list (my_notifications) and
// marks its own items read (notification_mark_read); it never names a recipient. Polling (decision N-D3).
function notificationsFor(user) { return !!user && user.role !== 'Viewer' && !mustChangePassword(user); }

function unreadCount(items) { return (Array.isArray(items) ? items : []).filter(n => n && n.read !== true).length; }

// ─── DATA LOAD (N1) — after sign-in only ──────────────────────────────────────────────────────
// Which datasets a role reads. Department Users read their assets and job orders through the server's scoped lists
// (asset_list / jo_list) and have no PM or employee pages; everyone else reads the datasets the server lets them read.
function datasetsFor(user) { return isDeptUser(user) ? ['assets','jobOrders','customPlants'] : DATA_KEYS.slice(); }
// Pure: classify what was read. Never guesses: an error or an unusable response is a failure, zero datasets is a failure,
// and missing or malformed datasets are reported so they stay read-only. Nothing is ever seeded by the browser.
function planDataLoad(result, opts = {}) {
  if (!result || typeof result !== 'object' || result.error || !Array.isArray(result.data)) return {action: 'fail', reason: 'failed'};
  const expected = Array.isArray(opts.expected) ? opts.expected : DATA_KEYS;
  const rows = result.data.filter(r => r && typeof r === 'object' && typeof r.key === 'string' && expected.includes(r.key));

    else { loaded.push(k); values[k] = r.value; }

// Reads the given datasets for this user. {error} when nothing could be read, else {data: rows} (a dataset that failed is
// simply absent, so planDataLoad reports it as missing and it stays read-only).
async function readDatasets(user, keys) {

    r.data.forEach(x => { if (x && direct.includes(x.key)) rows.push({key: x.key, value: x.value}); });
  }, () => { failures++; })); }
  viaFn.forEach(k => { attempts++; jobs.push(Promise.resolve(sb.rpc(scoped[k])).then(r => {

// N2: JSON with sorted object keys. The database (JSONB) does not keep key order, so values are compared this way.
function stableJson(v) {

  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stableJson(v[k])).join(',') + '}';

}
// N2: what to do with a Realtime update of one dataset.
//   'echo'     = it is one of our own recent writes coming back: ignore (state is already at least that new)
//   'conflict' = another change arrived while a local change of the same dataset is still waiting to be saved: the
//                waiting change must NOT overwrite it (it is dropped and the user is told)
//   'apply'    = take the new data
function realtimeAction(incoming, hasPending, recent) {

// The current page is kept in the address (#/joborders), so a refresh or a direct link opens the same page. It is only a

const PAGE_IDS = Object.freeze(['dashboard','assets','joborders','pmschedule','employees','reports','settings']);
function pageFromHash(hash) { const m = /^#\/([a-z]+)$/.exec(String(hash == null ? '' : hash)); return m && PAGE_IDS.includes(m[1]) ? m[1] : null; }

function statusCls(s) {

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:28px;}
.sc-purple::before{background:#a78bfa;}.sc-purple .stat-num{color:#a78bfa;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px 20px;backdrop-filter:blur(8px);position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.sc-blue::before{background:var(--blue);}.sc-green::before{background:var(--green);}
.sc-yellow::before{background:var(--yellow);}.sc-red::before{background:var(--red);}.sc-orange::before{background:var(--orange);}.sc-offsite::before{background:#60a5fa;}
.stat-num{font-family:var(--fh);font-size:36px;font-weight:700;line-height:1;}
.sc-blue .stat-num{color:var(--sky);}.sc-green .stat-num{color:var(--green);}
.sc-yellow .stat-num{color:var(--yellow);}.sc-red .stat-num{color:var(--red);}.sc-orange .stat-num{color:var(--orange);}
.stat-label{font-size:11px;color:var(--gray);font-family:var(--fm);letter-spacing:1px;margin-top:4px;text-transform:uppercase;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;backdrop-filter:blur(6px);margin-bottom:20px;}
.panel-head{padding:14px 20px;background:var(--hl-03);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-title{font-family:var(--fh);font-size:16px;font-weight:600;letter-spacing:.5px;}
.panel-body{padding:20px;}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
input:not([type]),input[type=text],input[type=password],input[type=email],input[type=date],input[type=number],select,textarea{background:var(--input-bg);border:1px solid var(--hl-12);color:var(--white);font-family:var(--fb);font-size:13px;padding:7px 12px;border-radius:5px;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--blue);}
select option{background:var(--navy2);}
textarea{resize:vertical;min-height:70px;width:100%;}
.search-box{padding:7px 12px;border-radius:5px;min-width:220px;}
.btn{padding:7px 16px;border:none;border-radius:5px;cursor:pointer;font-family:var(--fh);font-size:14px;font-weight:600;letter-spacing:.5px;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-primary{background:var(--blue);color:#fff;}.btn-primary:hover{background:#1545b8;}
.btn-accent{background:var(--accent-fill);color:var(--on-accent);}.btn-accent:hover{background:var(--accent2);}
.btn-success{background:#059669;color:#fff;}.btn-success:hover{background:#047857;}
.btn-danger{background:var(--red);color:#fff;}.btn-danger:hover{background:#dc2626;}
.btn-warning{background:#ea580c;color:#fff;}.btn-warning:hover{background:#c2410c;}
.btn-ghost{background:var(--hl-07);color:var(--white);border:1px solid var(--border);}.btn-ghost:hover{background:var(--hl-12);}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-icon{padding:5px 8px;font-size:15px;min-width:30px;text-align:center;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{padding:9px 12px;text-align:left;font-family:var(--fh);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);background:rgba(245,158,11,.06);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}tr:hover td{background:var(--hl-02);}
.sb-base{display:inline-block;padding:2px 9px;border-radius:3px;font-family:var(--fm);font-size:10px;letter-spacing:1px;font-weight:600;}
.so{background:rgba(16,185,129,.35);color:#34d399;border:1px solid rgba(16,185,129,.65);}
.sb{background:rgba(239,68,68,.3);color:#fca5a5;border:1px solid rgba(239,68,68,.6);}
.sm{background:rgba(249,115,22,.3);color:#fb923c;border:1px solid rgba(249,115,22,.6);}
.si{background:rgba(148,163,184,.18);color:var(--gray);border:1px solid rgba(148,163,184,.3);}
.sn{background:rgba(26,86,219,.4);color:#93c5fd;border:1px solid rgba(26,86,219,.75);}
.sl{background:rgba(245,158,11,.3);color:#fbbf24;border:1px solid rgba(245,158,11,.6);}
.jop{background:rgba(245,158,11,.15);color:var(--yellow);border:1px solid rgba(245,158,11,.3);}
.jcl{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.jip{background:rgba(26,86,219,.15);color:#60a5fa;border:1px solid rgba(26,86,219,.3);}
.jcp{background:rgba(139,92,246,.15);color:#a78bfa;border:1px solid rgba(139,92,246,.3);}
.prio-high{color:var(--red);font-weight:600;font-family:var(--fm);font-size:11px;}
.prio-low{color:var(--green);font-family:var(--fm);font-size:11px;}
.modal-overlay{display:flex;position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);z-index:200;align-items:center;justify-content:center;}
.modal{background:var(--navy2);border:1px solid var(--border);border-radius:10px;width:min(820px,95vw);max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-head{padding:18px 24px;background:var(--navy2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
.modal-title{font-family:var(--fh);font-size:20px;font-weight:700;}
.modal-close{background:none;border:none;color:var(--gray);cursor:pointer;font-size:22px;line-height:1;padding:2px 6px;}
.modal-close:hover{color:var(--white);}
.modal-body{padding:24px;}
.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:14px;}
.form-group{min-width:0;}
.form-row.three{grid-template-columns:repeat(3,minmax(0,1fr));}.form-row.single{grid-template-columns:1fr;}
@media(max-width:640px){.form-row,.form-row.three{grid-template-columns:1fr;}}
.form-group label{display:block;font-size:11px;font-family:var(--fm);letter-spacing:1px;color:var(--gray);margin-bottom:5px;text-transform:uppercase;}
.form-group input,.form-group select,.form-group textarea{width:100%;}
.jc-section{border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:14px;}
.jc-section-title{font-family:var(--fh);font-size:13px;font-weight:600;letter-spacing:1px;color:var(--accent);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.jc-section-title::after{content:'';flex:1;height:1px;background:var(--border);}
.parts-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
.parts-table th{padding:6px 8px;background:rgba(245,158,11,.08);border:1px solid var(--border);font-family:var(--fm);font-size:10px;letter-spacing:1px;color:var(--accent);}
.parts-table td{padding:4px 6px;border:1px solid var(--border);}
.parts-table input{background:transparent;border:none;color:var(--white);font-size:12px;width:100%;padding:2px 4px;outline:none;}
.parts-table input:focus{background:var(--hl-05);border-radius:3px;}
.checkbox-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.checkbox-item{display:flex;align-items:center;gap:6px;cursor:pointer;}
.checkbox-item input[type=radio],.checkbox-item input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 20px;}
.detail-item label{font-size:10px;font-family:var(--fm);color:var(--gray);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px;}
.detail-item .val{font-size:14px;font-weight:500;}
.pagination{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding-top:14px;}
.page-btn{padding:5px 11px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--gray);cursor:pointer;font-size:12px;}
.page-btn:hover,.page-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.page-info-txt{font-size:12px;color:var(--gray);font-family:var(--fm);}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px;}
.jo-item{background:var(--hl-03);border:1px solid var(--border);border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.jo-num{font-family:var(--fm);font-size:12px;color:var(--accent);}
.jo-desc{font-size:13px;}.jo-meta{font-size:11px;color:var(--gray);margin-top:2px;}
.plant-pill{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--hl-03);border:1px solid var(--border);border-radius:5px;font-size:13px;margin-bottom:6px;}
.pill-count{font-family:var(--fm);color:var(--accent);font-size:13px;}
.empty-state{text-align:center;padding:40px;color:var(--gray);}
.edit-mode-banner{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);border-radius:6px;padding:8px 14px;margin-bottom:14px;font-size:12px;color:var(--accent);font-family:var(--fm);display:flex;align-items:center;gap:8px;}
.toast-wrap{position:fixed;bottom:28px;right:28px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast-msg{background:var(--navy2);border:1px solid var(--green);border-left:4px solid var(--green);border-radius:8px;padding:12px 18px;font-size:13px;color:var(--white);box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:320px;}
.toast-msg.err{border-color:var(--red);border-left-color:var(--red);}
select.sb-base{cursor:pointer;-webkit-appearance:none;appearance:none;padding:2px 8px;}
@media(max-width:900px){.sidebar-toggle,.main-toolbar{display:none;}.main-content .page-header{padding-left:0;}.main{padding:16px;}.stats-row{grid-template-columns:1fr 1fr;}.dash-grid{grid-template-columns:1fr;}}
/* Navigation by width (2026-10-28): desktop sidebar above 900px; an icon rail on tablets (641-900px); a bottom bar with a
   "More" sheet on phones (640px and below). Rules: the phone/tablet block at the end of this stylesheet. */
.bottom-nav,.acct,.logo-phone,.fab-wrap{display:none;}   /* phone-only parts (2026-10-29): shown by the phone rules below */
/* Asset Registry tools (2026-10-29): inline on tablets and desktops (the wrappers take no layout part); a menu on phones */
.toolbar-more,.toolbar-tools{display:contents;}
.tools-toggle{display:none;}
@media(max-width:900px){
  .topbar{padding:0 12px;}
  .topbar .badge,.logo-sub{display:none;}
}
@media(max-width:480px){.logo-icon{display:none;}.logo-text{font-size:17px;}.topbar-right{gap:6px;}}
.btn-csv{background:rgba(16,185,129,.1);color:#4ade80;border:1px solid rgba(16,185,129,.25);}.btn-csv:hover{background:rgba(16,185,129,.2);color:#6ee7b7;}
/* ── Table action column: always stays on one line */
.assets-tbl td:last-child,.assets-tbl th:last-child{white-space:nowrap;width:1%;}
/* ── Responsive breakpoints ──────────────────────────────────────────── */
/* Hide less-important table columns on smaller screens */
@media(max-width:1400px){
  .col-hide-md{display:none;}
}
@media(max-width:1440px){
  .main{padding:22px 28px;}
  .stats-row{gap:12px;margin-bottom:22px;}
  .stat-card{padding:14px 18px;}
  .stat-num{font-size:30px;}
  .stat-label{font-size:10px;}
}
@media(max-width:1280px){
  :root{--sidebar-w:190px;}
  .main{padding:18px 20px;}
  .topbar{padding:0 22px;}
  .logo-text{font-size:17px;}
  .logo-sub{font-size:9px;letter-spacing:1.5px;}
  .badge{font-size:10px;padding:2px 8px;}
  .stats-row{gap:10px;margin-bottom:16px;}
  .stat-card{padding:12px 14px;}
  .stat-num{font-size:26px;}
  .page-title{font-size:24px;} :root{--title-lh:30px;}
  .page-sub{font-size:11px;}
  .page-header{margin-bottom:18px;}
  .panel-head{padding:11px 16px;}
  .panel-body{padding:14px 16px;}
  th{padding:7px 10px;}
  td{padding:7px 10px;font-size:12px;}
  .nav-item{height:40px;font-size:14px;}
  .nav-section{padding:6px 14px 3px;font-size:8px;}
  .modal{width:min(760px,93vw);}
  .btn{font-size:13px;padding:6px 13px;}
  .btn-sm{font-size:11px;padding:3px 8px;}
  .controls{gap:7px;}
  .search-box{min-width:160px;}
  .report-grid{gap:14px;}
  .sidebar-footer{padding:12px 16px 14px;}
  .sidebar-user-name{font-size:13px;}
  .jo-item{padding:8px 12px;}
  .plant-pill{padding:6px 12px;font-size:12px;}
}
@media(max-width:1100px){
  :root{--sidebar-w:165px;}
  .main{padding:14px 16px;}
  .topbar{padding:0 16px;}
  .logo-text{font-size:15px;}
  .logo-sub{display:none;}
  .badge{font-size:9px;padding:2px 6px;}
  .stats-row{gap:8px;margin-bottom:14px;}
  .stat-card{padding:10px 11px;}
  .stat-num{font-size:22px;}
  .page-title{font-size:20px;} :root{--title-lh:26px;}
  .page-sub{display:none;}
  .page-header{margin-bottom:14px;}
  .nav-item{height:38px;font-size:13px;gap:8px;}
  .nav-icon{font-size:14px;}
  .nav-section{padding:5px 12px 2px;font-size:7px;}
  .panel-head{padding:9px 13px;}
  .panel-body{padding:11px 13px;}
  th{font-size:9px;padding:6px 8px;letter-spacing:.5px;}
  td{font-size:11px;padding:6px 8px;}
  .btn{font-size:12px;padding:5px 11px;}
  .btn-sm{font-size:10px;padding:3px 7px;}
  .btn-icon{min-width:26px;padding:4px 6px;}
  .sidebar-footer{padding:10px 12px 12px;}
  .sidebar-user-name{font-size:12px;}
  .sidebar-user-role{font-size:8px;}
  .sidebar-avatar{width:28px;height:28px;font-size:13px;}
  .modal{width:min(700px,92vw);}
  .report-grid{grid-template-columns:1fr;}
  .dash-grid{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
  .form-row.three{grid-template-columns:1fr;}
}
/* U3 light theme: badge/status text colours with enough contrast on light surfaces */
:root[data-theme="light"] .so{color:#047857;}:root[data-theme="light"] .sb{color:#b91c1c;}:root[data-theme="light"] .sm{color:#c2410c;}
:root[data-theme="light"] .sn{color:#1d4ed8;}:root[data-theme="light"] .sl{color:#92400e;}
:root[data-theme="light"] .jip,:root[data-theme="light"] .role-engineer,:root[data-theme="light"] .sync-saving{color:#1d4ed8;}
:root[data-theme="light"] .jcp,:root[data-theme="light"] .role-senior{color:#6d28d9;}
:root[data-theme="light"] .sc-purple::before{background:#7c3aed;}:root[data-theme="light"] .sc-purple .stat-num{color:#7c3aed;}
:root[data-theme="light"] .btn-csv{color:#047857;}:root[data-theme="light"] .btn-csv:hover{color:#065f46;}
:root[data-theme="light"] .sidebar-footer{background:var(--hl-03);}
:root[data-theme="light"] .toast-msg{box-shadow:0 8px 30px rgba(15,32,68,.15);}
:root[data-theme="light"] .topbar{border-bottom-color:var(--accent-fill);}
/* theme toggle (login page and top bar) */
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:8px;border:1px solid var(--border);background:var(--hl-05);color:var(--gray);cursor:pointer;transition:color .15s,background .15s,border-color .15s;flex-shrink:0;}
.theme-toggle:hover,.theme-toggle:focus-visible{color:var(--accent);border-color:var(--accent);outline:none;}
/* ── Login Page */
.login-page{position:relative;isolation:isolate;overflow:hidden;min-height:100vh;display:grid;grid-template-columns:minmax(0,54fr) minmax(510px,46fr);background:var(--li-bg);
  --li-bg:linear-gradient(160deg,#0b1a33 0%,#0f2550 55%,#0b1a33 100%);--li-line:rgba(148,180,230,.20);--li-line-strong:rgba(148,180,230,.28);--li-gear:rgba(245,158,11,.22);--li-text:#f8fafc;--li-muted:#a9b8cf;
  --card-bg:rgba(10,22,46,.42);--card-bg-solid:rgba(13,28,58,.94);--card-bd:rgba(255,255,255,.16);--card-hl:rgba(255,255,255,.38);--card-sheen:rgba(255,255,255,.07);
  --card-shadow:0 30px 70px rgba(2,8,20,.5),0 10px 24px rgba(2,8,20,.28),0 1px 2px rgba(2,8,20,.3),inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.02);
  --li-tint:rgba(8,18,38,.38);--li-packet:rgba(245,158,11,.75);
  /* Right panel (2026-10-18): only a faint glow, no colour sheet, so both halves share the page navy and the board looks the same on both sides. */
  --rs-bg:radial-gradient(ellipse at 75% 20%,rgba(80,130,230,.06) 0%,transparent 60%);
  --rs-edge:rgba(148,180,230,.18);--rs-shade:-18px 0 40px -24px rgba(0,0,0,.6);}
:root[data-theme="light"] .login-page{--li-bg:linear-gradient(160deg,#e9eff8 0%,#dfe8f5 55%,#eaf0f8 100%);--li-line:rgba(15,32,68,.10);--li-line-strong:rgba(15,32,68,.14);--li-gear:rgba(180,83,9,.2);--li-text:#0f2044;--li-muted:#46566e;
  --card-bg:rgba(255,255,255,.5);--card-bg-solid:rgba(255,255,255,.95);--card-bd:rgba(255,255,255,.75);--card-hl:rgba(255,255,255,.95);--card-sheen:rgba(255,255,255,.45);
  --card-shadow:0 28px 64px rgba(15,32,68,.16),0 8px 20px rgba(15,32,68,.08),0 0 0 1px rgba(15,32,68,.06),inset 0 1px 0 rgba(255,255,255,.9);
  --li-tint:rgba(255,255,255,.34);--li-packet:rgba(217,119,6,.7);
  --rs-bg:radial-gradient(ellipse at 75% 20%,rgba(26,86,219,.04) 0%,transparent 60%);
  --rs-edge:rgba(15,32,68,.10);--rs-shade:-18px 0 40px -26px rgba(15,32,68,.25);}
.login-page{--lc-trace:rgba(245,158,11,.30);--lc-trace-strong:rgba(245,158,11,.46);--lc-socket:rgba(245,158,11,.5);--lc-pad:rgba(245,158,11,.78);--lc-via:#0b1a33;}
:root[data-theme="light"] .login-page{--lc-trace:rgba(180,83,9,.26);--lc-trace-strong:rgba(180,83,9,.40);--lc-socket:rgba(180,83,9,.44);--lc-pad:rgba(180,83,9,.70);--lc-via:#eef3fa;}
.lc-traces path{fill:none;stroke:var(--lc-trace);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;}
.lc-socket{fill:none;stroke:var(--lc-socket);stroke-width:1.2;stroke-dasharray:6 6;}
.lc-vias circle{fill:var(--lc-via);stroke:var(--lc-trace-strong);stroke-width:1.3;}
.lc-pads rect{fill:var(--lc-pad);}
.lc-parts rect,.lc-parts path{fill:none;stroke:var(--lc-trace-strong);stroke-width:1.1;}
.lc-signal{fill:none;stroke:var(--li-packet);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:26 100000;stroke-dashoffset:26;}   /* moved by Web Animations (LoginCircuit); hidden until then */
.lc-glow{fill:var(--accent-fill);opacity:.12;}
.login-link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.login-link:disabled{opacity:.45;cursor:default;text-decoration:none;}
:root[data-theme="light"] .login-link{color:#b45309;}
.login-aux{display:flex;justify-content:flex-end;margin:-8px 0 14px;}
.login-back{display:block;margin:16px auto 0;}
.login-connecting{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray);margin:-12px 0 16px;}
.login-caps{font-size:12px;color:var(--accent);margin:-10px 0 12px;}
:root[data-theme="light"] .login-caps{color:#b45309;}
.login-input.invalid input{border-color:var(--red) !important;box-shadow:0 0 0 2px rgba(239,68,68,.18);}
.login-info{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.55;color:var(--white);margin-bottom:14px;}
.login-success{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.38);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.55;color:var(--white);margin-bottom:14px;}
.login-temp-note{font-size:11px;line-height:1.5;color:var(--gray);margin-top:14px;text-align:center;}
.pw-checklist{list-style:none;margin:-6px 0 14px;padding:0;display:grid;gap:3px;font-size:12px;color:var(--gray);}
.pw-checklist li.ok{color:var(--green);}
/* forced password change: a compact card (three fields + the live checklist) that fits a desktop or phone screen */
.force-change .login-card{padding:22px 24px 18px;}
.force-change .login-card-head{margin-bottom:12px;}
.force-change .login-welcome{font-size:22px;}
.force-change .login-instr{font-size:12px;margin-top:2px;}
.force-change .login-field{margin-bottom:10px;}
.force-change .login-field label{margin-bottom:4px;}
.force-change .login-field input{padding-top:9px;padding-bottom:9px;}
.force-change .pw-checklist{margin:2px 0 10px;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:11px;}
@media(max-width:480px){ .force-change .pw-checklist{grid-template-columns:1fr;} .force-change .login-welcome{font-size:20px;} }
:root[data-theme="light"] .pw-checklist li.ok{color:#047857;}

.lv-flow{fill:none;stroke:var(--li-line-strong);stroke-width:1.2;stroke-dasharray:4 14;opacity:.9;animation:lv-dash 8s linear infinite;}

.lv-pulse circle{fill:var(--accent-fill);opacity:.5;animation:lv-pulse 3.6s ease-in-out infinite;}
.lv-spin{transform-origin:50% 50%;will-change:transform;animation-name:lv-rot;animation-timing-function:linear;animation-iteration-count:infinite;}

@keyframes lv-breathe{0%,100%{opacity:1;}50%{opacity:.45;}}
@keyframes lv-rot{to{transform:rotate(360deg);}}
@keyframes lv-dash{to{stroke-dashoffset:-72;}}
@keyframes lv-travel{from{stroke-dashoffset:0;}to{stroke-dashoffset:-1000;}}

/* No z-index here (2026-10-18): .login-main must not form a stacking context, so its ::before panel tint is painted
   BELOW the circuit board (.lc-board, z 0) instead of over it (the cause of the dim right side). The card still paints
   above the board (later in the page, positioned). */
.login-main{position:relative;display:flex;align-items:center;justify-content:center;padding:72px clamp(20px,4vw,56px) 40px;}
.login-main::before{content:'';position:absolute;top:0;bottom:0;right:0;left:-80px;z-index:-1;pointer-events:none;background:var(--rs-bg);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 160px);mask-image:linear-gradient(90deg,transparent 0,#000 160px);}
.login-card{position:relative;isolation:isolate;background-color:var(--card-bg);background-image:linear-gradient(128deg,var(--card-sheen) 0%,transparent 34%,transparent 70%,var(--card-sheen) 130%);border:1px solid var(--card-bd);border-radius:18px;padding:38px 36px 28px;width:392px;max-width:100%;
  -webkit-backdrop-filter:blur(1px) saturate(160%);backdrop-filter:blur(1px) saturate(160%);box-shadow:var(--card-shadow);}   /* 1px (was 10px): the board stays sharp behind the glass */
.login-card::before{content:'';position:absolute;top:0;left:18px;right:18px;height:1px;border-radius:1px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--card-hl),transparent);}

@media(max-width:900px){
  .dash-pair{grid-template-columns:1fr!important;}
  .notif-bell,.theme-toggle{width:40px;height:40px;}
  .btn-logout{min-height:40px;}
  .btn{min-height:40px;}
  .btn-sm{min-height:36px;padding:6px 12px;}
  .btn-icon{min-width:40px;min-height:40px;}
  .main select,.main input:not([type=checkbox]):not([type=radio]),.modal select,.modal input:not([type=checkbox]):not([type=radio]),.modal textarea{min-height:40px;font-size:16px!important;}   /* 16px: phones do not zoom into the field */
  .tabbar{flex-direction:column;}
  .tabbar-tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .tabbar-tabs::-webkit-scrollbar{display:none;}
  .tabbar-tabs>button{flex:0 0 auto;min-height:44px;}
  .tabbar-tools{border-left:none!important;border-top:1px solid var(--border);flex-wrap:wrap;margin-left:0!important;}
  .tabbar-tools>input:not([type=date]){flex:1 1 100%;min-width:0!important;}
  .tabbar-tools>input[type=date],.tabbar-tools>select{flex:1 1 140px;width:auto!important;min-width:0!important;}
  .tbl-toolbar{flex-wrap:wrap;justify-content:stretch!important;}
  .tbl-toolbar>*{flex:1 1 140px;min-width:0!important;}
  .tbl-toolbar>input{flex-basis:100%;}
}
@media(max-width:640px){
  .grid3{grid-template-columns:1fr 1fr!important;}
  /* list pages scroll as one page instead of a fixed-height panel with an inner scroller */
  .fill-page{height:auto!important;}
  .fill-page .panel{overflow:visible!important;flex:none!important;}
  .fill-page .tbl-wrap{overflow:visible!important;flex:none!important;}
  /* data tables become cards: each row a card, each cell "label · value" (labels copied from the column headers in App) */
  .tbl-wrap:has(table.card-table){overflow:visible;}
  table.card-table{display:block;width:100%!important;min-width:0!important;}
  table.card-table thead{display:none;}
  table.card-table tbody{display:block;}
  table.card-table tr{display:block;margin:0 0 10px;padding:6px 14px;border:1px solid var(--border);border-radius:10px;background:var(--hl-03,rgba(255,255,255,.03));}
  /* label in the left column; everything the cell holds stacks in the right column */
  table.card-table td{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:14px;row-gap:2px;padding:7px 0!important;border:none!important;
    border-bottom:1px solid var(--hl-07,rgba(255,255,255,.07))!important;text-align:right!important;white-space:normal!important;width:auto!important;max-width:none!important;font-size:14px;}
  table.card-table td>*{grid-column:2;justify-self:end;}
  table.card-table td:last-child{border-bottom:none!important;}
  table.card-table td::before{content:attr(data-label);grid-column:1;grid-row:1;align-self:start;padding-top:2px;max-width:42vw;text-align:left;font-family:var(--fm);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--gray);}
  table.card-table td:not([data-label]),table.card-table td[data-label=""]{grid-template-columns:minmax(0,1fr);}
  table.card-table td:not([data-label])>*,table.card-table td[data-label=""]>*{grid-column:1;}
  table.card-table td:not([data-label])::before,table.card-table td[data-label=""]::before{content:none;}
  table.card-table td.col-hide-md{display:none!important;}
  table.card-table td:first-child{font-size:16px;font-weight:700;}
  table.card-table td.cell-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding-top:10px!important;}
  table.card-table td.cell-actions::before{content:none;}
  table.card-table td:not(.cell-actions) button{min-height:36px;}   /* e.g. the status chip that opens the status menu */
  table.card-table td[colspan]{display:block;text-align:center!important;}
  table.card-table td[colspan]::before{content:none;}
  .modal-overlay{align-items:flex-end;}
  .modal{width:100vw!important;max-width:100vw!important;max-height:94dvh;border-radius:14px 14px 0 0;}
}
/* Tablets (641-900px): the sidebar stays, as a 60px icon rail (labels in tooltips), whatever the desktop collapse setting */
@media(min-width:641px) and (max-width:900px){
  .layout .sidebar{display:flex;width:var(--sidebar-w-collapsed);}
  .layout .main{margin-left:var(--sidebar-w-collapsed);}
  .layout .sidebar .nav-label,.layout .sidebar .sidebar-user-text,.layout .sidebar .nav-section{display:none;}
  .layout .sidebar .nav-item{gap:0;padding:0 0 0 15px;height:48px;}
  .layout .sidebar .sidebar-footer{padding:12px 0;display:flex;justify-content:center;}
  /* tables keep their columns: tighter cells and 36px row buttons so the action column fits beside the rail */
  .tbl-wrap th,.tbl-wrap td{padding:6px 7px;}
  .tbl-wrap td .btn-icon{min-width:36px;min-height:36px;padding:4px 6px;}
  .tbl-wrap td:last-child>div{flex-wrap:wrap!important;}   /* fixed-width action columns (Employees): buttons wrap inside the cell */
}
/* Phones (640px and below): no sidebar. A fixed bottom bar above the device's safe area, a "More" sheet over it, and room
   reserved under the page so the bar never covers the last item, a form or a button. */
@media(max-width:640px){
  .layout .sidebar{display:none;}
  .layout .main{margin-left:0;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));}
  .logout-text{display:none;}
  .btn-logout{width:40px;justify-content:center;padding:0;}
  .topbar{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--navy2);border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(0,0,0,.25);
    padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);}
  .bn-item{flex:1 1 0;min-width:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px 6px;
    background:none;border:none;border-top:3px solid transparent;color:var(--gray);font-family:var(--fh);font-size:11px;font-weight:600;letter-spacing:.3px;cursor:pointer;}
  .bn-item.active{color:var(--accent);border-top-color:var(--accent);background:var(--hl-05);}
  .bn-icon{font-size:20px;line-height:1;}
  .bn-label{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* page toolbars: search full width, filters two per row, buttons after them */
  .page-header .controls{width:100%;}
  .controls>.search-box{flex:1 1 100%;min-width:0;}
  .controls>select{flex:1 1 calc(50% - 5px);min-width:0;}
  table.card-table select.sb-base{letter-spacing:.5px;padding:4px 12px;max-width:100%;}
  table.card-table td[data-label="#"]{display:none!important;}   /* a row number adds nothing to a card */
  /* form sheets: the last buttons stay above the home indicator */
  .modal{padding-bottom:env(safe-area-inset-bottom,0px);}
  body:has(.staging-banner) .modal{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));}
  .toast-wrap{bottom:calc(76px + env(safe-area-inset-bottom,0px));left:12px;right:12px;align-items:stretch;}
  .toast-msg{max-width:none;}
  /* touch targets: 44 x 44 CSS px for the controls used most (the clickable box itself, not just the icon) */
  .notif-bell,.theme-toggle,.btn-logout{width:44px;height:44px;min-height:44px;}
  .btn,.btn-sm{min-height:44px;}
  .btn-icon{min-width:44px;min-height:44px;}
  .main select,.main input:not([type=checkbox]):not([type=radio]),.modal select,.modal input:not([type=checkbox]):not([type=radio]),.modal textarea{min-height:44px;}
  table.card-table td:not(.cell-actions) button{min-height:44px;}
  .assign-btn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
  .modal-close{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
  .settings-tab{min-height:44px;display:inline-flex;align-items:center;}
  .page-btn{min-width:44px;min-height:44px;}
  /* form row tables (job order: manpower, spare parts): each row a labelled two-column grid, remove button on its own line */
  .modal table.parts-table:has(tbody input),.modal table.parts-table:has(tbody input) tbody{display:block;width:100%;}
  .modal table.parts-table:has(tbody input) thead{display:none;}
  .modal table.parts-table:has(tbody input) tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .modal table.parts-table:has(tbody input) td{display:flex;flex-direction:column;gap:3px;padding:0;border:none;min-width:0;}
  .modal table.parts-table:has(tbody input) td::before{content:attr(data-label);font-family:var(--fm);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gray);}
  .modal table.parts-table:has(tbody input) td:last-child{grid-column:1 / -1;align-items:flex-end;}
  .modal table.parts-table:has(tbody input) td:last-child::before{content:none;}
  .modal table.parts-table:has(tbody input) input{min-height:44px;padding:8px 10px;border:1px solid var(--border);border-radius:5px;background:var(--hl-05);}
  .modal td .btn{min-width:44px;}
  /* checkboxes: the whole row (label) is the target, the box itself a little larger */
  .checkbox-item{min-height:44px;display:flex;align-items:center;gap:10px;}
  .main input[type=checkbox],.modal input[type=checkbox]{width:20px;height:20px;flex-shrink:0;}
  /* staging only: its fixed 24px banner sits at the very bottom, so the bar and the reserved room move up by 24px */
  body:has(.staging-banner) .bottom-nav{bottom:24px;}
  body:has(.staging-banner) .layout .main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));}
  body:has(.staging-banner) .toast-wrap{bottom:calc(100px + env(safe-area-inset-bottom,0px));}
}
/* Phones, compact lists (2026-10-29): more records per screen. Icons are smaller to the eye; their tap areas stay 44 x 44. */
@media(max-width:640px){
  /* KPI strips: every card in one row (Job Orders 5, PM Schedule 4, Employees 5) */
  .stat-strip{grid-template-columns:none!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px!important;margin-bottom:10px!important;}
  .stat-strip .stat-card{padding:7px 4px 6px!important;text-align:center;min-width:0;}
  .stat-strip .stat-card div:first-child{font-size:19px!important;}
  .stat-strip .stat-card div:last-child{font-size:9px!important;letter-spacing:0!important;line-height:1.15;margin-top:3px!important;word-break:keep-all;overflow-wrap:normal;}
  .page-header{margin-bottom:10px;}
  /* toolbars: shorter search and filter fields (text stays 16px, so phones do not zoom into them) */
  .controls>.search-box,.controls>select,.tbl-toolbar>input,.tbl-toolbar>select,.tabbar-tools>input{min-height:38px!important;height:38px;padding-top:4px!important;padding-bottom:4px!important;}
  .controls,.tbl-toolbar,.tabbar-tools{gap:6px!important;}
  .tbl-toolbar,.tabbar-tools{padding:6px 8px!important;}
  /* Asset Registry: "Add Asset" and an "Actions" menu (Export, Import, Template, Clear All Assets) in one row */
  .tools-toggle{display:inline-flex!important;}
  .toolbar-more{position:relative;display:inline-flex;}
  .toolbar-tools{display:none;}
  .toolbar-tools.open{display:flex;flex-direction:column;position:absolute;right:0;top:calc(100% + 6px);z-index:120;min-width:210px;padding:6px;gap:4px;
    background:var(--navy2);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.4);}
  .toolbar-tools.open>*{justify-content:flex-start;width:100%;min-height:44px;font-size:14px;}
  .controls:has(.toolbar-more)>.btn-accent{flex:1 1 auto;justify-content:center;}
  /* Job Orders: one toolbar row, "Raise Job Order" on the right */
  .jo-toolbar{flex-wrap:nowrap!important;}
  .jo-toolbar>*{flex:0 0 auto;}
  .jo-toolbar .btn{padding-left:10px;padding-right:10px;font-size:12px;}
  .jo-toolbar>.jo-raise{order:9;margin-left:auto;}
  .tools-toggle{font-size:13px!important;padding-left:14px;padding-right:14px;}
  .pm-toolbar{flex-wrap:nowrap!important;}
  .pm-toolbar>*{flex:0 0 auto;}
  .pm-toolbar .btn{padding-left:10px;padding-right:10px;font-size:12px;}
  /* Job Orders and PM Schedule cards: two columns, each label above its value; the first field and Problem span the card */
  .fill-page table.card-table tr:not(:has(td[colspan])){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px;row-gap:0;padding:8px 12px 2px!important;}
  .fill-page table.card-table td:not(.col-hide-md){display:flex!important;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:1px;padding:3px 0!important;border:none!important;text-align:left!important;}
  .fill-page table.card-table td::before{font-size:9.5px;max-width:none;}
  .fill-page table.card-table td:first-child,.fill-page table.card-table td[data-label="Problem"]{grid-column:1 / -1;}
  .fill-page table.card-table td.cell-actions{grid-column:1 / -1;flex-direction:row;justify-content:flex-end;align-items:center;}
  /* cards: tighter */
  table.card-table tr{padding:2px 12px!important;margin-bottom:8px!important;}
  table.card-table td{padding:4px 0!important;font-size:13px;}
  table.card-table td::before{font-size:10px;letter-spacing:.5px;}
  table.card-table td:first-child{font-size:15px;}
  table.card-table td.cell-actions{padding-top:2px!important;gap:2px!important;}
  /* action icons: a 30px coloured square inside the unchanged 44 x 44 button */
  table.card-table td.cell-actions .btn-icon{min-width:44px;min-height:44px;padding:7px!important;background-clip:content-box;border-color:transparent!important;font-size:13px;}
  /* Asset cards: number, name and status first; category and location below; actions last */
  table.assets-tbl.card-table tr:not(:has(td[colspan])){display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"num desc status" "cat cat loc" "act act act";
    align-items:center;column-gap:10px;row-gap:0;padding:8px 12px 0!important;}
  table.assets-tbl.card-table td:not(.col-hide-md){display:block!important;padding:0!important;border:none!important;text-align:left!important;}
  table.assets-tbl.card-table td::before{content:none!important;}
  table.assets-tbl.card-table td:nth-child(1){grid-area:num;font-size:13px!important;font-weight:600;}
  table.assets-tbl.card-table td:nth-child(2){grid-area:cat;font-size:12px!important;color:var(--gray);}
  table.assets-tbl.card-table td:nth-child(3){grid-area:desc;font-size:15px;}
  table.assets-tbl.card-table td:nth-child(7){grid-area:loc;text-align:right!important;font-size:12px!important;color:var(--gray);}
  table.assets-tbl.card-table td:nth-child(8){grid-area:status;}
  table.assets-tbl.card-table td:nth-child(9){grid-area:act;display:flex!important;justify-content:flex-end;}
  table.assets-tbl.card-table select.sb-base{min-height:34px!important;height:34px;font-size:12px!important;padding:2px 10px!important;letter-spacing:.3px;}
}
@media(max-width:380px){ .jo-raise-rest{display:none;} }
@media(max-width:400px){ .pm-add-rest{display:none;} }   /* "＋ Add PM" on narrow phones; the full name stays in the markup */   /* "＋ Raise" on the narrowest phones; the full name stays in the markup */
/* Phones v3 (2026-10-29): account menu in the header, six-page bottom bar, floating "+" on Job Orders and PM Schedule,
   compact asset toolbar and pagination, status pills, rounded action icons (30px shapes inside 44 x 44 buttons). */
@media(max-width:640px){
  /* header: "CMMS", notifications and the account button (theme, Settings, Logout are in its menu) */
  .logo-text,.logo-sub,.logo-icon{display:none!important;}
  .logo-phone{display:block;font-family:var(--fh);font-size:20px;font-weight:700;letter-spacing:2px;color:var(--white);}
  .topbar-theme,.btn-logout{display:none!important;}
  .acct{display:block;position:relative;}
  .acct-btn{width:44px;height:44px;padding:0;border-radius:50%;border:6px solid transparent;background:linear-gradient(135deg,var(--blue),var(--accent)) padding-box;
    color:#fff;font-family:var(--fh);font-size:15px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .acct-btn[aria-expanded="true"]{box-shadow:0 0 0 2px var(--accent);}
  .acct-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:300;min-width:220px;max-width:calc(100vw - 24px);padding:6px;
    background:var(--navy2);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.45);}
  .acct-who{padding:8px 10px 10px;margin-bottom:4px;border-bottom:1px solid var(--border);}
  .acct-name{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .acct-role{font-family:var(--fm);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--gray);margin-top:2px;}
  .acct-item{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 10px;border:none;border-radius:8px;background:none;
    color:var(--white);font-family:var(--fh);font-size:15px;font-weight:600;text-align:left;cursor:pointer;}
  .acct-item:hover,.acct-item:focus-visible{background:var(--hl-07);outline:none;}
  .acct-item.active{color:var(--accent);}
  .acct-logout{color:var(--red);}
  .acct-icon{width:20px;text-align:center;}
  /* bottom bar: up to six pages, equal widths, a little shorter (still at least 44px tall) */
  .bn-item{min-height:54px;gap:2px;padding:3px 1px 5px;font-size:10px;letter-spacing:0;}
  .bn-icon{font-size:18px;}
  .more-sheet{display:none!important;}
  .layout .main{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));}
  body:has(.staging-banner) .layout .main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));}
  /* floating "+": above the bar and the safe area; pages with it keep room so the last card ends above it */
  .fab-wrap{display:block;position:fixed;z-index:140;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));}
  body:has(.staging-banner) .fab-wrap{bottom:calc(92px + env(safe-area-inset-bottom,0px));}
  .layout .main:has(.fab-wrap){padding-bottom:calc(140px + env(safe-area-inset-bottom,0px));}
  body:has(.staging-banner) .layout .main:has(.fab-wrap){padding-bottom:calc(164px + env(safe-area-inset-bottom,0px));}
  .fab{width:56px;height:56px;padding:0;border:none;border-radius:50%;background:var(--accent);color:#0a1628;font-size:30px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.4);cursor:pointer;}
  .fab span{transition:transform .15s;}
  .fab.open span{transform:rotate(45deg);}
  .fab-menu{position:absolute;right:0;bottom:calc(100% + 10px);min-width:210px;padding:6px;background:var(--navy2);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.45);}
  .fab-item{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:none;border-radius:8px;background:none;
    color:var(--white);font-family:var(--fh);font-size:15px;font-weight:600;text-align:left;cursor:pointer;}
  .fab-item:hover,.fab-item:focus-visible{background:var(--hl-07);outline:none;}
  .fab-item-icon{width:20px;text-align:center;color:var(--accent);}
  body:has(.fab-wrap) .toast-wrap{bottom:calc(140px + env(safe-area-inset-bottom,0px));}
  .jo-toolbar,.pm-toolbar{display:none!important;}   /* their actions are behind the "+" on phones */
  /* Asset Registry: search | Add | Actions on one row, the two filters below */
  .asset-controls{display:grid!important;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"search add more" "cat status status";gap:6px!important;align-items:center;}
  .asset-controls>.search-box{grid-area:search;}
  .asset-controls>select:nth-of-type(1){grid-area:cat;}
  .asset-controls>select:nth-of-type(2){grid-area:status;}
  .asset-controls>.btn-accent{grid-area:add;}
  .asset-controls>.toolbar-more{grid-area:more;}
  .asset-controls>.search-box,.asset-controls>select{min-height:40px!important;height:40px;}
  .asset-controls>.btn-accent,.asset-controls .tools-toggle{min-height:40px!important;height:40px;padding:0 12px!important;font-size:13px!important;}
  /* pagination: one slim row; page buttons keep 44 x 44 tap areas around 30px shapes */
  .page-foot{padding:2px 8px 2px 12px!important;gap:6px;}
  .page-foot .page-info-txt{font-size:11px;}
  .page-foot .pagination{padding-top:0;gap:0;}
  .page-foot .page-btn{min-width:44px;min-height:44px;padding:0;border:7px solid transparent;border-radius:14px;background-clip:padding-box;box-shadow:inset 0 0 0 1px var(--border);font-size:13px;}
  /* asset cards: smaller type and gaps; status chips 26px high (36px tap area) */
  table.assets-tbl.card-table tr:not(:has(td[colspan])){padding:6px 10px 0!important;margin-bottom:6px!important;}
  table.assets-tbl.card-table td:nth-child(1){font-size:12px!important;}
  table.assets-tbl.card-table td:nth-child(3){font-size:14px;}
  table.assets-tbl.card-table td:nth-child(2),table.assets-tbl.card-table td:nth-child(7){font-size:11px!important;}
  table.assets-tbl.card-table select.sb-base{min-height:36px!important;height:36px;padding:0 8px!important;border:5px solid transparent!important;border-radius:12px;
    background-clip:padding-box;box-shadow:inset 0 0 0 1px currentColor;font-size:11px!important;letter-spacing:.3px;}
  /* job-order status: a tinted, outlined pill (40px tap area) */
  .fill-page table.card-table td[data-label="Status"] .sb-base{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px!important;
    border:5px solid transparent!important;border-radius:999px;background-clip:padding-box;background-color:color-mix(in srgb,currentColor 14%,transparent)!important;
    box-shadow:inset 0 0 0 1.5px currentColor;font-size:12px!important;font-weight:700;letter-spacing:.5px;}

// ─── CSV UTILITIES ───────────────────────────────────────────────────────────
function dlCSV(content, filename) {
  const blob = new Blob([content], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvCell(v) { return '"'+(String(v||'')).replace(/"/g,'""')+'"'; }
function parseCSVLine(line) {
  const vals=[]; let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(line[i]===','&&!inQ){vals.push(cur.trim());cur='';}
    else cur+=line[i];
  }
  vals.push(cur.trim()); return vals;
}
function exportAssetsCSV(assets, user) {
  if (!can(user,'asset.export')) { alert('CSV export is not available for your role.'); return false; }
  assets = assets.filter(a => canSeeAsset(user, a));

  const rows=assets.map(a=>[a.num,a.plant,a.desc,a.code,a.model,a.cap,a.reg,a.eng,a.serial,a.loc,a.status].map(csvCell).join(','));
  dlCSV([hdr.join(','),...rows].join('\n'),'assets_export.csv');
}
function exportJobOrdersCSV(jobOrders, user) {
  if (!can(user,'jo.export')) { alert('CSV export is not available for your role.'); return false; }
  jobOrders = jobOrders.filter(j => canSeeJO(user, j));
  const hdr=['Job No.','Date','Asset No.','Asset Desc.','Asset Category','Location','Eq. Code','Dept','Requested By','Priority','Repair Type','Problem','Status','Start Date','Section','Received By','Downtime (hrs)','Work Done','Work Status','Evaluation','Acceptance','Completion Date','Approved By','Technician','Designation','Hrs Attended'];
  const rows=[];
  jobOrders.forEach(j=>{
    const mp=(j.manpower||[]).filter(m=>m.empId||m.name);
    const joBase=[j.jobNo,j.date,j.assetNum,j.assetDesc,j.assetCategory||j.plant||'',j.location,j.eqcode,j.dept,j.requester,j.priority,j.repairType,j.problem,j.status,j.target,j.section,j.recvName,j.downtime,j.workDone,j.workStatus,j.eval,j.accept,j.completionDate,isApproved(j)?(j.approvedBy||''):''];
    const blank=joBase.map(()=>'');
    if(!mp.length){
      rows.push([...joBase,'','',''].map(csvCell).join(','));
    } else {
      mp.forEach((m,i)=>{
        const base=i===0?joBase:blank;
        const techName=`${m.name||''}${m.empId?` (${m.empId})`:''}`.trim();
        rows.push([...base,techName,m.designation||'',m.hours||''].map(csvCell).join(','));
      });

  });
  dlCSV([hdr.join(','),...rows].join('\n'),'joborders_export.csv');

function importCSVFile(file, onRows) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const lines = e.target.result.split(/\r?\n/).filter(l=>l.trim());
      if (lines.length < 2) { alert('CSV is empty or has no data rows.'); return; }
      onRows(lines.slice(1).map(parseCSVLine));
    } catch(err) { alert('Error reading CSV: '+err.message); }
  };
  reader.readAsText(file);
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
// Card tables on phones (2026-10-28): every list table on a page (not the dashboard's category matrix, not tables inside a
// modal) gets class card-table; each cell gets its column header as data-label, and a cell holding only buttons gets
// cell-actions. The editable row tables of forms (.parts-table in a modal: manpower, spare parts) get the labels only, for
// their stacked phone layout. Only attributes are written; the CSS decides when either is used (max-width 640px).
function labelCardTables(root) {
  for (const t of root.querySelectorAll('.modal table.parts-table')) {
    const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.replace(/\s+/g, ' ').trim());
    for (const tr of t.querySelectorAll('tbody tr')) [...tr.children].forEach((td, i) => { const l = heads[i] || ''; if (td.getAttribute('data-label') !== l) td.setAttribute('data-label', l); });
  }
  for (const t of root.querySelectorAll('.tbl-wrap:not(.cat-table) > table')) {
    if (t.closest('.modal')) continue;
    t.classList.add('card-table');
    const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.replace(/\s+/g, ' ').trim());
    for (const tr of t.querySelectorAll('tbody tr')) {
      let col = 0;
      for (const td of tr.children) {
        const label = heads[col] || '';
        if (td.colSpan <= 1 && td.getAttribute('data-label') !== label) td.setAttribute('data-label', label);
        const btns = [...td.querySelectorAll('button')], squash = x => x.replace(/\s+/g, '');
        const actions = td === tr.lastElementChild && btns.length > 0 && squash(td.textContent).length === squash(btns.map(b => b.textContent).join('')).length;   // the row's last cell, all its text inside buttons
        td.classList.toggle('cell-actions', actions);
        col += td.colSpan || 1;
      }
    }
  }
}
function App() {
  const [page, setPage] = useState(() => { try { return pageFromHash(window.location.hash) || 'dashboard'; } catch (_) { return 'dashboard'; } });
  const [sidebarCollapsed, setSidebarCollapsed] = useState(() => { try { return localStorage.getItem(SIDEBAR_KEY) === '1'; } catch(e) { return false; } });
  function toggleSidebar() { setSidebarCollapsed(c => { const n = !c; try { localStorage.setItem(SIDEBAR_KEY, n ? '1' : '0'); } catch(e) {} return n; }); }
  // Phones (2026-10-29): the header's account button opens a menu with the theme, Settings and Logout (the same actions as
  // the desktop header). It closes on a page change, a tap outside it, Escape and sign-out; the theme choice keeps it open.
  // Arrow keys move between its items; Escape returns focus to the button.
  const [acctOpen, setAcctOpen] = useState(false);
  const acctRef = useRef(null);
  const theme = useTheme();
  useEffect(() => {
    if (!acctOpen) return;
    const items = () => [...document.querySelectorAll('.acct-menu [role=menuitem]')];
    if (items()[0]) items()[0].focus();
    const away = e => { if (acctRef.current && !acctRef.current.contains(e.target)) setAcctOpen(false); };
    const keys = e => {
      if (e.key === 'Escape') { setAcctOpen(false); const b = acctRef.current && acctRef.current.querySelector('.acct-btn'); if (b) b.focus(); return; }
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      const list = items(), i = list.indexOf(document.activeElement), n = list[(i + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length];
      if (n) { n.focus(); e.preventDefault(); }

      setSyncStatus('ok');
      addToast(editId ? 'User updated.' : 'User added. Give the temporary password to the user: it is shown only once.');
      return editId ? null : {temporaryPassword: res.body.temporaryPassword, name: user.fullName};
    }
    // Own account (also an Admin's own record): only the own name may change here (S4); the server enforces the same.
    const r = await serverChange('profile_update_self', {p_full_name: user.fullName}, ['users']);
    if (r) { await recheckProfile(); addToast('User updated.'); }
    return null;
  }
  // Admin: a new temporary password for another account (forced change at its next sign-in; its sessions end).
  async function resetUserPassword(id) {
    if (!allow(can(currentUser,'users.admin'))) return null;
    const target = users.find(u => u.id === id);
    if (!target || !target.userId) { addToast('Account not found.', true); return null; }
    if (currentUser && target.id === currentUser.id) { addToast('Use Change Password for your own account.', true); return null; }
    const res = await serverFunction('admin-users', {action: 'reset_password', userId: target.userId});
    await loadUsers();
    if (res.status !== 200) { addToast(accountError(res, 'The password was not reset.'), true); return null; }
    addToast('Temporary password generated. The user must change it at the next sign-in.');
    return res.body.temporaryPassword;
  }
  // Send the confirmation mail again to an account's CURRENT, unconfirmed recovery address (e.g. a provisioned account, which
  // received none). Nothing about the account changes; the server checks the Admin, the account and a per-account limit.
  async function resendVerification(id) {
    if (!allow(can(currentUser,'users.admin'))) return false;
    const target = users.find(u => u.id === id);
    if (!target || !target.userId) { addToast('Account not found.', true); return false; }
    const res = await serverFunction('admin-users', {action: 'resend_verification', userId: target.userId});
    if (res.status !== 200) { addToast(accountError(res, 'The confirmation email was not sent.'), true); return false; }
    addToast('Confirmation email sent. The user must open the link in it to confirm the address.');

  }
  // Deactivate (accounts are kept: job orders reference their numeric id).
  function deleteUser(id) {
    if (!allow(can(currentUser,'users.admin'))) return;
    if (currentUser && currentUser.id === id) { addToast('Cannot deactivate your own account.', true); return; }
    const target = users.find(u => u.id === id);
    if (!target || !target.userId) { addToast('Account not found.', true); return; }
    serverFunction('admin-users', {action: 'set_active', userId: target.userId, active: false}).then(async res => {
      await loadUsers();
      if (res.status !== 200) { addToast(accountError(res, unsavedMsg(['users'])), true); return; }
      addToast('User deactivated. The account can no longer sign in; its job orders keep their references.');

  // ── Recovery links (only while signed out). A reset link sets a new password through complete-recovery, which also
  //    clears a pending forced change; the link's session is ended afterwards and the user signs in normally.
  async function completeRecovery(newPw) {
    if (!link || link.kind !== 'recovery' || link.error) return {ok: false, message: 'This link is not valid any more. Request a new one.'};
    const err = validatePassword(newPw);
    if (err) return {ok: false, message: err};
    try {
      const {error} = await sb.auth.setSession({access_token: link.accessToken, refresh_token: link.refreshToken});
      if (error) return {ok: false, message: 'This link is not valid any more. Request a new one.'};
    } catch (_) { return {ok: false, message: 'The server could not be reached. Try again.'}; }
    const res = await serverFunction('complete-recovery', {newPassword: newPw});
    try { await sb.auth.signOut({scope: 'local'}); } catch (_) {}
    if (res.status !== 200) return {ok: false, message: res.status === 400 && res.body && res.body.error ? res.body.error : 'The password was not changed. Request a new link.'};
    return {ok: true};
  }
  async function verifyRecoveryEmail() {
    if (!link || link.kind !== 'verify-email' || !link.verifyToken) return {ok: false};
    const res = await serverFunction('verify-recovery-email', {token: link.verifyToken});
    return {ok: res.status === 200};
  }

  // ── Permission guard for user actions (FEATURE_PLAN §12.2). The server checks again; this avoids pointless requests.
  // While a forced password change is pending, every guarded action is refused except the own password change, whose
  // condition evaluates to the FORCED_CHANGE_ALLOWED marker.
  function allow(ok) {
    if (mustChangePassword(currentUser) && ok !== FORCED_CHANGE_ALLOWED) { addToast('Change your temporary password first.', true); return false; }
    if (ok) return true; addToast(MSG_NO_PERMISSION, true); return false;
  }

  // ── Toast
  function addToast(msg, err=false) {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, {id, msg, err}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }

  // ── Asset mutations (whole-list save; Admin / Assistant Engineer, enforced by the database)
  function updateAssetStatus(num, status) {
    if (!allow(can(currentUser,'asset.status'))) return;
    const normStatus = status.toUpperCase().replace('UNDER MAINT.','UNDER MAINTENANCE');
    setAssets(prev => {
      const next = prev.map(a => a.num===num ? {...a, status:normStatus} : a);
      queueSave('assets', next);
      return next;
    });
    addToast(`Asset ${num} → ${normStatus}`);
  }

  function saveAsset(asset, editNum) {
    if (!allow(can(currentUser, editNum ? 'asset.edit' : 'asset.create'))) return;
    setAssets(prev => {
      let next;
      if (editNum) {
        next = prev.map(a => a.num===editNum ? asset : a);
        addToast(`Asset ${asset.num} updated.`);
      } else {
        if (prev.find(a => a.num===asset.num)) { addToast(`Asset ${asset.num} already exists.`, true); return prev; }
        next = [...prev, asset];
        addToast(`Asset ${asset.num} added.`);

  // ── JO mutations: each one is a checked server function (backend/sql/0002_functions.sql)
  async function saveJO(jo, editJobNo) {
    if (!allow(editJobNo ? (can(currentUser,'jo.edit.request') || can(currentUser,'jo.edit.work')) : can(currentUser,'jo.create'))) return;
    if (editJobNo) {
      const stored = jobOrders.find(j => j.jobNo===editJobNo);
      if (!allow(!!stored && mayEditJO(currentUser, stored))) return;
      if (isDeptUser(currentUser)) {                                                                     // Department User, own OPEN JO
        const a = assets.find(x => x.num === (jo.assetNum || stored.assetNum));
        if (!allow(!!a && canSeeAsset(currentUser, a))) return;
        if (jo.repairType !== DU_REPAIR_TYPE) { addToast('Department Users can only raise Unplanned repairs.', true); return; }
      }
      setJoModal(null);
      const r = await serverChange('jo_update', {p_job_no: editJobNo, p_fields: jo}, ['jobOrders'], `Job Order ${editJobNo} updated.`);
      const now = r && r.fresh.jobOrders && r.fresh.jobOrders.find(j => j.jobNo === editJobNo);
      if (now && isApproved(stored) && !isApproved(now)) addToast(`${editJobNo}: completion details changed — approval reset to pending.`, true);
    } else {
      if (isDeptUser(currentUser)) {                                                                     // D5: restricted request form
        const a = assets.find(x => x.num === jo.assetNum);
        if (!allow(!!a && canSeeAsset(currentUser, a) && DEPARTMENTS.includes(currentUser.department))) return;
        if (jo.repairType !== DU_REPAIR_TYPE) { addToast('Department Users can only raise Unplanned repairs.', true); return; }
      }
      setJoModal(null);
      await serverChange('jo_create', {p_jo: jo}, ['jobOrders'], jobNo => `Job Order ${jobNo} saved.`);
    }
  }

  async function updateJOStatus(jobNo, status, assignment) {
    if (!allow((status==='IN PROGRESS' ? can(currentUser,'jo.start') : status==='COMPLETED' ? can(currentUser,'jo.complete') : false) && canSeeJO(currentUser, (jobOrders.find(j => j.jobNo===jobNo))))) return;
    const from = {'IN PROGRESS':'OPEN', 'COMPLETED':'IN PROGRESS'}[status];
    const cur = jobOrders.find(j => j.jobNo===jobNo);
    if (!cur || cur.status !== from) { addToast(`${jobNo}: ${cur ? cur.status : 'not found'} → ${status} is not a valid step.`, true); return; }
    if (!jceSectionAllows(currentUser, cur, status==='IN PROGRESS' ? 'start' : 'progress')) { addToast(`${jobNo} belongs to the ${cur.section || 'unassigned'} section. You can only work on ${currentUser.section || 'your own'} section job orders.`, true); return; }
    // Starting work assigns it (owner decision 2026-10-11): a Job Card Editor takes it; Admin/AE choose an active Job Card
    // Editor. Assignment and status change are ONE server step.
    let assigneeId = null;
    if (status==='IN PROGRESS') {
      if (isJobCardEditor(currentUser)) {
        if (!isEligibleEditor(currentUser)) { addToast('Your Job Card Editor account needs an active status and a section before you can start work. Ask an Admin.', true); return; }
      } else {
        const ed = assignment && users.find(u => u.id === assignment.assigneeId);
        if (!isEligibleEditor(ed)) { addToast(`${jobNo}: select an active Job Card Editor (with a section) to assign the work to before moving it to IN PROGRESS.`, true); return; }
        assigneeId = ed.id;
      }
    }
    await serverChange('jo_set_status', {p_job_no: jobNo, p_status: status, p_assignee_legacy_id: assigneeId}, ['jobOrders'], `${jobNo} → ${status}`);
  }

  function deleteAsset(num) {
    if (!allow(can(currentUser,'asset.delete'))) return;
    setAssets(prev => {
      const next = prev.filter(a => a.num !== num);
      queueSave('assets', next);
      return next;
    });
    addToast(`Asset ${num} deleted.`);
  }
  function clearAllAssets() {
    if (!allow(can(currentUser,'asset.clearAll'))) return;
    clearTimeout(saveTimer.current); delete pendingSaves.current.assets;
    serverChange('asset_clear_all', {p_confirm: 'DELETE ALL ASSETS'}, ['assets'], 'All assets cleared. You can now import a fresh list.');
  }

  function deleteJO(jobNo) {
    if (!allow(can(currentUser,'jo.delete') && canSeeJO(currentUser, (jobOrders.find(j => j.jobNo===jobNo))))) return;
    serverChange('jo_delete', {p_job_no: jobNo}, ['jobOrders'], `${jobNo} deleted.`);
  }
  // F5: approval and closing are two separate actions (§4.3). Role-based only (jo.approve / jo.close are non-grantable).
  function approveJO(jobNo) {
    if (!allow(can(currentUser,'jo.approve') && canSeeJO(currentUser, (jobOrders.find(j => j.jobNo===jobNo))))) return;
    if (!canApproveJO(jobOrders.find(j => j.jobNo===jobNo))) { addToast(`${jobNo}: only a COMPLETED job order that is not yet approved can be approved.`, true); return; }
    serverChange('jo_approve', {p_job_no: jobNo}, ['jobOrders'], `${jobNo} completion approved. It can now be closed.`);
  }
  function closeJO(jobNo, closure) {
    if (!allow(can(currentUser,'jo.close') && canSeeJO(currentUser, (jobOrders.find(j => j.jobNo===jobNo))))) return;
    if (!canCloseJO(jobOrders.find(j => j.jobNo===jobNo))) { addToast(`${jobNo}: approve the completion before closing.`, true); return; }
    const closedDate = closure && /^\d{4}-\d{2}-\d{2}$/.test(closure.closedDate) ? closure.closedDate : '';
    if (!closedDate) { addToast('Please select the closed date.', true); return; }
    serverChange('jo_close', {p_job_no: jobNo, p_closed_date: closedDate}, ['jobOrders'], `${jobNo} closed.`);
  }
  function revertJO(jobNo) {
    if (!allow(can(currentUser,'jo.revert') && canSeeJO(currentUser, (jobOrders.find(j => j.jobNo===jobNo))))) return;
    if ((jobOrders.find(j => j.jobNo===jobNo) || {}).status !== 'CLOSED') { addToast(`${jobNo}: only a CLOSED job order can be reverted.`, true); return; }
    serverChange('jo_revert', {p_job_no: jobNo}, ['jobOrders'], `${jobNo} reverted to COMPLETED.`);
  }

  // ── Employees: status updates (Admin, AE) and administration (Admin) are separate server functions
  const [employees, setEmployees] = useState(BASE_EMPLOYEES);
  function saveEmployee(emp, editId) {
    if (!allow(can(currentUser,'emp.admin'))) return;
    serverChange('employee_save', {p_emp: emp, p_edit_id: editId || null}, ['employees'], editId ? 'Employee updated.' : 'Employee added.');
  }
  // ── PM Schedule (whole-list save; Admin / Assistant Engineer, enforced by the database)
  const [pm, setPM] = useState(BASE_PM);
  function savePMItem(item, editId) {
    if (!allow(can(currentUser,'pm.edit'))) return;
    setPM(prev => {
      let next;
      if (editId) {
        next = prev.map(p => p.id===editId ? {...item,id:editId,serviceHistory:p.serviceHistory||[]} : p);
      } else {
        const maxN = Math.max(0,...prev.map(p=>parseInt(p.id.split('-')[1])||0));
        const newId = 'pm-'+String(maxN+1).padStart(3,'0');
        next = [...prev, {...item, id:newId, serviceHistory:[]}];
      }
      saveNow('pm', next);
      return next;
    });
  }
  function importPMFromCSV(file) {
    if (!allow(can(currentUser,'pm.import'))) return;
    importCSVFile(file, rows => {
      const newPM = rows.map(r => ({
        id: r[0] || 'pm-' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
        assetNum: r[1]||'', assetDesc: r[2]||'', category: r[3]||'',
        location: r[4]||'', frequency: r[5]||'Monthly',
        lastService: r[6]||'', nextService: r[7]||'', notes: r[8]||'', serviceHistory:[]
      })).filter(p => p.assetDesc);
      setPM(prev => {
        const existing = new Set(prev.map(p => p.id));
        const next = [...prev, ...newPM.filter(p => !existing.has(p.id))];
        saveNow('pm', next);
        return next;
      });
      addToast('PM schedule imported.');
