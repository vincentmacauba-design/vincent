            <p style={{fontSize:13}}>{jo.workDone||'—'}</p>
            <div style={{display:'flex',gap:20,marginTop:8,fontSize:12,flexWrap:'wrap'}}>
              <span>Repair Type: <strong>{jo.repairType||'—'}</strong></span>
              <span>Work Status: <strong>{jo.workStatus||'—'}</strong></span>
              <span>Downtime: <strong>{jo.downtime||'0'} hrs</strong></span>
              <span>Evaluation: <strong>{jo.eval||'—'}</strong></span>
            </div>
          </div>
          <div className="jc-section">
            <div className="jc-section-title">Manpower</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,fontSize:13}}>
              <div>Tech 1: <strong>{jo.tech1||'—'}</strong> ({jo.tech1h||'0'} hrs)</div>
              <div>Tech 2: <strong>{jo.tech2||'—'}</strong> ({jo.tech2h||'0'} hrs)</div>
              <div>Section: <strong>{jo.section||'—'}</strong></div>
              <div>Approved By: <strong>{jo.approved||'—'}</strong></div>
              <div>Target: <strong>{jo.target||'—'}</strong></div>
              <div>Completion: <strong style={{color:'var(--green)'}}>{jo.completionDate||'—'}</strong></div>
            </div>
          </div>
          <div className="jc-section">
            <div className="jc-section-title">Materials / Parts</div>
            <table className="parts-table">
              <thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>SRP</th></tr></thead>
              <tbody>
                {(jo.parts||[]).filter(p=>p.desc).map((p,i)=><tr key={i}><td>{p.desc}</td><td>{p.qty}</td><td>{p.unit}</td><td>{p.srp}</td></tr>)}
                {!(jo.parts||[]).filter(p=>p.desc).length&&<tr><td colSpan={4} style={{color:'var(--gray)',fontSize:12}}>No parts recorded</td></tr>}
              </tbody>
            </table>
          </div>
          <div style={{marginTop:16,display:'flex',gap:10,justifyContent:'flex-end',flexWrap:'wrap'}}>
            <button className="btn btn-primary" onClick={()=>printJOPDF(jo)}>↓ Download PDF</button>
            <button className="btn btn-warning" onClick={()=>onEdit(jo)}>✏ Edit</button>
            <button className="btn btn-ghost" onClick={onClose}>Close</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── USER FORM MODAL ──────────────────────────────────────────────────────────
function UserFormModal({mode, user, onClose, onSave}) {
  const [f, setF] = useState(user ? {...user, password:''} : {
    username:'', password:'', fullName:'', email:'', role:'Operator', active:true
  });

  function handleSave() {
    if (!f.fullName.trim()) { alert('Full name is required'); return; }
    if (!f.username.trim()) { alert('Username is required'); return; }
    if (mode==='add' && !f.password.trim()) { alert('Password is required for new users'); return; }
    onSave(f);
  }

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{width:560}}>
        <div className="modal-head">
          <div className="modal-title">{mode==='add'?'Add New User':`Edit User — ${user?.username}`}</div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {mode==='edit'&&<div className="edit-mode-banner">✏ Editing user account — leave password blank to keep current password</div>}
          <div className="form-row">
            <div className="form-group">
              <label>Full Name</label>
              <input value={f.fullName||''} onChange={e=>setF({...f,fullName:e.target.value})} placeholder="Full name"/>
            </div>
            <div className="form-group">
              <label>Username</label>
              <input value={f.username||''} onChange={e=>setF({...f,username:e.target.value})} placeholder="Login username"/>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>{mode==='edit'?'New Password (leave blank to keep current)':'Password'}</label>
              <input type="password" value={f.password||''} onChange={e=>setF({...f,password:e.target.value})} placeholder={mode==='edit'?'Leave blank to keep current':'Set password'} autoComplete="new-password"/>
            </div>
            <div className="form-group">
              <label>Email Address</label>
              <input type="email" value={f.email||''} onChange={e=>setF({...f,email:e.target.value})} placeholder="user@villagroup.mv"/>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Role</label>
              <select value={f.role||'Operator'} onChange={e=>setF({...f,role:e.target.value})}>
                <option>Admin</option>
                <option>Assistant Engineer</option>
              </select>
            </div>
            <div className="form-group">
              <label>Account Status</label>
              <select value={f.active!==false?'true':'false'} onChange={e=>setF({...f,active:e.target.value==='true'})}>
                <option value="true">Active</option>
                <option value="false">Inactive</option>
              </select>
            </div>
          </div>
          <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:8}}>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-success" onClick={handleSave}>💾 {mode==='add'?'Add User':'Update User'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
